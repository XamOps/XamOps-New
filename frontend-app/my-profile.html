<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XamOps - My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/icons/XamOps.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/icons/XamOps.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
    <link rel="stylesheet" href="/src/usability-improvements.css">
    <script type="module" src="/src/usability-utils.js"></script>
</head>

<body class="antialiased bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <include file="/_sidebar.html"></include>

        <div class="flex-1 ml-64 flex flex-col h-screen overflow-hidden">

            <main id="main-content"
                class="flex-1 overflow-y-auto p-6 lg:p-8 bg-gradient-to-br from-slate-50 to-slate-100"
                x-data="myProfile()">

                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

                    body {
                        font-family: 'Inter', sans-serif;
                    }

                    [x-cloak] {
                        display: none !important;
                    }

                    .form-input:focus {
                        border-color: #667eea;
                        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
                    }

                    .btn-primary {
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    }

                    .btn-primary:hover {
                        transform: translateY(-2px);
                        box-shadow: 0 10px 15px -3px rgba(102, 126, 234, 0.4);
                        transition: all 0.3s ease;
                    }

                    .profile-card {
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    }
                </style>

                <h1 class="text-3xl font-bold mb-6 text-gray-800">My Profile</h1>

                <!-- Profile Card -->
                <div class="bg-white rounded-xl shadow-lg mb-8 overflow-hidden">
                    <div class="profile-card p-6 text-white">
                        <div class="flex items-center">
                            <div class="w-20 h-20 rounded-full bg-white/20 flex items-center justify-center text-3xl font-bold">
                                <span x-text="profile.username ? profile.username.charAt(0).toUpperCase() : 'U'"></span>
                            </div>
                            <div class="ml-6">
                                <h2 class="text-2xl font-bold" x-text="profile.username || 'Loading...'"></h2>
                                <p class="text-white/80" x-text="profile.email || ''"></p>
                                <span class="inline-block mt-2 px-3 py-1 bg-white/20 rounded-full text-sm" x-text="profile.role || ''"></span>
                            </div>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-500 mb-1">Client / Organization</label>
                                <p class="text-lg font-semibold text-gray-800" x-text="profile.clientName || 'N/A'"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-500 mb-1">User Type</label>
                                <p class="text-lg font-semibold text-gray-800" x-text="profile.isPrimaryUser ? 'Primary User (Admin)' : 'Team Member'"></p>
                            </div>
                        </div>

                        <!-- Connected Cloud Accounts -->
                        <div class="mt-6">
                            <label class="block text-sm font-medium text-gray-500 mb-2">Connected Cloud Accounts</label>
                            <div class="flex flex-wrap gap-2">
                                <template x-for="account in profile.cloudAccounts || []" :key="account.id">
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
                                        :class="{
                                            'bg-orange-100 text-orange-800': account.provider === 'AWS',
                                            'bg-blue-100 text-blue-800': account.provider === 'GCP',
                                            'bg-sky-100 text-sky-800': account.provider === 'Azure'
                                        }">
                                        <i class="mr-1.5"
                                            :class="{
                                                'fab fa-aws': account.provider === 'AWS',
                                                'fab fa-google': account.provider === 'GCP',
                                                'fab fa-microsoft': account.provider === 'Azure'
                                            }"></i>
                                        <span x-text="account.name"></span>
                                    </span>
                                </template>
                                <span x-show="!profile.cloudAccounts || profile.cloudAccounts.length === 0" class="text-gray-400">
                                    No cloud accounts connected
                                </span>
                            </div>
                        </div>

                        <!-- Change Password Button -->
                        <div class="mt-6 pt-6 border-t border-gray-200">
                            <button @click="showPasswordModal = true"
                                class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition-colors">
                                <i class="fas fa-key mr-2"></i>Change Password
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Team Users Section (Only for Primary Users) -->
                <template x-if="profile.isPrimaryUser">
                    <div>
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-gray-800">Team Members</h2>
                            <button @click="newTeamUser()"
                                class="btn-primary text-white px-6 py-3 rounded-lg font-semibold shadow-md">
                                <i class="fas fa-user-plus mr-2"></i>Add Team Member
                            </button>
                        </div>

                        <!-- Team User Form -->
                        <template x-if="isEditing">
                            <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border border-gray-100">
                                <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                                    <i class="fas fa-user-edit mr-2 text-indigo-500"></i>
                                    <span x-text="selectedUser.id ? 'Edit Team Member' : 'Add Team Member'"></span>
                                </h3>
                                <form @submit.prevent="saveTeamUser()">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                                            <input type="text" x-model="selectedUser.username" required
                                                class="form-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                                            <input type="email" x-model="selectedUser.email" required
                                                class="form-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                                            <input type="password" x-model="selectedUser.password" :required="!selectedUser.id"
                                                :placeholder="selectedUser.id ? 'Leave blank to keep current password' : 'Enter password'"
                                                class="form-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-semibold text-gray-700 mb-2">Role</label>
                                            <input type="text" :value="profile.role" disabled
                                                class="form-input w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500">
                                            <p class="text-xs text-gray-500 mt-1">Role is inherited from your account</p>
                                        </div>
                                    </div>

                                    <!-- Cloud Account Access Selection -->
                                    <div class="mt-6" x-show="profile.cloudAccounts && profile.cloudAccounts.length > 0">
                                        <label class="block text-sm font-semibold text-gray-700 mb-3">Cloud Account Access</label>
                                        <p class="text-xs text-gray-500 mb-3">Select which cloud accounts this team member can access</p>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            <template x-for="account in profile.cloudAccounts" :key="account.id">
                                                <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors">
                                                    <input type="checkbox"
                                                        :value="account.id"
                                                        x-model="selectedUser.accountIds"
                                                        class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                                                    <div class="ml-3 flex items-center">
                                                        <i class="mr-2"
                                                            :class="{
                                                                'fab fa-aws text-orange-500': account.provider === 'AWS',
                                                                'fab fa-google text-blue-500': account.provider === 'GCP',
                                                                'fab fa-microsoft text-sky-500': account.provider === 'Azure'
                                                            }"></i>
                                                        <span class="text-sm font-medium text-gray-700" x-text="account.name"></span>
                                                    </div>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="mt-8 flex justify-end space-x-4">
                                        <button type="button" @click="cancelEdit()"
                                            class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition-colors">
                                            Cancel
                                        </button>
                                        <button type="submit"
                                            class="btn-primary text-white px-8 py-2 rounded-lg font-bold shadow-md">
                                            Save
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </template>

                        <!-- Team Users Table -->
                        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
                            <div class="overflow-x-auto">
                                <table class="w-full">
                                    <thead class="bg-gray-50 border-b border-gray-200">
                                        <tr>
                                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Username</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Email</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Role</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Cloud Accounts</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-200">
                                        <template x-for="user in teamUsers" :key="user.id">
                                            <tr class="hover:bg-gray-50 transition-colors">
                                                <td class="px-6 py-4 text-sm text-gray-900 font-medium" x-text="user.username"></td>
                                                <td class="px-6 py-4 text-sm text-gray-500" x-text="user.email"></td>
                                                <td class="px-6 py-4">
                                                    <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-indigo-100 text-indigo-800"
                                                        x-text="user.role"></span>
                                                </td>
                                                <td class="px-6 py-4">
                                                    <template x-if="user.cloudAccounts && user.cloudAccounts.length > 0">
                                                        <div class="flex flex-wrap gap-1">
                                                            <template x-for="account in user.cloudAccounts" :key="account.id">
                                                                <span class="inline-flex items-center px-2 py-1 rounded text-xs font-medium"
                                                                    :class="{
                                                                        'bg-orange-100 text-orange-700': account.provider === 'AWS',
                                                                        'bg-blue-100 text-blue-700': account.provider === 'GCP',
                                                                        'bg-sky-100 text-sky-700': account.provider === 'Azure'
                                                                    }">
                                                                    <i class="mr-1 text-xs"
                                                                        :class="{
                                                                            'fab fa-aws': account.provider === 'AWS',
                                                                            'fab fa-google': account.provider === 'GCP',
                                                                            'fab fa-microsoft': account.provider === 'Azure'
                                                                        }"></i>
                                                                    <span x-text="account.name"></span>
                                                                </span>
                                                            </template>
                                                        </div>
                                                    </template>
                                                    <span x-show="!user.cloudAccounts || user.cloudAccounts.length === 0" class="text-xs text-gray-400">
                                                        No access
                                                    </span>
                                                </td>
                                                <td class="px-6 py-4 text-sm font-medium">
                                                    <button @click="editTeamUser(user)"
                                                        class="text-indigo-600 hover:text-indigo-900 mr-4 transition-colors">
                                                        <i class="fas fa-edit mr-1"></i>Edit
                                                    </button>
                                                    <button @click="deleteTeamUser(user.id)"
                                                        class="text-red-600 hover:text-red-900 transition-colors">
                                                        <i class="fas fa-trash-alt mr-1"></i>Delete
                                                    </button>
                                                </td>
                                            </tr>
                                        </template>
                                        <tr x-show="teamUsers.length === 0">
                                            <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                                                <i class="fas fa-users text-4xl mb-3 text-gray-300"></i>
                                                <p>No team members yet. Add one to get started.</p>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Password Change Modal -->
                <div x-show="showPasswordModal" x-cloak
                    class="fixed inset-0 z-50 overflow-y-auto"
                    @keydown.escape.window="showPasswordModal = false">
                    <div class="flex items-center justify-center min-h-screen px-4">
                        <div class="fixed inset-0 bg-black/50 transition-opacity" @click="showPasswordModal = false"></div>
                        <div class="relative bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
                            <h3 class="text-xl font-bold text-gray-800 mb-6">Change Password</h3>
                            <form @submit.prevent="changePassword()">
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Current Password</label>
                                        <input type="password" x-model="passwordForm.oldPassword" required
                                            class="form-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">New Password</label>
                                        <input type="password" x-model="passwordForm.newPassword" required
                                            class="form-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm New Password</label>
                                        <input type="password" x-model="passwordForm.confirmPassword" required
                                            class="form-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    </div>
                                </div>
                                <div class="mt-6 flex justify-end space-x-4">
                                    <button type="button" @click="showPasswordModal = false"
                                        class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition-colors">
                                        Cancel
                                    </button>
                                    <button type="submit"
                                        class="btn-primary text-white px-8 py-2 rounded-lg font-bold shadow-md">
                                        Update Password
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <script>
                    function myProfile() {
                        return {
                            profile: {
                                id: null,
                                username: '',
                                email: '',
                                role: '',
                                clientName: '',
                                isPrimaryUser: false,
                                cloudAccounts: []
                            },
                            teamUsers: [],
                            selectedUser: {
                                id: null,
                                username: '',
                                email: '',
                                password: '',
                                accountIds: []
                            },
                            isEditing: false,
                            showPasswordModal: false,
                            passwordForm: {
                                oldPassword: '',
                                newPassword: '',
                                confirmPassword: ''
                            },

                            // Determine API base URL based on user role
                            get apiBase() {
                                const roles = JSON.parse(sessionStorage.getItem('cached_user_roles') || '[]');
                                if (roles.includes('ROLE_XAMOPS')) {
                                    return '/api/xamops/team';
                                } else if (roles.includes('ROLE_BILLOPS')) {
                                    return '/api/billops/team';
                                }
                                // Default to xamops
                                return '/api/xamops/team';
                            },

                            getCsrfToken() {
                                return document.cookie
                                    .split('; ')
                                    .find(row => row.startsWith('XSRF-TOKEN='))
                                    ?.split('=')[1] || '';
                            },

                            init() {
                                this.fetchProfile();
                            },

                            fetchProfile() {
                                fetch(`${this.apiBase}/profile`, {
                                    method: 'GET',
                                    credentials: 'include'
                                })
                                    .then(res => {
                                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                                        return res.json();
                                    })
                                    .then(data => {
                                        this.profile = data;
                                        // If primary user, also fetch team users
                                        if (data.isPrimaryUser) {
                                            this.fetchTeamUsers();
                                        }
                                    })
                                    .catch(err => {
                                        console.error('Failed to fetch profile:', err);
                                    });
                            },

                            fetchTeamUsers() {
                                fetch(`${this.apiBase}/users`, {
                                    method: 'GET',
                                    credentials: 'include'
                                })
                                    .then(res => {
                                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                                        return res.json();
                                    })
                                    .then(data => {
                                        this.teamUsers = data || [];
                                    })
                                    .catch(err => {
                                        console.error('Failed to fetch team users:', err);
                                    });
                            },

                            newTeamUser() {
                                this.selectedUser = {
                                    id: null,
                                    username: '',
                                    email: '',
                                    password: '',
                                    accountIds: []
                                };
                                this.isEditing = true;
                            },

                            editTeamUser(user) {
                                this.selectedUser = {
                                    id: user.id,
                                    username: user.username,
                                    email: user.email,
                                    password: '',
                                    accountIds: user.accountIds || []
                                };
                                this.isEditing = true;
                            },

                            cancelEdit() {
                                this.isEditing = false;
                                this.selectedUser = { id: null, username: '', email: '', password: '', accountIds: [] };
                            },

                            saveTeamUser() {
                                if (!this.selectedUser.username?.trim()) return alert('Username is required!');
                                if (!this.selectedUser.email?.trim()) return alert('Email is required!');
                                if (!this.selectedUser.id && !this.selectedUser.password?.trim()) {
                                    return alert('Password is required for new users!');
                                }

                                const payload = { ...this.selectedUser };
                                if (payload.id && !payload.password?.trim()) {
                                    delete payload.password;
                                }

                                const url = payload.id
                                    ? `${this.apiBase}/users/${payload.id}`
                                    : `${this.apiBase}/users`;
                                const method = payload.id ? 'PUT' : 'POST';

                                fetch(url, {
                                    method,
                                    credentials: 'include',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'X-XSRF-TOKEN': this.getCsrfToken()
                                    },
                                    body: JSON.stringify(payload)
                                })
                                    .then(res => {
                                        if (!res.ok) {
                                            return res.text().then(text => {
                                                throw new Error(text || `HTTP ${res.status}`);
                                            });
                                        }
                                        return res.json();
                                    })
                                    .then(() => {
                                        this.fetchTeamUsers();
                                        this.cancelEdit();
                                    })
                                    .catch(err => {
                                        console.error('Save failed:', err);
                                        alert('Failed to save: ' + err.message);
                                    });
                            },

                            deleteTeamUser(id) {
                                if (!confirm('Are you sure you want to delete this team member?')) return;

                                fetch(`${this.apiBase}/users/${id}`, {
                                    method: 'DELETE',
                                    credentials: 'include',
                                    headers: { 'X-XSRF-TOKEN': this.getCsrfToken() }
                                })
                                    .then(res => {
                                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                                        this.fetchTeamUsers();
                                    })
                                    .catch(err => {
                                        console.error('Delete failed:', err);
                                        alert('Delete failed: ' + err.message);
                                    });
                            },

                            changePassword() {
                                if (this.passwordForm.newPassword !== this.passwordForm.confirmPassword) {
                                    return alert('New passwords do not match!');
                                }

                                if (this.passwordForm.newPassword.length < 6) {
                                    return alert('Password must be at least 6 characters!');
                                }

                                fetch(`${this.apiBase}/profile/password`, {
                                    method: 'PUT',
                                    credentials: 'include',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'X-XSRF-TOKEN': this.getCsrfToken()
                                    },
                                    body: JSON.stringify({
                                        oldPassword: this.passwordForm.oldPassword,
                                        newPassword: this.passwordForm.newPassword
                                    })
                                })
                                    .then(res => {
                                        if (!res.ok) {
                                            return res.text().then(text => {
                                                throw new Error(text || `HTTP ${res.status}`);
                                            });
                                        }
                                        alert('Password updated successfully!');
                                        this.showPasswordModal = false;
                                        this.passwordForm = { oldPassword: '', newPassword: '', confirmPassword: '' };
                                    })
                                    .catch(err => {
                                        console.error('Password change failed:', err);
                                        alert('Failed to change password: ' + err.message);
                                    });
                            }
                        };
                    }
                </script>
            </main>
        </div>
    </div>
</body>

</html>
