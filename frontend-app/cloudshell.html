<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XamOps - Cloud Shell</title>
  <!-- REDIRECT TO REACT CLOUDSHELL -->
  <script>
    // Automatically redirect to the new React CloudShell
    // Preserve query parameters (accountId, etc.)
    console.log('📍 [cloudshell.html] Redirecting to React CloudShell at /cloudshell');
    const currentParams = window.location.search;
    window.location.replace('/cloudshell' + currentParams);
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] {
      display: none !important;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    * {
      font-family: 'Inter', sans-serif;
    }

    .glass-header {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
  <!-- Usability Improvements -->
  <link rel="stylesheet" href="/src/usability-improvements.css">
  <script type="module" src="/src/usability-utils.js"></script>
</head>

<body class="bg-gray-900 text-white h-screen overflow-y-auto overflow-x-hidden">

  <div class="flex h-full">
    <include file="/_sidebar.html"></include>

    <div class="flex-1 lg:pl-64 flex flex-col h-full">

      <main id="main-content" class="flex-1 flex flex-col min-h-0 relative bg-gray-50">

        <!-- Page Header -->
        <header class="bg-white border-b px-8 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
          <div class="flex items-center gap-4">
            <button type="button" onclick="window.location.href='/dashboard.html'"
              class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 hover:text-gray-900 transition-all">
              <i class="fas fa-arrow-left"></i>
            </button>
            <div
              class="w-12 h-12 bg-gradient-to-br from-orange-500 to-amber-600 rounded-xl flex items-center justify-center">
              <i class="fas fa-terminal text-white text-xl"></i>
            </div>
            <div>
              <h1 class="text-2xl font-bold text-gray-800">CloudShell</h1>
              <p class="text-sm text-gray-600">Interactive cloud terminal access</p>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div id="connection-status"
              class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 border border-gray-200 flex items-center gap-2">
              <div class="w-1.5 h-1.5 rounded-full bg-gray-400"></div>
              <span>Initializing...</span>
            </div>
          </div>
        </header>

        <!-- Terminal Section -->
        <div class="flex-1 flex flex-col min-h-0 bg-gray-900">
          <!-- Tab/Toolbar Area -->
          <div class="bg-[#161b22] px-4 py-1 flex items-center border-b border-gray-800 shrink-0">
            <div
              class="flex items-center bg-[#0d1117] border-t border-l border-r border-orange-500 text-white px-4 py-2 text-sm font-medium rounded-t-md relative -mb-1.5 z-10">
              <i class="fab fa-linux mr-2 text-gray-400"></i>
              <span>bash</span>
              <span class="ml-2 w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            </div>
          </div>

          <div id="terminal" class="flex-1 bg-black overflow-hidden relative"></div>
        </div>

        <script>
          (function () {
            let term;
            let socket;
            let fitAddon;
            let accountId = null;
            let resizeListener;
            let accountChangeListener;

            function cleanup() {
              if (socket) {
                socket.close();
                socket = null;
              }
              if (term) {
                term.dispose();
                term = null;
              }
              if (resizeListener) {
                window.removeEventListener('resize', resizeListener);
                resizeListener = null;
              }
              if (accountChangeListener) {
                window.removeEventListener('account-changed', accountChangeListener);
                accountChangeListener = null;
              }
              const container = document.getElementById("terminal");
              if (container) container.innerHTML = '';
            }

            function getAccountId() {
              const urlParam = new URLSearchParams(window.location.search).get("accountId");
              if (urlParam) return urlParam;

              const saved = JSON.parse(sessionStorage.getItem("selectedAccountIds") || "[]");
              if (saved.length > 0) return saved[0];

              return null;
            }

            function initWebSocket() {
              const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
              const host = window.location.host;
              const tenantId = sessionStorage.getItem("selectedTenantId") || 'customer1';

              // Construct WebSocket URL
              const wsUrl = `${protocol}//${host}/terminal?accountId=${accountId}&tenantId=${tenantId}`;

              const status = document.getElementById("connection-status");
              if (status) {
                status.textContent = "Connecting...";
                status.className = "px-3 py-1 rounded text-xs font-medium bg-yellow-600";
              }

              socket = new WebSocket(wsUrl);

              socket.onopen = () => {
                console.log('WebSocket Connected');
                if (status) {
                  status.textContent = `Connected: ${accountId}`;
                  status.className = "px-3 py-1 rounded text-xs font-medium bg-green-600";
                }
                if (term) {
                  term.focus();
                  // Removed automatic connection message for cleaner UI
                }
              };

              socket.onmessage = (event) => {
                let data = event.data;

                // Filter out common bash non-TTY warnings that appear on startup
                if (data.includes("cannot set terminal process group") ||
                  data.includes("no job control in this shell")) {
                  return;
                }

                if (term) term.write(data);
              };

              socket.onclose = (event) => {
                console.warn('WebSocket Closed', event);
                if (status) {
                  status.textContent = "Disconnected";
                  status.className = "px-3 py-1 rounded text-xs font-medium bg-red-600";
                }
                // Removed connection closed message for cleaner UI
              };

              socket.onerror = (error) => {
                console.error('WebSocket Error:', error);
                if (status) {
                  status.textContent = "Connection Error";
                  status.className = "px-3 py-1 rounded text-xs font-medium bg-red-600";
                }
              };
            }

            function initTerminal() {
              cleanup();

              accountId = getAccountId();

              if (!accountId) {
                const container = document.getElementById("terminal");
                if (container) container.innerHTML = '<div class="p-8 text-red-400 font-mono">No account selected. Please select an account from the sidebar.</div>';
                return;
              }

              term = new Terminal({
                cursorBlink: true,
                cursorStyle: "bar",
                fontSize: 13,
                lineHeight: 1.0, // Reduced from 1.2 to remove gaps
                letterSpacing: 0, // Ensure no extra spacing
                fontFamily: 'Menlo, Monaco, "Courier New", monospace', // Simplified stack for consistency
                convertEol: true,
                theme: {
                  background: "#0d1117", // GitHub/AWS Dark Tone
                  foreground: "#e6edf3",
                  cursor: "#2f81f7",
                  selection: "#264f78",
                  black: "#484f58",
                  red: "#ff7b72",
                  green: "#3fb950",
                  yellow: "#d29922",
                  blue: "#58a6ff",
                  magenta: "#bc8cff",
                  cyan: "#39c5cf",
                  white: "#b1bac4",
                  brightBlack: "#6e7681",
                  brightRed: "#ffa198",
                  brightGreen: "#56d364",
                  brightYellow: "#e3b341",
                  brightBlue: "#79c0ff",
                  brightMagenta: "#d2a8ff",
                  brightCyan: "#56d4dd",
                  brightWhite: "#f0f6fc"
                },
                scrollback: 10000,
                allowProposedApi: true
              });

              fitAddon = new FitAddon.FitAddon();
              term.loadAddon(fitAddon);

              const container = document.getElementById("terminal");
              if (container) {
                term.open(container);
                setTimeout(() => {
                  fitAddon.fit();
                  term.focus();
                }, 100);

                container.addEventListener("click", () => {
                  if (term) term.focus();
                });
              }

              resizeListener = () => {
                if (fitAddon) fitAddon.fit();
              };
              window.addEventListener("resize", resizeListener);

              // Removed startup messages for cleaner UI as requested
              // term.writeln("\x1b[1;36mXamOps CloudShell v2.0\x1b[0m");
              // term.writeln(`Target Account: \x1b[1;33m${accountId}\x1b[0m`);
              // term.writeln("Initializing secure connection...\r\n");

              term.onData((data) => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                  socket.send(data);
                }
              });

              term.attachCustomKeyEventHandler((e) => {
                if (e.type === "keydown") {
                  if (e.ctrlKey && e.shiftKey && e.key === "C") {
                    const selection = term.getSelection();
                    if (selection) {
                      navigator.clipboard.writeText(selection);
                      return false;
                    }
                  }
                  if (e.ctrlKey && e.shiftKey && e.key === "V") {
                    navigator.clipboard.readText().then(text => {
                      if (socket) socket.send(text);
                    });
                    return false;
                  }
                  if (e.ctrlKey && e.key === "l") {
                    term.clear();
                    return false;
                  }
                }
                return true;
              });

              initWebSocket();

              accountChangeListener = (e) => {
                console.log("CloudShell: Account change detected", e.detail);
                if (e.detail && e.detail.accountId) {
                  accountId = e.detail.accountId;
                  const newUrl = new URL(window.location);
                  newUrl.searchParams.set('accountId', accountId);
                  window.history.replaceState(null, '', newUrl);
                }
                term.writeln("\r\n\x1b[33mSwitching accounts...\x1b[0m");
                setTimeout(() => initTerminal(), 500);
              };

              window.addEventListener('account-changed', accountChangeListener);
            }

            initTerminal();
          })();
        </script>
      </main>
    </div>
  </div>
</body>

</html>
