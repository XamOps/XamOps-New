<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="icon" href="/icons/XamOps.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/icons/XamOps.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="/src/main.js"></script>
</head>

<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        <include file="/_sidebar.html"></include>

        <main id="main-content" class="flex-1 flex flex-col min-w-0 overflow-hidden pl-64" x-data="ticketDetailApp()"
            x-init="init()">

            <style>
                [x-cloak] {
                    display: none !important;
                }

                /* Custom Scrollbar for Modal */
                .custom-scrollbar::-webkit-scrollbar {
                    width: 8px;
                }

                .custom-scrollbar::-webkit-scrollbar-track {
                    background: #f1f1f1;
                }

                .custom-scrollbar::-webkit-scrollbar-thumb {
                    background: #c7c7cc;
                    border-radius: 4px;
                }

                .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                    background: #a1a1aa;
                }

                /* Quill Overrides */
                .ql-editor {
                    min-height: 120px;
                    font-family: 'Inter', sans-serif;
                    font-size: 0.95rem;
                }

                .ql-toolbar {
                    border-radius: 0.5rem 0.5rem 0 0;
                    border-color: #e5e7eb !important;
                    background-color: #f9fafb;
                }

                .ql-container {
                    border-radius: 0 0 0.5rem 0.5rem;
                    border-color: #e5e7eb !important;
                    font-size: 1rem;
                }

                .ql-editor ul {
                    list-style-type: disc !important;
                    padding-left: 1.5em !important;
                }

                .ql-editor ol {
                    list-style-type: decimal !important;
                    padding-left: 1.5em !important;
                }

                /* Chat Bubble Content Styling */
                .prose-chat {
                    max-width: none;
                    font-size: 0.95rem;
                    line-height: 1.5;
                }

                .prose-chat p {
                    margin-bottom: 0.5em;
                }

                .prose-chat p:last-child {
                    margin-bottom: 0;
                }

                .prose-chat ul,
                .prose-chat ol {
                    margin-top: 0.5em;
                    margin-bottom: 0.5em;
                }

                /* Inverse prose for user bubbles (white text) */
                .prose-chat-inverse {
                    color: white;
                }

                .prose-chat-inverse a {
                    color: #bfdbfe;
                    text-decoration: underline;
                }

                .prose-chat-inverse strong {
                    color: white;
                    font-weight: 700;
                }

                .prose-chat-inverse code {
                    color: #1e40af;
                    background-color: #dbeafe;
                    border-radius: 0.25rem;
                    padding: 0.125rem 0.25rem;
                }
            </style>

            <header class="bg-white shadow-sm z-10 border-b border-gray-200 px-6 py-4">
                <div class="max-w-5xl mx-auto flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <a @click.prevent="goBackToTickets()" href="/billops/tickets.html"
                            class="text-gray-500 hover:text-indigo-600 transition cursor-pointer">
                            <i class="fas fa-arrow-left"></i> Back to Tickets
                        </a>
                        <div>
                            <h1 class="text-xl font-bold text-gray-900 flex items-center gap-3">
                                <span x-text="ticket ? ticket.subject : 'Loading...'"></span>
                                <span x-show="ticket"
                                    class="px-2.5 py-0.5 rounded-full text-xs font-medium uppercase tracking-wide"
                                    :class="{
                                    'bg-green-100 text-green-800': ticket && ticket.status === 'OPEN',
                                    'bg-yellow-100 text-yellow-800': ticket && ticket.status === 'IN_PROGRESS',
                                    'bg-gray-100 text-gray-800': ticket && ticket.status === 'CLOSED'
                                  }" x-text="ticket ? ticket.status : ''">
                                </span>
                            </h1>
                            <p class="text-xs text-gray-500 mt-1" x-show="ticket">
                                <span x-text="'#' + ticket.id"></span> &bull;
                                <span x-text="ticket.service"></span> &bull;
                                <span x-text="formatDate(ticket.createdAt)"></span>
                            </p>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button x-show="isAdmin && ticket && ticket.status !== 'CLOSED'" @click="showRcaModal = true"
                            class="bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium py-2 px-4 rounded transition flex items-center gap-2"
                            title="Generate RCA Report and Close Ticket">
                            <i class="fas fa-file-medical-alt"></i> Generate RCA
                        </button>

                        <button x-show="ticket && ticket.status !== 'CLOSED'" @click="closeTicket()"
                            class="text-gray-500 hover:text-red-600 text-sm font-medium transition flex items-center gap-2 px-3 py-2 rounded hover:bg-gray-50">
                            <i class="far fa-times-circle"></i> Close Ticket
                        </button>
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto bg-gray-100 p-6 scroll-smooth" id="chat-container">
                <div class="max-w-5xl mx-auto space-y-6 pb-6">

                    <div x-show="loading" class="flex justify-center py-10">
                        <i class="fas fa-spinner fa-spin text-3xl text-indigo-600"></i>
                    </div>

                    <div x-show="!loading && ticket" x-cloak class="space-y-8">

                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                            <div class="flex items-start gap-4">
                                <div class="flex-shrink-0">
                                    <div
                                        class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold">
                                        <i class="fas fa-ticket-alt"></i>
                                    </div>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex justify-between items-baseline mb-2">
                                        <h3 class="text-sm font-semibold text-gray-900">Ticket Description</h3>
                                        <span class="text-xs text-gray-400">Original Request</span>
                                    </div>
                                    <div class="prose prose-sm max-w-none text-gray-700" x-text="ticket.description">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="relative flex items-center justify-center py-2">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300"></div>
                            </div>
                            <span
                                class="relative bg-gray-100 px-4 text-xs text-gray-500 font-medium uppercase tracking-widest">Discussion
                                History</span>
                        </div>

                        <template x-for="reply in ticket.replies" :key="reply.id">
                            <div class="flex w-full" :class="isMe(reply) ? 'justify-end' : 'justify-start'">

                                <div class="flex max-w-[85%] md:max-w-[75%] gap-3"
                                    :class="isMe(reply) ? 'flex-row-reverse' : 'flex-row'">

                                    <div class="flex-shrink-0 mt-auto">
                                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shadow-sm"
                                            :class="reply.admin ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-200 text-gray-600'">
                                            <template x-if="reply.admin">
                                                <i class="fas fa-headset"></i>
                                            </template>
                                            <template x-if="!reply.admin">
                                                <span x-text="getInitials(reply.authorUsername)"></span>
                                            </template>
                                        </div>
                                    </div>

                                    <div>
                                        <div class="flex items-center gap-2 mb-1 px-1"
                                            :class="isMe(reply) ? 'justify-end' : 'justify-start'">
                                            <span class="text-xs font-semibold text-gray-600"
                                                x-text="reply.admin ? 'Support Agent' : reply.authorUsername"></span>
                                            <span class="text-[10px] text-gray-400"
                                                x-text="formatDateSimple(reply.createdAt)"></span>
                                        </div>

                                        <div class="shadow-sm px-5 py-3 relative"
                                            :class="isMe(reply) 
                                                ? 'bg-indigo-600 text-white rounded-2xl rounded-tr-none' 
                                                : 'bg-white text-gray-800 border border-gray-200 rounded-2xl rounded-tl-none'">

                                            <div class="prose-chat ql-editor !p-0 !min-h-0"
                                                :class="isMe(reply) ? 'prose-chat-inverse' : ''" x-html="reply.message">
                                            </div>

                                            <template x-if="reply.attachmentUrl || reply.attachmentName">
                                                <div class="mt-3">
                                                    <!-- Image Preview -->
                                                    <template
                                                        x-if="reply.attachmentType && reply.attachmentType.startsWith('image/')">
                                                        <div class="mb-2 rounded-lg overflow-hidden border border-gray-200 shadow-sm bg-gray-50 max-w-xs cursor-pointer hover:opacity-90 transition-opacity"
                                                            @click.stop="window.open(reply.attachmentUrl, '_blank')">
                                                            <img :src="reply.attachmentUrl" :alt="reply.attachmentName"
                                                                class="w-full h-auto object-cover max-h-60" />
                                                        </div>
                                                    </template>

                                                    <!-- RCA Document Box -->
                                                    <div x-show="reply.attachmentName && reply.attachmentName.startsWith('rca_ticket_')"
                                                        class="group cursor-pointer bg-white rounded-lg overflow-hidden border border-gray-200 hover:border-purple-300 transition-colors shadow-sm"
                                                        @click.stop="reply.attachmentUrl ? window.open(reply.attachmentUrl, '_blank') : alert('File URL not found')">
                                                        <div class="flex items-center p-3 bg-purple-50/50">
                                                            <div
                                                                class="p-2 bg-purple-100 text-purple-600 rounded-lg mr-3 shadow-sm">
                                                                <i class="fas fa-file-medical-alt text-xl"></i>
                                                            </div>
                                                            <div class="flex-1">
                                                                <h4
                                                                    class="text-sm font-bold text-purple-900 leading-tight">
                                                                    RCA Report Generated</h4>
                                                                <p class="text-xs text-purple-700 mt-0.5">Click to
                                                                    download PDF</p>
                                                            </div>
                                                            <div
                                                                class="text-purple-400 group-hover:text-purple-600 transition-colors bg-white rounded-full p-1.5 shadow-sm">
                                                                <i class="fas fa-download"></i>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <!-- General Attachment Box -->
                                                    <div x-show="!reply.attachmentName || !reply.attachmentName.startsWith('rca_ticket_')"
                                                        class="flex items-center p-2 rounded-lg transition-colors cursor-pointer"
                                                        :class="isMe(reply) ? 'bg-white/20 border border-white/30 hover:bg-white/40' : 'bg-gray-50 border border-gray-200 hover:bg-gray-100'"
                                                        @click.stop="reply.attachmentUrl ? window.open(reply.attachmentUrl, '_blank') : alert('File URL not found')">

                                                        <div class="p-2 rounded mr-3"
                                                            :class="isMe(reply) ? 'bg-white/20 text-white' : 'bg-white text-indigo-600 shadow-sm'">
                                                            <template
                                                                x-if="reply.attachmentType && reply.attachmentType.startsWith('image/')">
                                                                <i class="fas fa-file-image text-lg"></i>
                                                            </template>
                                                            <template
                                                                x-if="reply.attachmentType && reply.attachmentType.includes('pdf')">
                                                                <i class="fas fa-file-pdf text-lg"></i>
                                                            </template>
                                                            <template
                                                                x-if="!reply.attachmentType || (!reply.attachmentType.startsWith('image/') && !reply.attachmentType.includes('pdf'))">
                                                                <i class="fas fa-file-alt text-lg"></i>
                                                            </template>
                                                        </div>
                                                        <div class="flex-1 min-w-0 overflow-hidden">
                                                            <p class="text-sm font-medium truncate"
                                                                x-text="reply.attachmentName || 'Attached File'"></p>
                                                            <p class="text-[10px] opacity-80"
                                                                x-text="reply.attachmentUrl ? 'Click to view / download' : 'Attachment processing...'">
                                                            </p>
                                                        </div>
                                                        <div class="ml-2"><i
                                                                class="fas fa-download text-xs opacity-70"></i></div>
                                                    </div>
                                                </div>
                                            </template>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <div x-show="ticket.replies.length === 0" class="text-center py-10">
                            <p class="text-gray-400 text-sm italic">No replies yet. Start the conversation below.</p>
                        </div>

                    </div>
                </div>
            </div>

            <footer class="bg-white border-t border-gray-200 p-6" x-show="ticket && ticket.status !== 'CLOSED'">
                <div class="max-w-5xl mx-auto">
                    <form @submit.prevent="submitReply">
                        <div class="mb-4 relative">
                            <div x-ref="quillEditor" class="bg-white"></div>

                            <div x-show="attachment"
                                class="absolute bottom-2 right-2 bg-indigo-50 border border-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs flex items-center shadow-sm z-10">
                                <i class="fas fa-paperclip mr-2"></i>
                                <span x-text="fileName" class="max-w-[150px] truncate"></span>
                                <button type="button" @click="clearFile"
                                    class="ml-2 text-indigo-400 hover:text-indigo-900"><i
                                        class="fas fa-times"></i></button>
                            </div>
                        </div>

                        <div class="flex justify-between items-center">
                            <div class="flex items-center">
                                <label
                                    class="cursor-pointer text-gray-500 hover:text-indigo-600 transition flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-50">
                                    <i class="fas fa-paperclip text-lg"></i>
                                    <span class="text-sm font-medium">Attach File</span>
                                    <input type="file" class="hidden" @change="handleFileSelect">
                                </label>
                            </div>

                            <button type="submit"
                                class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-semibold shadow-md hover:bg-indigo-700 hover:shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
                                :disabled="isSubmitting || (!newReplyHasContent && !attachment)">
                                <span x-show="!isSubmitting">Send Reply <i class="fas fa-paper-plane ml-1"></i></span>
                                <span x-show="isSubmitting">
                                    <i class="fas fa-circle-notch fa-spin"></i> Sending...
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </footer>

            <div x-show="ticket && ticket.status === 'CLOSED'"
                class="bg-gray-50 border-t border-gray-200 p-6 text-center">
                <div
                    class="inline-flex items-center gap-2 text-gray-500 font-medium bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200">
                    <i class="fas fa-lock"></i> This ticket is closed.
                </div>
            </div>

            <div x-show="showRcaModal" style="display: none;" class="fixed inset-0 z-50 overflow-y-auto"
                aria-labelledby="modal-title" role="dialog" aria-modal="true">

                <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"
                        @click="showRcaModal = false"></div>

                    <div
                        class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full">

                        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                            <div class="flex justify-between items-center mb-4 border-b pb-3">
                                <h3 class="text-lg leading-6 font-medium text-gray-900 flex items-center gap-2"
                                    id="modal-title">
                                    <i class="fas fa-file-medical-alt text-purple-600"></i> Generate Root Cause Analysis
                                </h3>
                                <button @click="showRcaModal = false" class="text-gray-400 hover:text-gray-500">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>

                            <div class="max-h-[70vh] overflow-y-auto pr-2 custom-scrollbar">
                                <form id="rcaForm" class="space-y-6">

                                    <div>
                                        <label class="block text-sm font-bold text-gray-800 mb-2">1. Problem Statement
                                            <span class="text-red-500">*</span></label>
                                        <textarea x-model="rcaFormData.problemStatement"
                                            class="w-full shadow-sm border-gray-300 rounded-md focus:ring-purple-500 focus:border-purple-500 text-sm"
                                            rows="3" placeholder="Describe the problem briefly..."></textarea>
                                    </div>

                                    <div class="border-t border-gray-200 pt-4">
                                        <label class="block text-sm font-bold text-gray-800 mb-2">2. Incident
                                            Overview</label>
                                        <template x-for="(section, index) in rcaFormData.incidentOverview" :key="index">
                                            <div
                                                class="mb-3 bg-gray-50 p-4 rounded-lg border border-gray-200 relative group">
                                                <button type="button" @click="removeSection('incidentOverview', index)"
                                                    class="absolute top-2 right-2 text-gray-400 hover:text-red-500 transition-colors"
                                                    title="Remove Section">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                                <div class="mb-2">
                                                    <input x-model="section.heading" type="text"
                                                        class="block w-full bg-transparent border-0 border-b border-gray-300 focus:border-purple-500 focus:ring-0 text-sm font-semibold placeholder-gray-400 px-0"
                                                        placeholder="Label (e.g. Incident Name)">
                                                </div>
                                                <textarea x-model="section.content"
                                                    class="w-full bg-white border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500 text-sm"
                                                    rows="1" placeholder="Details..."></textarea>
                                            </div>
                                        </template>
                                        <button type="button" @click="addSection('incidentOverview')"
                                            class="text-sm text-purple-600 hover:text-purple-800 flex items-center font-medium">
                                            <i class="fas fa-plus-circle mr-1"></i> Add Sub-section
                                        </button>
                                    </div>

                                    <div class="border-t border-gray-200 pt-4">
                                        <label class="block text-sm font-bold text-gray-800 mb-2">3. Description of the
                                            Issue</label>
                                        <template x-for="(section, index) in rcaFormData.descriptionSections"
                                            :key="index">
                                            <div
                                                class="mb-3 bg-gray-50 p-4 rounded-lg border border-gray-200 relative group">
                                                <button type="button"
                                                    @click="removeSection('descriptionSections', index)"
                                                    class="absolute top-2 right-2 text-gray-400 hover:text-red-500 transition-colors"
                                                    title="Remove Section">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                                <div class="mb-2">
                                                    <input x-model="section.heading" type="text"
                                                        class="block w-full bg-transparent border-0 border-b border-gray-300 focus:border-purple-500 focus:ring-0 text-sm font-semibold placeholder-gray-400 px-0"
                                                        placeholder="Sub-heading (e.g. Symptoms)">
                                                </div>
                                                <textarea x-model="section.content"
                                                    class="w-full bg-white border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500 text-sm"
                                                    rows="2" placeholder="Details..."></textarea>
                                            </div>
                                        </template>
                                        <button type="button" @click="addSection('descriptionSections')"
                                            class="text-sm text-purple-600 hover:text-purple-800 flex items-center font-medium">
                                            <i class="fas fa-plus-circle mr-1"></i> Add Sub-section
                                        </button>
                                    </div>

                                    <div class="border-t border-gray-200 pt-4">
                                        <label class="block text-sm font-bold text-gray-800 mb-2">4. Root Cause
                                            Identification</label>
                                        <template x-for="(section, index) in rcaFormData.rootCauseSections"
                                            :key="index">
                                            <div
                                                class="mb-3 bg-gray-50 p-4 rounded-lg border border-gray-200 relative group">
                                                <button type="button" @click="removeSection('rootCauseSections', index)"
                                                    class="absolute top-2 right-2 text-gray-400 hover:text-red-500 transition-colors">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                                <div class="mb-2">
                                                    <input x-model="section.heading" type="text"
                                                        class="block w-full bg-transparent border-0 border-b border-gray-300 focus:border-purple-500 focus:ring-0 text-sm font-semibold placeholder-gray-400 px-0"
                                                        placeholder="Sub-heading (e.g. 5 Whys Analysis)">
                                                </div>
                                                <textarea x-model="section.content"
                                                    class="w-full bg-white border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500 text-sm"
                                                    rows="2" placeholder="Analysis..."></textarea>
                                            </div>
                                        </template>
                                        <button type="button" @click="addSection('rootCauseSections')"
                                            class="text-sm text-purple-600 hover:text-purple-800 flex items-center font-medium">
                                            <i class="fas fa-plus-circle mr-1"></i> Add Sub-section
                                        </button>
                                    </div>

                                    <div class="border-t border-gray-200 pt-4">
                                        <label class="block text-sm font-bold text-gray-800 mb-2">5. Resolution</label>
                                        <template x-for="(section, index) in rcaFormData.resolutionSections"
                                            :key="index">
                                            <div
                                                class="mb-3 bg-gray-50 p-4 rounded-lg border border-gray-200 relative group">
                                                <button type="button"
                                                    @click="removeSection('resolutionSections', index)"
                                                    class="absolute top-2 right-2 text-gray-400 hover:text-red-500 transition-colors">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                                <div class="mb-2">
                                                    <input x-model="section.heading" type="text"
                                                        class="block w-full bg-transparent border-0 border-b border-gray-300 focus:border-purple-500 focus:ring-0 text-sm font-semibold placeholder-gray-400 px-0"
                                                        placeholder="Sub-heading (e.g. Immediate Fix)">
                                                </div>
                                                <textarea x-model="section.content"
                                                    class="w-full bg-white border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500 text-sm"
                                                    rows="2" placeholder="Action taken..."></textarea>
                                            </div>
                                        </template>
                                        <button type="button" @click="addSection('resolutionSections')"
                                            class="text-sm text-purple-600 hover:text-purple-800 flex items-center font-medium">
                                            <i class="fas fa-plus-circle mr-1"></i> Add Sub-section
                                        </button>
                                    </div>

                                    <div class="border-t border-gray-200 pt-4">
                                        <label class="block text-sm font-bold text-gray-800 mb-2">6. Prevention / Future
                                            Mitigation</label>
                                        <template x-for="(section, index) in rcaFormData.preventionSections"
                                            :key="index">
                                            <div
                                                class="mb-3 bg-gray-50 p-4 rounded-lg border border-gray-200 relative group">
                                                <button type="button"
                                                    @click="removeSection('preventionSections', index)"
                                                    class="absolute top-2 right-2 text-gray-400 hover:text-red-500 transition-colors">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                                <div class="mb-2">
                                                    <input x-model="section.heading" type="text"
                                                        class="block w-full bg-transparent border-0 border-b border-gray-300 focus:border-purple-500 focus:ring-0 text-sm font-semibold placeholder-gray-400 px-0"
                                                        placeholder="Sub-heading (e.g. Long-term Fix)">
                                                </div>
                                                <textarea x-model="section.content"
                                                    class="w-full bg-white border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500 text-sm"
                                                    rows="2" placeholder="Plan..."></textarea>
                                            </div>
                                        </template>
                                        <button type="button" @click="addSection('preventionSections')"
                                            class="text-sm text-purple-600 hover:text-purple-800 flex items-center font-medium">
                                            <i class="fas fa-plus-circle mr-1"></i> Add Sub-section
                                        </button>
                                    </div>

                                    <div class="border-t border-gray-200 pt-4">
                                        <label class="block text-sm font-bold text-gray-800 mb-2">7. Conclusion</label>
                                        <textarea x-model="rcaFormData.conclusion"
                                            class="w-full shadow-sm border-gray-300 rounded-md focus:ring-purple-500 focus:border-purple-500 text-sm"
                                            rows="3" placeholder="Final summary..."></textarea>
                                    </div>

                                </form>
                            </div>
                        </div>

                        <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-gray-200">
                            <button type="button" @click="submitRca()" :disabled="rcaSubmitting"
                                class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-purple-600 text-base font-medium text-white hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50">
                                <span x-show="!rcaSubmitting">Submit & Close Ticket</span>
                                <span x-show="rcaSubmitting"><i class="fas fa-circle-notch fa-spin mr-2"></i> Generating
                                    PDF...</span>
                            </button>
                            <button type="button" @click="showRcaModal = false"
                                class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                                Cancel
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

            <script>
                function ticketDetailApp() {
                    return {
                        loading: true,
                        isSubmitting: false,
                        ticket: null,
                        newReply: '',
                        newReplyHasContent: false,
                        attachment: null,
                        fileName: '',
                        ticketId: null,
                        quillInstance: null,
                        currentUser: { id: null, username: '', roles: [] },

                        // RCA Variables
                        showRcaModal: false,
                        rcaSubmitting: false,
                        rcaFormData: {
                            problemStatement: '',
                            conclusion: '',
                            incidentOverview: [{ heading: 'Incident Name', content: '' }],
                            descriptionSections: [{ heading: 'Symptoms', content: '' }],
                            rootCauseSections: [{ heading: 'Primary Cause', content: '' }],
                            resolutionSections: [{ heading: 'Steps Taken', content: '' }],
                            preventionSections: [{ heading: 'Action Item', content: '' }]
                        },

                        init() {
                            const urlParams = new URLSearchParams(window.location.search);
                            this.ticketId = urlParams.get('id');

                            if (this.ticketId) {
                                this.fetchCurrentUser().then(() => {
                                    this.fetchTicketDetails();
                                });
                            } else {
                                window.location.href = '/billops/tickets.html';
                            }

                            // Listen for browser back/forward navigation (soft navigation)
                            window.addEventListener('popstate', (event) => {
                                console.log('[Ticket Detail] Popstate event detected, reloading ticket details');
                                const urlParams = new URLSearchParams(window.location.search);
                                const newTicketId = urlParams.get('id');

                                if (newTicketId && newTicketId !== this.ticketId) {
                                    this.ticketId = newTicketId;
                                    this.loading = true;
                                    this.fetchTicketDetails();
                                } else if (!newTicketId) {
                                    window.location.href = '/billops/tickets.html';
                                }
                            });
                        },

                        // --- NEW: Role Check ---
                        get isAdmin() {
                            return this.currentUser && this.currentUser.roles && this.currentUser.roles.includes('ROLE_BILLOPS_ADMIN');
                        },
                        // -----------------------

                        async fetchCurrentUser() {
                            try {
                                const response = await fetch('/api/billops/profile', { credentials: 'include' });
                                if (response.ok) {
                                    this.currentUser = await response.json();
                                    // Ensure roles is an array
                                    if (!this.currentUser.roles) {
                                        this.currentUser.roles = [];
                                    }
                                }
                            } catch (e) { console.error("User profile error", e); }
                        },

                        initQuill() {
                            if (this.quillInstance) return;

                            this.$nextTick(() => {
                                if (this.$refs.quillEditor) {
                                    this.quillInstance = new Quill(this.$refs.quillEditor, {
                                        theme: 'snow',
                                        placeholder: 'Type your message here...',
                                        modules: {
                                            toolbar: [
                                                ['bold', 'italic', 'underline', 'strike'],
                                                ['blockquote', 'code-block'],
                                                [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                                                ['clean']
                                            ]
                                        }
                                    });

                                    this.quillInstance.on('text-change', () => {
                                        this.newReply = this.quillInstance.root.innerHTML;
                                        const text = this.quillInstance.getText().trim();
                                        this.newReplyHasContent = text.length > 0;
                                    });
                                }
                            });
                        },

                        async fetchTicketDetails() {
                            try {
                                const response = await fetch(`/api/billops/tickets/${this.ticketId}`, { credentials: 'include' });
                                if (!response.ok) throw new Error('Failed to fetch ticket');
                                this.ticket = await response.json();

                                if (this.ticket.status !== 'CLOSED') {
                                    this.initQuill();
                                }
                                this.$nextTick(() => {
                                    const container = document.getElementById('chat-container');
                                    if (container) container.scrollTop = container.scrollHeight;
                                });

                            } catch (error) {
                                console.error('Error:', error);
                                alert('Could not load ticket details.');
                            } finally {
                                this.loading = false;
                            }
                        },

                        isMe(reply) {
                            if (this.currentUser.id) {
                                return String(reply.authorId) === String(this.currentUser.id);
                            }
                            return false;
                        },

                        handleFileSelect(event) {
                            const file = event.target.files[0];
                            if (file) {
                                if (file.size > 10 * 1024 * 1024) {
                                    alert("File is too large. Max size is 10MB.");
                                    return;
                                }
                                this.attachment = file;
                                this.fileName = file.name;
                            }
                        },

                        clearFile() {
                            this.attachment = null;
                            this.fileName = '';
                        },

                        async submitReply() {
                            const textContent = this.quillInstance.getText().trim();

                            if (!textContent && !this.attachment) {
                                return;
                            }

                            this.isSubmitting = true;

                            try {
                                const formData = new FormData();
                                const finalMessage = textContent ? this.newReply : "";
                                formData.append('message', finalMessage);
                                formData.append('ticketId', this.ticketId);

                                if (this.currentUser.id) {
                                    formData.append('authorId', this.currentUser.id);
                                }

                                if (this.attachment) {
                                    formData.append('file', this.attachment);
                                }

                                const response = await fetch(`/api/billops/tickets/${this.ticketId}/replies`, {
                                    credentials: 'include',
                                    method: 'POST',
                                    body: formData
                                });

                                if (!response.ok) throw new Error('Failed to send reply.');

                                const updatedTicket = await response.json();
                                this.ticket = updatedTicket;

                                this.quillInstance.root.innerHTML = '';
                                this.newReply = '';
                                this.clearFile();

                                this.$nextTick(() => {
                                    const container = document.getElementById('chat-container');
                                    container.scrollTop = container.scrollHeight;
                                });

                            } catch (err) {
                                console.error('Error submitting reply:', err);
                                alert('Error sending reply. Please try again.');
                            } finally {
                                this.isSubmitting = false;
                            }
                        },

                        closeTicket() {
                            if (confirm('Are you sure you want to close this ticket?')) {
                                fetch(`/api/billops/tickets/${this.ticketId}/close`, { method: 'POST', credentials: 'include' })
                                    .then(res => res.json())
                                    .then(updatedTicket => {
                                        this.ticket = updatedTicket;
                                    });
                            }
                        },

                        formatDate(dateString) {
                            if (!dateString) return '';
                            return new Date(dateString).toLocaleString('en-US', {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            });
                        },

                        formatDateSimple(dateString) {
                            if (!dateString) return '';
                            const date = new Date(dateString);
                            const today = new Date();
                            const isToday = date.toDateString() === today.toDateString();

                            if (isToday) {
                                return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                            }
                            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' +
                                date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                        },

                        getInitials(name) {
                            if (!name) return 'U';
                            return name.charAt(0).toUpperCase();
                        },

                        // --- RCA FUNCTIONS ---

                        addSection(arrayName) {
                            this.rcaFormData[arrayName].push({ heading: '', content: '' });
                        },

                        removeSection(arrayName, index) {
                            this.rcaFormData[arrayName].splice(index, 1);
                        },

                        async submitRca() {
                            if (!this.rcaFormData.problemStatement) {
                                alert("Problem Statement is required.");
                                return;
                            }

                            if (!confirm("This will generate an RCA report and CLOSE the ticket. Continue?")) {
                                return;
                            }

                            this.rcaSubmitting = true;

                            try {
                                const response = await fetch(`/api/billops/tickets/${this.ticketId}/rca`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    credentials: 'include',
                                    body: JSON.stringify(this.rcaFormData)
                                });

                                if (response.ok) {
                                    alert("RCA Generated successfully. Ticket Closed.");
                                    this.showRcaModal = false;
                                    this.fetchTicketDetails(); // Refresh to show the new system message
                                } else {
                                    const err = await response.json().catch(() => ({}));
                                    alert("Failed to submit RCA: " + (err.message || "Unknown error"));
                                }
                            } catch (error) {
                                console.error("Error submitting RCA:", error);
                                alert("An error occurred while submitting the RCA.");
                            } finally {
                                this.rcaSubmitting = false;
                            }
                        },

                        goBackToTickets() {
                            // Check if we can go back in history
                            if (window.history.length > 1 && document.referrer.includes('/billops/tickets.html')) {
                                window.history.back();
                            } else {
                                // Fallback: navigate directly to tickets page
                                window.location.href = '/billops/tickets.html';
                            }
                        }
                    };
                }
            </script>
        </main>
    </div>
    </div>

</body>

</html>
