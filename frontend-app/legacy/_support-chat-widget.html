<!-- Support Chat Widget - Included via Sidebar for all XAMOPS users -->
<script>
    function supportChatWidget() {
        return {
            open: false,
            newMessage: '',
            isLoading: false,
            messages: [],
            isXamopsUser: false,

            init() {
                // Check if user has ROLE_XAMOPS from cached roles
                const cachedRoles = JSON.parse(sessionStorage.getItem('cached_user_roles') || '[]');
                this.isXamopsUser = cachedRoles.includes('ROLE_XAMOPS');

                if (this.isXamopsUser) {
                    this.fetchHistory();
                    setInterval(() => this.fetchHistory(), 5000);
                }
            },

            // Get the currently selected account ID from sessionStorage
            getSelectedAccountId() {
                const selectedIds = JSON.parse(sessionStorage.getItem('selectedAccountIds') || '[]');
                return selectedIds.length > 0 ? selectedIds[0] : null;
            },

            async fetchHistory() {
                try {
                    const accountId = this.getSelectedAccountId();
                    const url = accountId
                        ? `/api/ai/chat/history?accountId=${encodeURIComponent(accountId)}`
                        : '/api/ai/chat/history';
                    const response = await fetch(url, {
                        credentials: 'include'
                    });
                    if (response.ok) {
                        const history = await response.json();
                        this.messages = history.map(msg => ({
                            text: msg.content,
                            isUser: msg.userMessage,
                            timestamp: msg.timestamp
                        }));
                        this.scrollToBottom();
                    }
                } catch (e) {
                    console.error('Failed to fetch chat history', e);
                }
            },

            async sendMessage() {
                if (this.newMessage.trim() === '') return;

                this.messages.push({ text: this.newMessage, isUser: true });
                const userMsg = this.newMessage;
                this.newMessage = '';
                this.isLoading = true;
                this.scrollToBottom();

                try {
                    const csrfToken = document.cookie
                        .split('; ')
                        .find(row => row.startsWith('XSRF-TOKEN='))
                        ?.split('=')[1];

                    const response = await fetch(`/api/ai/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-XSRF-TOKEN': csrfToken
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            message: userMsg,
                            accountId: this.getSelectedAccountId()
                        })
                    });

                    if (response.status === 401 || response.status === 403) {
                        this.messages.push({ text: '⚠️ Session expired. Please refresh the page to log in again.', isUser: false });
                        return;
                    }

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Server Error:', response.status, errorText);
                        throw new Error(`Server error: ${response.status}`);
                    }

                    // Fetch updated history after sending
                    await this.fetchHistory();

                } catch (error) {
                    console.error('Chat Error:', error);
                    this.messages.push({ text: '⚠️ Connection failed. Please try again later.', isUser: false });
                } finally {
                    this.isLoading = false;
                    this.scrollToBottom();
                }
            },

            scrollToBottom() {
                this.$nextTick(() => {
                    const container = document.getElementById('support-chat-history');
                    if (container) container.scrollTop = container.scrollHeight;
                });
            }
        }
    }
</script>

<div id="support-chat-widget" class="fixed bottom-24 right-6 z-50 font-sans" x-data="supportChatWidget()" x-init="init()" x-show="isXamopsUser" x-cloak>

    <button @click="open = !open; if(open) { fetchHistory(); scrollToBottom(); }"
        class="w-14 h-14 bg-gradient-to-r from-teal-500 to-green-500 rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-all duration-300 focus:outline-none z-50"
        title="Live Support">
        <i class="fas fa-headset text-white text-2xl"></i>
        <span class="absolute -top-1 -right-1 flex h-4 w-4">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-4 w-4 bg-teal-500"></span>
        </span>
    </button>

    <div x-show="open" x-cloak x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 transform scale-95 translate-y-10"
        x-transition:enter-end="opacity-100 transform scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 transform scale-100 translate-y-0"
        x-transition:leave-end="opacity-0 transform scale-95 translate-y-10"
        class="absolute bottom-20 right-0 w-96 h-[500px] bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden z-40">

        <div class="bg-gradient-to-r from-teal-500 to-green-500 text-white p-4 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-white bg-opacity-20 rounded-full flex items-center justify-center backdrop-blur-sm">
                    <i class="fas fa-user-headset text-sm"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm">BillOps Support</h3>
                    <p class="text-xs opacity-80 flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> Available
                    </p>
                </div>
            </div>
            <button @click="open = false"
                class="hover:bg-white hover:bg-opacity-20 rounded-lg p-2 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div id="support-chat-history"
            class="flex-1 p-4 overflow-y-auto bg-gray-50 space-y-4 custom-scrollbar">
            <template x-for="(msg, index) in messages" :key="index">
                <div :class="msg.isUser ? 'flex justify-end' : 'flex justify-start'">
                    <div :class="msg.isUser ? 'bg-teal-600 text-white rounded-br-none' : 'bg-white text-gray-800 border border-gray-200 rounded-bl-none'"
                        class="max-w-[85%] rounded-2xl px-4 py-3 shadow-sm text-sm leading-relaxed">
                        <p x-text="msg.text"></p>
                    </div>
                </div>
            </template>

            <div x-show="isLoading" class="flex justify-start">
                <div class="bg-white border border-gray-200 text-gray-500 rounded-2xl rounded-bl-none px-4 py-3 text-xs flex items-center shadow-sm">
                    <i class="fas fa-circle-notch fa-spin mr-2 text-teal-500"></i>
                    Sending...
                </div>
            </div>
        </div>

        <div class="p-4 bg-white border-t border-gray-100">
            <div class="relative flex items-center">
                <input type="text" x-model="newMessage" @keydown.enter="sendMessage()"
                    placeholder="Type your message..."
                    class="w-full bg-gray-100 text-gray-800 text-sm rounded-xl pl-4 pr-12 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition-all border-0">
                <button @click="sendMessage()" :disabled="isLoading || newMessage.trim() === ''"
                    class="absolute right-2 p-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </div>
</div>
