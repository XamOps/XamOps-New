server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Content Security Policy — ENFORCING, identical to the edge gateway and the
    # Spring services (xamops-service/billops/media-ops) so every layer agrees.
    # This container serves the SPA's index.html and static assets directly, so it
    # must carry the CSP itself — a request that is served here never reaches the
    # Spring backends that set the header.
    #
    # IMPORTANT nginx quirk: add_header does NOT inherit into a location block that
    # defines its own add_header. The static-asset, =/index.html and SPA-fallback
    # blocks below all set Cache-Control headers, so the CSP is repeated inside each
    # of them — without that repetition the HTML (served by the SPA fallback) would
    # ship with no CSP at all. Keep all copies in sync when editing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;

    # S3 browser — proxied to xamops-service (before the generic /api/ block)
    location /api/s3-browser/ {
        proxy_pass http://xamops-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_intercept_errors off;
    }

    # media-ops API — must come before the generic /api/ block
    location /api/media-ops/ {
        proxy_pass http://media-ops-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_intercept_errors off;
        client_max_body_size 2g;
    }

    # media-ops WebSocket (STOMP job progress)
    location /media-ops-ws {
        proxy_pass http://media-ops-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # media-ops browser stream WebSocket
    location /browser-stream/ {
        proxy_pass http://media-ops-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # HLS / transcoded media file serving
    location /media/ {
        proxy_pass http://media-ops-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }

    # Credit requests carry supporting documents of any type and size, so this route
    # opts out of the 32m cap below. Bodies stream straight through instead of being
    # spooled to nginx disk first, and the timeouts allow for slow uploads.
    location /api/billops/credits {
        proxy_pass http://xamops-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_intercept_errors off;
    }

    # Proxy all API requests to the backend service
    location /api/ {
        proxy_pass http://xamops-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        # Cluster agents POST their whole collection cycle as one uncompressed JSON
        # body to /api/v1/agent/ingest. With Trivy, Kubescape, OpenCost and
        # Prometheus all reporting, that payload runs to several MB — well past
        # nginx's 1m default, which rejected every push with a 413 the backend
        # never saw. Keep this comfortably above the largest expected push.
        client_max_body_size 32m;
        # DO NOT use proxy_intercept_errors here — it replaces backend JSON error
        # responses (500, 502, etc.) with nginx's own 50x.html, causing the frontend
        # to receive HTML instead of JSON and showing "API endpoint not found".
        proxy_intercept_errors off;
    }

    # Proxy WebSocket connections
    location /xamops-ws {
        proxy_pass http://xamops-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /terminal {
        proxy_pass http://xamops-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Auth endpoints
    location /login {
        proxy_pass http://xamops-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logout {
        proxy_pass http://xamops-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static assets directly
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated because this block's own add_header cancels server-level inheritance.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html must never be cached — it holds the asset hashes that bust JS/CSS cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Repeated because this block's own add_header cancels server-level inheritance.
        # This is the HTML document itself — the most important place for the CSP.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Repeated because this block's own add_header cancels server-level inheritance.
        # SPA fallback: every client-side route returns index.html through here, so
        # this is the main path by which users receive the HTML document.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
