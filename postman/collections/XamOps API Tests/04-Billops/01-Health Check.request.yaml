$kind: http-request
name: Health Check
method: GET
url: '{{billopsBaseUrl}}/api/billops/health'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response body contains running", function() {
        pm.expect(pm.response.text()).to.include("running");
      });
