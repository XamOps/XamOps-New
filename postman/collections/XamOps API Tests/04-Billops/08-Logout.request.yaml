$kind: http-request
name: Logout
method: POST
url: '{{billopsBaseUrl}}/logout'
order: 8000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response status equals success", function() {
        const json = pm.response.json();
        pm.expect(json.status).to.eql("success");
      });
