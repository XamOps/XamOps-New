$kind: http-request
name: Get User Profile
method: GET
url: '{{billopsBaseUrl}}/user/profile'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response has username", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("username");
      });
      pm.test("Response has email", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("email");
      });
      pm.test("Response has roles", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("roles");
      });
