$kind: http-request
name: 'Cost Forecast - Invalid Periods'
method: GET
url: '{{xamopsBaseUrl}}/api/xamops/forecast/cost'
order: 7000
queryParams:
  - key: accountId
    value: '{{awsAccountId}}'
  - key: periods
    value: '999'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function() {
        pm.response.to.have.status(400);
      });
      pm.test("Response status equals error", function() {
        const json = pm.response.json();
        pm.expect(json.status).to.eql("error");
      });
      pm.test("Response message contains Periods must be between", function() {
        const json = pm.response.json();
        pm.expect(json.message).to.include("Periods must be between");
      });
