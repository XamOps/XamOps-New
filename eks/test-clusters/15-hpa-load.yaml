# REAL CPU LOAD + HPA.
# Adapted from eks/stress-test.yaml (php-apache + Service + HPA) and moved into
# the team-b namespace, with an in-cluster load generator so metrics are never
# flat zeros and the HPA actually scales without manual `kubectl run`.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: team-b
  labels:
    app: php-apache
    scenario: hpa-load
    project: XamOps
    purpose: CloudK8sFeatureTesting
    owner: agent-provisioned
    created-on: "2026-10-09"
    ephemeral: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-apache
  template:
    metadata:
      labels:
        app: php-apache
        scenario: hpa-load
        project: XamOps
        purpose: CloudK8sFeatureTesting
        owner: agent-provisioned
        created-on: "2026-10-09"
        ephemeral: "true"
    spec:
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: team-b
  labels:
    app: php-apache
    project: XamOps
    purpose: CloudK8sFeatureTesting
    owner: agent-provisioned
    created-on: "2026-10-09"
    ephemeral: "true"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: php-apache
---
# Scales 1 -> 5 replicas above 50% CPU utilisation. Needs metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
  namespace: team-b
  labels:
    app: php-apache
    scenario: hpa-load
    project: XamOps
    purpose: CloudK8sFeatureTesting
    owner: agent-provisioned
    created-on: "2026-10-09"
    ephemeral: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
# Steady, modest in-cluster traffic source (keeps cost/CPU low but non-zero).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: team-b
  labels:
    app: load-generator
    scenario: load-generator
    project: XamOps
    purpose: CloudK8sFeatureTesting
    owner: agent-provisioned
    created-on: "2026-10-09"
    ephemeral: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
        scenario: load-generator
        project: XamOps
        purpose: CloudK8sFeatureTesting
        owner: agent-provisioned
        created-on: "2026-10-09"
        ephemeral: "true"
    spec:
      containers:
        - name: loadgen
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - while true; do wget -q -O- http://php-apache.team-b.svc.cluster.local >/dev/null 2>&1; done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 64Mi
