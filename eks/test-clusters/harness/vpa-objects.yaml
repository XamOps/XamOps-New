# OSS baseline: one upstream VerticalPodAutoscaler per seeded Deployment,
# updateMode Off (recommendation only — the recommender writes
# status.recommendation, nothing evicts or mutates pods).
#   kubectl apply -f vpa-objects.yaml
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: overprovisioned-api-baseline
  namespace: team-a
  labels:
    app.kubernetes.io/part-of: xamops-automation-harness
    project: XamOps
    purpose: CloudK8sFeatureTesting
    owner: agent-provisioned
    ephemeral: "true"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: overprovisioned-api
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
