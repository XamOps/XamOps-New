# Prometheus baseline for the XamOps automation harness (xamops-test-1 only).
#
#   helm upgrade --install prometheus prometheus-community/prometheus \
#     --version 29.36.1 -n monitoring --create-namespace -f prometheus-values.yaml
#
# Service name + port are chosen so the in-cluster URL equals the default that
# both xamops-agent and xamops-autoscaler hard-code:
#   http://prometheus-server.monitoring.svc.cluster.local:9090
#
# No PersistentVolume (emptyDir): no EBS volume is created, so nothing new in AWS.
# History is lost if the server pod restarts — acceptable for a 1-day harness.
# Prometheus adds no CloudWatch metric cardinality (it is in-cluster only).

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }

prometheus-node-exporter:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }

configmapReload:
  prometheus:
    resources:
      requests: { cpu: 5m, memory: 16Mi }
      limits: { memory: 64Mi }

server:
  service:
    type: ClusterIP        # never LoadBalancer / NodePort — no public exposure
    servicePort: 9090
  persistentVolume:
    enabled: false         # emptyDir
  emptyDir:
    sizeLimit: 4Gi
  retention: "3d"
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
    scrape_timeout: 10s
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1536Mi }
  podLabels:
    project: XamOps
    purpose: CloudK8sFeatureTesting
    owner: agent-provisioned
    ephemeral: "true"
