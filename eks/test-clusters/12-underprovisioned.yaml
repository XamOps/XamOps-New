# UNDER-PROVISIONED / THROTTLED: a genuinely CPU-hungry loop pinned behind a
# 10m request / 50m limit. container_cpu_cfs_throttled_seconds_total should
# climb continuously, so CPU-throttling detection is testable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: throttled-encoder
  namespace: prod-sim
  labels:
    app: throttled-encoder
    scenario: underprovisioned
    project: XamOps
    purpose: CloudK8sFeatureTesting
    owner: agent-provisioned
    created-on: "2026-10-09"
    ephemeral: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: throttled-encoder
  template:
    metadata:
      labels:
        app: throttled-encoder
        scenario: underprovisioned
        project: XamOps
        purpose: CloudK8sFeatureTesting
        owner: agent-provisioned
        created-on: "2026-10-09"
        ephemeral: "true"
    spec:
      containers:
        - name: encoder
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["/bin/sh", "-c"]
          # Unbounded busy loop — wants a full core, allowed 50m.
          args:
            - while true; do i=0; while [ $i -lt 1000000 ]; do i=$((i+1)); done; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
