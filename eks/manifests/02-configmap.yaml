apiVersion: v1
kind: ConfigMap
metadata:
  name: xamops-config
  namespace: xamops
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

  # ── Database pool ────────────────────────────────────────────────────────────
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "20"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "10000"
  SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: "30000"

  # ── Redis (in-cluster service) ────────────────────────────────────────────────
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"

  # ── OpenObserve (prod EC2: i-021da16d98a9c4239, private IP 10.1.10.93) ─────────
  OPENOBSERVE_URL: "http://10.1.10.93:5080"

  # ── CORS & Frontend ───────────────────────────────────────────────────────────
  # Update with your actual domain after ALB DNS or custom domain is ready
  CORS_ALLOWED_ORIGINS: "https://live.xamops.com"
  APP_FRONTEND_URL: "https://live.xamops.com"

  # ── AWS ───────────────────────────────────────────────────────────────────────
  AWS_REGION: "ap-south-1"
  AWS_COSTEXPLORER_MOCK: "false"

  # ── JPA / Hibernate ───────────────────────────────────────────────────────────
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  SERVER_FORWARD_HEADERS_STRATEGY: "native"

  # ── Logging ───────────────────────────────────────────────────────────────────
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: "INFO"
  LOGGING_LEVEL_COM_XAMMER_CLOUD: "INFO"

  # ── Cookie (HTTPS) ────────────────────────────────────────────────────────────
  SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: "None"
  SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"

  # ── CloudFormation S3 ─────────────────────────────────────────────────────────
  CLOUDFORMATION_TEMPLATE_S3_URL: "https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-readonly-role.yml"
