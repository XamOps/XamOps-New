# ─────────────────────────────────────────────────────────────────────────────
# Horizontal Pod Autoscaler
# Requires: metrics-server installed on the cluster
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xamops-service-hpa
  namespace: xamops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xamops-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xamops-frontend-hpa
  namespace: xamops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xamops-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
