# ─────────────────────────────────────────────────────────────────────────────
# XamOps Frontend — React + Nginx
# Nginx proxies /api/, /login, /logout, WebSocket to xamops-service:8080
# The LoadBalancer service creates an AWS NLB as the public entry point.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xamops-frontend
  namespace: xamops
  labels:
    app: xamops-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xamops-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: xamops-frontend
    spec:
      containers:
        - name: xamops-frontend
          # Replace <AWS_ACCOUNT_ID> with your account ID
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/xamops-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: xamops-frontend
  namespace: xamops
  annotations:
    # AWS NLB (faster than CLB, supports WebSocket natively)
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Optional: Add your ACM certificate ARN for HTTPS termination at NLB
    # service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:ap-south-1:<ACCOUNT_ID>:certificate/<CERT_ID>"
    # service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  selector:
    app: xamops-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
    # Uncomment after adding ACM cert annotation above:
    # - name: https
    #   port: 443
    #   targetPort: 80
  type: LoadBalancer
