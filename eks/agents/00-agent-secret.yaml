# ─────────────────────────────────────────────────────────────────────────────
# OpenObserve credentials for the XamOps unified agent.
#
# Fill in the values before applying, or run ./eks/agents/deploy-agents.sh
# which auto-fetches O2_ORG_ID and computes O2_AUTH_BASE64.
#
# Required fields:
#   O2_URL          — OpenObserve endpoint (in-cluster or ngrok)
#   O2_ORG_ID       — from XamOps → Observability → Overview → "Org ID"
#   O2_AUTH_BASE64  — base64("email:password")
#                     echo -n 'aditya@xammer.in:Complexpass#123' | base64
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: o2-agent-credentials
  namespace: xamops-system
type: Opaque
stringData:
  O2_URL: "http://openobserve.xamops.svc.cluster.local:5080"
  O2_ORG_ID: "<REPLACE_WITH_ORG_ID>"
  O2_AUTH_BASE64: "<REPLACE_WITH_BASE64>"   # echo -n 'email:password' | base64
