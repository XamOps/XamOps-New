# Disable auto-configurations that require external services
spring.autoconfigure.exclude=  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,  org.springframework.boot.autoconfigure.session.SessionAutoConfiguration,  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Prevent Eureka from registering during tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Use none for session storage
spring.session.store-type=none

# Placeholders for MultiTenantDataSourceConfig to satisfy @Value injections
spring.datasource.url=jdbc:postgresql://localhost:5432/test
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
