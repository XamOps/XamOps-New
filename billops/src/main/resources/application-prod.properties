# ===================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION for billops-service
# ===================================================================

# --- PRODUCTION PostgreSQL Database ---
# App always connects to MASTER via PgBouncer (port 6432)
# NEVER connect directly to Postgres port 5432
spring.datasource.url=jdbc:postgresql://10.30.11.65:6432/postgres
spring.datasource.username=postgres
spring.datasource.password=XamOps@123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- EMERGENCY FAILOVER (Slave/Replica) ---
# Slave is for manual failover ONLY — app does NOT use it in normal operation
# If master (10.30.11.65) dies:
#   1. On replica EC2: pg_ctl promote -D /var/lib/pgsql/data
#   2. Uncomment the line below and comment out the master URL above
#   3. Redeploy
# spring.datasource.url=jdbc:postgresql://10.30.11.247:5432/postgres

# --- PRODUCTION Service Registry ---
# Uses Docker internal container name — no HTTPS needed within prod-network
eureka.client.serviceUrl.defaultZone=http://service-registry:8761/eureka/

# Redis for PRODUCTION
# Redis is on a SEPARATE EC2 (10.30.12.92) — use private IP, NOT container name
spring.redis.host=10.30.12.92
spring.redis.port=6379

# --- Other PRODUCTION configurations ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.springframework=INFO
logging.level.com.xammer.billops=INFO

# PRODUCTION CORS Configuration
app.frontend.url=https://live.xamops.com
cors.allowed-origins=https://live.xamops.com

gemini.api.key=${GEMINI_API_KEY:AIzaSyDUHXg5yf3PrWdtvrHOhHQ9t5QKihoeCVA}
cloudformation.template.s3.url=https://xamopscftemplate.s3.ap-south-1.amazonaws.com/billops-readonly-role.yml

app.environment=production

# ===================================================================
# DETAILED LOGGING FOR SECURITY DEBUGGING
# ===================================================================
logging.level.org.springframework.security=TRACE
logging.level.com.xammer.cloud.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG

# Enable request/response logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# ==============================================================
# DATABASE CONNECTION POOL - PRODUCTION OVERRIDES
# Pool size = 10 per service (ASG handles scale-out)
# Formula: PgBouncer max_client_conn=200, 2 services, capped at 10 conservatively
# connection-timeout=15000: gives headroom under load
# ==============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.leak-detection-threshold=30000

# Serialize scheduled jobs — one at a time, prevents tenant pool stampede
spring.task.scheduling.pool.size=1

# Surface Hikari pool activity in logs (remove after pool issues are resolved)
logging.level.com.zaxxer.hikari=DEBUG

# Async timeout set well below ALB (300s) and nginx proxy_read_timeout (300s)
spring.mvc.async.request-timeout=125000

# ===================================================================
# PRODUCTION ENVIRONMENT - SCHEDULING
# ===================================================================
scheduling.enabled=true
