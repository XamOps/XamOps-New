# ===================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION for billops-service
# ===================================================================

# --- AWS Secrets Manager: load prod credentials at startup ---
# Region for the Secrets Manager client (instance role XamOps-App-EC2-Role supplies
# credentials over IMDS).
#
# Only two secrets, deliberately: billops shares the master database and the
# impersonation key with xamops-service, but has no business reading prod/xamops_app
# (mail password, Authentik token, LiveKit, OAuth secrets). If billops ever needs a
# secret of its own, that belongs in a new prod/billops_app rather than here.
#
# prod/xamops_shared is what guarantees the impersonation key matches: billops SIGNS
# the token, xamops-service and media-ops-service only verify it. A mismatch means
# every "Login As" silently fails validation.
spring.cloud.aws.region.static=ap-south-1
cloud.aws.stack.auto=false
spring.config.import=optional:aws-secretsmanager:prod/xamops_db,optional:aws-secretsmanager:prod/xamops_shared

# --- PRODUCTION PostgreSQL Database (Multi-Tenant Mode - Uses Master DB) ---
# From prod/xamops_db — the same master DB xamops-service uses (10.1.10.124), which is
# why both import the same secret rather than keeping two copies of one credential.
#
# SPRING_DATASOURCE_* env vars, if the deploy sets them, still outrank anything imported
# here, so these lines are inert until those are dropped.
spring.datasource.url=jdbc:postgresql://${host}:${port}/${dbname}
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Impersonation JWT — billops is the SIGNER. Stated explicitly here rather than
# inherited from application.properties, so prod's value is visible in prod's file.
app.impersonation.secret-key=${app_impersonation_secret_key}

# Encryption key for cloud credentials at rest. billops maps the same cloud_account rows as
# xamops-service and now decrypts the GCP service-account key and Azure client secret through
# the same converter, so this MUST resolve to the identical value xamops-service uses.
#
# DEPLOYMENT NOTE — prod/xamops_shared must carry app_encryption_secret_key for billops to
# read. Until it does, billops fails to start rather than reading credentials it cannot
# decrypt. If the value here ever drifts from xamops-service, the symptom is silent: GCP cost
# ingestion and Azure client creation stop for every tenant while the accounts look
# configured.
app.encryption.secret-key=${app_encryption_secret_key}

# --- Eureka Client Configuration for PRODUCTION ---
eureka.client.serviceUrl.defaultZone=https://live.xamops.com:8761/eureka/

# Redis for PRODUCTION
# Placeholders, not literals: the prod docker run passes SPRING_REDIS_HOST /
# SPRING_REDIS_PORT. Those used to land on spring.redis.host via relaxed binding, but
# Boot 3 renamed the property to spring.data.redis.*, so SPRING_REDIS_HOST no longer
# maps to anything and billops would silently fall back to the literal 'redis-live'.
# Reading the env var explicitly keeps the existing deploy command working unchanged.
spring.data.redis.host=${SPRING_REDIS_HOST:redis-live}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# --- Other PRODUCTION configurations ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.springframework=INFO
logging.level.com.xammer.billops=INFO

# PRODUCTION CORS Configuration
app.frontend.url=https://live.xamops.com
cors.allowed-origins=https://live.xamops.com

gemini.api.key=${GEMINI_API_KEY:AIzaSyDUHXg5yf3PrWdtvrHOhHQ9t5QKihoeCVA}
cloudformation.template.s3.url=https://xamopscftemplate.s3.ap-south-1.amazonaws.com/billops-readonly-role.yml

app.environment=production

# Explicit prod pool size — default of 10 was exhausted under scheduler load
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# DETAILED LOGGING FOR SECURITY DEBUGGING
# ===================================================================
logging.level.org.springframework.security=TRACE
logging.level.com.xammer.cloud.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG

# Enable request/response logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# ===================================================================
# PRODUCTION ENVIRONMENT - SCHEDULING
# ===================================================================
scheduling.enabled=true

# Google Chat attachment URL base — used to construct public links sent to GChat users
# Must be the public domain (not ngrok) so GChat can serve attachment links to end users
messaging.portal.base-url=https://live.xamops.com

# Directory where inbound GChat attachments are downloaded and stored on the server
support.upload.dir=/opt/billops/uploads