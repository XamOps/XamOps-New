# Set the server port for the BillOps microservice
server.port=8082

# ==============================================================
# MULTIPART FILE UPLOAD LIMITS
# ==============================================================
# Unlimited: credit requests and tickets accept supporting documents of any type and
# size. Parts above the threshold spool to disk rather than heap, so a large upload
# costs temp space, not memory. The nginx hops in front carry matching overrides.
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.file-size-threshold=2MB
# Let Tomcat read an aborted upload to completion instead of resetting the connection,
# which would surface to the browser as a network error rather than the real response.
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1

spring.application.name=billops
# spring.datasource.url=jdbc:postgresql://3.110.102.128:5432/production_db
# spring.datasource.username=app_user
# spring.datasource.password=AppPassword123
# spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
# Ensure Hibernate does not try to alter the schemas automatically 
# as it switches contexts. It can be dangerous in multi-tenant.
# (Note: You had duplicate entries for ddl-auto, 'none' is safer for production/multi-tenant)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.springframework=INFO
logging.level.com.xammer.billops=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# AWS Configuration
# Consolidated with xamops-service onto the same template (was billops-readonly-role.yml,
# a separate stale template lacking resource-explorer, marketplace, and CUR export
# permissions). Overridden per-profile below (local/uat/preprod/prod each set their own).
cloudformation.template.s3.url=https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-readonly-role.yml
aws.region=ap-south-1

# AWS Cost Explorer Mock Configuration (set to true in local profile to reduce API costs)
aws.costexplorer.mock=false

# ===================================================================
# CUR (COST AND USAGE REPORT) RECONCILIATION
# ===================================================================
# Reads the customer's CUR 2.0 export from their own S3 bucket (created by the
# onboarding stack's nested CUR template) and reconciles closed-month invoices
# against it, instead of against Cost Explorer's aggregated totals. CE omits or
# redistributes tax, credits, refunds and some data-transfer charges, so its
# totals do not reliably match the actual AWS bill.
#
# Scope is deliberately narrow and additive:
#   * only CLOSED months use CUR — the current month is not final for ~72h after
#     the period ends, so Cost Explorer remains the better estimate for it
#   * only accounts with a CUR export configured use CUR
#   * any miss (no export, not yet ingested, parse failure) falls back to the
#     existing Cost Explorer path
#
# Set false to disable ingestion and reads entirely and return to CE-only
# behaviour, with no other change required.
billops.cur.enabled=true

# How far back a first-time backfill reaches, in months. Bounded because each
# month that exists is a full download and parse; AWS also only delivers periods
# from when the export was created, so reaching further mostly lists nothing.
billops.cur.backfill-months=6

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ==============================================================
# DATABASE CONNECTION POOL (HIKARI) - OPTIMIZED
# ==============================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# ✅ CHANGED: Reduced to 10 mins (600000ms) to prevent stale connection errors
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=200000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-test-query=SELECT 1

