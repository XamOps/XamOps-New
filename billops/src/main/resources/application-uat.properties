# ===================================================================
# UAT ENVIRONMENT CONFIGURATION for billops-service
# ===================================================================

# --- AWS Secrets Manager: load UAT DB credentials at startup ---
spring.cloud.aws.region.static=ap-south-1
cloud.aws.stack.auto=false
spring.config.import=optional:aws-secretsmanager:uat/xamops_db_uat

# --- UAT PostgreSQL Database (Single DB Mode - No Multi-Tenancy) ---
# Connection details come from the secret above (single source of truth).
spring.datasource.url=jdbc:postgresql://${host}:${port}/${dbname}
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Eureka Client Configuration for UAT ---
# Reached over the xamops-network docker network by container name, the same way
# spring.data.redis.host=redis-uat below is.
#
# This was https://uat.xamops.com:8761/eureka/ -- an external hostname on a port that
# is not exposed. The Eureka client blocked on it during startup, which is what made
# the service take over five minutes to accept connections, and no service ever
# registered (/eureka/apps returned an empty list). The deploy passes
# EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE intending to override this, but that env var
# cannot: eureka.client.serviceUrl is a Map, relaxed binding turns the variable into
# the key "default-zone", and Eureka looks up "defaultZone". The unreachable value
# here therefore won.
eureka.client.serviceUrl.defaultZone=http://service-registry:8761/eureka/

spring.data.redis.host=redis-uat
spring.data.redis.port=6379



# --- Other UAT configurations ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework=INFO
logging.level.com.xammer.billops=INFO
# UAT CORS Configuration
app.frontend.url=https://uat.xamops.com
cors.allowed-origins=https://uat.xamops.com
gemini.api.key=${GEMINI_API_KEY:AIzaSyDUHXg5yf3PrWdtvrHOhHQ9t5QKihoeCVA}
cloudformation.template.s3.url=https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-readonly-role-uat.yml
# ===================================================================
# DETAILED LOGGING FOR SECURITY DEBUGGING
# ===================================================================
logging.level.org.springframework.security=TRACE
logging.level.com.xammer.cloud.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG

# Enable request/response logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
app.environment=uat

# ===================================================================
# AWS COST EXPLORER MOCK MODE
# ===================================================================
# Set to 'true' to use mock data instead of real AWS Cost Explorer API calls
# This prevents AWS charges ($0.01 per API call) during UAT testing
