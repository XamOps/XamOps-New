# ===================================================================
# LOCAL ENVIRONMENT CONFIGURATION for billops-service
# ===================================================================

# --- Local PostgreSQL Database (Single DB Mode - No Multi-Tenancy) ---
spring.datasource.url=jdbc:postgresql://13.127.62.153:5432/xamops_local_db
spring.datasource.username=xamops_local_user
spring.datasource.password=XamOps@123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Eureka Client Configuration for Local ---
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Redis for Local
spring.redis.host=localhost
spring.redis.port=6379

# --- Other Local configurations ---
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
logging.level.org.springframework=INFO
logging.level.com.xammer.billops=DEBUG
logging.file.name=logs/application.log

# Local CORS Configuration
app.frontend.url=http://localhost:5173
cors.allowed-origins=http://localhost:5173,http://localhost:8080,http://127.0.0.1:5500

# Local AWS/GCP config
gemini.api.key=${GEMINI_API_KEY:AIzaSyDUHXg5yf3PrWdtvrHOhHQ9t5QKihoeCVA}
# Consolidated with xamops-service onto the same template (was billops-readonly-role.yml,
# a separate stale template lacking resource-explorer, marketplace, and CUR export
# permissions).
cloudformation.template.s3.url=https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-readonly-role-local.yml

app.environment=local

# ===================================================================
# LOCAL ENVIRONMENT - SCHEDULING
# ===================================================================
scheduling.enabled=true

# ===================================================================
# AWS COST EXPLORER MOCKING (LOCAL ONLY)
# ===================================================================
# Enable mocking to reduce AWS API costs during local development
# Set to false if you need real AWS Cost Explorer data
aws.costexplorer.mock=false