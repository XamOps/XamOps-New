spring.application.name=api-gateway

# Run the gateway on the main public port
server.port=8080

# ==============================================================
# REACTIVE CODEC LIMIT (Spring Cloud Gateway uses Netty, not servlet)
# Must be raised to allow large file uploads to pass through
# ==============================================================
spring.codec.max-in-memory-size=55MB
spring.application.name=api-gateway

# Tell the gateway where to find the service registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- Routing Rules ---

# This rule defines how to handle requests for the XamOps service
spring.cloud.gateway.routes[0].id=xamops-service
spring.cloud.gateway.routes[0].uri=lb://xamops-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/xamops/**

# MediaOps service — FFmpeg-based media processing (port 8084)
spring.cloud.gateway.routes[1].id=media-ops-service
spring.cloud.gateway.routes[1].uri=lb://media-ops-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/media-ops/**

# MediaOps WebSocket (STOMP job progress)
spring.cloud.gateway.routes[2].id=media-ops-ws
spring.cloud.gateway.routes[2].uri=lb://media-ops-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/media-ops-ws/**