# Production edge gateway for live.xamops.com.
#
# This is the nginx that actually fronts prod. It runs as the container named
# "api-gateway" (image: nginx:latest) on the EC2 host, bind-mounted read-only:
#
#   docker run -d --name api-gateway --network xamops-network --restart always \
#     -p 80:80 -v /root/api-gateway-prod.conf:/etc/nginx/conf.d/default.conf:ro \
#     nginx:latest
#
# NOTE: the sibling Java sources in this directory are a Spring Cloud Gateway
# app on port 8080. It is NOT what serves prod. Only this file is.
#
# TLS terminates at the ALB, which forwards plain HTTP to :80 here — that is why
# every route hardcodes X-Forwarded-Proto https rather than passing $scheme.
#
# After editing: copy to /root/api-gateway-prod.conf on the host, then
#   docker exec api-gateway nginx -t && docker exec api-gateway nginx -s reload
# The bind mount means no container rebuild or recreate is needed.

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream frontend {
    server frontend-app:80;
}

upstream xamops_service {
    server xamops-service:8080;
}

upstream billops_service {
    server billops-service:8082;
}

upstream forecast_service {
    server xamops-forecast-live:5002;
}

upstream service_registry {
    server service-registry:8761;
}

upstream mediaops_service {
    server media-ops-service:8084;
}

server {
    listen 80;
    # demo.xamops.com serves the same frontend bundle and proxies /api to the same
    # backend as live.xamops.com — the demo is host-driven in the app, not a separate
    # deployment. Every route below passes Host $host, which both nginx hops preserve,
    # so the backend sees the real host; no X-Forwarded-Host is needed.
    #
    # EXTERNAL CONSOLE TASK (not automatable here): register the demo OAuth callbacks —
    #   https://demo.xamops.com/api/auth/google/callback      in Google Cloud Console
    #   https://demo.xamops.com/api/auth/microsoft/callback   in Microsoft Entra
    # as additional Authorized redirect URIs, or Google/Microsoft sign-in on the demo
    # host will be rejected with redirect_uri_mismatch.
    server_name live.xamops.com demo.xamops.com;

    # Set at server level so every route inherits it. nginx defaults to 1m, which
    # silently 413'd cluster agent pushes to /api/v1/agent/ingest — those arrive as
    # one uncompressed JSON body carrying Trivy, Kubescape, OpenCost and Prometheus
    # batches, several MB on a real cluster. The rejection happens here, so nothing
    # reaches xamops-service and its logs show no trace of the failure.
    # Locations needing more (media-ops) override this individually.
    client_max_body_size 32m;

    # HSTS: force browsers to use HTTPS for this host and all subdomains, and
    # qualify for the preload list (requires max-age >= 1y + includeSubDomains +
    # preload). TLS terminates at the ALB and plain HTTP reaches nginx on :80,
    # but the header still travels back to the client over the ALB's HTTPS
    # connection, which is all HSTS requires. "always" makes nginx emit it on
    # error responses too; it is still overridden in any location that sets its
    # own add_header (only /health does, which is intentionally header-free).
    #
    # NOTE: submit live.xamops.com to https://hstspreload.org only once every
    # subdomain is HTTPS-ready — preload is hard to undo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy — ENFORCING, and kept byte-for-byte identical to the
    # policy xamops-service/billops/media-ops set in Spring, so every layer that can
    # emit a CSP agrees. This is the single edge choke point for live.xamops.com and
    # demo.xamops.com, so this header covers every response regardless of which
    # upstream served it.
    #
    # script-src/style-src keep 'unsafe-inline' + 'unsafe-eval' + https: because the
    # legacy static pages under /js and the CDN <script> tags in index.html rely on
    # them; the broad https: admits jsdelivr/cdnjs/Google Fonts without pinning each.
    # img-src adds blob:/data: for runtime-generated images; connect-src adds wss:
    # for SockJS/STOMP and LiveKit. object-src 'none', base-uri 'self' and
    # frame-ancestors 'self' hold regardless of the script policy (clickjacking +
    # <base> hijack + plugin injection).
    #
    # Tightening (nonces/hashes instead of 'unsafe-inline', pinned hosts instead of
    # broad https:) is a coordinated frontend change — do it in all four places at
    # once so the layers stay in agreement.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Clickjacking protection. SAMEORIGIN, NOT DENY: the app embeds its own Grafana
    # dashboards in same-origin iframes (GrafanaDashboardPage), which DENY would
    # break. SAMEORIGIN still blocks every third-party site from framing the app,
    # which is what stops clickjacking. This is the legacy-browser backstop for the
    # CSP frame-ancestors 'self' directive above, and matches the frameOptions
    # SAMEORIGIN set by the Spring services.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /eureka/ {
        proxy_pass http://service_registry/eureka/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/xamops/ {
        proxy_pass http://xamops_service/api/xamops/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /terminal {
        proxy_pass http://xamops_service/terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /livekit/ {
        proxy_pass http://13.207.123.90:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /xamops-ws {
        proxy_pass http://xamops_service/xamops-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/cicd/ {
        proxy_pass http://xamops_service/cicd/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ai/ {
        proxy_pass http://xamops_service/api/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ai-advisor/ {
        proxy_pass http://xamops_service/api/ai-advisor/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Credit requests carry supporting documents of any type and size, so this route
    # opts out of the server-level 32m cap. Bodies stream straight through instead of
    # being spooled to nginx disk first, and the timeouts allow for slow uploads.
    location /api/billops/credits {
        proxy_pass http://billops_service/api/billops/credits;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /api/billops/ {
        proxy_pass http://billops_service/api/billops/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/admin/ {
        proxy_pass http://billops_service/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/forecast/ {
        proxy_pass http://forecast_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /login {
        proxy_pass http://xamops_service/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /logout {
        proxy_pass http://xamops_service/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /agentinstall/ {
        proxy_pass http://xamops_service/agentinstall/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /agent/download/ {
        proxy_pass http://xamops_service/agent/download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Cluster agent ingest, config fetch and command polling. Inherits the
    # server-level client_max_body_size above — do not let this route fall back
    # to nginx's 1m default or every push 413s before reaching the backend.
    location /api/v1/agent/ {
        proxy_pass http://xamops_service/api/v1/agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
    }

    location /api/media-ops/ {
        proxy_pass http://mediaops_service/api/media-ops/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 2g;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /media-ops-ws {
        proxy_pass http://mediaops_service/media-ops-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /browser-stream/ {
        proxy_pass http://mediaops_service/browser-stream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /media/ {
        proxy_pass http://mediaops_service/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # Everything else — including any /api/ path without an explicit route above
    # — goes to the frontend container, whose own nginx re-proxies /api/ back to
    # xamops-service. Those requests traverse two proxies, so both need a body
    # limit; see frontend-app/nginx.conf.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
