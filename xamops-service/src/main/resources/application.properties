# ======================================================================
# COST OPTIMIZATION / RECOMMENDATION ENGINE
# ======================================================================
# Currency conversion. Optimization services compute in USD (what the provider
# pricing APIs quote) and convert once at the presentation boundary. The rate is
# fixed rather than fetched live so cost reports stay reproducible; update it and
# the as-of date together. Replaces three previously-divergent hardcoded
# constants (83.0, 84.0 and an implied 83.33).
currency.usd-to-inr-rate=${CURRENCY_USD_TO_INR_RATE:83.0}
currency.rate-as-of=${CURRENCY_RATE_AS_OF:2026-01-01}

# Maximum age of a PostgreSQL snapshot of cloud API results before it is treated
# as stale and refetched. Without a bound, a project whose API access broke kept
# serving its last successful result indefinitely.
optimization.snapshot.max-age-hours=${OPTIMIZATION_SNAPSHOT_MAX_AGE_HOURS:48}

# When true, EC2 rightsizing also requests Graviton (ARM64) options from Compute
# Optimizer. Off by default: an ARM64 target needs an AMI rebuilt for that
# architecture, so it is a migration rather than a one-click resize. Any
# cross-architecture recommendation is flagged and the apply path refuses it.
