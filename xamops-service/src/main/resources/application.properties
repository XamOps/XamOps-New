# ===================================================================
# COMMON CONFIGURATION (APPLIES TO ALL ENVIRONMENTS)
# ===================================================================
spring.application.name=xamops-service
server.port=8080

# ==============================================================
# MULTIPART FILE UPLOAD LIMITS
# ==============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# --- Set the default profile to 'prod' for production deployments ---
spring.profiles.active=local

# ==============================================================
# MASTER DATABASE CONFIGURATION (production_db)
# NOTE: This is ONLY used in PROD profile for multi-tenant routing
# Local and UAT profiles use their own single databases from profile-specific properties
# ==============================================================
spring.datasource.url=jdbc:postgresql://18.61.99.59:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# ==============================================================
# DATABASE CONNECTION POOL (HIKARI) - PHASE 1 STABILITY FIX
# ==============================================================
# Connection Timeout: Fail fast if a connection cannot be obtained (10 seconds)
# Reduced from 30s to prevent threads hanging during outages
spring.datasource.hikari.connection-timeout=10000

# Idle Timeout: 2 mins (120000ms) - Close idle connections quickly to free resources
spring.datasource.hikari.idle-timeout=120000

# Max Lifetime: 10 mins (600000ms) - Adjusted for stability
# This prevents holding connections that network devices might drop silently
spring.datasource.hikari.max-lifetime=600000

# Keepalive: 30s (30000ms) - CRITICAL FIX
# Perform a health check on idle connections every 30 seconds to detect broken links
# BEFORE the application tries to use them
spring.datasource.hikari.keepalive-time=30000

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20

# Validation: Verify connection is alive before giving it to the app
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.test-while-idle=true
spring.datasource.hikari.validation-timeout=3000

# --- SpringDoc OpenAPI (Swagger) Configuration ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# --- Common AWS & Application Logic ---
aws.region=ap-south-1

# AWS Cost Explorer Mock Configuration (set to true in local profile to reduce API costs)
aws.costexplorer.mock=false
tagging.compliance.required-tags=cost-center,project
rightsizing.instance-size-order=nano,micro,small,medium,large,xlarge,2xlarge,4xlarge,8xlarge,12xlarge,16xlarge,24xlarge
quotas.key-codes=L-1216C47A,L-F678F1CE,L-7295265B,L-69A177A2
pricing.ebs.fallback-price=0.10

# ==============================================================
# ACCESSOPS — AUTHENTIK IDENTITY BACKEND CONFIGURATION
# ==============================================================
# Base URL of the self-hosted Authentik instance.
# All API calls go to {authentik.base-url}/api/v3/...
authentik.base-url=${AUTHENTIK_BASE_URL:https://auth.xamops.com}

# Master API token used ONLY for provisioning new tenants (creating service accounts,
# groups, and per-tenant tokens). Stored as env var; never committed to source control.
# Generate via Authentik UI: Admin → System → Tokens → Create
authentik.master-token=${AUTHENTIK_MASTER_TOKEN:}

# AES-256-GCM key for encrypting per-tenant Authentik tokens at rest.
# Must be a Base64-encoded 32-byte value. Generate with: openssl rand -base64 32
# Never committed to source control. Required at startup.
identity.encryption-key=${IDENTITY_ENCRYPTION_KEY:}

# ==============================================================
# OPENOBSERVE CONFIGURATION
# ==============================================================
openobserve.url=http://localhost:5080
openobserve.external.url=${OPENOBSERVE_EXTERNAL_URL:}
openobserve.admin.email=aditya@xammer.in
openobserve.admin.password=${OPENOBSERVE_ADMIN_PASSWORD:CHANGE_ME}

# --- Rate Limiting for Dashboard API ---
bucket4j.filters[0].url=^/api/dashboard.*
bucket4j.filters[0].rate-limit.bandwidths[0].capacity=10
bucket4j.filters[0].rate-limit.bandwidths[0].time=1
bucket4j.filters[0].rate-limit.bandwidths[0].unit=minutes

# --- Default Redis Port ---
spring.redis.port=6379

# --- General Settings ---
spring.security.debug=false
spring.mvc.async.request-timeout=120000
server.servlet.session.timeout=1d
server.servlet.session.cookie.path=/

# Impersonation JWT — MUST match app.impersonation.secret-key in billops
app.impersonation.secret-key=${APP_IMPERSONATION_SECRET_KEY:CHANGE_ME}

# --- Mail Configuration ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notifications@xamops.com
spring.mail.password=${SPRING_MAIL_PASSWORD:CHANGE_ME}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.s3.bucket-name=xamops-document-bucket
app.s3.region=ap-south-1

# --- AutoSpotting Configuration ---
autospotting.enabled=true
autospotting.sqs.queue-url=https://sqs.ap-south-1.amazonaws.com/605134457560/autospotting-events.fifo
autospotting.sqs.poll-interval=5000
autospotting.dynamodb.table-name=autospotting-CustomerAccounts
autospotting.tag.key=spot-enabled
autospotting.tag.value=true
autospotting.metric.namespace=AutoSpotting

# --- CloudFormation ---
cloudformation.s3.bucket=xamops-cloudformation-templates
cloudformation.s3.region=ap-south-1

# --- JSON / Jackson ---
logging.level.com.fasterxml.jackson=DEBUG
logging.level.org.springframework.web=DEBUG

# --- Diagnostic Log Pattern: includes MDC tenant + thread name on every line ---
# [NO-TENANT] means the thread has no tenant context — indicates a multi-tenant bug
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{tenant:-NO-TENANT}] [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{tenant:-NO-TENANT}] [%thread] %-5level %logger{36} - %msg%n
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# --- XamOps AI Configuration ---
anythingllm.api.key=${ANYTHINGLLM_API_KEY:CHANGE_ME}
anythingllm.url=http://13.200.255.73:3001/api/v1/workspace/xamops-workspace/chat

# --- Timeouts ---
spring.http.client.read-timeout=300s
rest.template.read-timeout=300000

# --- External Tools ---
prowler.executable.path=${PROWLER_PATH:/Users/admin/Library/Python/3.9/bin/prowler}

# ===================================================================
# SCHEDULED JOBS CONFIGURATION
# ===================================================================
# Enable/disable scheduled jobs globally
scheduling.enabled=true

# ===================================================================
# CACHE CONFIGURATION - COST OPTIMIZATION
# ===================================================================
# Increased cache TTL to reduce AWS API calls
# Cost data doesn't change frequently enough to justify short TTL
spring.cache.redis.time-to-live=14400000
# Cache eviction frequency (4 hours = 14400000ms)
caching.eviction.fixedRate.ms=14400000

# Cost-specific cache TTL (6 hours)
cache.cost.ttl=21600000

# ==================================================================
# CLOUDIDR FLEXCOMPUTE CONFIGURATION
# ===================================================================
cloudidr.api.base-url=https://public-api.cloudidr.com
cloudidr.auth.email=
cloudidr.auth.password=${CLOUDIDR_AUTH_PASSWORD:}
cloudidr.cloudformation.template-url=https://xamops-cloudformation-templates.s3.ap-south-1.amazonaws.com/cloudidr-integration.yaml
cloudidr.cloudformation.stack-name=XamOps-CloudiDR-Integration

cloudidr.auth.email=Jigar@xammer.in
cloudidr.auth.password=${CLOUDIDR_AUTH_PASSWORD:CHANGE_ME}
# ===================================================================
# AI GATEWAY (LiteLLM SIDECAR) CONFIGURATION
# ===================================================================
# LiteLLM proxy base URL — runs as a sidecar container alongside xamops-service
litellm.base-url=${LITELLM_BASE_URL:http://localhost:4000}
# Master key used to authenticate internal Java → LiteLLM calls
litellm.master-key=${LITELLM_MASTER_KEY:sk-xamops-master}
# Path where Java writes the generated litellm-config.yaml (must be writable)
litellm.config.path=${LITELLM_CONFIG_PATH:/app/litellm-config.yaml}

# XAMOPS AGENT CONFIGURATION
# ===================================================================
# Single API key for ALL XamOps Agents - same key for ALL environments & clusters
xamops.agent.api-key=${XAMOPS_AGENT_API_KEY:CHANGE_ME}

# XamOps server URL (used in agent install commands)
xamops.server.url=${XAMOPS_SERVER_URL:https://api.xamops.com}

opensre.url=http://localhost:2024
opensre.langsmith.api-key=${OPENSRE_LANGSMITH_API_KEY:CHANGE_ME}

# SRE Detection Pipeline
sre.kafka.bootstrap-servers=localhost:9092
sre.kafka.topic=sre.detection.events
sre.detection.max-join-window-seconds=600
sre.detection.reopen-grace-seconds=120
