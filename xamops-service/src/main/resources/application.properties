# --- Self-service AWS onboarding (XamSecure Onboarding tab) ---
# These are type "Cloud account" credentials from the Upwind console (Settings -> Access
# Management -> Credentials -> Generate credentials), NOT the API sync credential above. They are
# injected server-side into the CloudFormation launch URL; a customer never types them.
#
# Upwind's template generates the external ID and registers the account itself
# (Custom::UpwindGeneratedToken / Custom::UpwindRegisteredAccount), so ONE credential serves every
# customer — per-account uniqueness comes from the generated external ID.
#
# Do NOT rotate or delete this credential while customers hold stacks: the template's custom
# resources run on stack UPDATE and DELETE too, so revoking it strands their stacks.
# Baked-in defaults follow the same reasoning as the API credential above: env vars are not
# injected for Upwind in ci-cd, so an empty default would leave onboarding permanently
# "not configured" in UAT/prod. The env var still wins where it IS set, which is how to rotate
# without a rebuild.
#
# Scope, measured 2026-08-19 by decoding the token: type=cloud_account with
# create/get/delete:credentials and get:external-ids on integration.upwind.io, and ZERO
# permissions on api.upwind.io. It therefore cannot read any tenant's findings, which is what
# makes one shared credential acceptable across all customers. It CAN delete credentials in the
# org, so treat it as a disruption risk and rotate if it leaks.
upwind.onboarding.client-id=${UPWIND_ONBOARDING_CLIENT_ID:020ba951-ea1d-4ddc-b56a-b2123c09c675}
upwind.onboarding.client-secret=${UPWIND_ONBOARDING_CLIENT_SECRET:sRl5UrpjEZb0WXECQ8wSuYBu28W4OC5y}
# Pinned rather than left to Upwind's "latest": the parameter names we fill in below would break
# silently if Upwind reshaped the template between the version tested and what a customer deploys.
upwind.onboarding.template-url=${UPWIND_ONBOARDING_TEMPLATE_URL:https://s3.amazonaws.com/cfn.upwind.io/onboarding/latest.yaml}
# ECS sensor stacks. Two separate templates, not one with a launch-type flag: the EC2 one deploys a
# privileged per-host sensor plus a scanner plus the cluster manager, the Fargate one deploys the
# cluster manager alone (Fargate does not permit a privileged host daemon). Both pin container image
# versions, so these point at Upwind's published copies rather than anything we host.
upwind.onboarding.ecs-template-url=${UPWIND_ONBOARDING_ECS_TEMPLATE_URL:https://s3.amazonaws.com/cfn.upwind.io/templates/integrations/ecs-sensor/ecs-sensor-task.yaml}
upwind.onboarding.ecs-fargate-template-url=${UPWIND_ONBOARDING_ECS_FARGATE_TEMPLATE_URL:https://s3.amazonaws.com/cfn.upwind.io/templates/integrations/ecs-fargate/ecs-cluster-manager-task.yaml}
# Upwind's own AWS account — the trusted principal in the generated role's trust policy.
upwind.onboarding.trusted-account=${UPWIND_ONBOARDING_TRUSTED_ACCOUNT:340457201789}
upwind.onboarding.region=${UPWIND_ONBOARDING_REGION:us}
# Fixed, not the customer's current console region: the template sources its onboarding Lambda
# from upwind-serverless-functions-${AWS::Region}, so an unsupported region fails the stack with
# an opaque "bucket does not exist".
upwind.onboarding.stack-region=${UPWIND_ONBOARDING_STACK_REGION:us-east-1}
upwind.onboarding.verify-interval-ms=${UPWIND_ONBOARDING_VERIFY_INTERVAL_MS:120000}

# --- Self-service sensor deployment (XamSecure Onboarding tab) ---
# Type "Sensor" credentials from the Upwind console (Settings -> Access management ->
# Credentials), NOT the Cloud account credential above and NOT the API sync credential.
# Verified live 2026-08-24 by decoding the token: type=agent, ZERO permissions on both
# integration.upwind.io and api.upwind.io — it cannot read the management API or the data API,
# so a customer who extracts it from their own host/cluster cannot reach any tenant's data. The
# realistic risk of a leak is a rogue sensor enrolling into the org (integrity), not data
# exposure, which is why one shared credential is used here exactly as it is for cloud accounts.
#
# The command template below is Upwind's own "Connect a host" script, copied verbatim from the
# console (Home -> Connect a host -> Step 3), with CLIENT_ID/CLIENT_SECRET as the only variables.
# It is NOT parameterized per account or cluster — unlike the CloudFormation stack, this same
# script is correct for every host. Kubernetes/ECS sensor deployment uses a different (Helm)
# command that this does not cover yet.
upwind.sensor.client-id=${UPWIND_SENSOR_CLIENT_ID:512eba83-7fb5-4ded-b5e0-2b09f9d6af02}
upwind.sensor.client-secret=${UPWIND_SENSOR_CLIENT_SECRET:MbAoqT5oSFDSynGHPTorINsNOic4snqX}
# Full sync (vulns+posture+inventory+APIs) cadence, ms. Default 6h.
#
# It is a safety-net reconciliation pass — the webhook handles near-real-time pushes when
# registered — so it does not need to be frequent. It needs to be INFREQUENT: a full run was
# measured at 73 minutes of API time on 2026-08-04 (126,808 vulnerability findings alone take
# ~18 min; posture walks FAIL and PASS separately). At the previous 1h cadence the sync ran
# essentially back-to-back, re-upserting ~207k rows continuously.
upwind.sync.full-interval-ms=${UPWIND_SYNC_FULL_INTERVAL_MS:21600000}
# Detection poll cadence, ms. Default 60s.
upwind.sync.detection-interval-ms=${UPWIND_SYNC_DETECTION_INTERVAL_MS:60000}
# Transient-failure retry within a single sync run (5xx / connection errors).
# Retries this many total attempts, backing off from the given ms (doubling each time).
upwind.http.max-attempts=${UPWIND_HTTP_MAX_ATTEMPTS:3}
upwind.http.retry-backoff-ms=${UPWIND_HTTP_RETRY_BACKOFF_MS:1000}
upwind.webhook.secret=${UPWIND_WEBHOOK_SECRET:}
xamops.public.base-url=${XAMOPS_PUBLIC_BASE_URL:http://localhost:8080}

