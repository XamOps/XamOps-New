# ===================================================================
# CUR (COST AND USAGE REPORT) — RECONCILED FINOPS DATA
# ===================================================================
# When on, the FinOps pages serve CLOSED months from the customer's Cost and Usage
# Report instead of Cost Explorer. CUR is the source AWS generates the invoice
# from, so it includes tax, fees, credits, refunds and data-transfer detail that
# Cost Explorer omits or redistributes — which is why CE totals often fail to
# match the actual bill.
#
# Reads only. Ingestion is owned by BillOps (CurIngestionService), which writes
# bounded monthly aggregates into the shared cached_data table under AWS_CUR_*
# keys. The Cost Explorer snapshots under AWS_MONTHLY_* are still written and are
# never overwritten, so this is purely a read preference.
#
# SHIPS DISABLED, unlike BillOps where CUR is on by default. An invoice must match
# the bill; these are cost pages whose numbers customers already read, so flipping
# them is opt-in per environment. Enable after confirming CUR and Cost Explorer
# reconcile for a real account — compare with:
#   GET /api/billops/cur/reconcile?accountId=&year=&month=
#
# With this false, every FinOps read path behaves exactly as before.
xamops.cur.enabled=false

# ===================================================================
# BULK RESOURCE ENUMERATION (GCP / AZURE CLOUDLIST)
# ===================================================================
# Both providers offer one API that returns every resource in a project or
# subscription. Neither Cloudlist used it: GCP loops ~30 per-service clients and
# Azure issues ~30 per-type SDK calls on a 15-thread pool with a 90s budget.
#
# The cost of that shape is not mainly latency — both fan out in parallel — it is
# that coverage is limited to the types someone wrote a collector for, that the
# Azure scan truncates at 90s on a large subscription, and that it is ~30x the API
# requests per refresh against APIs that throttle per project/subscription.
#
# BOTH SHIP DISABLED. With them off, every page keeps using the existing scan
# unchanged, so enabling is the only behavioural switch. Both fall back
# automatically — on a missing API, a missing role, an error, or an empty result —
# so a misconfigured project degrades to the old path rather than reporting an
# empty inventory.
#
# --- GCP: Cloud Asset Inventory ---
# Prerequisites: enable cloudasset.googleapis.com on the project, and grant the
# service account cloudasset.assets.searchAllResources (roles/cloudasset.viewer).
#
# Compute Engine is still read by its own collector and overlaid on the result.
# Asset Inventory identifies an instance by name, but Cloud Monitoring filters for
# GCE metrics need the numeric instance id, and GcpOptimizationService builds a
# name->id map from this inventory for exactly that. Serving Asset Inventory's rows
# unmodified would leave every rightsizing recommendation without its utilisation
# enrichment. Two calls instead of ~30 still holds.
xamops.gcp.asset-inventory.enabled=false

# --- Azure: Resource Graph ---
# Prerequisite: the service principal needs Reader on the subscription — the same
# grant the per-type scan already requires, so no new permission in practice.
#
# Uses the existing AzureArmClient rather than the azure-resourcemanager-resourcegraph
# SDK module: Resource Graph is a single REST endpoint, and that client already owns
# cached bearer tokens, timeouts, and the semantics that make a 403 an error instead
# of an empty subscription. No new dependency for one HTTP call.
xamops.azure.resource-graph.enabled=false

