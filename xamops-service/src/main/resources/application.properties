sre.kafka.topic=sre.detection.events
sre.detection.max-join-window-seconds=600
sre.detection.reopen-grace-seconds=120

# ===================================================================
# TICKET ADMIN NOTIFICATION RECIPIENTS
# ===================================================================
# Comma-separated list for Technical tickets; single address for Account & Billing.
# These are also the addresses inbound mail is matched against: a mail that mentions
# one of them in To or Cc becomes a ticket in that category.
xamops.tickets.admin.technical-emails=techtickets@xamops.com
xamops.tickets.admin.billing-email=bizfin@xammer.com

# ===================================================================
# TICKET EMAIL INGESTION (mail -> ticket)
# ===================================================================
# Reads a mailbox over IMAP and turns mail that mentions one of the addresses
# above into a ticket. Both group addresses are served by ONE mailbox: add a
# dedicated Workspace account as a member of both groups, and it receives
# everything sent to either. Which group was mentioned is read off the To/Cc
# headers, which survive group delivery.
#
# Off unless a mailbox is configured.
#
# The credential keys follow the same convention as spring.mail.username/password:
# lowercase, resolved from whichever source the profile supplies. That means one
# spelling works everywhere —
#   prod/uat : a key in the AWS Secrets Manager secret the profile imports
#              (prod/xamops_app — only this service runs the poller)
#   local    : a line in .env.local at the repo root, which application-local
#              .properties already imports as a properties file
#   anywhere : the environment variable TICKET_INGEST_MAIL_USERNAME, via Spring's
#              relaxed binding
#
# Never put the app password in a properties file — those are tracked in git,
# which is how the SMTP one ended up committed in the uat and preprod profiles.
xamops.tickets.email-ingest.enabled=${ticket_ingest_enabled:false}
xamops.tickets.email-ingest.host=${ticket_ingest_imap_host:imap.gmail.com}
xamops.tickets.email-ingest.port=${ticket_ingest_imap_port:993}
xamops.tickets.email-ingest.username=${ticket_ingest_mail_username:}
xamops.tickets.email-ingest.password=${ticket_ingest_mail_password:}
xamops.tickets.email-ingest.folder=INBOX
xamops.tickets.email-ingest.poll-interval-ms=60000
xamops.tickets.email-ingest.initial-delay-ms=30000
# Per pass, so a backlog drains over several passes instead of one long transaction.
xamops.tickets.email-ingest.max-messages-per-poll=25
# Only read unread mail newer than this. An established mailbox carries thousands of
# unread messages — the account used for the first live test had 1552 — and without a
# bound the poller works through all of them oldest-first before reaching today's mail,
# which is indistinguishable from the feature being broken. Applied server-side, so the
# backlog is never fetched. Bounds the first run only: afterwards the \Seen flag and the
# message-id ledger prevent reprocessing, so this can stay generous enough that mail
# arriving during a deploy is never missed. 0 disables the bound.
xamops.tickets.email-ingest.lookback-days=${ticket_ingest_lookback_days:7}
# 25 MB, matching TicketAttachmentPolicy.
xamops.tickets.email-ingest.max-attachment-bytes=26214400
# Confirms to the sender which ticket their mail became, threaded onto their message.
xamops.tickets.email-ingest.acknowledge-sender=true
# Holds tickets whose sender matched no user and no known domain. Created on first use;
# these are a triage queue for an admin to reassign, not a real customer.
xamops.tickets.email-ingest.intake-client-name=Email Intake
# Our own domains. Excluded from domain matching — "someone at xammer.in" identifies no
# customer, so an internal sender resolves by their exact address or not at all.
xamops.tickets.email-ingest.internal-domains=xamops.com,xammer.com,xammer.in
# Extra senders that must never open a ticket, e.g. a mailer-daemon or a monitoring bot.
xamops.tickets.email-ingest.ignored-senders=

