# ===================================================================
# --- AWS Inventory Plane (Resource Explorer) ---
#
# Shared resource inventory, replacing the ~1000 per-service describe calls
# CloudListService fans out with a handful of free Resource Explorer queries.
#
# Ships DISABLED. With it off, every page keeps using the existing describe
# path unchanged, so enabling it is the only behavioural switch. Turn it on
# per environment after confirming Resource Explorer answers for a real
# customer account (check aws_inventory_sync_state.mode).
# ===================================================================
xamops.inventory.enabled=false

# 5 minute reconcile. Affordable only because Resource Explorer is free; never
# point this at the describe fallback.
#
# Was 60s, which no longer fits: a full pass on a ~1650-resource account measures
# 63-77s, so the reconciler never idled and simply ran back-to-back forever. It is
# also no longer the thing that makes inventory feel live — the EventBridge stream
# surfaces creations and deletions in ~5s, which leaves this pass doing what its
# name says, reconciling away dropped or out-of-order events. Five minutes is the
# worst case for noticing something events missed entirely.
#
# Raise it further, not lower, if accounts get bigger. Lowering it below the
# measured pass duration buys nothing: the overlap guard just skips cycles.
xamops.inventory.sync-interval-ms=300000

# Let the app finish starting before the first sync — startup already has a
# DB->Redis seed pass competing for connections.
xamops.inventory.initial-delay-ms=120000

# Region used to discover the account's index before the aggregator region is
# known. Only ListIndexes goes here.
xamops.inventory.resource-explorer.default-region=us-east-1

# Create a Resource Explorer index in enabled regions that lack one.
#
# AWS does not auto-index opt-in regions (Hyderabad, Jakarta, Melbourne, UAE,
# Zurich, Spain, Milan, Cape Town, Bahrain, Osaka). Verified on a live account:
# 18 enabled regions, 17 indexed, and the 7 EC2 instances in the unindexed
# region were invisible — so the cloud list would have shown 15 of 22.
#
# On by default because the alternative is every customer with an opt-in region
# sitting permanently on the slow describe path with no automatic remedy. The
# index holds no customer data and is free; creation is one-time and idempotent.
# Set false if the platform must never write to a customer account.
xamops.inventory.auto-create-indexes=true

# How stale a sync may be before readers revert to describes. Deliberately
# well above the sync interval: a few missed cycles is a slightly stale page,
# whereas flipping every account onto a 1000-call scan is an outage.
xamops.inventory.staleness-threshold-minutes=180

# --- Phase 2: near-real-time events (optional) ---
#
# ONE ENVIRONMENT AT A TIME. SQS delivers each message to exactly one consumer,
# so two environments polling the same queue steal each other's events — and the
# theft is silent: the environment that wins finds no matching account in its own
# database, logs "unknown AWS account", and discards the message. The other
# environment simply never sees that resource until the next 60s reconcile.
#
# Therefore events.enabled is pinned to false in local/uat/preprod, and only
# turned on in the environment that owns the queue. If a second environment
# genuinely needs events, deploy its own copy of xamops-inventory-engine.yaml
# with a different queue name and point that environment at it.
#
# Phase 1 polling has no such constraint — each environment queries Resource
# Explorer independently and can be enabled everywhere.
#
# Takes freshness from ~60s to ~5s.
#
# Prerequisites, in order:
#   1. Deploy cloudformation/xamops-inventory-engine.yaml ONCE in the XamOps
#      account (creates the queue below).
#   2. Customer's onboarding role stack must include the nested inventory-events
#      stack, which is on by default via EnableInventoryEvents=true. It finds
#      their enabled regions itself, so single- and multi-region accounts need
#      no different treatment.
#
# With this false the 60s poll above is the only path and still works.
#
# The poll interval is how often we long-poll SQS, not how often events arrive:
# receiveMessage waits up to 20s, so this is really a backoff between waits.
xamops.inventory.events.enabled=false
xamops.inventory.events.queue-url=https://sqs.ap-south-1.amazonaws.com/605134457560/xamops-inventory-events.fifo
xamops.inventory.events.poll-interval-ms=5000

# Customer authorisation is automatic. InventoryQueueAuthorizer rewrites the
# queue policy from the accounts table whenever an account connects, on startup,
# and hourly as a backstop — so onboarding a customer authorises them with no
# manual step and no account list to maintain, at 10 customers or 1000.
#
# Requires the backend role to hold sqs:SetQueueAttributes on the queue; the
# engine stack's bootstrap policy grants exactly that.
xamops.inventory.events.auto-authorize=true
xamops.inventory.events.backend-principal-arn=arn:aws:iam::605134457560:role/XamOps-App-EC2-Role
xamops.inventory.events.auth-sync-interval-ms=3600000

# Once events are live the poll becomes pure reconciliation rather than the
# primary path, so it can be relaxed to cut Resource Explorer calls further:
#   xamops.inventory.sync-interval-ms=900000

# ===================================================================
# Live security findings
#
# Ingest of aws.securityhub, aws.guardduty and aws.config findings from the same
# event stream the inventory plane uses. The xamops-inventory-security rule has
# been forwarding these all along (IncludeSecurityFindings defaults to 'true')
# and the backend was discarding them, so no new AWS resource, no new queue and
# no extra AWS cost is involved — the messages already arrive and are already
# paid for.
#
# Two independent switches on purpose:
#
#  * ingest is gated only by xamops.inventory.events.enabled, so once events are
#    on, findings accumulate. That is deliberate: a findings table that starts
#    filling before anyone reads it means the page has history on day one rather
#    than being empty until the first event after launch.
#
#  * serving is gated by the flag below. With it false, findings are recorded but
#    no page behaviour changes, which makes this safe to deploy ahead of the UI.
xamops.security.live-findings.enabled=false

# Keep resolved findings for 90 days before purging. Longer than the inventory
# tombstone window because the audit question here has a longer tail: "was this
# bucket public at any point last quarter" is asked during reviews, not during
# operations.
xamops.security.live-findings.retention-days=90

# ===================================================================
# Security finding notification
#
# Third switch, independent of ingest and serving. Off by default because this is
# the only part of the pipeline that reaches outside the product: turning it on
# starts sending customers email. Enable it after confirming findings look right
# on the Security Center page.
xamops.security.notify.enabled=false

# Coalescing window, not a poll interval. Findings arrive in bursts — an active
# GuardDuty incident or a Config rule re-evaluating an estate produces dozens in a
# minute — so the sweep collapses a burst into one email instead of sending one per
# finding. Five minutes is short enough that a critical finding is not sitting
# unread for long, long enough that a burst arrives as a single message.
#
# Lowering this toward zero recreates the mail-flood problem it exists to prevent.
xamops.security.notify.interval-ms=300000

# Let the app finish starting, and let the first ingest cycles land, before the
# first notification pass. Without this a restart can email about findings that
# were already notified before the previous shutdown finished writing.
xamops.security.notify.initial-delay-ms=180000

# Ceiling on findings carried in one notification batch. Beyond this the remainder
# is deferred to the next window, oldest first, so a flood drains in order rather
# than the newest findings starving older ones.
xamops.security.notify.max-batch=100

# Inbox retention. The bell is a feed, not an archive — the findings themselves
# are the durable record and they have their own 90-day retention above.
xamops.security.notify.inbox-retention-days=30

