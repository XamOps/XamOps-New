# ===================================================================
# --- Outbound WhatsApp / SMS (alerts + FinOps reports) ---
#
# Mirrors alert digests and scheduled report summaries onto WhatsApp for
# recipients who have a number in app_user.contact. Email is unchanged and
# remains the channel of record: it sends first, and lastSent bookkeeping is
# still driven by the email loop, so nothing here can suppress or re-trigger a
# report.
#
# PHASE 1 IS WHATSAPP ONLY. SMS is implemented but stays off until its DLT
# header and templates are approved — see the SMS block below.
#
# Ships DISABLED, and fails closed at three independent levels: the master
# switch, blank credentials, and a blank template ID. Any one of them being
# unset means no provider call is attempted.
#
# Enable flags are env-overridable so a local run does not need a code edit,
# following the same convention as upwind.sync.enabled. Set them in the
# gitignored .env.local at the repo root.
#
# Template IDs are NOT optional on either channel: WhatsApp requires a
# Meta-approved template and the provider is DLT-registered for SMS, so
# free-form text is rejected. That is why AlertTextBuilder and
# FinOpsReportTextBuilder emit ordered positional values, not a finished string.
# ===================================================================
xamops.messaging.enabled=${MESSAGING_ENABLED:false}
xamops.messaging.api-key=${MESSAGING_PROVIDER_API_KEY:}

# Xamping (Xammer's own CPaaS) serves each product from a SEPARATE host, so the
# host is set per channel below rather than once here. Verified by probing:
# POST /api/v1/whatsapp/single on sms.xammer.in returns a bare 404, while the
# same path on whatsapp.xammer.in returns API_KEY_MISSING. Leave this blank
# unless something fronts several products behind one gateway.
xamops.messaging.base-url=${MESSAGING_PROVIDER_BASE_URL:}

# Applied to contact numbers stored without one. That column has no country
# code and no validation, so most rows are bare 10-digit numbers.
xamops.messaging.default-country-code=+91

# Short by design: these calls run on the same @Scheduled threads that send
# email, so an unresponsive provider must fail one message, not stall the run.
xamops.messaging.connect-timeout=5s
xamops.messaging.read-timeout=10s

# --- WhatsApp channel (POST /api/v1/whatsapp/single) — PHASE 1 ---
# sender must be the number registered as a WhatsApp Business sender, E.164.
# The template IDs come from the Meta-approved template list, retrievable from
# the provider via GET /api/v1/template once base-url is known.
xamops.messaging.whatsapp.enabled=${MESSAGING_WHATSAPP_ENABLED:false}
xamops.messaging.whatsapp.base-url=${MESSAGING_WHATSAPP_BASE_URL:https://whatsapp.xammer.in}
xamops.messaging.whatsapp.sender=${MESSAGING_WHATSAPP_SENDER:}
xamops.messaging.whatsapp.alert-template-id=${MESSAGING_WHATSAPP_ALERT_TEMPLATE_ID:}
xamops.messaging.whatsapp.report-template-id=${MESSAGING_WHATSAPP_REPORT_TEMPLATE_ID:}

# true  = SMS is WhatsApp's backup, sent only when a WhatsApp send fails
# false = WhatsApp and SMS are independent channels and both send
# Off in phase 1: with SMS disabled there is nothing to fall back to, and
# leaving it on would misdescribe the actual behaviour.
xamops.messaging.whatsapp.sms-fallback=${MESSAGING_WHATSAPP_SMS_FALLBACK:false}

# --- SMS channel (POST /v1/sms/countrycode) — PHASE 2, not yet enabled ---
# Needs a DLT-approved 6-char sender header and DLT template IDs. The
# sms.*-body patterns (see MessagingProperties) must then be edited to match
# the approved wording character for character, because this endpoint takes
# both `message` and `template_id` and the provider rejects a mismatch.
xamops.messaging.sms.enabled=${MESSAGING_SMS_ENABLED:false}
xamops.messaging.sms.base-url=${MESSAGING_SMS_BASE_URL:https://sms.xammer.in}
xamops.messaging.sms.sender-id=${MESSAGING_SMS_SENDER_ID:XAMMER}
# otp | transactional | promotional | global. Keep transactional: promotional
# is DND-filtered and would drop a share of alerts silently.
xamops.messaging.sms.route=transactional
xamops.messaging.sms.alert-template-id=${MESSAGING_SMS_ALERT_TEMPLATE_ID:}
xamops.messaging.sms.report-template-id=${MESSAGING_SMS_REPORT_TEMPLATE_ID:}

