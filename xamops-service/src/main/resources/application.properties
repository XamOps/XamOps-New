# --- Rate Limiting for Dashboard API ---
# bucket4j 0.14 nests bandwidths under a rate-limits list (was a single rate-limit
# object) and dropped the Caffeine resolver, so the cache must now be named explicitly.
# jcache (Caffeine-backed, in-process) keeps the limit per-instance, which is what the
# 0.8.1 setup did. It also has to be a *sync* resolver: the Lettuce/Redisson resolvers
# only activate for WEBFLUX/GATEWAY filters, and this is a servlet app.
bucket4j.cache-to-use=jcache
bucket4j.filters[0].cache-name=bucket4j-dashboard
bucket4j.filters[0].url=^/api/dashboard.*
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=10
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes

