# ─── Ticket calls (LiveKit) ──────────────────────────────────────────────────
# Self-hosted LiveKit SFU. url is browser-facing, so it must be wss:// in any
# environment served over https.
xamops.calls.livekit.url=${LIVEKIT_URL:ws://localhost:7880}
xamops.calls.livekit.api-key=${LIVEKIT_API_KEY:}
xamops.calls.livekit.api-secret=${LIVEKIT_API_SECRET:}
# Join token lifetime.
#
# Raised from 900s: a LiveKit token is presented on join *and* reused by the client
# on an automatic reconnect, so a 15-minute TTL meant any call longer than that
# could not recover from a network blip — the reconnect failed on an expired token
# and the participant was stranded. Authorization is still re-checked every time a
# token is issued, and a token is worthless without a live session, so a longer TTL
# widens no meaningful window.
xamops.calls.livekit.token-ttl-seconds=${LIVEKIT_TOKEN_TTL_SECONDS:14400}

# Secret for the short-lived token the browser presents on the call websocket.
# Base64-encoded, min 32 bytes decoded. MUST be overridden outside local dev.
xamops.calls.ws-token.secret=${CALLS_WS_TOKEN_SECRET:ZGV2LW9ubHktY2FsbHMtd3Mtc2VjcmV0LWNoYW5nZS1tZS0zMmJ5dGVz}
xamops.calls.ws-token.ttl-seconds=${CALLS_WS_TOKEN_TTL_SECONDS:1800}

# ─── Ring vs queue ───────────────────────────────────────────────────────────
# Two deadlines, because a support desk is a queue and not a telephone.
#
# ring-seconds is how long agents are actively interrupted with a ringtone. Past it
# the call does NOT end: it goes quiet and holds in the queue, staying answerable and
# visible in every agent's waiting list — including agents who log in partway through.
#
# queue-seconds is the deadline that actually gives up and records a missed call.
#
# Previously there was only the ring deadline, so a caller was cut off after 40
# seconds, and a call placed while no agent happened to have a tab open died on the
# spot with "nobody is available".
xamops.calls.ring-seconds=${CALLS_RING_SECONDS:45}
xamops.calls.queue-seconds=${CALLS_QUEUE_SECONDS:600}
# Sweeper cadence: expires unanswered rings AND reaps abandoned live calls.
xamops.calls.sweep-interval-ms=${CALLS_SWEEP_INTERVAL_MS:10000}

# How long an in-room participant may go without a heartbeat before the room is
# treated as empty and the call is closed.
#
# This is what stops a closed tab from leaving a call ACTIVE forever — which used
# to make the ticket permanently un-callable, since a new call always yields to any
# live session on the same ticket. Must stay well above the client heartbeat
# interval (15s) so a brief socket reconnect mid-conversation is not mistaken for
# an abandoned room.
xamops.calls.active-stale-seconds=${CALLS_ACTIVE_STALE_SECONDS:120}

# Absolute ceiling on a live session, applied whatever the heartbeats say. Backstop
# for the heartbeat mechanism itself failing (old client build, or a bug here);
# generous enough that no genuine support call is ever cut short.
xamops.calls.max-session-hours=${CALLS_MAX_SESSION_HOURS:12}

# Upper bound on how many people a single call may ring. Every ring costs a
# participant row, a presence lookup, and a missed-call email if nobody answers, so
# an unbounded admin pool turns one ignored call into an inbox-wide event.
xamops.calls.max-ring-fanout=${CALLS_MAX_RING_FANOUT:25}

# Presence TTL backstop; must exceed the client ping interval with margin.
#
# Lowered from 900s: on a hard browser kill there is no clean STOMP disconnect, so
# this is how long a dead tab keeps looking ringable. At 900s a customer could wait
# out the full ring window on a ghost while real agents were available. The client
# pings every 2 minutes, so 300s still tolerates a missed ping plus a reconnect.
xamops.calls.presence.ttl-seconds=${CALLS_PRESENCE_TTL_SECONDS:300}
# Demo fallback: when comp.ai reports no integration connections / cloud findings
# (neither is wired on the demo org), surface a small fixed set so the Integrations
# and Cloud Tests tabs aren't blank. Never overrides real data — set to false to disable.
compai.demo-fallback=${COMPAI_DEMO_FALLBACK:true}

# Rows unseen by complete Upwind fetches for this long are archived even when coverage is
# too low to trust the run. Separates a broken fetch from stale rows the coverage ratio cannot
# tell apart; 4x the 6h interval, so a couple of failed runs cannot trigger it.
upwind.sync.stale-grace-hours=${UPWIND_SYNC_STALE_GRACE_HOURS:24}

# Which cloud accounts identify the owner of ORG-LEVEL Upwind data — currently the shift-left CI
# scan stream behind the Code tab.
#
# Those events carry no cloud account: measured 2026-08-12, all 100 sampled scans report
# image="XamOps-New", identical to `repository` and present on IaC builds too, so `image` is the
# build name and not a runtime image. Every client also reads one shared upwind.org-id. So there is
# nothing in the payload to scope by, and no inference from data we hold can recover it — the
# repository connected to this Upwind organization is XamOps itself, whose builds never appear as
# a running image in any customer account.
#
# Naming the owner is therefore a statement of fact we hold and the API cannot express. A client
# owning these accounts is Xammer and sees its own CI history; every other tenant is told no code
# scanning is connected for their accounts, which is true.
#
# Empty means withheld from everyone, so an unconfigured environment cannot leak.
upwind.shift-left.owner-account-ids=${UPWIND_SHIFTLEFT_OWNER_ACCOUNT_IDS:605134457560}

# ==============================================================
# AWS SDK REGION (awspring / Spring Cloud AWS)
# ==============================================================
# Must live in the base profile, not only in uat/prod. awspring 4 creates the
# SecretsManagerClient as soon as the starter is on the classpath — it is no longer
# gated on spring.config.import carrying an aws-secretsmanager: entry the way 2.4.x
# was. Building that client needs a region, and with no profile active (CI running
# @SpringBootTest) there is no AWS_REGION, no ~/.aws profile and no EC2 metadata, so
# region resolution fails and the whole context fails to start.
#
# Note the property name: awspring 3+ moved it from cloud.aws.region.static to
# spring.cloud.aws.region.static. The old name binds to nothing.
spring.cloud.aws.region.static=ap-south-1

# ===================================================================
# AZURE DASHBOARD REFRESH
#
# Until now every Azure cron, cache TTL and timeout was a hardcoded literal in Java —
# grep for "azure." in the profiles returned only prose comments. AWS externalises the
# one cron that matters (xamops.cost.refresh-cron), and these are the Azure equivalents.
#
# ORDERING IS DELIBERATE. Billing ingestion at 03:30 writes the Redis cost keys that the
# dashboard snapshot at 04:30 reads. Reversed, or run at a fixed rate phased from JVM
# start as the ingestion job previously was, the snapshot can be assembled from a cold
# cost cache and report zero spend for a subscription that has spend. The empty-overwrite
# guard in AzureDashboardService.saveDashboardToDatabase catches that and refuses to
# replace a good snapshot, but relying on a guard is not the same as ordering the work.
#
# Both are pinned to Asia/Kolkata. Every Azure cron in the codebase was written with an
# "IST" comment and no zone attribute, so the stated times were only correct if the
# container happened to run in IST.
# ===================================================================

# Azure cost ingestion — daily at 03:30 IST, one hour before the dashboard snapshot.
# Was @Scheduled(fixedRate = 6h), which could not be placed relative to anything.
xamops.azure.billing-ingestion-cron=0 30 3 * * *

# Azure dashboard snapshot — daily at 04:30 IST.
# Was "0 30 4 * * WED,SUN" while both the code comment and the controller javadoc claimed
# daily. GCP has been daily all along; Azure was the outlier, and between a Wednesday and
# the following Sunday the dashboard served a snapshot that got a day older each day.
xamops.azure.dashboard-refresh-cron=0 30 4 * * *

# When to label a snapshot stale, in minutes. Default 1560 (26 hours) — wider than the
# daily cadence on purpose, so one missed run is quiet and two consecutive misses are not.
#
# This does NOT expire anything. The snapshot has no TTL by design: a figure labelled
# "1500 minutes old" is more useful than a blank dashboard, and the AWS side already
# established that expiring the DB tier just converts permanent staleness into periodic
# blankness. This threshold only drives the label.
xamops.azure.dashboard.stale-after-minutes=1560

# Delay before the first snapshot is built for a newly connected subscription.
#
# The connected event fires before onboarding has finished saving the cost-export
# configuration, so refreshing instantly would produce a first snapshot carrying a
# "cost reporting is not configured" warning that is about to stop being true.
xamops.azure.dashboard.warmup-delay-seconds=120

# Deadline for one Azure dashboard section (six run concurrently, so this is the worst
# case for the whole refresh, not the sum).
#
# Sized for the slowest legitimate section, the inventory: twelve subscription-wide list
# calls plus an N+1 over SQL servers. Previously there was no deadline at all — a hung ARM
# call parked the scheduler thread, which is pool size 1 in prod, so one bad socket stopped
# every job behind it including the 05:10 unified snapshot.
xamops.azure.dashboard.section-timeout-seconds=120
