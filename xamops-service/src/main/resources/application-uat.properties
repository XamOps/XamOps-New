# ---------------------------------------------------------------------------
# Workload autoscaling (Java vertical rightsizing engine).
#
# UAT IS THE ONLY PROFILE WHERE EITHER FLAG IS TRUE. application.properties,
# -local, -prod and -preprod all keep both at false, and
# WorkloadAutoscalingPropertiesTest reads all five files off disk and fails if
# that ever stops being so. Turning this on anywhere else is a deliberate change
# that has to go through that test.
#
# enabled: master switch. While false the engine makes no AWS call and no
#   cluster call at all, and the read endpoint returns engine status plus gate
#   reasons with an empty workloads array. True here because the engine has been
#   validated against a real cluster -- the Go rightsizer it replaces was
#   measured recommending 0m CPU and 1Mi memory requests on 7 of 7 workloads.
#
# readiness.vertical-rightsizing: whether anything may be APPLIED. Separate from
#   enabled on purpose: recommendations are useful long before automatic
#   application is trusted. Both flags AND a registered WorkloadActionExecutor
#   are required before a decision is auto-appliable, and an operator still has
#   to press Apply -- default-mode below is RECOMMEND, not AUTO.
#
# NOTE: xamops.k8s.automation.readiness.vertical-rightsizing is also defined by
# the CloudK8s UI branch, deliberately -- one flag flips the UI and the engine
# together. On merge, keep ONE copy of that line.
# ---------------------------------------------------------------------------
xamops.automation.vertical.enabled=true
xamops.k8s.automation.readiness.vertical-rightsizing=true
# HPA (horizontal) master switch, parallel to vertical.enabled. UAT is the only
# profile where the engine's HPA decisions are surfaced on the read path.
xamops.automation.horizontal.enabled=true
# D3b standalone target-retune sub-flag. On here so UAT exercises the full HPA path;
# off in every other profile. A retune not driven by a vertical request move is a
# separately gated capability, so the apply path refuses one the engine would not emit.
xamops.automation.horizontal.target-retune.enabled=true
# Cosmetic/redundant: HPA-apply readiness now DERIVES from the read-write connection
# (HpaApplyService.requireControllerReady / K8sCapabilitiesService.readinessMap), which
# is the real enabler -- NOT this staging flag. Kept true so the standalone readiness map
# agrees with the derived value in UAT; a read-write user is ready even with this false.
xamops.k8s.automation.readiness.hpa-apply=true
# node-optimizer-actions: the release-safety gate for LIVE node actions (idle cordon/drain,
# spot-ratio). Default false everywhere else (application.properties, prod) so node drains
# fail closed until explicitly signed off. Turned ON in UAT ONLY, kept on (not a soak-window
# toggle), on the evidence of the tier-A real-drain soak, which PASSED:
#   .agents/tasks/cloudk8s-realdrain-soak-2026-10-24/run-2/real-drain-soak-report.md
# Its F1 finding (repeated re-drain of an already-drained node) is fixed on main (ec6908691).
# This only makes 'Apply' available for node-optimizer actions in UAT. A real drain still needs
# the per-cluster nodeOptimizerPolicy (enabled + autoDrainIdleNodes), mode=full, the agent's
# env ENABLE_* flags and DRY_RUN=false -- none of which change here.
#
# DESTROY-IT CAMPAIGN (wf_d2ab28b44080e183, 2026-10-27): FULL LIVE posture on
# xamops-test-1 ONLY. Every runnable controller's readiness gate is opened in UAT so
# the four-layer safety gate (readiness x per-cluster mode x agent ENABLE_* x DRY_RUN)
# is exercised live end to end. UAT remains the only profile where these are true
# (prod/preprod/local/default stay false; WorkloadAutoscalingPropertiesTest enforces it).
xamops.k8s.automation.readiness.node-optimizer-actions=true
# spot-interruption-actions: node-optimizer interruption-handling sub-path. UAT ONLY (the base
# default stays false; prod/preprod/local still forbidden — K8sAutomationReadinessPropertiesTest
# .onlyUatMayOverrideSpotInterruptionActions enforces that). Runtime still requires
# node-optimizer-actions + nodeOptimizerPolicy.handleSpotInterruptions=true; this only makes it settable.
xamops.k8s.automation.readiness.spot-interruption-actions=true
# rebalancer: on-demand node drain when a rebalance is triggered (ENABLE_REBALANCER + mode=full).
xamops.k8s.automation.readiness.rebalancer=true
# evictor-live: live consolidation via the evictor/utilisation-threshold scale-in path.
xamops.k8s.automation.readiness.evictor-live=true
# vpa-apply: VPA object create/update via the VPA manager.
xamops.k8s.automation.readiness.vpa-apply=true
# consolidation-actions: Consolidation Engine v1 (commit 45e88dbeb) acting gate. This is a
# REAL bound key (K8sReadinessKey.CONSOLIDATION_ACTIONS) distinct from evictor-live; the
# controller also needs ENABLE_CONSOLIDATION=true + consolidationPolicy.enabled + mode=full.
xamops.k8s.automation.readiness.consolidation-actions=true


# Real-Kubernetes cost + savings (roadmap C2). Default-OFF everywhere; ON here so
# UAT surfaces real $/mo cost and savings on the v3 Automation cards. While off the
# backend makes no AWS pricing call and every cost field is null (the UI then shows
# nothing/dash). On, the backend resolves each node's instanceType+capacityType+zone
# to a live rate (AWS Pricing on-demand PRICE_LIST + EC2 spot-price-history), caches
# it, and attributes per-workload cost; a node that can't be priced (unknown type,
# Fargate, no live price) shows a dash + reason, never a fabricated number. Needs the
# UAT role's existing pricing + ec2:DescribeSpotPriceHistory grants (already present).
xamops.k8s.cost.enabled=true

# The scheduled daily cluster-cost-snapshot loop. ON only here in UAT; default-OFF
# everywhere else via the inline false default (no key declared in the other
# profiles, matching how xamops.k8s.cost.enabled is declared only in uat). The loop
# also requires xamops.k8s.cost.enabled above; while either is off it does not run.
xamops.k8s.cost.snapshot.enabled=true
# Per-tenant hourly k8s workload usage rollups. ON only here in UAT; default-OFF
# everywhere else via the inline false default (no key declared in the other
# profiles). On, each k8s-resources push the agent already sends is captured as raw
# per-container usage samples (async, after the ingest commits; a failure never
# fails the ingest), rolled up hourly into p50/p95/max per workload-container and
# downsampled daily, in the k8s_workload_usage_* tables of this database. Retention
# and cadence keys (xamops.k8s.usage-rollup.*) default in code: hourly 90 d, daily
# 730 d, raw samples 48 h. Cost: no new service and no AWS call; storage only, on the
# existing Postgres (well under 1 GB at UAT scale).
xamops.k8s.usage-rollup.enabled=true

# auto-apply.*: the scheduled auto-apply loop (FEAT-002). auto-apply.enabled is
#   the GLOBAL KILL SWITCH for the loop and defaults OFF everywhere but here. It
#   being true does not make anything apply on its own: the loop still goes through
#   the same apply gates, and only a workload whose stored policy mode is AUTO is a
#   candidate -- and UAT's default-mode is RECOMMEND with endpoint 2 not yet
#   implemented, so no AUTO policy row can exist on UAT yet. The loop is therefore
#   inert until one is seeded. The other three are the loop's cadence and safety.
xamops.automation.vertical.auto-apply.enabled=true
xamops.automation.vertical.auto-apply.interval-minutes=15
xamops.automation.vertical.auto-apply.cluster-cooldown-minutes=15
xamops.automation.vertical.auto-apply.circuit-breaker-threshold=3

# ---------------------------------------------------------------------------
# Where the vertical engine reads usage from, and the two defaults that apply
# ONLY when a workload has no vertical_workload_policy row.
#
# metrics.*: Prometheus is reached through the Kubernetes API SERVICE PROXY, so
#   these three values are the components of the proxied path and nothing more --
#   no host, no scheme, no credential.
#
#   port=80 because that is what XamOps' OWN customer installer produces: the
#   script served by GET /api/v1/agent/install/eks.sh never sets
#   server.service.servicePort, so it gets the prometheus chart's default of 80,
#   and it points the agent at prometheus-server.monitoring.svc.cluster.local:80.
#   Only the test harness (eks/test-clusters/harness/prometheus-values.yaml) uses
#   9090. A default of 9090 therefore answered NO_METRICS_SOURCE on every cluster
#   onboarded the official way, and looked correct only on the harness cluster.
#   The ClusterRole's services/proxy resourceNames grant BOTH :80 and :9090, so
#   either shape of cluster works; this is the one that is normal.
#
# default-window-hours / default-mode: applied by the read path only when the
#   resolved policy's source is DEFAULTS. A stored row always wins, so the
#   reported provenance stays truthful about what was actually used.
#
#   RECOMMEND here, not OFF: with OFF the engine answers POLICY_OFF for every
#   workload, and endpoint 2 (the policy write) is not implemented, so there is
#   no other way to get a row. RECOMMEND cannot apply anything on its own -- an
#   apply needs both flags, an executor AND an operator pressing Apply.
#
#   72h here, not 24: Prometheus in this harness is emptyDir with retention 3d,
#   so 72h is the LONGEST HONEST window available. A workload whose measured
#   history does not cover it answers INSUFFICIENT_HISTORY with no numbers,
#   which is the correct answer and not a bug -- MIN_SAMPLE_COVERAGE stays 0.5.
#   If a live check shows workloads reading INSUFFICIENT_HISTORY only because
#   usage is still selected by CURRENT pod names (so a rollout resets a
#   workload's history to zero), the fix is that selection, not a lower bar;
#   dropping this back to 24 is the honest interim.
# ---------------------------------------------------------------------------
xamops.automation.vertical.metrics.namespace=monitoring
xamops.automation.vertical.metrics.service=prometheus-server
xamops.automation.vertical.metrics.port=80
xamops.automation.vertical.metrics.query-timeout-seconds=20
xamops.automation.vertical.metrics.ignore-container-start-seconds=120
xamops.automation.vertical.default-window-hours=72
xamops.automation.vertical.default-mode=RECOMMEND

# CUR auto-registration retry — re-attempts registration for connected AWS
# accounts still on Cost Explorer, so an account becomes CUR-backed automatically
# once AWS delivers the first CUR file, instead of needing a manual refresh.
xamops.cur.auto-register.enabled=true
