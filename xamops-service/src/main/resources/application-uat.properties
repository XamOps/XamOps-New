# --- Secure Cookie Configuration for HTTPS ---
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true

# --- UAT Logging & Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.forward-headers-strategy=native
logging.level.org.springframework=INFO
logging.level.com.xammer.cloud=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.cors=WARN
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=WARN
logging.level.com.fasterxml.jackson=WARN

# --- Tomcat thread pool cap (default 200 = 100MB stack waste) ---
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=25

# --- Session timeout (8h covers a full workday, was 1d) ---
server.servlet.session.timeout=8h

# --- Actuator: management port separate from app port ---
# Puts all /actuator/* endpoints on port 9090, bypassing the main Spring Security config.
# Port 9090 is never exposed externally (-p not mapped), so only reachable from the server itself.
management.server.port=9090
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.metrics.enabled=true

# --- Health check: don't ping DB/Redis on every call (was causing 2s response) ---
management.health.db.enabled=false
management.health.redis.enabled=false

