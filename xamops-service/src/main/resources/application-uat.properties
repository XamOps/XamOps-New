# ===================================================================
# --- AWS Inventory Plane ---
#
# Phase 1 (Resource Explorer reconcile): each environment queries Resource
# Explorer independently, so there is nothing to collide over.
xamops.inventory.enabled=true
#
# Phase 2 (event stream): ON, but pointed at a queue of its own.
#
# This must NOT be the queue in application.properties. SQS delivers each
# message to exactly one consumer, so two environments polling the same queue
# steal each other's events — and the theft is silent: the winner finds no
# matching account in its own database, logs "unknown AWS account", and discards
# the message, while the other environment simply never sees that change.
#
# PREREQUISITE — this queue must exist before uat is deployed with this on:
#   aws cloudformation deploy \
#     --template-file cloudformation/xamops-inventory-engine.yaml \
#     --stack-name xamops-inventory-engine-uat \
#     --parameter-overrides QueueBaseName=xamops-inventory-events-uat \
#                           Environment=staging \
#     --capabilities CAPABILITY_IAM --region ap-south-1
#
# and uat customer stacks must be onboarded with
# XamOpsInventoryQueueUrl set to the same queue, otherwise their forwarders send
# to prod's queue and uat receives nothing.
# ===================================================================
xamops.inventory.events.enabled=true
xamops.inventory.events.queue-url=https://sqs.ap-south-1.amazonaws.com/605134457560/xamops-inventory-events-uat.fifo

