---
# deploy-nodejs-pm2.yml
# Installs Node.js via NodeSource, deploys an application from Git, installs
# dependencies, and runs it under the PM2 process manager with startup on boot.
#
# Customization placeholders (replaced by the customization engine):
#   {{TARGET_HOSTS}}   - Inventory group or host pattern to target
#   {{APP_NAME}}       - Application / PM2 process name
#   {{NODE_VERSION}}   - Node.js major version (e.g. 20)
#   {{REPO_URL}}       - Git repository URL to deploy
#   {{APP_DIR}}        - Filesystem directory to deploy into
#   {{ENTRY_POINT}}    - Application entry script (e.g. dist/server.js)
- name: Deploy Node.js application with PM2
  hosts: "{{TARGET_HOSTS}}"
  become: true
  vars:
    app_name: "{{APP_NAME}}"
    node_version: "{{NODE_VERSION}}"
    repo_url: "{{REPO_URL}}"
    app_dir: "{{APP_DIR}}"
    entry_point: "{{ENTRY_POINT}}"

  tasks:
    - name: Add NodeSource apt setup script
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/setup_{{ node_version }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: "0755"

    - name: Run NodeSource setup
      ansible.builtin.command: bash /tmp/nodesource_setup.sh
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Install PM2 globally
      community.general.npm:
        name: pm2
        global: true

    - name: Clone or update application repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: true
      notify: Restart application

    - name: Install application dependencies
      community.general.npm:
        path: "{{ app_dir }}"
        production: true
      notify: Restart application

    - name: Start application under PM2
      ansible.builtin.command: "pm2 start {{ entry_point }} --name {{ app_name }}"
      args:
        chdir: "{{ app_dir }}"
      register: pm2_start
      changed_when: "'started' in pm2_start.stdout or pm2_start.rc == 0"
      failed_when: false

    - name: Configure PM2 to start on boot
      ansible.builtin.command: pm2 startup systemd -u root --hp /root
      register: pm2_startup
      changed_when: "'already' not in pm2_startup.stdout"

    - name: Persist PM2 process list
      ansible.builtin.command: pm2 save
      changed_when: true

  handlers:
    - name: Restart application
      ansible.builtin.command: "pm2 reload {{ app_name }}"
      failed_when: false
