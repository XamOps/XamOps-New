# ===================================================================
# TICKET CALLS (LiveKit)
# ===================================================================
# Defaults live here because prod is deployed by hand (no prod job in ci-cd.yml,
# which only wires LIVEKIT_* for UAT), so the container starts with none of these
# env vars set. A blank api-key or api-secret makes LiveKitTokenService
# .isConfigured() false, /api/xamops/calls/ws-token then reports
# callingEnabled:false, and the UI greys out the call buttons with
# "Calling is not enabled on this environment".
#
# The key/secret are UAT's on purpose: as of 2026-07-31 prod shares the UAT SFU
# (EIP 13.207.123.90) and one key pair spans both environments — see the header
# of docker-compose.livekit.prod.yml. Keep them in step with the LIVEKIT_API_KEY
# / LIVEKIT_API_SECRET GitHub secrets; a mismatch mints tokens the SFU rejects.
#
# url is browser-facing, so it names the prod gateway (which proxies /livekit/ to
# that SFU), not the SFU itself, and must be wss:// because prod is https.
# Env vars still win, so a future prod deploy job can override without a rebuild.
xamops.calls.livekit.url=${LIVEKIT_URL:wss://live.xamops.com/livekit}
xamops.calls.livekit.api-key=${LIVEKIT_API_KEY:${livekit_api_key}}
xamops.calls.livekit.api-secret=${LIVEKIT_API_SECRET:${livekit_api_secret}}

# Signs the short-lived token the browser presents on the call websocket. Without
# this prod falls back to the dev default baked into application.properties.
xamops.calls.ws-token.secret=${CALLS_WS_TOKEN_SECRET:${calls_ws_token_secret}}

# ===================================================================
# --- AWS Inventory Plane ---
#
# Stated explicitly rather than inherited. Before this block, prod carried no
# inventory or security keys at all and silently took the all-false defaults from
# application.properties — so nothing in this file told you what prod's posture
# was, and answering "is the event pipeline on in prod?" meant tracing
# inheritance.
# ===================================================================

# Resource Explorer reconcile. Independent per environment, nothing to collide
# over.
xamops.inventory.enabled=true

# Event stream. Prod OWNS the queue named in application.properties, which is why
# no queue-url override appears here.
#
# That ownership is exclusive. SQS delivers each message to exactly one consumer,
# so any other environment polling the same queue steals prod's events and
# discards them as "unknown AWS account". Non-prod environments must point at
# their own queue — see application-uat.properties for the engine stack command.
#
# InventoryEventListener logs a startup warning when a non-prod profile is
# enabled against this queue; treat that warning as an incident, because the
# symptom on the prod side is silence rather than an error.
xamops.inventory.events.enabled=true

# Reconcile interval. Once events are live this pass is pure reconciliation
# rather than the primary path, so it is relaxed from the 5-minute default to cut
# Resource Explorer calls. Do not lower it below the measured pass duration
# (60-130s on a ~1650-resource account) — the overlap guard would just skip
# cycles.
xamops.inventory.sync-interval-ms=900000

# ===================================================================
# --- Live security findings ---
# ===================================================================

# Serve findings on the Security Center and Alerts pages. Read-only: one indexed
# query, no AWS calls, no cache to invalidate.
xamops.security.live-findings.enabled=true

# Email and the in-app inbox.
#
# LEFT OFF, deliberately, and this is the one line in this block that is a
# business decision rather than a technical one. Turning it true starts emailing
# real paying customers the moment a critical finding lands, and recipients are
# every user under the owning client — preferences are per-client, so there is no
# per-user opt-out yet.
#
# Recommended sequence: exercise it in uat first, confirm the volume a real
# estate produces over a few days, then enable here.
#
# The rest of the pipeline is unaffected by this flag: findings are still
# ingested, stored and shown on both pages. Only email and the bell are skipped.
xamops.security.notify.enabled=true

# Coalescing window. Left at the 5-minute default on purpose — this is what turns
# a GuardDuty burst into one email instead of thirty. Local overrides it to 60s
# for testing; that value must never reach here.
xamops.security.notify.interval-ms=300000

# Remember-me cookie signing key — from Secrets Manager, was a literal in SecurityConfig.
app.remember-me.key=${app_remember_me_key}

# Serve cost pages from the Cost and Usage Report rather than Cost Explorer.
#
# Ships disabled in application.properties and turned on per environment, because it
# changes figures customers already read: CUR is what AWS bills from, so it carries
# tax, fees, credits, refunds and data-transfer detail that Cost Explorer omits or
# redistributes. Totals move, and they move towards the invoice.
#
# The fallback is per query, not per account: an account with no usable report keeps
# answering from Cost Explorer rather than showing nothing, so enabling this cannot
# blank a page for an account that has no CUR.
#
# The guidance attached to the default is to reconcile a closed month before
# flipping prod:
#   GET /api/billops/cur/reconcile?accountId=&year=&month=
# Worth doing for a live account if it has not been done — a mismatch here is a
# number a customer queries, not a page that fails.
xamops.cur.enabled=true

# Cost data refresh — daily, not the WED/SUN default.
#
# The twice-weekly default exists because Cost Explorer bills $0.01 per request and this
# job makes several per account. That constraint does not apply to a report: an Athena
# scan over a partition-pruned aggregate costs a fraction of a cent, which is why GCP
# already refreshes daily and Azure every six hours.
#
# Safe to make daily only because the job now runs CUR_ONLY — see refreshCostData. Were
# it still AUTO, every account without a usable report would fall back to Cost Explorer
# and this cadence would multiply that bill by three.
#
# No point going more often: AWS delivers a CUR roughly one to three times a day, on no
# published schedule.
xamops.cost.refresh-cron=0 30 2 * * *

# AutoSpotting Phase A safety switches. Keep false until the Phase B rewrite ships.
autospotting.aws.conversions-enabled=false
autospotting.gcp.conversions-enabled=false
autospotting.aws.savings-ledger.enabled=false

# ---------------------------------------------------------------------------
# Workload autoscaling (Java vertical rightsizing engine). BOTH DEFAULT FALSE.
#
# enabled: master switch. While false the engine makes no AWS call and no
#   cluster call at all, and the read endpoint returns engine status plus gate
#   reasons with an empty workloads array. It stays false until the engine has
#   been validated against a real cluster -- the Go rightsizer it replaces was
#   measured recommending 0m CPU and 1Mi memory requests on 7 of 7 workloads.
#
# readiness.vertical-rightsizing: whether anything may be APPLIED. Separate
#   from enabled on purpose: recommendations are useful long before automatic
#   application is trusted. No executor is implemented yet, so a stored AUTO
#   policy is inert by construction regardless of this value.
#
# NOTE: xamops.k8s.automation.readiness.vertical-rightsizing is also defined by
# the CloudK8s UI branch, deliberately -- one flag flips the UI and the engine
# together. On merge, keep ONE copy of that line.
# ---------------------------------------------------------------------------
xamops.automation.vertical.enabled=false
xamops.k8s.automation.readiness.vertical-rightsizing=false

# ---------------------------------------------------------------------------
# Where the vertical engine reads usage from, and the two defaults that apply
# ONLY when a workload has no vertical_workload_policy row.
#
# metrics.*: Prometheus is reached through the Kubernetes API SERVICE PROXY, so
#   these three values are the components of the proxied path and nothing more --
#   no host, no scheme, no credential. The defaults are what
#   eks/test-clusters/harness/prometheus-values.yaml installs, and the URL the Go
#   agent and autoscaler hard-code.
#
# default-window-hours / default-mode: applied by the read path only when the
#   resolved policy's source is DEFAULTS. A stored row always wins, so the
#   reported provenance stays truthful about what was actually used. OFF keeps
#   this feature inert in every profile until somebody turns it on deliberately.
# ---------------------------------------------------------------------------
xamops.automation.vertical.metrics.namespace=monitoring
xamops.automation.vertical.metrics.service=prometheus-server
xamops.automation.vertical.metrics.port=9090
xamops.automation.vertical.metrics.query-timeout-seconds=20
xamops.automation.vertical.metrics.ignore-container-start-seconds=120
xamops.automation.vertical.default-window-hours=24
xamops.automation.vertical.default-mode=OFF
