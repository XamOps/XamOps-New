# CloudFormation EventBridge Callback — enables auto-connect for AWS onboarding.
# A non-empty param.name is what makes AwsAccountService report eventBridgeEnabled=true,
# which is what tells the browser to poll for auto-connect instead of falling back to the
# manual "enter your account ID and role name" form. It also appends
# &param_XamOpsEventBusArn=<value> to the generated CloudFormation URL.
#
# The bus is UAT's on purpose: PutEvents is audit-only (the customer-side Lambda logs a
# warning and carries on if it fails) — what actually connects the account is the Lambda's
# direct HTTPS POST to XamOpsCallbackUrl, which the prod templates set to live.xamops.com.
#
# This does nothing until the S3 templates at cloudformation.template.s3[.readwrite].url
# carry the AutoCallback resources — see cloudformation/xamops-readonly-role.yml.
xamops.cfn.callback.param.name=XamOpsEventBusArn
xamops.cfn.callback.param.value=arn:aws:events:ap-south-1:605134457560:event-bus/xamops-onboarding-events


