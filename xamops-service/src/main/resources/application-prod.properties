# --- AWS Secrets Manager: load prod credentials at startup ---
# Region for the Secrets Manager client (instance role XamOps-App-EC2-Role supplies
# credentials over IMDS; the container is started with no AWS_* env vars).
#
# Three secrets, split by who reads them:
#   prod/xamops_db      — datasource. Keys match uat/xamops_db_uat so the property
#                         lines below are identical in both profiles.
#   prod/xamops_shared  — the impersonation JWT key, which MUST be the same value in
#                         xamops-service, billops and media-ops-service. One secret is
#                         what stops those three drifting apart.
#   prod/xamops_app     — everything only this service reads.
#
# Keys inside every imported secret share one flat namespace with no prefix (this is
# a limitation of spring-cloud-starter-aws-secrets-manager-config 2.4.x), and a
# duplicate key across two secrets silently overwrites. Hence the generic
# username/password/host/port/dbname live ONLY in the db secret, and every app key is
# uniquely named.
#
# optional: means a missing secret does not fail the import — but the placeholders
# below then have nothing to resolve against, so startup fails immediately naming the
# property. That is deliberate: prod refuses to boot rather than run with a blank
# encryption key.
spring.cloud.aws.region.static=ap-south-1
cloud.aws.stack.auto=false
spring.config.import=optional:aws-secretsmanager:prod/xamops_db,optional:aws-secretsmanager:prod/xamops_shared,optional:aws-secretsmanager:prod/xamops_app

# --- PRODUCTION PostgreSQL Database (Single-Tenant Mode) ---
# From prod/xamops_db. The host there is 10.1.10.124 — the 10.1.10.239 that used to be
# hardcoded here was stale, and prod has been running on .124 via SPRING_DATASOURCE_URL.
#
# Those SPRING_DATASOURCE_* env vars still win over anything imported here (OS
# environment outranks config data), so these three lines stay inert until the env vars
# are dropped from the docker run. That makes this change safe to ship before the
# restart, not after.
spring.datasource.url=jdbc:postgresql://${host}:${port}/${dbname}
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=org.postgresql.Driver

