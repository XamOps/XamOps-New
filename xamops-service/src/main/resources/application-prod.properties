# ===================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ===================================================================

# --- PRODUCTION PostgreSQL Database (Single-Tenant Mode) ---
spring.datasource.url=jdbc:postgresql://10.1.10.239:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- PRODUCTION Service Registry ---
eureka.client.serviceUrl.defaultZone=http://service-registry:8761/eureka/

# --- PRODUCTION Redis Host ---
# Docker: redis-live | EKS: SPRING_REDIS_HOST env var overrides this (set to 'redis' in K8s)
spring.redis.host=${SPRING_REDIS_HOST:redis-live}
spring.redis.port=${SPRING_REDIS_PORT:6379}

# --- CORS for UAT Environment ---
# Only allows your UAT frontend to access the API
cors.allowed-origins=https://live.xamops.com

# --- UAT API Keys & URLs ---
gemini.api.key=${GEMINI_API_KEY:CHANGE_ME}
openai.api.key=${OPENAI_API_KEY:}

# --- OpenObserve (prod: i-021da16d98a9c4239 / live-otel.xamops.com) ---
# Internal URL: use private IP if in same VPC (lower latency, no egress cost)
# aws ec2 describe-instances --instance-ids i-021da16d98a9c4239 --query 'Reservations[0].Instances[0].PrivateIpAddress'
openobserve.url=${OPENOBSERVE_URL:http://10.1.11.163:5080}
openobserve.external.url=${OPENOBSERVE_EXTERNAL_URL:https://live-otel.xamops.com}
openobserve.admin.email=${OPENOBSERVE_ADMIN_EMAIL:admin@xamops.local}
openobserve.admin.password=${OPENOBSERVE_ADMIN_PASSWORD:CHANGE_ME}
cloudformation.template.s3.url=https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-readonly-role.yml
cloudformation.template.s3.readwrite.url=https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-readwrite-role.yml
app.frontend.url=https://live.xamops.com

# --- Secure Cookie Configuration for HTTPS ---
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true



# --- Production Logging & Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.flyway.out-of-order=true
spring.jpa.show-sql=false
server.forward-headers-strategy=native
logging.level.org.springframework=INFO
logging.level.com.xammer.cloud=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.cors=WARN
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=WARN
logging.level.com.fasterxml.jackson=WARN

# --- Tomcat thread pool cap ---
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=50

# --- Session timeout ---
server.servlet.session.timeout=8h

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notifications@xamops.com
spring.mail.password=${SPRING_MAIL_PASSWORD:CHANGE_ME}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

groq.api.key=${GROQ_API_KEY}

#prophet.forecast.url=http://forecast-service:5002/forecast/cost


# ? UPDATED: Prophet Forecast Service (use Docker service name)
forecast.service.url=http://xamops-forecast-live:5002
marketplace.procurement.service.url=http://xamops-marketplace-procurement-live:5003
forecast.service.connect-timeout=20000
forecast.service.read-timeout=180000

# ? ADDED: RestTemplate Configuration
rest.template.connect-timeout=20000
rest.template.read-timeout=180000

# ? ADDED: Environment identifier
app.environment=production

# ==============================================================
# DATABASE CONNECTION POOL - PRODUCTION OVERRIDES
# 20 connections: handles scheduled jobs + user requests + startup seed pass
# connection-timeout=15000: 5s was too aggressive under load, 15s gives headroom
# ==============================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.master-maximum-pool-size=15
spring.datasource.hikari.leak-detection-threshold=30000

# Serialize scheduled jobs — one at a time, prevents tenant pool stampede
spring.task.scheduling.pool.size=1

logging.level.com.zaxxer.hikari=WARN

# Async timeout set well below ALB (300s) and nginx proxy_read_timeout (300s)
# so Spring returns a clean 503 JSON before upstream kills the connection
spring.mvc.async.request-timeout=125000


github.api.baseurl=https://api.github.com
app.encryption.secret-key=${APP_ENCRYPTION_SECRET_KEY:CHANGE_ME}


# Existing Mumbai URL (Keep this)
prometheus.api.url=http://13.234.115.203:9090/

anythingllm.api.key=${ANYTHINGLLM_API_KEY:CHANGE_ME}

# 2. The Connection URL for 'xamops-workspace'
# NOTE: We added '/api/v1' and '/chat' to the URL. This is required for the code to work.
anythingllm.url=http://13.200.255.73:3001/api/v1/workspace/xamops-workspace/chat



prowler.executable.path=${PROWLER_PATH:/usr/local/bin/prowler}

# ===================================================================
# PRODUCTION ENVIRONMENT - SCHEDULING
# ===================================================================
scheduling.enabled=true
scheduling.current-tenant-id=system
spring.mvc.async.request-timeout=120000
aws.costexplorer.mock=false

# ===================================================================
# XAMOPS AGENT CONFIGURATION
# ===================================================================
