# ==============================================================
# DATABASE CONNECTION POOL - PRODUCTION OVERRIDES
# 20 connections: handles scheduled jobs + user requests + startup seed pass
# connection-timeout=15000: 5s was too aggressive under load, 15s gives headroom
# ==============================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.master-maximum-pool-size=15
spring.datasource.hikari.leak-detection-threshold=30000

# Serialize scheduled jobs — one at a time, prevents tenant pool stampede
spring.task.scheduling.pool.size=1

logging.level.com.zaxxer.hikari=WARN

# Async timeout set well below ALB (300s) and nginx proxy_read_timeout (300s)
# so Spring returns a clean 503 JSON before upstream kills the connection
spring.mvc.async.request-timeout=125000


github.api.baseurl=https://api.github.com

# AES key for credentials stored in the database. From prod/xamops_app, seeded with the
# value prod was already using — every existing ciphertext was written with it, so this
# must not be "upgraded" as part of a config move. Rotating it needs
# app.encryption.previous-keys carrying the old key while rows are re-encrypted.
app.encryption.secret-key=${app_encryption_secret_key}

# Impersonation JWT. Stated explicitly here rather than inherited from
# application.properties, so prod's value is visible in prod's file. From
# prod/xamops_shared — billops signs, this service and media-ops verify, so all three
# must resolve the same value.
#
# Today this is the SAME value as app.encryption.secret-key above. That is a known
# problem, not a convention: one leaked value both decrypts every stored credential and
# mints super-admin impersonation tokens. Splitting them is a coordinated change across
# all three services, tracked separately.
app.impersonation.secret-key=${app_impersonation_secret_key}

