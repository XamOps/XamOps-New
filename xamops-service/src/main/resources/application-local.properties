# ===================================================================
# XAMSECURE — UPWIND SYNC (LOCAL)
# ===================================================================
# Credentials (UPWIND_CLIENT_ID / UPWIND_CLIENT_SECRET) load from the gitignored
# .env.local at the repo root — NEVER hardcode the secret here.
# Import from both the repo root AND one level up: `spring-boot:run` sets the CWD
# to the module dir (xamops-service/), so the repo-root file is at ../.env.local;
# running the packaged jar from the repo root finds ./.env.local. Both are optional.
spring.config.import=optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
# Turn the scheduler on: detections every 60s, full sync (vulns + posture + inventory) every 4h.
upwind.sync.enabled=true

# Kafka isn't running locally — disable the SRE consumer to stop reconnect spam
# flooding the logs (mirrors the UAT profile).
spring.kafka.listener.auto-startup=false

