# ===================================================================
# --- AWS Inventory Plane ---
#
# Phase 1 (60s Resource Explorer polling): safe to enable here. Each
# environment polls independently, so there is nothing to collide over.
xamops.inventory.enabled=true
#
# Phase 2 (event stream): deliberately OFF in local. The queue in
# application.properties is a single SQS queue, and SQS gives each message to
# exactly one consumer — if this environment polled it too, it would steal
# events belonging to the environment that owns it, find no matching account
# in its own database, and silently discard them. To run events here, deploy a
# separate xamops-inventory-engine.yaml with its own queue name and override
# xamops.inventory.events.queue-url below.
# ===================================================================
xamops.inventory.events.enabled=true

# Local gets its OWN queue, and this override stopped being optional the moment
# prod was enabled on the shared one.
#
# Without it, local inherits the queue URL from application.properties — the queue
# prod owns. SQS delivers each message to exactly one consumer, so a developer's
# laptop consumes production customers' events, finds no matching account in the
# local database, logs "unknown AWS account" and discards them. Prod loses those
# changes with nothing on its own side to indicate why. This was genuinely
# happening before this line existed; InventoryEventListener's shared-queue
# startup warning is what surfaced it.
#
# PREREQUISITE — deploy the queue once, then local events resume:
#   aws cloudformation deploy \
#     --template-file cloudformation/xamops-inventory-engine.yaml \
#     --stack-name xamops-inventory-engine-local \
#     --parameter-overrides QueueBaseName=xamops-inventory-events-local \
#                           Environment=development \
#     --capabilities CAPABILITY_IAM --region ap-south-1
#
# and re-onboard the test account with XamOpsInventoryQueueUrl pointing here.
#
# Until that queue exists local receives no events. Harmless: the Resource
# Explorer reconcile above still keeps inventory current, so only the ~5s event
# path and the detector findings are inactive locally.
xamops.inventory.events.queue-url=https://sqs.ap-south-1.amazonaws.com/605134457560/xamops-inventory-events-local.fifo


# ===================================================================
# --- Live security findings (LOCAL) ---
#
# Ingest is already active here, because it is gated only by
# xamops.inventory.events.enabled above. These two switches control what happens
# with the findings once stored, and both default to false in
# application.properties — so without overriding them here, findings accumulate
# in cloud_security_finding and no page ever shows them.
# ===================================================================

# Serve findings to the Security Center and Alerts pages.
xamops.security.live-findings.enabled=true

# Email and the in-app inbox.
#
# LEFT OFF DELIBERATELY. This is the only switch in the pipeline that reaches
# outside the product, and this profile points at a database holding real client
# and app_user rows — so turning it on means a critical finding emails every real
# user under the owning client, from a local dev machine.
#
# Turn it on only once you are content for that to happen, or after pointing
# spring.mail.* at a capture server such as MailHog. Ingest and the pages work
# fully with this false; only email and the inbox row are skipped.
xamops.security.notify.enabled=true

# Tightened from the 300000 default so a local test does not wait five minutes
# for the coalescing window. Do not carry this value to production — the window
# is what turns a burst of findings into one email instead of thirty.
xamops.security.notify.interval-ms=60000
xamops.security.notify.initial-delay-ms=20000


xamops.cur.enabled=true

# Cost data refresh — daily now, not WED/SUN.
#
# The twice-weekly default exists because Cost Explorer bills $0.01 per request and this
# job makes several per account. Reading a CUR has no per-request charge (Athena scan cost
# for a partition-pruned monthly aggregate is a fraction of a cent), so the constraint is
# gone for accounts backed by a report — which is why GCP and Azure already refresh daily.
#
# 02:30 IST is ~21:00 UTC, so it picks up the previous day's final delivery. AWS refreshes
# an open month up to three times a day at times it does not publish, so no fixed hour can
# guarantee sitting just behind a delivery; CUR data is inherently 6-24h behind regardless.
# The 01:45 CUR revalidation runs first, so a report that stopped arriving is already
# marked stale before this job would warm a cache from it.
xamops.cost.refresh-cron=0 30 2 * * *

