# --- Local PostgreSQL Database (Single DB Mode - No Multi-Tenancy) ---
spring.datasource.url=jdbc:postgresql://13.127.62.153:5432/xamops_local_db
spring.datasource.username=xamops_local_user
spring.datasource.password=XamOps@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# HIKARI CONNECTION POOL (LOCAL TUNING)
# ==============================================================
# Aggressive recycling of connections to prevent "Connection Reset" errors
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000
# Ensure we have enough connections for parallel dashboard fetching
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.leak-detection-threshold=60000
# Validate connections before handing them out so silently-dropped TCP sockets
# (killed by NAT/firewall idle timeouts) are evicted instead of causing 500s
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.minimum-idle=5

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
# CRITICAL: Set to 'none' or 'validate' for Multi-Tenant apps to prevent
# schema update locks when switching tenants rapidly.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# FLYWAY CONFIGURATION
