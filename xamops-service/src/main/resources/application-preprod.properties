# AWS COST EXPLORER MOCK MODE
# ===================================================================
# Set to 'true' to use mock data instead of real AWS Cost Explorer API calls
# This prevents AWS charges ($0.01 per API call) during UAT testing

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2

# Master/lookup pool (just reads tenant routing info)
spring.datasource.hikari.master-maximum-pool-size=5

# Wait up to 10s for a connection before failing
spring.datasource.hikari.connection-timeout=10000

# Log connections held >30s (helps catch async threads holding connections)
spring.datasource.hikari.leak-detection-threshold=30000

# Keep async request timeout longer than your AWS timeout (300s scheduler + buffer)
spring.mvc.async.request-timeout=125000

# Serialize scheduled jobs — one at a time, prevents tenant pool stampede
spring.task.scheduling.pool.size=1

# Surface Hikari pool activity in logs
logging.level.com.zaxxer.hikari=DEBUG
# ===================================================================
# --- AWS Inventory Plane ---
#
# Phase 1 (Resource Explorer reconcile): each environment queries Resource
# Explorer independently, so there is nothing to collide over.
xamops.inventory.enabled=true
#
# Phase 2 (event stream): OFF, and this is the correct default for preprod.
#
# Prod owns the queue named in application.properties. SQS delivers each message
# to exactly one consumer, so enabling this here without also overriding
# queue-url would make preprod steal prod's events and discard them as "unknown
# AWS account" — prod would go quiet with no error anywhere on its side.
#
# To run events here, deploy a dedicated queue and set both lines:
#   aws cloudformation deploy \
#     --template-file cloudformation/xamops-inventory-engine.yaml \
#     --stack-name xamops-inventory-engine-preprod \
#     --parameter-overrides QueueBaseName=xamops-inventory-events-preprod \
#     --capabilities CAPABILITY_IAM --region ap-south-1
#
#   xamops.inventory.events.enabled=true
#   xamops.inventory.events.queue-url=https://sqs.ap-south-1.amazonaws.com/605134457560/xamops-inventory-events-preprod.fifo
# ===================================================================
xamops.inventory.events.enabled=false

# Serving is on, but expect it to show nothing while events are off above.
#
# Findings have exactly one source: the event stream. The Resource Explorer
# reconcile builds inventory, not findings — it never calls Security Hub or
# Config. So with events.enabled=false this flag changes nothing visible; it is
# set true only so that enabling the queue above is a one-line change rather than
# two, and so nobody concludes the feature is broken when the real cause is that
# no events are arriving.
xamops.security.live-findings.enabled=true

# No email from preprod — it shares client rows with real addresses.
xamops.security.notify.enabled=false
