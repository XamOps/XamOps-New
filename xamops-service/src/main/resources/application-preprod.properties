# --- Diagnostic Log Pattern: includes MDC tenant + thread name on every line ---
# [NO-TENANT] on any log line = tenant context lost on that thread = multi-tenant routing bug
# [customer4] = correct tenant context present
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{tenant:-NO-TENANT}] [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{tenant:-NO-TENANT}] [%thread] %-5level %logger{36} - %msg%n

