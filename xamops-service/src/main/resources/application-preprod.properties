# ===================================================================
# --- AWS Inventory Plane ---
#
# Phase 1 (Resource Explorer reconcile): each environment queries Resource
# Explorer independently, so there is nothing to collide over.
xamops.inventory.enabled=true

# Resource Explorer index creation/promotion — OFF, stated explicitly.
#
# Preprod connects customer accounts with the READ-ONLY role (XamOpsReadOnlyRole),
# which does not grant resource-explorer-2:CreateIndex or UpdateIndexType. With
# this true, every reconcile pass tried those writes, each was denied, and the
# continuous stream of AccessDenied tripped the customer's CIS 4.1 unauthorized-API
# alarm (DTPL-UnauthorizedAPICalls-Alarm) roughly every 30 minutes. Inventory still
# works with it off: uncovered regions stay on the describe fallback. Only enable
# this in an environment that assumes the READ-WRITE role, which grants the two
# actions.
xamops.inventory.auto-create-indexes=false
#
# Phase 2 (event stream): OFF, and this is the correct default for preprod.
#
# Prod owns the queue named in application.properties. SQS delivers each message
# to exactly one consumer, so enabling this here without also overriding
# queue-url would make preprod steal prod's events and discard them as "unknown
# AWS account" — prod would go quiet with no error anywhere on its side.
#
# To run events here, deploy a dedicated queue and set both lines:
#   aws cloudformation deploy \
#     --template-file cloudformation/xamops-inventory-engine.yaml \
#     --stack-name xamops-inventory-engine-preprod \
#     --parameter-overrides QueueBaseName=xamops-inventory-events-preprod \
#     --capabilities CAPABILITY_IAM --region ap-south-1
#
#   xamops.inventory.events.enabled=true
#   xamops.inventory.events.queue-url=https://sqs.ap-south-1.amazonaws.com/605134457560/xamops-inventory-events-preprod.fifo
# ===================================================================
xamops.inventory.events.enabled=false

# Serving is on, but expect it to show nothing while events are off above.
#
# Findings have exactly one source: the event stream. The Resource Explorer
# reconcile builds inventory, not findings — it never calls Security Hub or
# Config. So with events.enabled=false this flag changes nothing visible; it is
# set true only so that enabling the queue above is a one-line change rather than
# two, and so nobody concludes the feature is broken when the real cause is that
# no events are arriving.
xamops.security.live-findings.enabled=true

# No email from preprod — it shares client rows with real addresses.
xamops.security.notify.enabled=true


# AutoSpotting Phase A safety switches. Keep false until the Phase B rewrite ships.
autospotting.aws.conversions-enabled=false
autospotting.gcp.conversions-enabled=false
autospotting.aws.savings-ledger.enabled=false
autospotting.gcp.savings-ledger.enabled=false

# ---------------------------------------------------------------------------
# Workload autoscaling (Java vertical rightsizing engine). BOTH DEFAULT FALSE.
#
# enabled: master switch. While false the engine makes no AWS call and no
#   cluster call at all, and the read endpoint returns engine status plus gate
#   reasons with an empty workloads array. It stays false until the engine has
#   been validated against a real cluster -- the Go rightsizer it replaces was
#   measured recommending 0m CPU and 1Mi memory requests on 7 of 7 workloads.
#
# readiness.vertical-rightsizing: whether anything may be APPLIED. Separate
#   from enabled on purpose: recommendations are useful long before automatic
#   application is trusted. No executor is implemented yet, so a stored AUTO
#   policy is inert by construction regardless of this value.
#
# NOTE: xamops.k8s.automation.readiness.vertical-rightsizing is also defined by
# the CloudK8s UI branch, deliberately -- one flag flips the UI and the engine
# together. On merge, keep ONE copy of that line.
# ---------------------------------------------------------------------------
xamops.automation.vertical.enabled=false
xamops.k8s.automation.readiness.vertical-rightsizing=false
# consolidation-actions: live node consolidation stays gated (fail-closed) until validation + soak.
xamops.k8s.automation.readiness.consolidation-actions=false
# HPA (horizontal) master switch, parallel to vertical.enabled. UAT only.
xamops.automation.horizontal.enabled=false
# D3b standalone target-retune sub-flag. Off everywhere but a deliberately opted-in
# environment, even where HPA automation is on. UAT only, same parity as the switch.
xamops.automation.horizontal.target-retune.enabled=false

# auto-apply.*: the scheduled auto-apply loop (FEAT-002). auto-apply.enabled is
#   the GLOBAL KILL SWITCH for the loop and defaults OFF in every profile but UAT.
#   While it is false the loop does not run at all, independently of the two flags
#   above. The other three are the loop's cadence and safety.
xamops.automation.vertical.auto-apply.enabled=false
xamops.automation.vertical.auto-apply.interval-minutes=15
xamops.automation.vertical.auto-apply.cluster-cooldown-minutes=15
xamops.automation.vertical.auto-apply.circuit-breaker-threshold=3

# ---------------------------------------------------------------------------
# Where the vertical engine reads usage from, and the two defaults that apply
# ONLY when a workload has no vertical_workload_policy row.
#
# metrics.*: Prometheus is reached through the Kubernetes API SERVICE PROXY, so
#   these three values are the components of the proxied path and nothing more --
#   no host, no scheme, no credential.
#
#   port=80 because that is what XamOps' OWN customer installer produces: the
#   script served by GET /api/v1/agent/install/eks.sh never sets
#   server.service.servicePort, so it gets the prometheus chart's default of 80,
#   and it points the agent at prometheus-server.monitoring.svc.cluster.local:80.
#   Only the test harness (eks/test-clusters/harness/prometheus-values.yaml) uses
#   9090. A default of 9090 therefore answered NO_METRICS_SOURCE on every cluster
#   onboarded the official way, and looked correct only on the harness cluster.
#   The ClusterRole's services/proxy resourceNames grant BOTH :80 and :9090, so
#   either shape of cluster works; this is the one that is normal.
#
# default-window-hours / default-mode: applied by the read path only when the
#   resolved policy's source is DEFAULTS. A stored row always wins, so the
#   reported provenance stays truthful about what was actually used. OFF keeps
#   this feature inert in every profile until somebody turns it on deliberately.
# ---------------------------------------------------------------------------
xamops.automation.vertical.metrics.namespace=monitoring
xamops.automation.vertical.metrics.service=prometheus-server
xamops.automation.vertical.metrics.port=80
xamops.automation.vertical.metrics.query-timeout-seconds=20
xamops.automation.vertical.metrics.ignore-container-start-seconds=120
xamops.automation.vertical.default-window-hours=24
xamops.automation.vertical.default-mode=OFF

# CUR auto-registration retry — re-attempts registration for connected AWS
# accounts still on Cost Explorer, so an account becomes CUR-backed automatically
# once AWS delivers the first CUR file, instead of needing a manual refresh.
xamops.cur.auto-register.enabled=true
