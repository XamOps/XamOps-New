version: '3.8'

# LiveKit SFU for ticket calls — UAT.
#
# IMPORTANT: this runs on a DEDICATED EC2 in a PUBLIC subnet with an Elastic IP,
# NOT on the app instance. WebRTC media (UDP) needs a host reachable directly on
# the internet with symmetric routing; the app instance sits in a private subnet
# behind a NAT gateway (inbound EIP != outbound NAT IP), so media cannot work
# there. See the runbook below.
#
# ── Host (UAT) ───────────────────────────────────────────────────────────────
#   Instance : dedicated t3.small, Amazon Linux 2023, public subnet (IGW route)
#   EIP      : 13.207.123.90   (advertised to clients for media via --node-ip)
#   SG       : livekit-media-sg — inbound from 0.0.0.0/0:
#                7881/tcp, 3478/tcp, 3478/udp, 50000-50100/udp   (media + TURN)
#                7880/tcp from the VPC CIDR only                 (signalling)
#   Admin    : via SSM Session Manager (no SSH port open)
#
# ── Signalling path (no separate TLS/cert needed) ────────────────────────────
#   Browser → https/wss on uat.xamops.com (ALB, existing cert)
#           → api-gateway nginx  location /livekit/ → http://<livekit-private-ip>:7880/
#   So LIVEKIT_URL on xamops-service stays: wss://uat.xamops.com/livekit
#
# ── Media path ───────────────────────────────────────────────────────────────
#   Browser ⇄ 13.207.123.90 directly on UDP 50000-50100 (and TCP 7881 / TURN 3478)
#
# ── Bring up (on the LiveKit EC2, via SSM) ───────────────────────────────────
#   export LIVEKIT_API_KEY=...        # must match xamops-service LIVEKIT_API_KEY
#   export LIVEKIT_API_SECRET=...     # >= 32 chars; must match xamops-service
#   docker compose -f docker-compose.livekit.uat.yml up -d
#
# Host networking is required so LiveKit binds the media ports on the host with
# no Docker UDP NAT (which breaks WebRTC connectivity checks).

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: xamops-livekit-uat
    restart: unless-stopped
    network_mode: host
    # --node-ip pins the public EIP into ICE candidates. Set LIVEKIT_NODE_IP to
    # the instance's Elastic IP (13.207.123.90 on current UAT).
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-13.207.123.90}
    environment:
      # "key: secret" — kept in env so the secret is not committed to git.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.uat.yaml:/etc/livekit.yaml:ro
