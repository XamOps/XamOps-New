# ocb manifest for the slim XamPulse collector ("xampulse-otelcol"), Linux MVP set.
# Windows, Kubernetes and ECS components are intentionally left out for now.
# Build: ocb --config xamops-agent/xampulse/otelcol-builder.yaml
# The version below was taken from the upstream release page and has NOT been built or tested here.
# Pin it again (and record it in deploy/xampulse/DEPENDENCIES.md) when the first collector is built.
dist:
  name: xampulse-otelcol
  description: XamPulse OpenTelemetry Collector (Linux)
  output_path: ./build/xampulse-otelcol
  otelcol_version: 0.164.0

receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/journaldreceiver v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/dockerstatsreceiver v0.164.0
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.164.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.164.0
