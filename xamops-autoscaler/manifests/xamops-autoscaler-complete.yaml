# ═══════════════════════════════════════════════════════════════════════════════
# XamOps Automation Agent — Complete Kubernetes Manifest
#
# Tier 2: Write-Permission Automation Agent (optional — deploy alongside agent)
# Deploys into the xamops-system namespace (same as xamops-agent).
#
# Controllers (all off by default, enable via XamOps UI or env vars):
#   ENABLE_EVICTOR        — utilisation-threshold node scale-in (analyse-only by default;
#                           drains only through the shared drain executor)
#   ENABLE_RIGHTSIZER     — rightsizing analysis (P80/P100 recommendations)
#   ENABLE_RIGHTSIZER_APPLY — let the rightsizer patch requests (also needs
#                           applyMode=immediate AND DRY_RUN=false)
#   ENABLE_REBALANCER     — drain on-demand nodes when XamOps triggers a rebalance
#                           (needs this AND rebalancer.enabled AND status=running;
#                           each operation runs at most once)
#   ENABLE_HPA_MANAGER    — create/update/delete HPAs from UI recommendations
#   ENABLE_VPA_MANAGER    — create VPA objects + collect recommendations
#   ENABLE_NODE_OPTIMIZER — idle node detection, spot analysis, interruption handling
#
# IMPORTANT: DRY_RUN=true by default — zero cluster changes until explicitly enabled.
# Every node drain goes through one executor: global budget (maxParallelDrains),
# a plan that must prove the drain is safe, Eviction API only (never pod delete),
# replacements verified by new pod UID, abort + uncordon on failure. The plan is
# the scheduler-fit simulator (internal/fitsim): DaemonSet/mirror pods are excluded,
# every other pod must fit on another node, and the set is re-planned before every
# eviction; anything it cannot prove is refused.
# ═══════════════════════════════════════════════════════════════════════════════
---
# ── Namespace (shared with xamops-agent) ──────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: xamops-system
  labels:
    app.kubernetes.io/managed-by: xamops

---
# ── ServiceAccount ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xamops-automation
  namespace: xamops-system
  labels:
    app: xamops-automation
    app.kubernetes.io/component: automation

---
# ── ClusterRole — Write RBAC ──────────────────────────────────────────────────
# Separate from xamops-agent's read-only ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xamops-automation
  labels:
    app: xamops-automation
rules:
  # ── Read access (needed to make safe decisions) ──────────────────────────
  # PersistentVolumeClaims and PersistentVolumes feed the stateful/zone protection
  # (FEAT-005 / stateful-db-fixtures report §5): the fit simulator resolves each
  # pod's PVC → PV → topology.kubernetes.io/zone node-affinity so a zonal volume is
  # placed same-AZ only. PVs are cluster-scoped, hence listed here, not in the Role.
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
      - replicationcontrollers
      - services
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]

  # ── Operator Custom Resources for database-role detection (FEAT-005) ───────
  # The stateful protection layer reads operator CR status (never DB credentials) to
  # tell a primary from a sync standby — currently the allow-listed CloudNativePG
  # Cluster (postgresql.cnpg.io). Read-only; a cluster without the CRD installed is
  # treated as zero CRs. Extend the allow-list here when more operators are added.
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - clusters
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]

  # ── Write access (core autoscaling actions) ────────────────────────────────
  # Cordon / uncordon nodes
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["patch", "update"]

  # Evict pods — the only way pods leave a node (Eviction API honours PDBs).
  # There is deliberately no pods "delete" grant.
  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs: ["create"]

  # ── VPA Manager in-place resize (FEAT: cloudk8s-vpa-apply) ──────────────────
  # TRUE in-place pod resize via the resize subresource (K8s >=1.33,
  # InPlacePodVerticalScaling beta — the version where the /resize subresource + this
  # pods/resize RBAC resource exist; matches xamops-workload-autoscaler-rbac.yaml:46
  # "K8s 1.33+ resize subresource"). Restart-free, QoS-preserving: it can only change a
  # running pod's spec.containers[].resources — never delete/evict a pod, never patch a
  # workload template. Gated in code (gate.VPAManager Live + ENABLE_VPA_MANAGER +
  # vpa-apply ready + DRY_RUN=false); dormant until that gate opens. Least-privilege:
  # patch only.
  - apiGroups: [""]
    resources:
      - pods/resize
    verbs: ["patch"]

  # Patch Deployment resource requests (rightsizer)
  # DORMANT RESTART-CAPABLE GRANT: patching a Deployment template rolls its pods
  # (an effective restart). This write verb is gated in code (ENABLE_RIGHTSIZER_APPLY
  # + applyMode=immediate + DRY_RUN=false) and is only exercised by the rightsizer
  # apply path. The VPA manager's restart-capable write (VPAManager.Apply) is
  # currently CALLERLESS — the control loop only collects recommendations — so this
  # grant stays dormant for VPA pending the owner restart decision. Grant unchanged.
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["patch", "update"]

  # Patch StatefulSet resource requests (rightsizer, when protectStatefulSets=false)
  - apiGroups: ["apps"]
    resources:
      - statefulsets
    verbs: ["patch", "update"]

  # Events — write autoscaler events into the cluster
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch", "update"]

  # ── HPA Manager: create/update/delete HorizontalPodAutoscalers ─────────────
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── VPA Manager: create/update/delete VerticalPodAutoscalers ───────────────
  # Only needed when ENABLE_VPA_MANAGER=true and VPA CRD is installed.
  # DORMANT RESTART-CAPABLE GRANT: the create/update/patch/delete verbs here back
  # VPAManager.Apply, which (with a VPA updateMode of Auto/Recreate/InPlaceOrRecreate)
  # can restart workload pods. That method is CALLERLESS today — the gate.VPAManager
  # decision caps at Analyse and the control loop only calls CollectRecommendations
  # (read-only: get/list/watch). These write verbs therefore remain dormant pending
  # the owner restart decision. Grant unchanged.
  - apiGroups: ["autoscaling.k8s.io"]
    resources:
      - verticalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── Node Optimizer: read node metrics, read PDB ────────────────────────────
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]

---
# ── ClusterRoleBinding ────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xamops-automation
  labels:
    app: xamops-automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xamops-automation
subjects:
  - kind: ServiceAccount
    name: xamops-automation
    namespace: xamops-system
---
# ── Role + RoleBinding — operation ledger (namespaced) ────────────────────────
# The rebalancer records each operation's live outcome in ConfigMap
# xamops-automation-state so an operation never runs twice (across cycles and
# restarts). DRY_RUN=true never writes it. get/update/patch are limited to that one
# ConfigMap; create cannot be restricted by resourceNames, so it is namespace-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xamops-automation-state
  namespace: xamops-system
  labels:
    app: xamops-automation
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames: ["xamops-automation-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["create"]
  # ── Leader election (FEAT-002 / agent-ha-design.md CHOICE B) ───────────────
  # A multi-replica Deployment runs exactly one active apply/drain loop by holding a
  # coordination.k8s.io Lease in this namespace. Namespaced only — no cluster-wide
  # grant. "list" is omitted deliberately (leaderelection only needs get/create/update/
  # watch on its single lease).
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "create", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xamops-automation-state
  namespace: xamops-system
  labels:
    app: xamops-automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xamops-automation-state
subjects:
  - kind: ServiceAccount
    name: xamops-automation
    namespace: xamops-system
---
# ── Secret — API credentials (edit before applying) ───────────────────────────
# Replace <BASE64_API_KEY> and <BASE64_SERVER_URL> with base64-encoded values:
#   echo -n 'your-api-key' | base64
#   echo -n 'https://your-xamops-backend.example.com' | base64
apiVersion: v1
kind: Secret
metadata:
  name: xamops-automation-secret
  namespace: xamops-system
  labels:
    app: xamops-automation
type: Opaque
data:
  XAMOPS_API_KEY: <BASE64_API_KEY>
  XAMOPS_SERVER_URL: <BASE64_SERVER_URL>

---
# ── ConfigMap — runtime tuning ────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: xamops-automation-config
  namespace: xamops-system
  labels:
    app: xamops-automation
data:
  # ── Safety: DRY_RUN=true means no cluster changes (just logs + pushes data)
  DRY_RUN: "true"

  # ── Tier 2 feature flags (all off by default — enable per-cluster in XamOps UI)
  # Node scale-in: candidates are nodes whose summed pod requests are under target.
  # Analyse-only unless the policy sets analyseOnly=false; any drain goes through the
  # shared executor: a global drain budget, a scheduler-fit plan that must prove the
  # set drainable, Eviction API only, new-UID replacements verified Running+Ready,
  # and on abort the node is restored (uncordoned if this autoscaler cordoned it).
  ENABLE_EVICTOR: "false"
  # Workload rightsizing: P80/P100 recommendations (patching also needs ENABLE_RIGHTSIZER_APPLY)
  ENABLE_RIGHTSIZER: "false"
  # Rightsizer apply: patches requests ONLY when this is "true" AND
  # workloadRightsizerPolicy.applyMode=immediate AND DRY_RUN=false.
  ENABLE_RIGHTSIZER_APPLY: "false"
  # Node rebalance: when XamOps sets rebalancer.status=running (and enabled), drain
  # on-demand nodes oldest-first through the shared executor; one run per operation
  # (rebalancer.operationId or a generation counter), recorded in the ledger ConfigMap.
  ENABLE_REBALANCER: "false"
  # HPA management: create/update/delete HPAs from XamOps UI recommendations
  ENABLE_HPA_MANAGER: "false"
  # VPA management: create VPA objects and collect VPA recommendations
  # Requires VPA CRD installed: helm install vpa fairwinds-stable/vpa
  ENABLE_VPA_MANAGER: "false"
  # Node optimizer: idle node detection, spot candidate analysis, spot interruption handling
  ENABLE_NODE_OPTIMIZER: "false"
  # Consolidation: drain + terminate under-utilised nodes (gated behind a verified
  # in-cycle drain; terminate is additionally gated on the consolidation-actions
  # readiness key). Ships inert — leave "false" until explicitly enabled.
  ENABLE_CONSOLIDATION: "false"

  # ── Leader election (FEAT-002 / agent-ha-design.md CHOICE B) ─────────────────
  # With replicas: 2 below, exactly one replica runs the apply/drain control loop at a
  # time (it holds the coordination.k8s.io Lease xamops-automation-leader); the standby
  # serves health + heartbeat + /metrics only. Never split-brain. Set to "false" only
  # for a single-replica dev deployment to run the loop directly.
  ENABLE_LEADER_ELECTION: "true"

  # ── Operator recovery lever (FEAT-002) ───────────────────────────────────────
  # RUN_MODE is normally unset. To recover a fenced fleet, run the agent image once
  # with RUN_MODE=uncordon-all: it uncordons every node this autoscaler cordoned
  # (annotation xamops.io/drain-cordoned-by=xamops-automation), clears the cordoned-by/
  # drain-state annotations, then exits. Honours DRY_RUN (simulate-only) and never
  # touches the agent's own node. Do NOT set it here; pass it as a one-shot override.

  # ── Polling & push intervals (seconds)
  POLICY_POLL_INTERVAL: "60"
  METRICS_PUSH_INTERVAL: "120"
  HEARTBEAT_INTERVAL: "60"

  # ── Prometheus endpoint (same cluster, monitoring namespace by default)
  PROMETHEUS_URL: "http://prometheus-server.monitoring.svc.cluster.local:9090"

  # ── Node drain timeout (seconds). 1200 = 20 minutes.
  DRAIN_TIMEOUT_SECONDS: "1200"

  # ── Cluster identity (must match values in XamOps backend)
  # Set CLUSTER_NAME and CLOUD_ACCOUNT_ID to match your registered cluster.
  # These are passed via env vars in the Deployment below.
  # CLUSTER_NAME: set in Deployment env
  # CLOUD_ACCOUNT_ID: set in Deployment env

---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xamops-automation
  namespace: xamops-system
  labels:
    app: xamops-automation
    app.kubernetes.io/component: automation
  annotations:
    # Rolling update — always drain old pod before replacing so both agents
    # are never in a split-brain write state simultaneously.
    deployment.kubernetes.io/revision: "1"
spec:
  # Two replicas with leader election (FEAT-002): exactly one holds the Lease and runs
  # the apply/drain loop; the other is a warm standby. maxUnavailable:0 below keeps the
  # leader serving during a rollout.
  replicas: 2
  selector:
    matchLabels:
      app: xamops-automation
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable:0 keeps 2/2 available throughout a rollout so the leader never
      # drops; maxSurge:2 lets both replacement pods come up in parallel on a pod-packed
      # cluster (the required hostname anti-affinity still pins one automation pod per
      # node) instead of serialising behind a single surge slot.
      maxUnavailable: 0
      maxSurge: 2
  template:
    metadata:
      labels:
        app: xamops-automation
        app.kubernetes.io/component: automation
      annotations:
        # Restart when ConfigMap changes (requires Reloader or manual rollout)
        checksum/config: "placeholder-update-on-deploy"
    spec:
      serviceAccountName: xamops-automation
      terminationGracePeriodSeconds: 60

      # ── Security context ───────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534

      containers:
        - name: automation
          # Published by CI (.github/workflows/ci-cd.yml: autoscaler-docker-push).
          # For production prefer pinning an immutable tag, e.g.
          # ghcr.io/xamops/xamops-autoscaler:sha-<commit>, instead of :latest.
          image: ghcr.io/xamops/xamops-autoscaler:latest
          imagePullPolicy: Always

          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            # Prometheus /metrics (FEAT-001 served this on :9090; FEAT-002 exposes it).
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # ── Liveness & readiness ─────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15

          # ── Environment — ConfigMap values ───────────────────────────────
          envFrom:
            - configMapRef:
                name: xamops-automation-config

          # ── Environment — Secrets + cluster identity ─────────────────────
          env:
            - name: XAMOPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xamops-automation-secret
                  key: XAMOPS_API_KEY

            - name: XAMOPS_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: xamops-automation-secret
                  key: XAMOPS_SERVER_URL

            # ── Set these to match your cluster registration in XamOps ─────
            - name: CLUSTER_NAME
              value: "my-eks-cluster"          # ← EDIT THIS

            - name: CLOUD_ACCOUNT_ID
              value: "123456789012"            # ← EDIT THIS (AWS account ID)
            # Own namespace: never drained, and home of the ledger ConfigMap
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Pod name — leader-election Lease identity (FEAT-002)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Node this agent runs on — never cordoned or drained (never-cordon/drain-self)
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # ── Resource limits ───────────────────────────────────────────────
          # BUG-001 / F-E6-3: the agent OOMKills at scale (~250 nodes / 5k pods) with the
          # old 256Mi limit — the informer caches for nodes/pods/deployments plus the
          # scheduler-fit plan grow with cluster size. Raised to request 512Mi / limit 1Gi
          # so the leader survives a full-cluster scale/soak without being OOMKilled.
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

          # ── Security ──────────────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # ── Topology (FEAT-002) ───────────────────────────────────────────────
      # REQUIRED: the two automation replicas must land on different nodes, so losing
      # one node never takes out both the leader and the standby at once.
      # PREFERRED: also keep off the xamops-agent's node when possible.
      affinity:
        # ── Spot avoidance (FEAT-005) ──────────────────────────────────────
        # The agent is the component that decides drains and ASG terminations, so it
        # must not itself ride a spot node that can be reclaimed mid-decision. REQUIRED
        # anti-affinity to spot capacity: schedule only where xamops.io/capacity is not
        # "spot" (on-demand pools, or nodes that simply do not carry the label).
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: xamops.io/capacity
                    operator: NotIn
                    values: ["spot"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: xamops-automation
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: xamops-agent
                topologyKey: kubernetes.io/hostname

      # ── Tolerations: run on any node, including tainted system nodes ──────
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists
        # Tolerate the unschedulable (cordon) taint (FEAT-002): without this a restart
        # while the agent's own node is cordon-fenced could never reschedule, deadlocking
        # recovery. The never-cordon/drain-self invariant stops the agent cordoning its
        # own node in the first place; this toleration covers externally-cordoned nodes.
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule

---
# ── NetworkPolicy ─────────────────────────────────────────────────────────────
# The autoscaler only needs:
#   EGRESS: XamOps backend (HTTPS), Prometheus (9090), k8s API server (443/6443)
# No INGRESS required (push-only architecture).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xamops-automation-netpol
  namespace: xamops-system
  labels:
    app: xamops-automation
spec:
  podSelector:
    matchLabels:
      app: xamops-automation
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Health probe from kubelet (node-local)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8081

  egress:
    # XamOps backend — HTTPS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API server — in-cluster (varies by provider)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443

    # Prometheus — monitoring namespace
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9090

    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # EKS Pod Identity Agent — credential endpoint (link-local, IPv4 + IPv6)
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
        - ipBlock:
            cidr: fd00:ec2::23/128
      ports:
        - protocol: TCP
          port: 80

---
# ── PodDisruptionBudget — protect the autoscaler itself ──────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: xamops-automation-pdb
  namespace: xamops-system
  labels:
    app: xamops-automation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: xamops-automation
