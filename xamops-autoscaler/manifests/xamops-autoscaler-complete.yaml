# ═══════════════════════════════════════════════════════════════════════════════
# XamOps Autoscaler — Complete Kubernetes Manifest
#
# Deploys xamops-autoscaler into the xamops-system namespace (same as
# xamops-agent). The autoscaler has READ+WRITE cluster access to:
#   - Evict pods (bin-packing / scale-in)
#   - Cordon & uncordon nodes
#   - Patch Deployment/StatefulSet resource requests (rightsizing)
#   - Read PodDisruptionBudgets before eviction
#
# IMPORTANT DEFAULTS (DRY_RUN=true — no cluster changes until explicitly enabled)
# ═══════════════════════════════════════════════════════════════════════════════
---
# ── Namespace (shared with xamops-agent) ──────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: xamops-system
  labels:
    app.kubernetes.io/managed-by: xamops

---
# ── ServiceAccount ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xamops-autoscaler
  namespace: xamops-system
  labels:
    app: xamops-autoscaler
    app.kubernetes.io/component: autoscaler

---
# ── ClusterRole — Write RBAC ──────────────────────────────────────────────────
# Separate from xamops-agent's read-only ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xamops-autoscaler
  labels:
    app: xamops-autoscaler
rules:
  # ── Read access (needed to make safe decisions) ──────────────────────────
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
      - replicationcontrollers
      - services
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]

  # ── Write access (core autoscaling actions) ────────────────────────────────
  # Cordon / uncordon nodes
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["patch", "update"]

  # Evict pods (bin-packing / scale-in)
  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs: ["create"]

  # Delete pods (fallback drain path when eviction blocked)
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["delete"]

  # Patch Deployment resource requests (rightsizer)
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["patch", "update"]

  # Patch StatefulSet resource requests (rightsizer, when protectStatefulSets=false)
  - apiGroups: ["apps"]
    resources:
      - statefulsets
    verbs: ["patch", "update"]

  # Events — write autoscaler events into the cluster
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch", "update"]

---
# ── ClusterRoleBinding ────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xamops-autoscaler
  labels:
    app: xamops-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xamops-autoscaler
subjects:
  - kind: ServiceAccount
    name: xamops-autoscaler
    namespace: xamops-system

---
# ── Secret — API credentials (edit before applying) ───────────────────────────
# Replace <BASE64_API_KEY> and <BASE64_SERVER_URL> with base64-encoded values:
#   echo -n 'your-api-key' | base64
#   echo -n 'https://your-xamops-backend.example.com' | base64
apiVersion: v1
kind: Secret
metadata:
  name: xamops-autoscaler-secret
  namespace: xamops-system
  labels:
    app: xamops-autoscaler
type: Opaque
data:
  XAMOPS_API_KEY: <BASE64_API_KEY>
  XAMOPS_SERVER_URL: <BASE64_SERVER_URL>

---
# ── ConfigMap — runtime tuning ────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: xamops-autoscaler-config
  namespace: xamops-system
  labels:
    app: xamops-autoscaler
data:
  # ── Safety: DRY_RUN=true means no cluster changes (just logs + pushes data)
  DRY_RUN: "true"

  # ── Feature flags (all off by default — enable per-cluster in XamOps UI)
  ENABLE_EVICTOR: "false"
  ENABLE_RIGHTSIZER: "false"
  ENABLE_REBALANCER: "false"

  # ── Polling & push intervals (seconds)
  POLICY_POLL_INTERVAL: "60"
  METRICS_PUSH_INTERVAL: "120"
  HEARTBEAT_INTERVAL: "60"

  # ── Prometheus endpoint (same cluster, monitoring namespace by default)
  PROMETHEUS_URL: "http://prometheus-server.monitoring.svc.cluster.local:9090"

  # ── Node drain timeout (seconds). 1200 = 20 minutes.
  DRAIN_TIMEOUT_SECONDS: "1200"

  # ── Cluster identity (must match values in XamOps backend)
  # Set CLUSTER_NAME and CLOUD_ACCOUNT_ID to match your registered cluster.
  # These are passed via env vars in the Deployment below.
  # CLUSTER_NAME: set in Deployment env
  # CLOUD_ACCOUNT_ID: set in Deployment env

---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xamops-autoscaler
  namespace: xamops-system
  labels:
    app: xamops-autoscaler
    app.kubernetes.io/component: autoscaler
  annotations:
    # Rolling update — always drain old pod before replacing so both agents
    # are never in a split-brain write state simultaneously.
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xamops-autoscaler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: xamops-autoscaler
        app.kubernetes.io/component: autoscaler
      annotations:
        # Restart when ConfigMap changes (requires Reloader or manual rollout)
        checksum/config: "placeholder-update-on-deploy"
    spec:
      serviceAccountName: xamops-autoscaler
      terminationGracePeriodSeconds: 60

      # ── Security context ───────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534

      containers:
        - name: autoscaler
          # Replace with your actual image once built:
          #   docker build -t <registry>/xamops-autoscaler:latest ./xamops-autoscaler
          #   docker push <registry>/xamops-autoscaler:latest
          image: xamops/autoscaler:latest
          imagePullPolicy: Always

          ports:
            - name: health
              containerPort: 8081
              protocol: TCP

          # ── Liveness & readiness ─────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15

          # ── Environment — ConfigMap values ───────────────────────────────
          envFrom:
            - configMapRef:
                name: xamops-autoscaler-config

          # ── Environment — Secrets + cluster identity ─────────────────────
          env:
            - name: XAMOPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xamops-autoscaler-secret
                  key: XAMOPS_API_KEY

            - name: XAMOPS_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: xamops-autoscaler-secret
                  key: XAMOPS_SERVER_URL

            # ── Set these to match your cluster registration in XamOps ─────
            - name: CLUSTER_NAME
              value: "my-eks-cluster"          # ← EDIT THIS

            - name: CLOUD_ACCOUNT_ID
              value: "123456789012"            # ← EDIT THIS (AWS account ID)

          # ── Resource limits ───────────────────────────────────────────────
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # ── Security ──────────────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # ── Topology: prefer a different node from xamops-agent ───────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: xamops-agent
                topologyKey: kubernetes.io/hostname

      # ── Tolerations: run on any node, including tainted system nodes ──────
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists

---
# ── NetworkPolicy ─────────────────────────────────────────────────────────────
# The autoscaler only needs:
#   EGRESS: XamOps backend (HTTPS), Prometheus (9090), k8s API server (443/6443)
# No INGRESS required (push-only architecture).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xamops-autoscaler-netpol
  namespace: xamops-system
  labels:
    app: xamops-autoscaler
spec:
  podSelector:
    matchLabels:
      app: xamops-autoscaler
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Health probe from kubelet (node-local)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8081

  egress:
    # XamOps backend — HTTPS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API server — in-cluster (varies by provider)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443

    # Prometheus — monitoring namespace
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9090

    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# ── PodDisruptionBudget — protect the autoscaler itself ──────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: xamops-autoscaler-pdb
  namespace: xamops-system
  labels:
    app: xamops-autoscaler
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: xamops-autoscaler
