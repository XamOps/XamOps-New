name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: sqa_5f8eb43e239a79b840fbe5548bd0dd53e973c6a7
          SONAR_HOST_URL: http://13.232.39.166:9000
        with:
          args: >
            -Dsonar.projectKey=Sonarqube-xamops
            -Dsonar.projectName=Sonarqube-xamops
            -Dsonar.sources=.
