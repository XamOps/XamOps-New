
name: Multi Service CI/CD

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:

  # =========================================================
  # Detect Changed Services
  # =========================================================
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      billops: ${{ steps.filter.outputs.billops }}
      xamops_service: ${{ steps.filter.outputs.xamops_service }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Detect File Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |

            frontend:
              - 'frontend-app/**'

            billops:
              - 'billops/**'

            xamops_service:
              - 'xamops-service/**'


  # =========================================================
  # FRONTEND APP
  # =========================================================
  frontend-app:
    name: Frontend App - Build & Deploy
    runs-on: ubuntu-latest

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.frontend == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.SSH_TOKEN }}" | \
          docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ghcr.io/xamops/frontend-app:latest \
            -t ghcr.io/xamops/frontend-app:sha-${{ github.sha }} \
            ./frontend-app

      - name: Push Frontend Docker Image
        run: |
          docker push ghcr.io/xamops/frontend-app:latest
          docker push ghcr.io/xamops/frontend-app:sha-${{ github.sha }}

      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/bastion_key
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/uat_key

          chmod 600 ~/.ssh/bastion_key
          chmod 600 ~/.ssh/uat_key

          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy Frontend App
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o "ProxyCommand=ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -W %h:%p ec2-user@${{ secrets.BASTION_HOST }}" \
            -i ~/.ssh/uat_key \
            ec2-user@${{ secrets.SSH_HOST }} << 'ENDSSH'

            echo "${{ secrets.SSH_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/xamops/frontend-app:latest

            docker network inspect xamops-network >/dev/null 2>&1 || \
            docker network create xamops-network

            docker stop frontend-app 2>/dev/null || true
            docker rm frontend-app 2>/dev/null || true

            docker run -d \
              --name frontend-app \
              --restart unless-stopped \
              --network xamops-network \
              -p 3000:3000 \
              ghcr.io/xamops/frontend-app:latest

            sleep 15

            if docker ps --filter "name=frontend-app" \
              --filter "status=running" | grep -q frontend-app; then

              echo "✅ frontend-app is running"

            else

              echo "❌ frontend-app failed"

              docker logs --tail=50 frontend-app

              exit 1

            fi

            docker image prune -f

          ENDSSH


  # =========================================================
  # BILLOPS SERVICE
  # =========================================================
  billops:
    name: BillOps - Build & Deploy
    runs-on: ubuntu-latest

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.billops == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build BillOps Jar
        run: |
          mvn -pl billops clean package \
          -DskipTests \
          --no-transfer-progress

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.SSH_TOKEN }}" | \
          docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build BillOps Docker Image
        run: |
          docker build \
            -t ghcr.io/xamops/billops:latest \
            -t ghcr.io/xamops/billops:sha-${{ github.sha }} \
            ./billops

      - name: Push BillOps Docker Image
        run: |
          docker push ghcr.io/xamops/billops:latest
          docker push ghcr.io/xamops/billops:sha-${{ github.sha }}

      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/bastion_key
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/uat_key

          chmod 600 ~/.ssh/bastion_key
          chmod 600 ~/.ssh/uat_key

          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy BillOps
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o "ProxyCommand=ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -W %h:%p ec2-user@${{ secrets.BASTION_HOST }}" \
            -i ~/.ssh/uat_key \
            ec2-user@${{ secrets.SSH_HOST }} << 'ENDSSH'

            echo "${{ secrets.SSH_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/xamops/billops:latest

            docker network inspect xamops-network >/dev/null 2>&1 || \
            docker network create xamops-network

            docker stop billops 2>/dev/null || true
            docker rm billops 2>/dev/null || true

            docker run -d \
              --name billops \
              --restart unless-stopped \
              --network xamops-network \
              --memory=2g \
              --memory-swap=2g \
              -p 8081:8081 \
              -e SPRING_PROFILES_ACTIVE=uat \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://10.30.21.26:5432/xamops_db_uat \
              -e EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://service-registry:8761/eureka/ \
              -e SPRING_FLYWAY_OUT_OF_ORDER=true \
              ghcr.io/xamops/billops:latest

            sleep 20

            if docker ps --filter "name=billops" \
              --filter "status=running" | grep -q billops; then

              echo "✅ billops is running"

            else

              echo "❌ billops failed"

              docker logs --tail=50 billops

              exit 1

            fi

            docker image prune -f

          ENDSSH


  # =========================================================
  # XAMOPS SERVICE
  # =========================================================
  xamops-service:
    name: XamOps Service - Build & Deploy
    runs-on: ubuntu-latest

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.xamops_service == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build XamOps Jar
        run: |
          mvn -pl xamops-service clean package \
          -DskipTests \
          --no-transfer-progress

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.SSH_TOKEN }}" | \
          docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build XamOps Docker Image
        run: |
          docker build \
            -t ghcr.io/xamops/xamops-service:latest \
            -t ghcr.io/xamops/xamops-service:sha-${{ github.sha }} \
            ./xamops-service

      - name: Push XamOps Docker Image
        run: |
          docker push ghcr.io/xamops/xamops-service:latest
          docker push ghcr.io/xamops/xamops-service:sha-${{ github.sha }}

      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/bastion_key
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/uat_key

          chmod 600 ~/.ssh/bastion_key
          chmod 600 ~/.ssh/uat_key

          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy XamOps Service
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o "ProxyCommand=ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -W %h:%p ec2-user@${{ secrets.BASTION_HOST }}" \
            -i ~/.ssh/uat_key \
            ec2-user@${{ secrets.SSH_HOST }} << 'ENDSSH'

            echo "${{ secrets.SSH_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/xamops/xamops-service:latest

            docker network inspect xamops-network >/dev/null 2>&1 || \
            docker network create xamops-network

            docker stop xamops-service 2>/dev/null || true
            docker rm xamops-service 2>/dev/null || true

            docker run -d \
              --name xamops-service \
              --restart unless-stopped \
              --network xamops-network \
              --memory=2g \
              --memory-swap=2g \
              -p 9090:9090 \
              -e SPRING_PROFILES_ACTIVE=uat \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://10.30.21.26:5432/xamops_db_uat \
              -e EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://service-registry:8761/eureka/ \
              -e SPRING_FLYWAY_OUT_OF_ORDER=true \
              -e MANAGEMENT_SERVER_PORT=9090 \
              -e MANAGEMENT_HEALTH_DB_ENABLED=false \
              -e MANAGEMENT_HEALTH_REDIS_ENABLED=false \
              -e "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,metrics,info" \
              -e MANAGEMENT_ENDPOINT_METRICS_ENABLED=true \
              ghcr.io/xamops/xamops-service:latest

            sleep 20

            if docker ps --filter "name=xamops-service" \
              --filter "status=running" | grep -q xamops-service; then

              echo "✅ xamops-service is running"

            else

              echo "❌ xamops-service failed"

              docker logs --tail=50 xamops-service

              exit 1

            fi

            docker image prune -f

          ENDSSH
```
