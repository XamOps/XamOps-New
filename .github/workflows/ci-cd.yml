name: CI/CD Pipeline – xamops-service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: XamOps/XamOps-New

permissions:
  contents: read
  packages: write

jobs:

  # ────────────────────────────────────────────
  #  JOB 1 – Build & Test
  # ────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test -B --no-transfer-progress
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # ────────────────────────────────────────────
  #  JOB 2 – Build & Push Docker Image
  # ────────────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build .jar
        run: mvn package -B -DskipTests --no-transfer-progress

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.SSH_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/xamops/xamops-new:latest \
            -t ghcr.io/xamops/xamops-new:sha-${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/xamops/xamops-new:latest
          docker push ghcr.io/xamops/xamops-new:sha-${{ github.sha }}

  # ────────────────────────────────────────────
  #  JOB 3 – Deploy to UAT
  # ────────────────────────────────────────────
  deploy:
    name: Deploy to UAT Server
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment: uat

    steps:
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write bastion key
          cat << 'SSHKEY' > ~/.ssh/bastion_key
          ${{ secrets.BASTION_SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/bastion_key

          # Write UAT key
          cat << 'SSHKEY' > ~/.ssh/uat_key
          ${{ secrets.SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/uat_key

          # SSH global config
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

          echo "✅ SSH keys configured!"

      - name: Test Bastion Connection
        run: |
          ssh -i ~/.ssh/bastion_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ec2-user@${{ secrets.BASTION_HOST }} \
              "echo '✅ Bastion connected!'"

      - name: Deploy via Bastion
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o "ProxyCommand=ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -W %h:%p ec2-user@${{ secrets.BASTION_HOST }}" \
            -i ~/.ssh/uat_key \
            ec2-user@${{ secrets.SSH_HOST }} << 'ENDSSH'

            echo "${{ secrets.SSH_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/xamops/xamops-new:latest

            docker network inspect xamops-network >/dev/null 2>&1 || \
              docker network create xamops-network

            docker stop xamops-service 2>/dev/null || true
            docker rm   xamops-service 2>/dev/null || true

            docker run -d \
              --name xamops-service \
              --restart unless-stopped \
              --network xamops-network \
              --memory=2g \
              --memory-swap=2g \
              -p 9090:9090 \
              -e SPRING_PROFILES_ACTIVE=uat \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://10.30.21.26:5432/xamops_db_uat \
              -e EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://service-registry:8761/eureka/ \
              -e SPRING_FLYWAY_OUT_OF_ORDER=true \
              -e MANAGEMENT_SERVER_PORT=9090 \
              -e MANAGEMENT_HEALTH_DB_ENABLED=false \
              -e MANAGEMENT_HEALTH_REDIS_ENABLED=false \
              -e "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,metrics,info" \
              -e MANAGEMENT_ENDPOINT_METRICS_ENABLED=true \
              ghcr.io/xamops/xamops-new:latest

            sleep 20

            if docker ps --filter "name=xamops-service" \
              --filter "status=running" | grep -q xamops-service; then
              echo "✅ xamops-service is running"
              docker ps --filter "name=xamops-service"
            else
              echo "❌ Failed to start"
              docker logs --tail=50 xamops-service
              exit 1
            fi

            docker image prune -f
            echo "🚀 Deployment complete!"

          ENDSSH
