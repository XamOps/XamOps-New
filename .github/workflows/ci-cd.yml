name: CI/CD Pipeline – xamops-service
 
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
 
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: XamOps/XamOps-New
 
jobs:
  # ────────────────────────────────────────────
  #  JOB 1 – Build & Test
  # ────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
 
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
 
      - name: Run tests
        run: mvn clean verify -B -DskipTests 
 
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
 
  # ────────────────────────────────────────────
  #  JOB 2 – Build & Push Docker Image
  # ────────────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
 
    permissions:
      contents: read
      packages: write
 
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
 
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
 
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.gr_token }}
 
      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  # ────────────────────────────────────────────
  #  JOB 3 – Deploy to UAT
  # ────────────────────────────────────────────
  deploy:
    name: Deploy to UAT Server
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
 
    environment: uat
 
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # ── Authenticate & pull latest image ──────────────────────────
            echo "${{ secrets.gh_token }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
 
            docker pull ghcr.io/${{ github.repository }}:latest
 
            # ── Ensure the Docker network exists ──────────────────────────
            docker network inspect xamops-network >/dev/null 2>&1 || \
              docker network create xamops-network
 
            # ── Stop & remove old container ───────────────────────────────
            docker stop xamops-service || true
            docker rm   xamops-service || true
 
            # ── Start new container ───────────────────────────────────────
            docker run -d \
              --name xamops-service \
              --restart unless-stopped \
              --network xamops-network \
              --memory=2g \
              --memory-swap=2g \
              -p 9090:9090 \
              -e SPRING_PROFILES_ACTIVE=uat \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://10.30.21.26:5432/xamops_db_uat \
              -e EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://service-registry:8761/eureka/ \
              -e SPRING_FLYWAY_OUT_OF_ORDER=true \
              -e MANAGEMENT_SERVER_PORT=9090 \
              -e MANAGEMENT_HEALTH_DB_ENABLED=false \
              -e MANAGEMENT_HEALTH_REDIS_ENABLED=false \
              -e "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,metrics,info" \
              -e MANAGEMENT_ENDPOINT_METRICS_ENABLED=true \
              ghcr.io/${{ github.repository }}:latest
 
            # ── Health check ──────────────────────────────────────────────
            echo "⏳ Waiting for container to start..."
            sleep 15
 
            if docker ps --filter "name=xamops-service" --filter "status=running" | grep -q xamops-service; then
              echo "✅ xamops-service is running"
              docker ps --filter "name=xamops-service"
            
        
