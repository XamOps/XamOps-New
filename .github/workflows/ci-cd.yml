name: CI/CD Pipeline – XamOps Monorepo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:

  # ────────────────────────────────────────────
  #  JOB 0 – Detect which services changed (native git diff)
  # ────────────────────────────────────────────
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      billops:    ${{ steps.diff.outputs.billops }}
      xamops:     ${{ steps.diff.outputs.xamops }}
      frontend:   ${{ steps.diff.outputs.frontend }}
      media-ops:  ${{ steps.diff.outputs.media-ops }}
      agent:      ${{ steps.diff.outputs.agent }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services via git diff
        id: diff
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git hash-object -t tree /dev/null)
          fi

          echo "Comparing $BASE → ${{ github.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          # A change to this workflow changes how every service is built and deployed,
          # so treat it as touching all of them. Without this, an edit to the deploy or
          # readiness logic can only be exercised by piggy-backing on an unrelated
          # source change -- which is how a health check that never actually checked
          # health survived for as long as it did.
          if echo "$CHANGED" | grep -q "^\.github/workflows/"; then
            echo "CI workflow changed -> treating all services as changed"
            CHANGED=$(printf '%s\nbillops/\nxamops-service/\nfrontend-app/\nmedia-ops-service/\nxamops-agent/\n' "$CHANGED")
          fi

          if echo "$CHANGED" | grep -q "^billops/"; then
            echo "billops=true" >> $GITHUB_OUTPUT
          else
            echo "billops=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q "^xamops-service/"; then
            echo "xamops=true" >> $GITHUB_OUTPUT
          else
            echo "xamops=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q "^frontend-app/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q "^media-ops-service/"; then
            echo "media-ops=true" >> $GITHUB_OUTPUT
          else
            echo "media-ops=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q "^xamops-agent/"; then
            echo "agent=true" >> $GITHUB_OUTPUT
          else
            echo "agent=false" >> $GITHUB_OUTPUT
          fi


  # ══════════════════════════════════════════════════════════
  #  BILLOPS
  # ══════════════════════════════════════════════════════════

  billops-build-test:
    name: "[billops] Build & Test"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.billops == 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test -B --no-transfer-progress -pl billops -am

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billops-test-reports
          path: billops/target/surefire-reports/
          if-no-files-found: ignore

  billops-docker-push:
    name: "[billops] Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: [changes, billops-build-test]
    if: |
      needs.changes.outputs.billops == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build .jar from repo root (parent POM resolves)
        run: mvn package -B -DskipTests --no-transfer-progress -pl billops -am

      - name: Copy pre-built jar into billops folder
        run: cp billops/target/*.jar billops/app.jar

      - name: Patch billops Dockerfile (strip build stage, use pre-built jar)
        run: |
          python3 - <<'PYEOF'
          import re
          with open("billops/Dockerfile", "r") as f:
              lines = f.readlines()
          last_from_idx = 0
          for i, line in enumerate(lines):
              if line.strip().upper().startswith("FROM"):
                  last_from_idx = i
          runtime_lines = lines[last_from_idx:]
          patched = []
          for line in runtime_lines:
              stripped = line.strip()
              if re.search(r"RUN\s+mvn", stripped):
                  print("REMOVED: " + stripped)
                  continue
              if re.search(r"COPY\s+--from=", stripped):
                  print("REPLACED: " + stripped)
                  patched.append("COPY app.jar app.jar\n")
                  continue
              line = re.sub(r"COPY\s+target/\*\.jar\s+\S+", "COPY app.jar app.jar", line)
              line = re.sub(r"COPY\s+\*\.jar\s+\S+", "COPY app.jar app.jar", line)
              patched.append(line)
          with open("billops/Dockerfile", "w") as f:
              f.writelines(patched)
          print("\nFinal Dockerfile:")
          print("".join(patched))
          PYEOF

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        run: |
          docker buildx build \
            --no-cache \
            --provenance=false \
            -t ghcr.io/xamops/billops:latest \
            -t ghcr.io/xamops/billops:sha-${{ github.sha }} \
            --push \
            ./billops

  billops-deploy:
    name: "[billops] Deploy to UAT"
    runs-on: ubuntu-latest
    needs: [changes, billops-docker-push]
    if: |
      needs.changes.outputs.billops == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: uat
    steps:
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat << 'SSHKEY' > ~/.ssh/bastion_key
          ${{ secrets.BASTION_SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/bastion_key
          cat << 'SSHKEY' > ~/.ssh/uat_key
          ${{ secrets.SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/uat_key
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config
          echo "✅ SSH keys configured!"

      - name: Test Bastion Connection
        run: |
          ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ec2-user@${{ secrets.BASTION_HOST }} "echo '✅ Bastion connected!'"

      - name: Deploy billops via Bastion
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o "ProxyCommand=ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -W %h:%p ec2-user@${{ secrets.BASTION_HOST }}" \
            -i ~/.ssh/uat_key \
            ec2-user@${{ secrets.SSH_HOST }} << 'ENDSSH'

            echo "🔄 Deploying billops..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/xamops/billops:latest

            docker network inspect xamops-network >/dev/null 2>&1 || docker network create xamops-network

            docker stop billops-service 2>/dev/null || true
            docker rm   billops-service 2>/dev/null || true

            docker run -d \
              --name billops-service \
              --restart unless-stopped \
              --network xamops-network \
              --memory=2g --memory-swap=2g \
              -p 8082:8082 \
              -e SPRING_PROFILES_ACTIVE=uat \
              -e APP_IMPERSONATION_SECRET_KEY=${{ secrets.APP_IMPERSONATION_SECRET_KEY }} \
              -e APP_ENCRYPTION_SECRET_KEY=${{ secrets.APP_ENCRYPTION_SECRET_KEY }} \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://10.30.21.26:5432/xamops_db_uat \
              -e EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://service-registry:8761/eureka/ \
              -e SPRING_FLYWAY_OUT_OF_ORDER=true \
              -e MANAGEMENT_HEALTH_DB_ENABLED=false \
              -e MANAGEMENT_HEALTH_REDIS_ENABLED=false \
              -e "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,metrics,info" \
              ghcr.io/xamops/billops:latest

            # A crash-looping container passes "docker ps --status running": with
            # --restart unless-stopped it is up again moments after each exit, so the
            # old 20s snapshot reported success while nothing was ever serving. Poll
            # actual readiness instead, and always show logs on failure.
            # Probed from the host against the published port, not inside the container:
            # the JRE base image ships neither curl nor wget, so an in-container probe
            # can never succeed. Any HTTP status counts as ready, including 401 -- the
            # actuator sits behind Spring Security, so a 401 still proves the app is
            # bound and running its filter chain. Only 000 (connection refused) means
            # nothing is listening.
            echo "⏳ waiting for billops-service to become ready..."
            ready=0
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://localhost:8082/actuator/health 2>/dev/null || echo 000)
              if [ "$code" != "000" ]; then
                echo "billops-service responding (HTTP $code)"
                ready=1; break
              fi
              # Detect a container that is restarting rather than merely slow to boot.
              restarts=$(docker inspect -f '{{.RestartCount}}' billops-service 2>/dev/null || echo 0)
              if [ "${restarts:-0}" -ge 3 ]; then
                echo "❌ billops-service is crash-looping (${restarts} restarts)"
                break
              fi
              sleep 10
            done

            if [ "$ready" = "1" ]; then
              echo "✅ billops-service is up and healthy"
              docker ps --filter "name=billops-service"
            else
              echo "❌ billops-service failed to become ready"
              echo "─── restart count: $(docker inspect -f '{{.RestartCount}}' billops-service 2>/dev/null) ───"
              echo "─── last 120 log lines ───"
              docker logs --tail=120 billops-service 2>&1 || true
              exit 1
            fi

            docker image prune -f
            echo "🚀 billops deployment complete!"
          ENDSSH


  # ══════════════════════════════════════════════════════════
  #  XAMOPS-SERVICE
  # ══════════════════════════════════════════════════════════

  xamops-build-test:
    name: "[xamops-service] Build & Test"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.xamops == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Reject duplicate Flyway migration versions
        run: |
          # Two migrations sharing a version makes Flyway throw at validate time, before it
          # applies anything -- so the application does not start at all. That is a total
          # outage, not a partial one, and it is only discovered on deploy because nothing
          # here checked for it. This has already happened twice: once fixed by hand in
          # "fix(migration): resolve duplicate", and again when three separate versions
          # collided at once and UAT would not boot.
          #
          # Cheap to catch: the version is everything between the leading V and the '__'.
          DIR=xamops-service/src/main/resources/db/migration
          DUPES=$(ls "$DIR" | sed -nE 's/^V([0-9_.]+)__.*\.sql$/\1/p' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate Flyway migration versions found. Flyway refuses to start with these."
            for v in $DUPES; do
              echo "  version $v is claimed by:"
              ls "$DIR" | grep -E "^V${v}__" | sed 's/^/    /'
            done
            echo ""
            echo "Renumber whichever file has NOT been applied to a live database yet."
            echo "Renaming an already-applied migration makes Flyway see it as missing."
            exit 1
          fi
          echo "ok  no duplicate migration versions"

      - name: Run tests
        run: mvn test -B --no-transfer-progress -pl xamops-service -am

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xamops-test-reports
          path: xamops-service/target/surefire-reports/
          if-no-files-found: ignore

  xamops-docker-push:
    name: "[xamops-service] Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: [changes, xamops-build-test]
    if: |
      needs.changes.outputs.xamops == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build .jar from repo root (parent POM resolves)
        run: mvn package -B -DskipTests --no-transfer-progress -pl xamops-service -am

      - name: Copy pre-built jar into xamops-service folder
        run: cp xamops-service/target/*.jar xamops-service/app.jar

      - name: Patch xamops-service Dockerfile (strip build stage, use pre-built jar)
        run: |
          python3 - <<'PYEOF'
          import re
          with open("xamops-service/Dockerfile", "r") as f:
              lines = f.readlines()
          last_from_idx = 0
          for i, line in enumerate(lines):
              if line.strip().upper().startswith("FROM"):
                  last_from_idx = i
          runtime_lines = lines[last_from_idx:]
          patched = []
          for line in runtime_lines:
              stripped = line.strip()
              if re.search(r"RUN\s+mvn", stripped):
                  print("REMOVED: " + stripped)
                  continue
              if re.search(r"COPY\s+--from=", stripped):
                  print("REPLACED: " + stripped)
                  patched.append("COPY app.jar app.jar\n")
                  continue
              line = re.sub(r"COPY\s+target/\*\.jar\s+\S+", "COPY app.jar app.jar", line)
              line = re.sub(r"COPY\s+\*\.jar\s+\S+", "COPY app.jar app.jar", line)
              patched.append(line)
          with open("xamops-service/Dockerfile", "w") as f:
              f.writelines(patched)
          print("\nFinal Dockerfile:")
          print("".join(patched))
          PYEOF

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        run: |
          docker buildx build \
            --no-cache \
            --provenance=false \
            -t ghcr.io/xamops/xamops-new:latest \
            -t ghcr.io/xamops/xamops-new:sha-${{ github.sha }} \
            --push \
            ./xamops-service

  xamops-deploy:
    name: "[xamops-service] Deploy to UAT"
    runs-on: ubuntu-latest
    needs: [changes, xamops-docker-push]
    if: |
      needs.changes.outputs.xamops == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: uat
    steps:
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat << 'SSHKEY' > ~/.ssh/bastion_key
          ${{ secrets.BASTION_SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/bastion_key
          cat << 'SSHKEY' > ~/.ssh/uat_key
          ${{ secrets.SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/uat_key
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config
          echo "✅ SSH keys configured!"

      - name: Test Bastion Connection
        run: |
          ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ec2-user@${{ secrets.BASTION_HOST }} "echo '✅ Bastion connected!'"

      - name: Deploy xamops-service via Bastion
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o "ProxyCommand=ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -W %h:%p ec2-user@${{ secrets.BASTION_HOST }}" \
            -i ~/.ssh/uat_key \
            ec2-user@${{ secrets.SSH_HOST }} << 'ENDSSH'

            echo "🔄 Deploying xamops-service..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/xamops/xamops-new:latest

            docker network inspect xamops-network >/dev/null 2>&1 || docker network create xamops-network

            docker stop xamops-service 2>/dev/null || true
            docker rm   xamops-service 2>/dev/null || true

            docker run -d \
              --name xamops-service \
              --restart unless-stopped \
              --network xamops-network \
              --memory=4g --memory-swap=4g \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=uat \
              -e APP_IMPERSONATION_SECRET_KEY=${{ secrets.APP_IMPERSONATION_SECRET_KEY }} \
              -e APP_ENCRYPTION_SECRET_KEY=${{ secrets.APP_ENCRYPTION_SECRET_KEY }} \
              -e APP_REMEMBER_ME_KEY=${{ secrets.APP_REMEMBER_ME_KEY }} \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://10.30.21.26:5432/xamops_db_uat \
              -e EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://service-registry:8761/eureka/ \
              -e SPRING_FLYWAY_OUT_OF_ORDER=true \
              -e UPWIND_SYNC_ENABLED=true \
              -e MANAGEMENT_SERVER_PORT=8080 \
              -e MANAGEMENT_HEALTH_DB_ENABLED=false \
              -e MANAGEMENT_HEALTH_REDIS_ENABLED=false \
              -e "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,metrics,info" \
              -e MANAGEMENT_ENDPOINT_METRICS_ENABLED=true \
              -e LIVEKIT_URL=wss://uat.xamops.com/livekit \
              -e LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }} \
              -e LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }} \
              -e CALLS_WS_TOKEN_SECRET=${{ secrets.CALLS_WS_TOKEN_SECRET }} \
              ghcr.io/xamops/xamops-new:latest

            # Same false-green problem as billops: --restart unless-stopped means a
            # crash-looping container is "running" whenever the snapshot happens to land
            # between restarts. Poll readiness and dump logs on failure instead.
            # Host-side probe for the same reasons as billops: no curl/wget in the JRE
            # image, and a 401 from the security-protected actuator still proves the app
            # is up. 000 means nothing is listening.
            echo "⏳ waiting for xamops-service to become ready..."
            ready=0
            for i in $(seq 1 42); do
              code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://localhost:8080/actuator/health 2>/dev/null || echo 000)
              if [ "$code" != "000" ]; then
                echo "xamops-service responding (HTTP $code)"
                ready=1; break
              fi
              restarts=$(docker inspect -f '{{.RestartCount}}' xamops-service 2>/dev/null || echo 0)
              if [ "${restarts:-0}" -ge 3 ]; then
                echo "❌ xamops-service is crash-looping (${restarts} restarts)"
                break
              fi
              sleep 10
            done

            if [ "$ready" = "1" ]; then
              echo "✅ xamops-service is up and healthy"
              docker ps --filter "name=xamops-service"
            else
              echo "❌ xamops-service failed to become ready"
              echo "─── restart count: $(docker inspect -f '{{.RestartCount}}' xamops-service 2>/dev/null) ───"
              echo "─── last 120 log lines ───"
              docker logs --tail=120 xamops-service 2>&1 || true
              exit 1
            fi

            docker image prune -f
            echo "🚀 xamops-service deployment complete!"
          ENDSSH


  # ══════════════════════════════════════════════════════════
  #  FRONTEND-APP
  # ══════════════════════════════════════════════════════════

  frontend-build-test:
    name: "[frontend-app] Build & Test"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend-app
        run: npm install

      - name: Run tests
        working-directory: frontend-app
        run: npm test
        continue-on-error: false

  frontend-docker-push:
    name: "[frontend-app] Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: [changes, frontend-build-test]
    if: |
      needs.changes.outputs.frontend == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend-app
        run: npm install

      - name: Build React app
        working-directory: frontend-app
        run: npx vite build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Patch Dockerfile to skip tsc
        working-directory: frontend-app
        run: sed -i 's/RUN npm run build/RUN npx vite build/g' Dockerfile

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        run: |
          docker buildx build \
            --no-cache \
            --provenance=false \
            --build-arg DISABLE_ESLINT_PLUGIN=true \
            -t ghcr.io/xamops/frontend-app:latest \
            -t ghcr.io/xamops/frontend-app:sha-${{ github.sha }} \
            --push \
            ./frontend-app

  frontend-deploy:
    name: "[frontend-app] Deploy to UAT"
    runs-on: ubuntu-latest
    needs: [changes, frontend-docker-push]
    if: |
      needs.changes.outputs.frontend == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: uat
    steps:
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat << 'SSHKEY' > ~/.ssh/bastion_key
          ${{ secrets.BASTION_SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/bastion_key
          cat << 'SSHKEY' > ~/.ssh/uat_key
          ${{ secrets.SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/uat_key
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config
          echo "✅ SSH keys configured!"

      - name: Test Bastion Connection
        run: |
          ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ec2-user@${{ secrets.BASTION_HOST }} "echo '✅ Bastion connected!'"

      - name: Deploy frontend-app via Bastion
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o "ProxyCommand=ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -W %h:%p ec2-user@${{ secrets.BASTION_HOST }}" \
            -i ~/.ssh/uat_key \
            ec2-user@${{ secrets.SSH_HOST }} << 'ENDSSH'

            echo "🔄 Deploying frontend-app..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/xamops/frontend-app:latest

            docker network inspect xamops-network >/dev/null 2>&1 || docker network create xamops-network

            docker stop frontend-app 2>/dev/null || true
            docker rm   frontend-app 2>/dev/null || true

            docker run -d \
              --name frontend-app \
              --restart unless-stopped \
              --network xamops-network \
              --memory=2g --memory-swap=2g \
              ghcr.io/xamops/frontend-app:latest

            sleep 20
            if docker ps --filter "name=frontend-app" --filter "status=running" | grep -q frontend-app; then
              echo "✅ frontend-app is running"
              docker ps --filter "name=frontend-app"
            else
              echo "❌ frontend-app failed to start"
              docker logs --tail=50 frontend-app
              exit 1
            fi

            docker image prune -f
            echo "🚀 frontend-app deployment complete!"
          ENDSSH


  # ══════════════════════════════════════════════════════════
  #  MEDIA-OPS-SERVICE
  # ══════════════════════════════════════════════════════════

  media-ops-build-test:
    name: "[media-ops-service] Build & Test"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.media-ops == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests — FFmpeg not available in CI runner)
        run: mvn package -B -DskipTests --no-transfer-progress -pl media-ops-service -am

  media-ops-docker-push:
    name: "[media-ops-service] Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: [changes, media-ops-build-test]
    if: |
      needs.changes.outputs.media-ops == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build .jar
        run: mvn package -B -DskipTests --no-transfer-progress -pl media-ops-service -am

      - name: Copy pre-built jar into service folder
        run: cp media-ops-service/target/*.jar media-ops-service/app.jar

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image (FFmpeg baked in)
        run: |
          docker buildx build \
            --no-cache \
            --provenance=false \
            -t ghcr.io/xamops/media-ops-service:latest \
            -t ghcr.io/xamops/media-ops-service:sha-${{ github.sha }} \
            --push \
            ./media-ops-service

  media-ops-deploy:
    name: "[media-ops-service] Deploy to UAT"
    runs-on: ubuntu-latest
    needs: [changes, media-ops-docker-push]
    if: |
      needs.changes.outputs.media-ops == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: uat
    steps:
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat << 'SSHKEY' > ~/.ssh/bastion_key
          ${{ secrets.BASTION_SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/bastion_key
          cat << 'SSHKEY' > ~/.ssh/uat_key
          ${{ secrets.SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/uat_key
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Test Bastion Connection
        run: |
          ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ec2-user@${{ secrets.BASTION_HOST }} "echo '✅ Bastion connected!'"

      - name: Deploy media-ops-service via Bastion
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o "ProxyCommand=ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -W %h:%p ec2-user@${{ secrets.BASTION_HOST }}" \
            -i ~/.ssh/uat_key \
            ec2-user@${{ secrets.SSH_HOST }} << 'ENDSSH'

            echo "🔄 Deploying media-ops-service..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/xamops/media-ops-service:latest

            docker network inspect xamops-network >/dev/null 2>&1 || docker network create xamops-network

            mkdir -p /data/xamops-media

            docker stop media-ops-service 2>/dev/null || true
            docker rm   media-ops-service 2>/dev/null || true

            docker run -d \
              --name media-ops-service \
              --restart unless-stopped \
              --network xamops-network \
              --memory=3g --memory-swap=3g \
              -p 8084:8084 \
              -v /data/xamops-media:/data/xamops-media \
              -e SPRING_PROFILES_ACTIVE=uat \
              -e APP_IMPERSONATION_SECRET_KEY=${{ secrets.APP_IMPERSONATION_SECRET_KEY }} \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://10.30.21.26:5432/xamops_db_uat \
              -e REDIS_HOST=redis-uat \
              -e REDIS_PORT=6379 \
              -e EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://service-registry:8761/eureka/ \
              -e SPRING_FLYWAY_TABLE=flyway_schema_history_media_ops \
              -e SPRING_FLYWAY_BASELINE_ON_MIGRATE=true \
              -e SPRING_FLYWAY_BASELINE_VERSION=0 \
              -e SPRING_FLYWAY_OUT_OF_ORDER=true \
              -e HLS_BASE_URL=http://${{ secrets.SSH_HOST }}:8084/media \
              -e RTMP_BASE_URL=rtmp://${{ secrets.SSH_HOST }}/live \
              -e MANAGEMENT_HEALTH_DB_ENABLED=false \
              -e MANAGEMENT_HEALTH_REDIS_ENABLED=false \
              -e "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,metrics,info" \
              ghcr.io/xamops/media-ops-service:latest

            sleep 25
            if docker ps --filter "name=media-ops-service" --filter "status=running" | grep -q media-ops-service; then
              echo "✅ media-ops-service is running"
              docker ps --filter "name=media-ops-service"
            else
              echo "❌ media-ops-service failed to start"
              docker logs --tail=50 media-ops-service
              exit 1
            fi

            docker image prune -f
            echo "🚀 media-ops-service deployment complete!"
          ENDSSH


  # ══════════════════════════════════════════════════════════
  #  XAMOPS-AGENT
  # ══════════════════════════════════════════════════════════
  #
  # Build-and-verify only; this job deliberately does not push.
  #
  # The agent image lives on Docker Hub (docker.io/xamops/agent) rather than GHCR because
  # customer clusters pull it anonymously, and publishing is a manual, deliberate act —
  # a new agent sends payload fields that older server deployments do not understand, so
  # moving a tag has to be sequenced behind a server rollout.
  #
  # Until Aug 2026 there was no agent job here at all, which is how two defects shipped:
  #   * the ENTRYPOINT pointed at /xamops-agent while the build only produced the
  #     arch-suffixed names, so no image built after May 2026 could start
  #   * `ARG TARGETARCH=amd64` shadowed the value buildx injects, so the arm64 image
  #     contained an x86-64 binary
  # Both are invisible to `docker build` alone: it exits 0. The checks below are what
  # actually catch them, so keep the arch assertion even if the build step looks redundant.

  agent-build-verify:
    name: "[xamops-agent] Build & Verify"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Must track the go directive in xamops-agent/go.mod. Raised from 1.21 when
          # golang.org/x/crypto moved to v0.52.0 for the SSH advisories -- that release
          # requires 1.25, and go get bumped the module directive to match.
          go-version: '1.25'
          cache-dependency-path: xamops-agent/go.sum

      - name: Compile and vet
        working-directory: xamops-agent
        run: |
          go build ./...
          go vet ./...

      - name: Run Go tests
        working-directory: xamops-agent
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee /tmp/gotest.log && exit 0
          # "no test files" is an acceptable outcome; a real assertion failure is not.
          if grep -qE "^(FAIL|--- FAIL)" /tmp/gotest.log; then
            exit 1
          fi
          exit 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build both architectures and assert each binary matches its platform
        working-directory: xamops-agent
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "::group::linux/$arch"
            docker buildx build \
              --platform "linux/$arch" \
              --build-arg "AGENT_VERSION=ci-${GITHUB_SHA::7}" \
              -t "xamops-agent-ci:$arch" \
              --load .

            cid=$(docker create --platform "linux/$arch" "xamops-agent-ci:$arch")
            # Also proves the path in ENTRYPOINT exists: docker cp fails otherwise.
            docker cp "$cid:/xamops-agent" "/tmp/agent-$arch"
            docker rm "$cid" >/dev/null

            case "$arch" in
              amd64) want="x86-64" ;;
              arm64) want="aarch64" ;;
            esac

            got=$(file -b "/tmp/agent-$arch")
            echo "$got"
            if ! echo "$got" | grep -q "$want"; then
              echo "::error::linux/$arch image contains the wrong binary architecture."
              echo "::error::Expected '$want', got: $got"
              echo "::error::Most likely a predefined platform ARG (TARGETARCH) was given a"
              echo "::error::default value, which shadows the value buildx injects."
              exit 1
            fi

            if ! grep -q "ci-${GITHUB_SHA::7}" <(strings "/tmp/agent-$arch"); then
              echo "::error::AGENT_VERSION was not stamped into the linux/$arch binary."
              echo "::error::Check the -ldflags -X path matches internal/version.Version."
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Assert the entrypoint actually starts
        run: |
          set -uo pipefail
          # Expected to exit non-zero on missing config. What matters is which error:
          # a config complaint proves the binary ran, whereas "no such file or directory"
          # or "exec format error" means the image is unstartable.
          out=$(docker run --rm --platform linux/amd64 xamops-agent-ci:amd64 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qiE "exec format error|no such file or directory|executable file not found"; then
            echo "::error::Image cannot start — ENTRYPOINT does not resolve to a runnable binary."
            exit 1
          fi
          if ! echo "$out" | grep -q "Starting XamOps Agent"; then
            echo "::error::Agent did not reach its startup log line."
            exit 1
          fi
          echo "✅ entrypoint runs"
