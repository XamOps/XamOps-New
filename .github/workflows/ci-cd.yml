
name: Multi Service CI/CD

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:

  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      billops: ${{ steps.filter.outputs.billops }}
      xamops_service: ${{ steps.filter.outputs.xamops_service }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changed Files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend-app/**'

            billops:
              - 'billops/**'

            xamops_service:
              - 'xamops-service/**'

  frontend_app:
    name: Frontend Build & Push
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.SSH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ghcr.io/xamops/frontend-app:latest \
            ./frontend-app

      - name: Push Frontend Docker Image
        run: |
          docker push ghcr.io/xamops/frontend-app:latest

  billops:
    name: Billops Build & Push
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.billops == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Billops Jar
        run: |
          mvn -pl billops clean package -DskipTests

      - name: Login to GHCR
        run: |
          echo "${{ secrets.SSH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Billops Docker Image
        run: |
          docker build \
            -t ghcr.io/xamops/billops:latest \
            ./billops

      - name: Push Billops Docker Image
        run: |
          docker push ghcr.io/xamops/billops:latest

  xamops_service:
    name: XamOps Service Build & Push
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.xamops_service == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build XamOps Service Jar
        run: |
          mvn -pl xamops-service clean package -DskipTests

      - name: Login to GHCR
        run: |
          echo "${{ secrets.SSH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build XamOps Service Docker Image
        run: |
          docker build \
            -t ghcr.io/xamops/xamops-service:latest \
            ./xamops-service

      - name: Push XamOps Service Docker Image
        run: |
          docker push ghcr.io/xamops/xamops-service:latest
```
