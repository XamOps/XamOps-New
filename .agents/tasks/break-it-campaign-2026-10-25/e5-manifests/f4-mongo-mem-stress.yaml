apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: e5-f4-mongo-mem-stress
  namespace: xamops-db-fixtures
spec:
  mode: one
  selector:
    namespaces:
      - xamops-db-fixtures
    labelSelectors:
      app: mongo
  stressors:
    memory:
      workers: 2
      size: "150MB"
  duration: "120s"
