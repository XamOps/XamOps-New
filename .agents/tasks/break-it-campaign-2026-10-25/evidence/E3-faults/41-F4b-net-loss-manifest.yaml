apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: e3-net-loss
  namespace: chaos-testing
spec:
  action: loss
  mode: all
  selector:
    namespaces:
      - xamops-system
    labelSelectors:
      app: xamops-automation
  direction: to
  loss:
    loss: "50"
    correlation: "50"
  duration: "90s"
