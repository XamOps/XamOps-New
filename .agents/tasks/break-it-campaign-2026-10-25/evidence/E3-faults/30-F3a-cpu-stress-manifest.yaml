apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: e3-cpu-stress
  namespace: chaos-testing
spec:
  mode: all
  selector:
    namespaces:
      - xamops-system
    labelSelectors:
      app: xamops-automation
  stressors:
    cpu:
      workers: 2
      load: 100
  duration: "90s"
