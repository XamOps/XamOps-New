apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: e3-net-delay
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - xamops-system
    labelSelectors:
      app: xamops-automation
  direction: to
  delay:
    latency: "500ms"
    jitter: "200ms"
    correlation: "50"
  duration: "90s"
