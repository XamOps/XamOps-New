version: '3.8'

services:
  marketplace-procurement-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xamops-marketplace-procurement-local
    ports:
      - "5003:5003"
    environment:
      - FLASK_ENV=local
      - LOG_LEVEL=DEBUG
      - PORT=5003
      - WORKERS=2
      - THREADS=4
      - TIMEOUT=60
      - AWS_REGION=us-east-1
      # Platform AWS credentials (used to assume customer role via STS)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
