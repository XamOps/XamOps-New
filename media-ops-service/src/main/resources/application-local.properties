# ===================================================================
# LOCAL ENVIRONMENT
# ===================================================================
spring.datasource.url=jdbc:postgresql://13.127.62.153:5432/xamops_local_db
spring.datasource.username=xamops_local_user
spring.datasource.password=XamOps@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Flyway: skip checksum validation in local dev (checksum may differ after SQL edits)
spring.flyway.validate-on-migrate=false

# Use the libass-enabled ffmpeg-full build (keg-only, so reference its full path).
# The plain Homebrew `ffmpeg` lacks libass → no `subtitles` filter → burn-in fails.
mediaops.ffmpeg.path=/usr/local/opt/ffmpeg-full/bin/ffmpeg
mediaops.storage.base-dir=/Users/admin/xamops-media
mediaops.rtmp.base-url=rtmp://localhost:1935/live
mediaops.hls.base-url=http://localhost:8084/media

# S3: upload transcoded output to xamops-document-bucket/media-ops/
# Credentials from ~/.aws/credentials [default] profile (ap-south-1).
mediaops.s3.enabled=true
mediaops.s3.delete-local-after-upload=false

# Local dev keeps files on disk (delete-local-after-upload=false; the player serves
# them via the local file server), so inline post-upload cleanup is disabled here.
mediaops.cleanup.local-output.enabled=false

# ── Local development key ONLY ───────────────────────────────────────────────
# Throwaway value, intentionally committed so `local` runs with no setup. Must match
# xamops-service and billops: billops signs the impersonation token, this service only
# verifies it, so a mismatch makes every "Login As" silently fail validation.
app.impersonation.secret-key=dna/W6GjfQxNteV3LnOm1qqrE0Swvjwna2Kaag/NjMY=
