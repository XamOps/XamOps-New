# ===================================================================
# UAT ENVIRONMENT
# ===================================================================
# --- AWS Secrets Manager: load UAT DB credentials at startup ---
spring.cloud.aws.region.static=ap-south-1
cloud.aws.stack.auto=false
spring.config.import=optional:aws-secretsmanager:uat/xamops_db_uat

# Credentials (username/password) come from the secret above.
spring.datasource.url=jdbc:postgresql://${host}:${port}/${dbname}
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.table=flyway_schema_history_media_ops
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# FFmpeg is baked into the Docker image at /usr/bin/ffmpeg
mediaops.ffmpeg.path=/usr/bin/ffmpeg
mediaops.storage.base-dir=/data/xamops-media
mediaops.rtmp.base-url=${RTMP_BASE_URL:rtmp://localhost/live}
mediaops.hls.base-url=${HLS_BASE_URL:https://uat-media.xamops.io}

# S3: same bucket as prod but under a uat/ prefix to keep assets separate
mediaops.s3.enabled=true
mediaops.s3.bucket=xamops-document-bucket
mediaops.s3.region=ap-south-1
mediaops.s3.access-key=
mediaops.s3.secret-key=
mediaops.s3.key-prefix=uat/media-ops
mediaops.s3.public-base-url=https://xamops-document-bucket.s3.ap-south-1.amazonaws.com
mediaops.s3.delete-local-after-upload=true

# Reclaim local disk: delete local output of COMPLETED jobs once a remote copy exists.
mediaops.cleanup.local-output.enabled=true
