# ===================================================================
# PRODUCTION ENVIRONMENT
# ===================================================================

# --- AWS Secrets Manager: load prod credentials at startup ---
# Region for the Secrets Manager client (instance role XamOps-App-EC2-Role supplies
# credentials over IMDS — the same role this service already relies on for S3, see the
# mediaops.s3.* block below).
#
# Two secrets only: the shared master database, and the impersonation key. media-ops
# does not read prod/xamops_app.
spring.cloud.aws.region.static=ap-south-1
cloud.aws.stack.auto=false
spring.config.import=optional:aws-secretsmanager:prod/xamops_db,optional:aws-secretsmanager:prod/xamops_shared

# This file already carried no plaintext — DB_URL/DB_USERNAME/DB_PASSWORD had no
# defaults, so the container simply failed to start unless the deploy supplied all
# three. The secret is now the fallback, so those env vars become optional rather than
# mandatory. They still win when set, which keeps any existing deploy working unchanged.
spring.datasource.url=${DB_URL:jdbc:postgresql://${host}:${port}/${dbname}}
spring.datasource.username=${DB_USERNAME:${username}}
spring.datasource.password=${DB_PASSWORD:${password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Impersonation JWT — media-ops only VERIFIES; billops signs. Must resolve to the same
# value, which is why it comes from prod/xamops_shared and not from the plaintext
# default still sitting in this service's application.properties.
app.impersonation.secret-key=${app_impersonation_secret_key}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000

# Flyway: media-ops shares the DB with the rest of XamOps, so it MUST use its own
# history table to avoid colliding with other services' migrations.
spring.flyway.table=flyway_schema_history_media_ops
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

mediaops.ffmpeg.path=/usr/bin/ffmpeg
mediaops.storage.base-dir=/data/xamops-media
mediaops.rtmp.base-url=${RTMP_BASE_URL:rtmp://localhost/live}
mediaops.hls.base-url=${HLS_BASE_URL:https://media.xamops.io}

# S3: shared bucket with the rest of XamOps — media files land in media-ops/ folder.
# Credentials come from the EC2/ECS IAM role (same as xamops-service).
# No explicit keys needed in prod — DefaultCredentialsProvider handles it.
mediaops.s3.enabled=true
mediaops.s3.bucket=xamops-document-bucket
mediaops.s3.region=ap-south-1
mediaops.s3.access-key=
mediaops.s3.secret-key=
mediaops.s3.key-prefix=media-ops
mediaops.s3.public-base-url=https://xamops-document-bucket.s3.ap-south-1.amazonaws.com
mediaops.s3.delete-local-after-upload=true

# Reclaim local disk: delete local output of COMPLETED jobs once a remote copy exists.
mediaops.cleanup.local-output.enabled=true
