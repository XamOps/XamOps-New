# ===================================================================
# PRODUCTION ENVIRONMENT
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000

# Flyway: media-ops shares the DB with the rest of XamOps, so it MUST use its own
# history table to avoid colliding with other services' migrations.
spring.flyway.table=flyway_schema_history_media_ops
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

mediaops.ffmpeg.path=/usr/bin/ffmpeg
mediaops.storage.base-dir=/data/xamops-media
mediaops.rtmp.base-url=${RTMP_BASE_URL:rtmp://localhost/live}
mediaops.hls.base-url=${HLS_BASE_URL:https://media.xamops.io}

# S3: shared bucket with the rest of XamOps — media files land in media-ops/ folder.
# Credentials come from the EC2/ECS IAM role (same as xamops-service).
# No explicit keys needed in prod — DefaultCredentialsProvider handles it.
mediaops.s3.enabled=true
mediaops.s3.bucket=xamops-document-bucket
mediaops.s3.region=ap-south-1
mediaops.s3.access-key=
mediaops.s3.secret-key=
mediaops.s3.key-prefix=media-ops
mediaops.s3.public-base-url=https://xamops-document-bucket.s3.ap-south-1.amazonaws.com
mediaops.s3.delete-local-after-upload=true
