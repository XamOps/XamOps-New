spring.application.name=media-ops-service
server.port=8084

# ==============================================================
# MULTIPART
# ==============================================================
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

spring.profiles.active=local

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# EUREKA SERVICE DISCOVERY
# ==============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ==============================================================
# REDIS SESSION (shared with xamops-service)
# ==============================================================
# spring.session.store-type was removed in Boot 3: the store is inferred from the
# spring-boot-starter-session-data-redis dependency.
spring.session.data.redis.namespace=spring:session

# ==============================================================
# IMPERSONATION JWT ("Login As" from billops)
# MUST match app.impersonation.secret-key in billops and xamops-service —
# billops signs the token, this service only verifies it.
# ==============================================================
# No fallback literal: the previous default was a key committed to the repository, and a
# default meant a misresolved env var silently fell back to a publicly-known value instead
# of failing. media-ops only VERIFIES these tokens, but accepting ones signed with a public
# key is exactly the problem.
app.impersonation.secret-key=${APP_IMPERSONATION_SECRET_KEY}

# ==============================================================
# CORS
# ==============================================================
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# ==============================================================
# FFMPEG + MEDIA STORAGE
# ==============================================================
mediaops.ffmpeg.path=ffmpeg
mediaops.storage.base-dir=/tmp/xamops-media
mediaops.rtmp.base-url=rtmp://localhost/live
mediaops.hls.base-url=http://localhost:8084/media

# ==============================================================
# S3 STORAGE (disabled by default — enable in prod/local profiles)
# Shared bucket: xamops-document-bucket (ap-south-1)
# Media files are stored under the media-ops/ folder alongside
# billing-archive/, rca/, and tickets/.
# ==============================================================
mediaops.s3.enabled=false
mediaops.s3.bucket=xamops-document-bucket
mediaops.s3.region=ap-south-1
# Leave access-key / secret-key blank to use the default credential chain
# (IAM role, AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars, ~/.aws/credentials)
mediaops.s3.access-key=
mediaops.s3.secret-key=
mediaops.s3.key-prefix=media-ops
mediaops.s3.public-base-url=https://xamops-document-bucket.s3.ap-south-1.amazonaws.com
mediaops.s3.endpoint=
mediaops.s3.delete-local-after-upload=false

# ==============================================================
# LOGGING
# ==============================================================
logging.level.com.xammer.mediaops=DEBUG
logging.level.org.springframework=INFO

# ==============================================================
# JSON — Jackson 2 (see spring-boot-jackson2 in the root pom)
# ==============================================================
# Boot 4 prefers Jackson 3 (tools.jackson). This service's code still uses the Jackson 2
# ObjectMapper/JsonNode API, so Jackson 2 is selected for MVC request/response conversion
# (and STOMP payloads where applicable) to keep one mapper in play end to end.
spring.http.converters.preferred-json-mapper=jackson2
spring.websocket.messaging.preferred-json-mapper=jackson2

# ==============================================================
# AWS SDK REGION (awspring / Spring Cloud AWS)
# ==============================================================
# Must live in the base profile, not only in uat/prod. awspring 4 creates the
# SecretsManagerClient as soon as the starter is on the classpath — it is no longer
# gated on spring.config.import carrying an aws-secretsmanager: entry the way 2.4.x
# was. Building that client needs a region, and with no profile active (CI running
# @SpringBootTest) there is no AWS_REGION, no ~/.aws profile and no EC2 metadata, so
# region resolution fails and the whole context fails to start.
#
# Note the property name: awspring 3+ moved it from cloud.aws.region.static to
# spring.cloud.aws.region.static. The old name binds to nothing.
spring.cloud.aws.region.static=ap-south-1
