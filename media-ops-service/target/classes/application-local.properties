spring.datasource.url=jdbc:postgresql://13.127.62.153:5432/xamops_local_db
spring.datasource.username=xamops_local_user
spring.datasource.password=XamOps@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000

spring.redis.host=localhost
spring.redis.port=6379

# Flyway: skip checksum validation in local dev (checksum may differ after SQL edits)
spring.flyway.validate-on-migrate=false

mediaops.ffmpeg.path=ffmpeg
mediaops.storage.base-dir=/Users/admin/xamops-media
mediaops.rtmp.base-url=rtmp://localhost:1935/live
mediaops.hls.base-url=http://localhost:8084/media

# S3: enable locally when you want to test uploads against the real bucket.
# Credentials are picked up from ~/.aws/credentials (same profile used by xamops-service).
mediaops.s3.enabled=false
mediaops.s3.delete-local-after-upload=false
