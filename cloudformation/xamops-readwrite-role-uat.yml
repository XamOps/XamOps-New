  # =================================================================
  # MAIN ROLE — XamOpsReadWriteRole
  # AWS ReadOnlyAccess + 9 domain-specific managed policies (10 total, at AWS limit)
  # Rightsizing added as inline policy (does not count toward managed policy limit)
  # This role is assumed by the XamOps backend for cross-account access
  # =================================================================
  XamOpsReadWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'XamOpsReadWriteRole-uat'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${XamOpsAccountId}:role/${XamOpsPrincipalRoleName}'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
        - !Ref XamOpsPolicyReadExtra
        - !Ref XamOpsPolicyEC2Manage
        - !Ref XamOpsPolicySpots
        - !Ref XamOpsPolicyTagging
        - !Ref XamOpsPolicyWaste
        - !Ref XamOpsPolicyIAMManage
        - !Ref XamOpsPolicyComputeManage
        - !Ref XamOpsPolicyStorageManage
        - !Ref XamOpsPolicyCostManage
      # -----------------------------------------------------------------
      # Inline policy: Rightsizing
      # Added inline because the role is at the 10 managed policy limit.
      # Inline policies are updated independently via stack updates.
      # -----------------------------------------------------------------
      Policies:
        # ------------------------------------------------------------------
        # Cost and Usage Report access. Attached only when CurS3Bucket is set,
        # i.e. when the CUR lives in THIS account.
        #
        # The genuinely new grants are athena:StartQueryExecution — a write
        # action, so absent from the ReadOnlyAccess managed policy above — and
        # the s3:PutObject below. Athena has no mode that avoids writing query
        # results, so reading a CUR requires one object write; it is scoped to a
        # dedicated prefix so the role can only create objects XamOps wrote.
        # Keep this prefix in sync with CurSource.athenaResultsLocation.
        # ------------------------------------------------------------------
        - !If
          - HasCurBucket
          - PolicyName: XamOpsCurReadPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: XamOpsCurBucketRead
                  Effect: Allow
                  Action:
                    - 's3:GetObject'
                    - 's3:ListBucket'
                    - 's3:GetBucketLocation'
                  Resource:
                    - !If [AutoCurBucket, !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}', !Sub 'arn:aws:s3:::${CurS3Bucket}']
                    - !If [AutoCurBucket, !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/*', !Sub 'arn:aws:s3:::${CurS3Bucket}/*']
                - Sid: XamOpsCurAthenaQuery
                  Effect: Allow
                  Action:
                    - 'athena:StartQueryExecution'
                    - 'athena:StopQueryExecution'
                    - 'athena:GetQueryExecution'
                    - 'athena:GetQueryResults'
                    - 'athena:GetWorkGroup'
                  Resource: '*'
                - Sid: XamOpsCurGlueCatalog
                  Effect: Allow
                  Action:
                    - 'glue:GetDatabase'
                    - 'glue:GetDatabases'
                    - 'glue:GetTable'
                    - 'glue:GetTables'
                    - 'glue:GetPartition'
                    - 'glue:GetPartitions'
                    - 'glue:CreateDatabase'
                    - 'glue:CreateTable'
                    - 'glue:DeleteTable'
                    - 'glue:BatchCreatePartition'
                  Resource: '*'
                - Sid: XamOpsCurAthenaResultsWrite
                  Effect: Allow
                  Action:
                    - 's3:PutObject'
                    - 's3:AbortMultipartUpload'
                  Resource: !If
                    - AutoCurBucket
                    - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/xamops-athena-results/*'
                    - !Sub 'arn:aws:s3:::${CurS3Bucket}/xamops-athena-results/*'
          - !Ref 'AWS::NoValue'
        # -----------------------------------------------------------------
        # Resource Explorer service-linked role.
        #
        # Without this, Search still works but returns PARTIAL results —
        # tagged resources plus untagged ones created after Oct 2025, missing
        # older untagged history. With it, Resource Explorer builds a complete
        # index and keeps it current within minutes.
        #
        # Condition-scoped to one AWS service: IAM evaluates
        # iam:AWSServiceName, so the only role creatable here is
        # AWSServiceRoleForResourceExplorer. Created once per account.
        # -----------------------------------------------------------------
        - PolicyName: XamOpsPolicyResourceExplorerSlr
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: XamOpsResourceExplorerServiceLinkedRole
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'
                Condition:
                  StringEquals:
                    'iam:AWSServiceName': 'resource-explorer-2.amazonaws.com'
        - PolicyName: XamOpsPolicyRightsizing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: XamOpsRightsizingPermissions
                Effect: Allow
                Action:
                  - 'application-autoscaling:RegisterScalableTarget'
                  - 'autoscaling:DescribeAutoScalingGroups'
                  - 'compute-optimizer:GetEnrollmentStatus'
                  - 'compute-optimizer:UpdateEnrollmentStatus'
                  - 'compute-optimizer:GetEBSVolumeRecommendations'
                  - 'ec2:CreateVpcEndpoint'
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeVolumes'
                  - 'ec2:ModifyInstanceAttribute'
                  - 'ec2:ModifyVolume'
                  - 'ec2:StartInstances'
                  - 'ec2:StopInstances'
                  - 'ecs:RegisterTaskDefinition'
                  - 'ecs:UpdateService'
                  - 'elasticache:ModifyReplicationGroup'
                  - 'es:UpdateDomainConfig'
                  - 'iam:PassRole'
                  - 'kms:CreateGrant'
                  - 'kms:Decrypt'
                  - 'kms:Encrypt'
                  - 'kms:GenerateDataKey*'
                  - 'kms:ReEncrypt*'
                  - 'lambda:DeleteFunction'
                  - 'lambda:GetFunction'
                  - 'lambda:GetPolicy'
                  - 'lambda:GetProvisionedConcurrencyConfig'
                  - 'lambda:ListTags'
                  - 'lambda:PublishVersion'
                  - 'lambda:PutProvisionedConcurrencyConfig'
                  - 'lambda:DeleteProvisionedConcurrencyConfig'
                  - 'lambda:UpdateAlias'
                  - 'lambda:UpdateFunctionCode'
                  - 'lambda:UpdateFunctionConfiguration'
                  - 'rds:ModifyDBInstance'
                Resource: '*'
        # -----------------------------------------------------------------
        # BillOps CUR read access — scoped to the dedicated
        # xamops-cur-{accountId} bucket created by the nested
        # XamOpsCurExport stack below, not a wildcard. Kept as its own
        # inline policy (like Rightsizing above) since this role is
        # already at the 10 managed-policy limit.
        # -----------------------------------------------------------------
        - PolicyName: XamOpsPolicyCurRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: XamOpsCurReadAccess
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource:
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/*'
        # -----------------------------------------------------------------
        # CloudK8s fleet read - roadmap Appendix 8.1 Catalog-A read delta.
        # Kept as its own inline policy: 2,722 compacted chars does not fit in
        # the headroom of any existing policy on this role, and the read-write
        # role is already at the 10 managed-policies-per-role quota. The four
        # ecr:* actions are deferred to Phase 3 by Appendix 8.1 itself.
        # -----------------------------------------------------------------
        - PolicyName: XamOpsPolicyEksFleetRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EksFleetInventory
                Effect: Allow
                Action:
                  - 'eks:ListNodegroups'
