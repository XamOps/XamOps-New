AWSTemplateFormatVersion: '2010-09-09'
Description: >
  XamOps Read-Write (UAT) + AutoSpotting Stack: Creates a secure IAM Role for the XamOps platform
  to monitor AND manage this AWS account, including auto-spotting event forwarding,
  user management, resource modification, and full operational control over supported services.
  Deploys EventBridge rules and a Lambda forwarder for real-time Spot instance event capture.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "XamOps Platform Configuration"
        Parameters:
          - XamOpsAccountId
          - ExternalId
      - Label:
          default: "Amazon EKS Configuration"
        Parameters:
          - EKSClusterNames
      - Label:
          default: "AutoSpotting Configuration"
        Parameters:
          - XammerSQSQueueUrl
          - XammerRegion
          - EnableAutoSpotting
    ParameterLabels:
      XamOpsAccountId:
        default: "XamOps AWS Account ID"
      ExternalId:
        default: "Unique External ID"
      EKSClusterNames:
        default: "EKS Cluster Names (Optional)"
      XammerSQSQueueUrl:
        default: "Xammer SQS Queue URL"
      XammerRegion:
        default: "Xammer AWS Region"
      EnableAutoSpotting:
        default: "Enable AutoSpotting"

Parameters:
  XamOpsAccountId:
    Type: String
    Description: The 12-digit AWS Account ID for the XamOps platform. Provided by XamOps.
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS Account ID.

  ExternalId:
    Type: String
    Description: A unique secret value provided by XamOps to secure the connection (cross-account IAM role assumption).
    MinLength: 10
    ConstraintDescription: Must be the unique external ID from the XamOps platform.

  EKSClusterNames:
    Type: CommaDelimitedList
    Description: (Optional) A comma-separated list of your EKS cluster names. XamOps will be granted admin access to these clusters.
    Default: ""

  XammerSQSQueueUrl:
    Type: String
    Description: URL of the Xammer SQS queue for AutoSpotting events. Provided by XamOps.
    Default: 'https://sqs.ap-south-1.amazonaws.com/605134457560/autospotting-events.fifo'

  XammerRegion:
    Type: String
    Description: AWS Region where Xammer infrastructure is deployed.
    Default: 'ap-south-1'

  EnableAutoSpotting:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable or disable AutoSpotting event forwarding to XamOps.

  # -------------------------------------------------------------------
  # Inventory events (near-real-time resource discovery)
  #
  # On by default. Without it XamOps still discovers resources, but by
  # polling every 60s instead of being told within seconds. Defaulting to
  # 'true' rather than making it opt-in matters: the feature costs this
  # account a few cents a month, and an opt-in flag buried in a stack
  # parameter is one almost nobody would ever turn on.
  # -------------------------------------------------------------------
  EnableInventoryEvents:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Forward resource change events to XamOps so new resources appear within
      seconds instead of up to a minute. Creates an EventBridge bus, rules in
      each of your enabled regions, and one small Lambda. Cost is typically
      under $0.10/month.

  IncludeSecurityFindings:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Also forward Security Hub, GuardDuty and AWS Config findings. These events
      are free on the default event bus.

  XamOpsInventoryQueueUrl:
    Type: String
    Description: URL of the XamOps inventory event queue.
    Default: 'https://sqs.ap-south-1.amazonaws.com/605134457560/xamops-inventory-events.fifo'

  XamOpsInventoryRegion:
    Type: String
    Description: Region hosting the XamOps inventory event queue.
    Default: 'ap-south-1'

  XamOpsInventoryTemplateUrl:
    Type: String
    Description: S3 URL of the nested inventory-events template.
    Default: 'https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-inventory-events-nested.yaml'

  # -------------------------------------------------------------------
  # Cost and Usage Report (CUR)
  #
  # Only needed when this account keeps its OWN CUR — a standalone account, or
  # a member account whose payer XamOps does not manage. Accounts that sit under
  # a XamOps management/payer account are covered by that MPA's own CUR, which
  # XamOps reads from its own bucket, so they leave this blank and no CUR
  # permission is added to this role at all.
  # -------------------------------------------------------------------
  CurS3Bucket:
    Type: String
    Default: ''
    Description: >
      (Optional) Name of the S3 bucket holding this account's Cost and Usage Report.
      Leave blank if this account is under a XamOps payer account, or if you have no CUR.
      Use AUTO if you are also deploying the XamOps cost reporting stack, which creates
      xamops-cur-<this account id>.
  # CUR 2.0 Data Export (billing reconciliation for BillOps invoicing)
  #
  # On by default, same reasoning as EnableInventoryEvents. Cost to this
  # account is a few cents a month (S3 storage + requests only — Data
  # Exports itself has no AWS charge) and is purged automatically after
  # 90 days. Read-write accounts get the exact same billing pipeline as
  # read-only accounts — CUR export is unrelated to the write permissions
  # this role adds, so there's no reason for the two paths to diverge.
  # -------------------------------------------------------------------
  EnableCurExport:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Set up an AWS Cost and Usage Report (CUR 2.0) export to a dedicated S3
      bucket in this account, so BillOps can reconcile invoices from AWS's
      billing source of truth instead of Cost Explorer's aggregated totals.
      Creates one S3 bucket and one Data Export. Cost is typically a few
      cents a month.

  XamOpsCurExportTemplateUrl:
    Type: String
    Description: S3 URL of the nested CUR export template.
    Default: 'https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-cur-export-nested.yaml'

  # ---------------------------------------------------------------------------------
  # CUR 1.0 — the report XamOps itself reads.
  #
  # On by default, and nested here rather than left to a second launch link, because an
  # optional step is one most accounts never take: XamOps then shows Cost Explorer
  # figures everywhere and nobody can say why the per-resource and invoice views are
  # empty. CUR 2.0 above stays available but is off by default; the two write the same
  # bucket name and only one can own it.
  # ---------------------------------------------------------------------------------
  EnableCurReport:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Create an AWS Cost and Usage Report (CUR 1.0) in this account, so XamOps can show
      per-resource cost, invoice-level charges and data transfer breakdowns that the Cost
      Explorer API cannot express. Set to false for an account under a XamOps payer
      account, which is already covered by that payer's report.

  XamOpsCurReportTemplateUrl:
    Type: String
    Description: S3 URL of the nested CUR 1.0 report template.
    Default: 'https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-cur-report.yml'

Conditions:
  IsAutoSpottingEnabled: !Equals [!Ref EnableAutoSpotting, 'true']

  # Guards the nested stack. With inventory events off, nothing below is created
  # and the account simply relies on 60s polling.
  DeployInventoryEvents: !Equals [!Ref EnableInventoryEvents, 'true']

  # Guards the CUR export nested stack. With this off, BillOps simply keeps
  # reconciling this account's invoices from Cost Explorer.
  DeployCurExport: !Equals [!Ref EnableCurExport, 'true']

  # AWS::CUR::ReportDefinition exists only in us-east-1, and a nested stack is created in
  # its parent's region. The onboarding link pins us-east-1, but a customer who changes it
  # in the console would otherwise fail the whole connection on a report they can live
  # without — so the report is skipped instead, and the platform reports it as missing.
  IsCurReportRegion: !Equals [!Ref 'AWS::Region', 'us-east-1']

  DeployCurReport: !And
    - !Equals [!Ref EnableCurReport, 'true']
    - !Condition IsCurReportRegion

  # Whether the role is granted CUR read permissions at all.
  #
  # Deploying the export is itself a bucket: the nested stack creates
  # xamops-cur-<this account id> whether or not anyone named it here. Testing only
  # CurS3Bucket left the two defaults contradicting each other — EnableCurExport
  # defaults to 'true' and CurS3Bucket to '' — so a stack launched with defaults
  # created a CUR bucket and then withheld permission to read it. The data arrived
  # and every query against it failed with AccessDenied.
  #
  # An account under a XamOps payer account sets EnableCurExport to 'false' and still
  # gets no CUR permissions, which is the case this guard exists for.
  # Either report writes the same bucket, xamops-cur-<this account id>, so the read
  # grant follows whichever one is on rather than being tied to the CUR 2.0 export.
  CreatesOwnCurBucket: !Or
    - !Condition DeployCurExport
    - !Condition DeployCurReport

  HasCurBucket: !Or
    - !Not [!Equals [!Ref CurS3Bucket, '']]
    - !Condition CreatesOwnCurBucket

  # Whether the bucket is the one the export nested stack creates, rather than one the
  # customer named. 'AUTO' says so explicitly; an empty value alongside the export says
  # so implicitly, and both have to resolve to the same ARN or the policy names a bucket
  # that does not exist.
  #
  # Derived here rather than passed in, because the onboarding UI does not know the account
  # id when it builds this launch URL. An IAM policy may name a bucket that does not exist
  # yet — it grants nothing until it does — so the two stacks can be launched in any order.
  AutoCurBucket: !Or
    - !Equals [!Ref CurS3Bucket, 'AUTO']
    - !And
      - !Equals [!Ref CurS3Bucket, '']
      - !Condition CreatesOwnCurBucket

Resources:

  # =================================================================
  # MANAGED POLICIES — 8 domain-specific policies (Uniskai-style)
  # Each policy can be updated independently via a stack update
  # without touching any other policy or the role itself.
  # =================================================================

  # -----------------------------------------------------------------
  # Policy 1: Extra read permissions beyond AWS ReadOnlyAccess
  # (Cost Explorer, Compute Optimizer, Pricing API, etc.)
  # -----------------------------------------------------------------
  XamOpsPolicyReadExtra:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: XamOpsPolicyReadExtra-uat
      Description: Extra read permissions for XamOps platform monitoring (cost, optimizer, pricing, etc.)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'acm:ListCertificates'
              - 'access-analyzer:ListAnalyzers'
              - 'access-analyzer:ListFindings'
              - 'autoscaling:DescribeAutoScalingGroups'
              - 'autoscaling:DescribeInstanceRefreshes'
              - 'autoscaling:DescribeLaunchConfigurations'
              - 'autoscaling:DescribePolicies'
              - 'autoscaling:DescribeScheduledActions'
              - 'budgets:ViewBudget'
              - 'ce:GetAnomalies'
              - 'ce:GetCostAndUsage'
              - 'ce:GetDimensionValues'
              - 'ce:GetReservationCoverage'
              - 'ce:GetReservationPurchaseRecommendation'
              - 'ce:GetReservationUtilization'
              - 'cloudtrail:DescribeTrails'
              - 'cloudtrail:GetTrailStatus'
              - 'cloudtrail:LookupEvents'
              - 'cloudwatch:DescribeAlarms'
              - 'cloudwatch:GetMetricData'
              - 'cloudwatch:GetMetricStatistics'
              - 'compute-optimizer:GetEBSVolumeRecommendations'
              - 'compute-optimizer:GetEc2InstanceRecommendations'
              - 'compute-optimizer:GetLambdaFunctionRecommendations'
              - 'dynamodb:DescribeTable'
              - 'dynamodb:ListTables'
              - 'ec2:Describe*'
              - 'ecr:DescribeRepositories'
              - 'ecs:DescribeClusters'
              - 'ecs:ListClusters'
              - 'eks:DescribeCluster'
              - 'eks:ListClusters'
              - 'elasticache:DescribeCacheClusters'
              - 'elasticloadbalancing:DescribeLoadBalancers'
              - 'elasticloadbalancing:DescribeTargetGroups'
              - 'elasticloadbalancing:DescribeTargetHealth'
              - 'iam:GetAccountPasswordPolicy'
              - 'iam:GetLoginProfile'
              - 'iam:GetPolicyVersion'
              - 'iam:GetRole'
              - 'iam:ListAccessKeys'
              - 'iam:ListAccountAliases'
              - 'iam:ListAttachedUserPolicies'
              - 'iam:ListGroups'
              - 'iam:ListGroupsForUser'
              - 'iam:ListMFADevices'
              - 'iam:ListPolicies'
              - 'iam:ListRoles'
              - 'iam:ListUserPolicies'
              - 'iam:ListUsers'
              - 'kms:DescribeKey'
              - 'kms:GetKeyRotationStatus'
              - 'kms:ListKeys'
              - 'lambda:GetFunction'
              - 'lambda:ListFunctions'
              - 'lambda:ListProvisionedConcurrencyConfigs'
              - 'lambda:ListVersionsByFunction'
              - 'logs:DescribeLogGroups'
              - 'logs:DescribeLogStreams'
              - 'logs:GetQueryResults'
              - 'logs:StartQuery'
              - 'organizations:DescribeAccount'
              - 'organizations:ListAccounts'
              - 'pricing:DescribeServices'
              - 'pricing:GetProducts'
              - 'pricing:ListPriceLists'
              - 'rds:DescribeDBInstances'
              - 'rds:DescribeDBSnapshots'
              - 'rds:ListTagsForResource'
              # Resource Explorer — inventory source. One cross-region Search
              # replaces ~1000 per-service describes, at no charge. Read-only:
              # these actions never create an index. Kept in sync with the
              # read-only templates.
              - 'resource-explorer-2:Search'
              - 'resource-explorer-2:ListResources'
              - 'resource-explorer-2:ListIndexes'
              - 'resource-explorer-2:ListViews'
              - 'resource-explorer-2:GetIndex'
              - 'resource-explorer-2:GetView'
              - 'resource-explorer-2:GetDefaultView'
              # ------------------------------------------------------------------
              # Index creation - the only non-read Resource Explorer action here.
              #
              # AWS does not auto-index opt-in regions (Hyderabad, Jakarta, Melbourne,
              # UAE, Zurich, Spain, Milan, Cape Town, Bahrain, Osaka). Measured on a
              # live account: 18 enabled regions, 17 indexed, and the 7 EC2 instances
              # in the unindexed region were invisible to XamOps. Without this
              # permission every customer using an opt-in region needs a manual fix
              # before their inventory is complete, so the gap persists silently.
              #
              # A Resource Explorer index holds no customer data of its own and is free
              # of charge - it only lets AWS answer "what exists in this region".
              # Creation is one-time per region and idempotent.
              # ------------------------------------------------------------------
              - 'resource-explorer-2:CreateIndex'
              # Fallback when Resource Explorer is blocked: one call per region.
              # Note this role already has tag:TagResources for the tagging
              # feature; GetResources is the read counterpart and was missing.
              - 'tag:GetResources'
              - 'tag:GetTagKeys'
              - 'route53:ListHostedZones'
              - 's3:GetBucketAcl'
              - 's3:GetBucketLocation'
              - 's3:GetBucketPublicAccessBlock'
              - 's3:GetLifecycleConfiguration'
              - 's3:ListAccessGrantsInstances'
              - 's3:ListAccessGrantsLocations'
              - 's3:ListAllMyBuckets'
              - 's3:ListBucket'
              - 's3:ListBucketVersions'
              - 's3:ListMultiRegionAccessPoints'
              - 'servicequotas:ListServiceQuotas'
              - 'sns:ListTopics'
              - 'sqs:GetQueueAttributes'
              - 'sqs:ListQueues'
              - 'sts:GetCallerIdentity'
              - 'aws-marketplace:SearchAgreements'
              - 'aws-marketplace:DescribeAgreement'
              - 'aws-marketplace:GetAgreementTerms'
              - 'aws-marketplace:DescribeEntity'
              - 'aws-marketplace:SendAgreementPaymentRequest'
              - 'aws-marketplace:CancelAgreementPaymentRequest'
              - 'aws-marketplace:GetAgreementPaymentRequest'
              - 'aws-marketplace:ListEntities'
              - 'aws-marketplace:SearchListings'
              - 'aws-marketplace:SearchFacets'
              - 'aws-marketplace:GetListing'
              - 'aws-marketplace:GetProduct'
              - 'aws-marketplace:GetOffer'
              - 'aws-marketplace:GetOfferTerms'
              - 'aws-marketplace:ListPurchaseOptions'
              - 'aws-marketplace:ListFulfillmentOptions'
              - 'aws-marketplace:ListAgreementInvoiceLineItems'
              - 'aws-marketplace:ListAgreementPaymentRequests'
              - 'aws-marketplace:GetBillingAdjustmentRequest'
              - 'aws-marketplace:BatchCreateBillingAdjustmentRequest'
              - 'aws-marketplace:ListAgreementCancellationRequests'
              - 'aws-marketplace:SendAgreementCancellationRequest'
              - 'aws-marketplace:GetAgreementCancellationRequest'
              - 'aws-marketplace:CancelAgreementCancellationRequest'
            Resource: '*'

  # -----------------------------------------------------------------
  # Policy 2: EC2 instance lifecycle management
  # (start/stop/terminate, volumes, snapshots, security groups, EIPs)
  # -----------------------------------------------------------------
  XamOpsPolicyEC2Manage:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: XamOpsPolicyEC2Manage-uat
      Description: EC2 instance lifecycle management for XamOps (start, stop, terminate, volumes, networking)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'ec2:StartInstances'
              - 'ec2:StopInstances'
              - 'ec2:RebootInstances'
              - 'ec2:TerminateInstances'
              - 'ec2:RunInstances'
              - 'ec2:ModifyInstanceAttribute'
              - 'ec2:ModifyInstanceCreditSpecification'
              - 'ec2:ModifyVolume'
              - 'ec2:ModifyVolumeAttribute'
              - 'ec2:DescribeVolumesModifications'
              - 'ec2:CreateSnapshot'
              - 'ec2:DeleteSnapshot'
              - 'ec2:CreateVolume'
              - 'ec2:DeleteVolume'
              - 'ec2:AttachVolume'
              - 'ec2:DetachVolume'
              - 'ec2:AuthorizeSecurityGroupIngress'
              - 'ec2:AuthorizeSecurityGroupEgress'
              - 'ec2:RevokeSecurityGroupIngress'
              - 'ec2:RevokeSecurityGroupEgress'
              - 'ec2:CreateSecurityGroup'
              - 'ec2:DeleteSecurityGroup'
              - 'ec2:AllocateAddress'
              - 'ec2:ReleaseAddress'
              - 'ec2:AssociateAddress'
              - 'ec2:DisassociateAddress'
            Resource: '*'

  # -----------------------------------------------------------------
  # Policy 3: AutoSpotting — Spot Fleet, EC2 Fleet, and ASG management
  # -----------------------------------------------------------------
  XamOpsPolicySpots:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: XamOpsPolicySpots-uat
      Description: Spot Fleet, EC2 Fleet, and Auto Scaling Group management for XamOps AutoSpotting
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'ec2:RequestSpotInstances'
              - 'ec2:CancelSpotInstanceRequests'
              - 'ec2:DescribeSpotInstanceRequests'
              - 'ec2:DescribeSpotFleetInstances'
              - 'ec2:DescribeSpotFleetRequests'
              - 'ec2:DescribeSpotPriceHistory'
              - 'ec2:RequestSpotFleet'
              - 'ec2:CancelSpotFleetRequests'
              - 'ec2:ModifySpotFleetRequest'
              - 'ec2:CreateFleet'
              - 'ec2:DeleteFleets'
              - 'ec2:DescribeFleets'
              - 'ec2:DescribeFleetInstances'
              - 'ec2:ModifyFleet'
              - 'ec2:CreateLaunchTemplate'
              - 'ec2:ModifyLaunchTemplate'
              - 'ec2:DeleteLaunchTemplate'
              - 'ec2:CreateLaunchTemplateVersion'
              - 'ec2:DeleteLaunchTemplateVersions'
              - 'autoscaling:CreateAutoScalingGroup'
              - 'autoscaling:UpdateAutoScalingGroup'
              - 'autoscaling:DeleteAutoScalingGroup'
              - 'autoscaling:SetDesiredCapacity'
              - 'autoscaling:TerminateInstanceInAutoScalingGroup'
              - 'autoscaling:PutScalingPolicy'
              - 'autoscaling:DeletePolicy'
              - 'autoscaling:PutScheduledUpdateGroupAction'
              - 'autoscaling:DeleteScheduledAction'
              - 'autoscaling:AttachInstances'
              - 'autoscaling:DetachInstances'
              - 'autoscaling:CreateLaunchConfiguration'
              - 'autoscaling:DeleteLaunchConfiguration'
              - 'autoscaling:StartInstanceRefresh'
            Resource: '*'

  # -----------------------------------------------------------------
  # Policy 4: Cross-service tagging (mirrors Uniskai's Tagging policy)
  # All tag add/remove actions consolidated here for governance control
  # -----------------------------------------------------------------
  XamOpsPolicyTagging:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: XamOpsPolicyTagging-uat
      Description: Tagging permissions across all AWS services for XamOps cost allocation and governance
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: XamOpsTaggingPermissions
            Effect: Allow
            Action:
              - 'acm:AddTagsToCertificate'
              - 'acm:RemoveTagsFromCertificate'
              - 'apigateway:DELETE'
              - 'apigateway:POST'
              - 'appflow:TagResource'
              - 'appflow:UntagResource'
              - 'appmesh:TagResource'
              - 'appmesh:UntagResource'
              - 'autoscaling:CreateOrUpdateTags'
              - 'autoscaling:DeleteTags'
              - 'backup:TagResource'
              - 'backup:UntagResource'
              - 'bedrock:TagResource'
              - 'bedrock:UntagResource'
              - 'cassandra:Alter'
              - 'cassandra:AlterMultiRegionResource'
              - 'cassandra:TagResource'
              - 'cassandra:TagMultiRegionResource'
              - 'cassandra:UnTagMultiRegionResource'
              - 'cassandra:UntagResource'
              - 'cloudfront:TagResource'
              - 'cloudfront:UntagResource'
              - 'cloudtrail:AddTags'
              - 'cloudtrail:RemoveTags'
              - 'cloudwatch:TagResource'
              - 'cloudwatch:UntagResource'
              - 'codecommit:TagResource'
              - 'codecommit:UntagResource'
              - 'cognito-identity:TagResource'
              - 'cognito-identity:UntagResource'
              - 'dynamodb:TagResource'
              - 'dynamodb:UntagResource'
              - 'ec2:CreateTags'
              - 'ec2:DeleteTags'
              - 'ec2:DeleteVolume'
              - 'ec2:DeregisterImage'
              - 'ecr:TagResource'
              - 'ecr:UntagResource'
              - 'ecs:TagResource'
              - 'ecs:UntagResource'
              - 'eks:TagResource'
              - 'eks:UntagResource'
              - 'elasticache:AddTagsToResource'
              - 'elasticache:RemoveTagsFromResource'
              - 'elasticbeanstalk:AddTags'
              - 'elasticbeanstalk:RemoveTags'
              - 'elasticbeanstalk:UpdateTagsForResource'
              - 'elasticfilesystem:CreateTags'
              - 'elasticfilesystem:DeleteTags'
              - 'elasticfilesystem:TagResource'
              - 'elasticfilesystem:UntagResource'
              - 'elasticloadbalancing:AddTags'
              - 'elasticloadbalancing:RemoveTags'
              - 'elasticmapreduce:AddTags'
              - 'elasticmapreduce:RemoveTags'
              - 'emr-containers:TagResource'
              - 'emr-containers:UntagResource'
              - 'emr-serverless:TagResource'
              - 'emr-serverless:UntagResource'
              - 'es:AddTags'
              - 'es:RemoveTags'
              - 'events:TagResource'
              - 'events:UntagResource'
              - 'fsx:TagResource'
              - 'fsx:UntagResource'
              - 'glacier:AddTagsToVault'
              - 'glacier:RemoveTagsFromVault'
              - 'glue:TagResource'
              - 'glue:UntagResource'
              - 'iam:TagRole'
              - 'iam:UntagRole'
              - 'iam:TagUser'
              - 'iam:UntagUser'
              - 'kafka:TagResource'
              - 'kafka:UntagResource'
              - 'kinesis:AddTagsToStream'
              - 'kinesis:RemoveTagsFromStream'
              - 'kms:TagResource'
              - 'kms:UntagResource'
              - 'lambda:TagResource'
              - 'lambda:UntagResource'
              - 'logs:TagResource'
              - 'logs:UntagResource'
              - 'memorydb:TagResource'
              - 'memorydb:UntagResource'
              - 'mq:CreateTags'
              - 'mq:DeleteTags'
              - 'rds:AddTagsToResource'
              - 'rds:RemoveTagsFromResource'
              - 'redshift:CreateTags'
              - 'redshift:DeleteTags'
              - 'route53:ChangeTagsForResource'
              - 'route53domains:DeleteTagsForDomain'
              - 'route53domains:UpdateTagsForDomain'
              - 's3:DeleteJobTagging'
              - 's3:DeleteObjectTagging'
              - 's3:DeleteObjectVersionTagging'
              - 's3:PutBucketTagging'
              - 's3:PutJobTagging'
              - 's3:PutObjectTagging'
              - 's3:PutObjectVersionTagging'
              - 's3:ReplicateTags'
              - 'sagemaker:AddTags'
              - 'sagemaker:DeleteTags'
              - 'secretsmanager:TagResource'
              - 'secretsmanager:UntagResource'
              - 'ses:TagResource'
              - 'ses:UntagResource'
              - 'sns:TagResource'
              - 'sns:UntagResource'
              - 'sqs:TagQueue'
              - 'sqs:UntagQueue'
              - 'states:TagResource'
              - 'states:UntagResource'
              - 'tag:TagResources'
              - 'tag:UntagResources'
              - 'timestream:TagResource'
              - 'timestream:UntagResource'
              - 'wafv2:TagResource'
              - 'wafv2:UntagResource'
            Resource: '*'

  # -----------------------------------------------------------------
  # Policy 5: Waste remediation (idle/unused resource cleanup)
  # Mirrors Uniskai's UniskaiPolicyWaste approach
  # -----------------------------------------------------------------
  XamOpsPolicyWaste:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: XamOpsPolicyWaste-uat
      Description: Waste remediation permissions for XamOps - clean up idle snapshots, volumes, AMIs, stopped instances, unused log groups
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: XamOpsWasteRemediation
            Effect: Allow
            Action:
              - 'application-autoscaling:RegisterScalableTarget'
              - 'autoscaling:DescribeAutoScalingGroups'
              - 'ec2:DeleteNetworkInterface'
              - 'ec2:DeleteSnapshot'
              - 'ec2:DeleteVolume'
              - 'ec2:DeregisterImage'
              - 'ec2:DescribeAddresses'
              - 'ec2:DescribeImages'
              - 'ec2:DescribeInstances'
              - 'ec2:DescribeLaunchTemplateVersions'
              - 'ec2:DescribeSnapshots'
              - 'ec2:DescribeVolumes'
              - 'ec2:ReleaseAddress'
              - 'ec2:TerminateInstances'
