  # =================================================================
  # EKS CONFIGMAP AUTOMATION
  # =================================================================

  ConfigMapLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EKSDescribeAndModifyAuthConfigMapPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'eks:DescribeCluster'
                Resource: !Sub 'arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/*'
              - Effect: Allow
                Action: 'sts:GetCallerIdentity'
                Resource: '*'

  EKSAuthMapUpdaterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt ConfigMapLambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import logging
          import cfnresponse
          import boto3
          import base64
          import urllib3
          import os
          import time
          from botocore.signers import RequestSigner

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def get_bearer_token(cluster_name, region):
              sts_client = boto3.client('sts', region_name=region)
              service_id = sts_client.meta.service_model.service_id
              signer = RequestSigner(
                  service_id, region, 'sts', 'v4',
                  boto3.Session().get_credentials(),
                  boto3.Session().events
              )
              params = {
                  'method': 'GET',
                  'url': f'https://sts.{region}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15',
                  'body': {},
                  'headers': { 'x-k8s-aws-id': cluster_name },
                  'context': {}
              }
              signed_url = signer.generate_presigned_url(
                  params, region_name=region, expires_in=60, operation_name=''
              )
              base64_url = base64.urlsafe_b64encode(signed_url.encode('utf-8')).rstrip(b'=').decode('utf-8')
              return 'k8s-aws-v1.' + base64_url

          def handler(event, context):
              request_type = event['RequestType']
              props = event['ResourceProperties']
              role_arn = props['RoleArn']
              cluster_names = props['ClusterNames']
              physical_resource_id = f"eks-auth-updater-{props.get('StackId', 'default')}"

              try:
                  if request_type == 'Delete':
                      logger.info("Stack deletion triggered. No action taken on aws-auth ConfigMap.")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)
                      return

                  if not cluster_names or not cluster_names[0]:
                      logger.info("No EKS cluster names provided. Skipping ConfigMap update.")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)
                      return

                  eks_client = boto3.client('eks')
                  for cluster_name in cluster_names:
                      cluster_name = cluster_name.strip()
                      if not cluster_name: continue

                      logger.info(f"Processing cluster: {cluster_name}")
                      cluster_info = eks_client.describe_cluster(name=cluster_name)['cluster']
                      endpoint = cluster_info['endpoint']
                      ca_data_b64 = cluster_info['certificateAuthority']['data']
                      region = cluster_info['arn'].split(':')[3]

                      ca_cert_file = '/tmp/ca.crt'
                      with open(ca_cert_file, 'wb') as f:
                          f.write(base64.b64decode(ca_data_b64))

                      token = get_bearer_token(cluster_name, region)
                      http = urllib3.PoolManager(ca_certs=ca_cert_file)

                      headers = {'Authorization': f'Bearer {token}'}
                      get_url = f"{endpoint}/api/v1/namespaces/kube-system/configmaps/aws-auth"

                      resp = http.request('GET', get_url, headers=headers)
                      if resp.status != 200:
                          raise Exception(f"Failed to get aws-auth ConfigMap for {cluster_name}: Status {resp.status} - {resp.data.decode('utf-8')}")

                      cm = json.loads(resp.data.decode('utf-8'))
                      map_roles_str = cm['data'].get('mapRoles', '[]')
                      map_roles = json.loads(map_roles_str) if map_roles_str else []

                      role_exists = any(entry.get('rolearn') == role_arn for entry in map_roles)

                      if not role_exists:
                          logger.info(f"Role ARN not found. Adding '{role_arn}' to ConfigMap for cluster '{cluster_name}'.")
                          map_roles.append({
                              'rolearn': role_arn,
                              'username': 'xamops-admin-role:{{SessionName}}',
                              'groups': ['system:masters']
                          })
                          cm['data']['mapRoles'] = json.dumps(map_roles, indent=2)

                          patch_headers = headers.copy()
                          patch_headers['Content-Type'] = 'application/strategic-merge-patch+json'

                          patch_payload = json.dumps({'data': cm['data']})
                          patch_resp = http.request('PATCH', get_url, headers=patch_headers, body=patch_payload.encode('utf-8'))

                          if patch_resp.status != 200:
                              raise Exception(f"Failed to update aws-auth ConfigMap for {cluster_name}: Status {patch_resp.status} - {patch_resp.data.decode('utf-8')}")

                          logger.info(f"Successfully added role to aws-auth ConfigMap for cluster {cluster_name}")
                      else:
                          updated = False
                          for entry in map_roles:
                              if entry.get('rolearn') == role_arn:
                                  if 'system:masters' not in entry.get('groups', []):
                                      entry['groups'] = ['system:masters']
                                      entry['username'] = 'xamops-admin-role:{{SessionName}}'
                                      updated = True
                                  break

                          if updated:
                              cm['data']['mapRoles'] = json.dumps(map_roles, indent=2)
                              patch_headers = headers.copy()
                              patch_headers['Content-Type'] = 'application/strategic-merge-patch+json'
                              patch_payload = json.dumps({'data': cm['data']})
                              patch_resp = http.request('PATCH', get_url, headers=patch_headers, body=patch_payload.encode('utf-8'))
                              if patch_resp.status != 200:
                                  raise Exception(f"Failed to update aws-auth ConfigMap for {cluster_name}: Status {patch_resp.status} - {patch_resp.data.decode('utf-8')}")
                              logger.info(f"Upgraded role to system:masters for cluster {cluster_name}")
                          else:
                              logger.info(f"Role {role_arn} already has system:masters access for cluster {cluster_name}. No changes made.")

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)

              except Exception as e:
                  logger.error(f"Error processing EKS auth config: {e}", exc_info=True)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)}, physical_resource_id)

  EKSAuthConfig:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt EKSAuthMapUpdaterFunction.Arn
      RoleArn: !GetAtt XamOpsReadWriteRole.Arn
      ClusterNames: !Ref EKSClusterNames
      StackId: !Ref AWS::StackId

  # =================================================================
  # AUTOSPOTTING — Event Forwarder Lambda + IAM Role
  # =================================================================

  AutoSpottingEventForwarderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: xamops-autospotting-forwarder-role-uat
      Description: IAM role for AutoSpotting event forwarder Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SendToXammerSQS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowSendToXammerQueue
                Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueUrl
                Resource: !Sub 'arn:aws:sqs:${XammerRegion}:${XamOpsAccountId}:autospotting-events.fifo'
              - Sid: AllowEC2Describe
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeSpotPriceHistory
                Resource: '*'
      Tags:
        - Key: Service
          Value: XamOps-AutoSpotting
        - Key: ManagedBy
          Value: CloudFormation

  AutoSpottingEventForwarderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: xamops-autospotting-event-forwarder-uat
      Description: Forward EC2 spot instance events to XamOps AutoSpotting engine
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt AutoSpottingEventForwarderRole.Arn
      Timeout: 30
      Environment:
        Variables:
          XAMMER_SQS_QUEUE_URL: !Ref XammerSQSQueueUrl
          XAMMER_REGION: !Ref XammerRegion
          CUSTOMER_ACCOUNT_ID: !Ref 'AWS::AccountId'
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime

          sqs = boto3.client('sqs', region_name=os.environ['XAMMER_REGION'])

          def lambda_handler(event, context):
              """Forward EC2 spot events and interruption warnings to XamOps SQS queue"""

              print(f"Received event: {json.dumps(event)}")

              detail_type = event.get('detail-type', '')
              detail = event.get('detail', {})
              instance_id = detail.get('instance-id', 'unknown')
              state = detail.get('state', '')
              instance_lifecycle = detail.get('instance-lifecycle', '')

              # Always forward Spot interruption warnings (no instance-lifecycle field)
              is_interruption = (detail_type == 'EC2 Spot Instance Interruption Warning')

              # For state-change events: forward Spot launches and OD launches
              # (OD launches indicate Spot was unavailable — useful for fallback tracking)
              is_spot_launch = (state == 'running' and instance_lifecycle == 'spot')
              is_od_launch = (state == 'running' and instance_lifecycle == 'normal')
              is_termination = (state in ('terminated', 'stopped') and instance_lifecycle == 'spot')

              if not (is_interruption or is_spot_launch or is_od_launch or is_termination):
                  print(f"Skipping event: detail-type={detail_type} state={state} lifecycle={instance_lifecycle}")
                  return {'statusCode': 200, 'body': 'Event not relevant'}

              enriched_event = {
                  'version': event.get('version'),
                  'id': event.get('id'),
                  'detail-type': detail_type,
                  'source': event.get('source'),
                  'account': os.environ['CUSTOMER_ACCOUNT_ID'],
                  'time': event.get('time'),
                  'region': event.get('region'),
                  'resources': event.get('resources', []),
                  'detail': detail
              }

              try:
                  dedup_id = f"{instance_id}-{state or detail_type}-{event.get('time', '')}"
                  response = sqs.send_message(
                      QueueUrl=os.environ['XAMMER_SQS_QUEUE_URL'],
                      MessageBody=json.dumps(enriched_event),
                      MessageGroupId='customer-events',
                      MessageDeduplicationId=dedup_id
                  )
                  print(f"Forwarded {detail_type} event for {instance_id}: {response['MessageId']}")
                  return {
                      'statusCode': 200,
                      'body': json.dumps({'message': 'Event forwarded successfully', 'messageId': response['MessageId']})
                  }
              except Exception as e:
                  print(f"Error forwarding event: {str(e)}")
                  raise
      Tags:
        - Key: Service
          Value: XamOps-AutoSpotting
        - Key: ManagedBy
          Value: CloudFormation

  AutoSpottingForwarderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AutoSpottingEventForwarderFunction}'
      RetentionInDays: 7

  # =================================================================
  # EVENTBRIDGE RULES — capture Spot events in this account
  # =================================================================

  SpotInstanceLaunchRule:
    Type: AWS::Events::Rule
    Properties:
      Name: xamops-autospotting-spot-launch
      Description: Capture spot instance launch events and forward to XamOps
      State: !If [IsAutoSpottingEnabled, ENABLED, DISABLED]
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Instance State-change Notification
        detail:
          state:
            - running
          instance-lifecycle:
            - spot
      Targets:
        - Arn: !GetAtt AutoSpottingEventForwarderFunction.Arn
          Id: XamOpsSpotLaunchTarget

  LaunchRuleLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutoSpottingEventForwarderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SpotInstanceLaunchRule.Arn

  SpotInstanceTerminationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: xamops-autospotting-spot-termination
      Description: Capture spot instance termination events and forward to XamOps
      State: !If [IsAutoSpottingEnabled, ENABLED, DISABLED]
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Instance State-change Notification
        detail:
          state:
            - terminated
            - stopped
          instance-lifecycle:
            - spot
      Targets:
        - Arn: !GetAtt AutoSpottingEventForwarderFunction.Arn
          Id: XamOpsSpotTerminationTarget

  TerminationRuleLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutoSpottingEventForwarderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SpotInstanceTerminationRule.Arn

  SpotInterruptionRule:
    Type: AWS::Events::Rule
    Properties:
      Name: xamops-autospotting-spot-interruption
      Description: Capture Spot interruption warnings (2-min notice) and forward to XamOps
      State: !If [IsAutoSpottingEnabled, ENABLED, DISABLED]
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Spot Instance Interruption Warning
      Targets:
        - Arn: !GetAtt AutoSpottingEventForwarderFunction.Arn
          Id: XamOpsInterruptionTarget

  InterruptionRuleLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutoSpottingEventForwarderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SpotInterruptionRule.Arn

  ODFallbackRule:
    Type: AWS::Events::Rule
    Properties:
      Name: xamops-autospotting-od-fallback
      Description: Capture OD launches to detect when Spot is unavailable
      State: !If [IsAutoSpottingEnabled, ENABLED, DISABLED]
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Instance State-change Notification
        detail:
          state:
            - running
          instance-lifecycle:
            - normal
      Targets:
        - Arn: !GetAtt AutoSpottingEventForwarderFunction.Arn
          Id: XamOpsODFallbackTarget

  ODFallbackRuleLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutoSpottingEventForwarderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ODFallbackRule.Arn

  # =================================================================
  # CLOUDWATCH ALARMS — monitor the event forwarder Lambda
  # =================================================================

  AutoSpottingLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: xamops-autospotting-forwarder-errors
      AlarmDescription: Alert when AutoSpotting event forwarder Lambda encounters errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AutoSpottingEventForwarderFunction
      TreatMissingData: notBreaching

  AutoSpottingLambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: xamops-autospotting-forwarder-throttles
      AlarmDescription: Alert when AutoSpotting event forwarder Lambda is throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AutoSpottingEventForwarderFunction
      TreatMissingData: notBreaching

  # =================================================================
  # INVENTORY EVENTS (nested)
  #
  # Nested rather than inlined so the same logic serves the read-only and
  # read-write templates across every environment without six copies to keep
  # in step. The nested stack discovers the account's enabled regions itself,
  # so single- and multi-region customers deploy exactly the same thing and
  # nobody has to declare a region list up front.
  # =================================================================
  XamOpsInventoryEvents:
    Type: AWS::CloudFormation::Stack
    Condition: DeployInventoryEvents
    Properties:
      TemplateURL: !Ref XamOpsInventoryTemplateUrl
      # Comfortably longer than the fan-out needs; a region that hangs must not
      # leave the parent stack waiting indefinitely.
      TimeoutInMinutes: 20
      Parameters:
        XamOpsAccountId: !Ref XamOpsAccountId
        XamOpsSQSQueueUrl: !Ref XamOpsInventoryQueueUrl
        XamOpsRegion: !Ref XamOpsInventoryRegion
        IncludeSecurityFindings: !Ref IncludeSecurityFindings
        ResourceSuffix: !Ref XamOpsInventoryResourceSuffix

  # =================================================================
  # CUR in us-east-1 from a parent stack in ANY region
  #
  # Replaces the region-locked CUR nested stacks. AWS::CUR::ReportDefinition and
  # AWS::BCMDataExports::Export only exist in us-east-1, and a native nested stack is
  # always created in its parent's region. This custom-resource Lambda runs in the
  # parent's region but pins every CUR / Data Exports / S3 call to us-east-1, so the
  # shared bucket (xamops-cur-<id>), the CUR 1.0 report and the CUR 2.0 export all land
  # in us-east-1 regardless of where this stack lives. Rides along on a normal
  # "Update stack", so connected accounts get CUR without re-onboarding or moving region.
  # Bucket/report/prefix names below are byte-for-byte what the backend already expects.
  # =================================================================
  XamOpsCurManagerRole:
    Type: AWS::IAM::Role
    Condition: CreatesOwnCurBucket
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: XamOpsCurManagerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CurBucket
                Effect: Allow
                Action:
                  - 's3:CreateBucket'
                  - 's3:PutBucketPolicy'
                  - 's3:GetBucketPolicy'
                  - 's3:PutBucketPublicAccessBlock'
                  - 's3:PutEncryptionConfiguration'
                  - 's3:PutBucketLifecycleConfiguration'
                  - 's3:PutBucketOwnershipControls'
                  - 's3:PutBucketTagging'
                  - 's3:GetBucketLocation'
                  - 's3:ListBucket'
                Resource:
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/*'
              - Sid: CurReportDefinition
                Effect: Allow
                Action:
                  - 'cur:PutReportDefinition'
                  - 'cur:DescribeReportDefinitions'
                  - 'cur:DeleteReportDefinition'
                Resource: '*'
              - Sid: CurDataExport
                Effect: Allow
                Action:
                  - 'bcm-data-exports:CreateExport'
                  - 'bcm-data-exports:GetExport'
                  - 'bcm-data-exports:ListExports'
                  - 'bcm-data-exports:UpdateExport'
                  - 'bcm-data-exports:DeleteExport'
                Resource: '*'

  XamOpsCurManagerFunction:
    Type: AWS::Lambda::Function
    Condition: CreatesOwnCurBucket
    Properties:
      Handler: index.handler
      Role: !GetAtt XamOpsCurManagerRole.Arn
      Runtime: python3.12
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import logging
          import time
          import boto3
          import cfnresponse
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # Everything CUR lives in us-east-1 regardless of the stack's region.
          CUR_REGION = 'us-east-1'

          # CUR 2.0 export column selection. Kept byte-for-byte in sync with
          # cloudformation/xamops-cur-export-nested.yaml — do NOT reintroduce the CUR 1.0
          # names product_product_name or reservation_amortized_upfront_fee_for_usage; CUR
          # 2.0 rejects the whole export for them.
          CUR2_QUERY = (
              "SELECT bill_bill_type, bill_payer_account_id, bill_billing_entity, "
              "line_item_usage_account_id, line_item_line_item_type, "
              "line_item_usage_start_date, line_item_usage_end_date, "
              "line_item_product_code, product_servicecode, product_region_code, "
              "line_item_usage_type, line_item_operation, line_item_resource_id, "
              "line_item_usage_amount, line_item_unblended_rate, "
              "line_item_unblended_cost, line_item_blended_cost, pricing_unit, "
              "pricing_public_on_demand_cost, "
              "reservation_amortized_upfront_cost_for_usage, "
              "savings_plan_savings_plan_effective_cost "
              "FROM COST_AND_USAGE_REPORT"
          )

          def _bucket_exists(s3, bucket):
              try:
                  s3.head_bucket(Bucket=bucket)
                  return True
              except ClientError as e:
                  code = e.response.get('Error', {}).get('Code', '')
                  if code in ('404', 'NoSuchBucket'):
                      return False
                  # 403 means it exists but is owned elsewhere; treat as "exists" so we do
                  # not try to recreate it. Any other error re-raises.
                  if code == '403':
                      return True
                  raise

          def ensure_bucket(account_id):
              # Creates the shared xamops-cur-<id> bucket in us-east-1 and applies the exact
              # config the two former nested templates set. Idempotent: an existing bucket is
              # left in place and its config is re-asserted (safe to repeat).
              bucket = 'xamops-cur-' + account_id
              s3 = boto3.client('s3', region_name=CUR_REGION)
              if not _bucket_exists(s3, bucket):
                  try:
                      # us-east-1 CreateBucket must NOT send a LocationConstraint.
                      s3.create_bucket(Bucket=bucket)
                      logger.info("Created bucket %s", bucket)
                  except ClientError as e:
                      code = e.response.get('Error', {}).get('Code', '')
                      if code not in ('BucketAlreadyOwnedByYou', 'BucketAlreadyExists'):
                          raise
                      logger.info("Bucket %s already present (%s)", bucket, code)

              s3.put_public_access_block(
                  Bucket=bucket,
                  PublicAccessBlockConfiguration={
                      'BlockPublicAcls': True, 'BlockPublicPolicy': True,
                      'IgnorePublicAcls': True, 'RestrictPublicBuckets': True,
                  },
              )
              s3.put_bucket_encryption(
                  Bucket=bucket,
                  ServerSideEncryptionConfiguration={
                      'Rules': [{'ApplyServerSideEncryptionByDefault': {'SSEAlgorithm': 'AES256'}}]
                  },
              )
              try:
                  s3.put_bucket_ownership_controls(
                      Bucket=bucket,
                      OwnershipControls={'Rules': [{'ObjectOwnership': 'BucketOwnerEnforced'}]},
                  )
              except ClientError as e:
                  logger.warning("put_bucket_ownership_controls failed (non-fatal): %s", e)
              # Lifecycle: expire the Athena scratch prefix (CUR 1.0 template) and age out
              # raw CUR 2.0 exports after 90 days (CUR 2.0 template). Both prefixes coexist.
              s3.put_bucket_lifecycle_configuration(
                  Bucket=bucket,
                  LifecycleConfiguration={'Rules': [
                      {
                          'ID': 'ExpireAthenaResults', 'Status': 'Enabled',
                          'Filter': {'Prefix': 'xamops-athena-results/'},
                          'Expiration': {'Days': 7},
                          'AbortIncompleteMultipartUpload': {'DaysAfterInitiation': 1},
                      },
                      {
                          'ID': 'ExpireOldExports', 'Status': 'Enabled',
                          'Filter': {'Prefix': 'cur2/'},
                          'Expiration': {'Days': 90},
                      },
                  ]},
              )
              # Bucket policy carries BOTH delivery principals so CUR 1.0 (billingreports)
              # and CUR 2.0 (bcm-data-exports) can write to the one shared bucket. Both
              # services validate this policy at report/export creation time.
              arn = 'arn:aws:s3:::' + bucket
              policy = {
                  'Version': '2012-10-17',
                  'Statement': [
                      {
                          'Sid': 'AllowBillingReportsGetBucketAcl',
                          'Effect': 'Allow',
                          'Principal': {'Service': 'billingreports.amazonaws.com'},
                          'Action': ['s3:GetBucketAcl', 's3:GetBucketPolicy'],
                          'Resource': arn,
                          'Condition': {'StringEquals': {
                              'aws:SourceAccount': account_id,
                              'aws:SourceArn': 'arn:aws:cur:us-east-1:' + account_id + ':definition/*',
                          }},
                      },
                      {
                          'Sid': 'AllowBillingReportsPutObject',
                          'Effect': 'Allow',
                          'Principal': {'Service': 'billingreports.amazonaws.com'},
                          'Action': 's3:PutObject',
                          'Resource': arn + '/*',
                          'Condition': {'StringEquals': {
                              'aws:SourceAccount': account_id,
                              'aws:SourceArn': 'arn:aws:cur:us-east-1:' + account_id + ':definition/*',
                          }},
                      },
                      {
                          'Sid': 'EnableAWSDataExportsToWriteToS3',
                          'Effect': 'Allow',
                          'Principal': {'Service': 'bcm-data-exports.amazonaws.com'},
                          'Action': 's3:PutObject',
                          'Resource': arn + '/*',
                          'Condition': {
                              'ArnLike': {'aws:SourceArn': 'arn:aws:bcm-data-exports:us-east-1:' + account_id + ':export/*'},
                              'StringEquals': {'aws:SourceAccount': account_id},
                          },
                      },
                  ],
              }
              s3.put_bucket_policy(Bucket=bucket, Policy=json.dumps(policy))
              logger.info("Bucket %s configured", bucket)
              return bucket

          def ensure_cur1_report(bucket):
              # CUR 1.0 ReportDefinition. Idempotent: a DuplicateReportName means it already
              # exists, which we treat as success (a legacy CUR's immutable settings cannot
              # be changed in place anyway). Note: AdditionalArtifacts is intentionally
              # omitted — the API rejects an empty list, and we want none.
              cur = boto3.client('cur', region_name=CUR_REGION)
              definition = {
                  'ReportName': 'xamops-cur',
                  'TimeUnit': 'HOURLY',
                  'Format': 'Parquet',
                  'Compression': 'Parquet',
                  'AdditionalSchemaElements': ['RESOURCES'],
                  'S3Bucket': bucket,
                  'S3Prefix': 'cur',
                  'S3Region': CUR_REGION,
                  'RefreshClosedReports': True,
                  'ReportVersioning': 'OVERWRITE_REPORT',
              }
              # The bucket policy granting billingreports.amazonaws.com was just written and
              # may not have propagated; PutReportDefinition validates it and can reject with
              # ValidationException until it has. Retry a few times with backoff.
              last_err = None
              for attempt in range(6):
                  try:
                      cur.put_report_definition(ReportDefinition=definition)
                      logger.info("Created CUR 1.0 report xamops-cur")
                      return
                  except ClientError as e:
                      code = e.response.get('Error', {}).get('Code', '')
                      if code == 'DuplicateReportNameException':
                          logger.info("CUR 1.0 report already present")
                          return
                      last_err = e
                      logger.warning("put_report_definition attempt %d failed (%s): %s",
                                     attempt + 1, code, e)
                      time.sleep(10)
              # Exhausted retries — surface so the caller can decide (handler treats a
              # CUR-step failure as non-fatal so the stack still converges).
              raise last_err

          def ensure_cur2_export(account_id, bucket):
              # CUR 2.0 Data Export. Idempotent: if an export named xamops-cur2 already
              # exists we leave it; otherwise create it with the exact config the former
              # nested template used.
              de = boto3.client('bcm-data-exports', region_name=CUR_REGION)
              for page in de.get_paginator('list_exports').paginate():
                  for ref in page.get('Exports', []):
                      if ref.get('ExportName') == 'xamops-cur2':
                          logger.info("CUR 2.0 export already present")
                          return
              export = {
                  'Name': 'xamops-cur2',
                  'Description': 'XamOps BillOps invoice reconciliation export',
                  'DataQuery': {
                      'QueryStatement': CUR2_QUERY,
                      'TableConfigurations': {
                          'COST_AND_USAGE_REPORT': {
                              'TIME_GRANULARITY': 'DAILY',
                              'INCLUDE_RESOURCES': 'TRUE',
                          }
                      },
                  },
                  'DestinationConfigurations': {
                      'S3Destination': {
                          'S3Bucket': bucket,
                          'S3Prefix': 'cur2',
                          'S3Region': CUR_REGION,
                          'S3OutputConfigurations': {
                              'OutputType': 'CUSTOM',
                              'Format': 'TEXT_OR_CSV',
                              'Compression': 'GZIP',
                              'Overwrite': 'OVERWRITE_REPORT',
                          },
                      }
                  },
                  'RefreshCadence': {'Frequency': 'SYNCHRONOUS'},
              }
              try:
                  de.create_export(Export=export)
                  logger.info("Created CUR 2.0 export xamops-cur2")
              except ClientError as e:
                  code = e.response.get('Error', {}).get('Code', '')
                  # Treat an already-exists race as success.
                  if 'already' in str(e).lower() or code in ('ConflictException', 'ValidationException'):
                      logger.info("CUR 2.0 export create returned %s; treating as present", code)
                  else:
                      raise

          def handler(event, context):
              request_type = event['RequestType']
              props = event.get('ResourceProperties', {})
              account_id = props['AwsAccountId']
              enable_report = str(props.get('EnableCurReport', 'false')).lower() == 'true'
              enable_export = str(props.get('EnableCurExport', 'false')).lower() == 'true'
              physical_id = 'xamops-cur-manager-' + account_id

              try:
                  if request_type == 'Delete':
                      # Deliberately a no-op. The CUR bucket holds billing history that
                      # cannot be regenerated (the nested templates used DeletionPolicy:
                      # Retain for the same reason). We leave the bucket, report and export
                      # in place so stack deletion never destroys billing data or fails.
                      logger.info("Delete: leaving CUR bucket/report/export intact")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
                      return

                  # The bucket is the one hard requirement — a failure here is fatal, since
                  # the role's CUR read grants and BillOps both depend on it existing.
                  bucket = ensure_bucket(account_id)

                  # The report/export are best-effort and self-healing. AWS CUR / Data
                  # Exports validation can lag behind the bucket-policy write by a minute,
                  # and the report is re-asserted on every stack update, so a transient
                  # failure here must NOT roll the whole connection stack back. Log it and
                  # still succeed; the next update (or a manual re-run) converges it.
                  cur_warning = None
                  if enable_report:
                      try:
                          ensure_cur1_report(bucket)
                      except Exception as e:
                          cur_warning = 'CUR 1.0 report deferred: ' + str(e)
                          logger.error(cur_warning, exc_info=True)
                  if enable_export:
                      try:
                          ensure_cur2_export(account_id, bucket)
                      except Exception as e:
                          cur_warning = 'CUR 2.0 export deferred: ' + str(e)
                          logger.error(cur_warning, exc_info=True)

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'BucketName': bucket,
                      'Cur1Prefix': 'cur',
                      'Cur2Prefix': 'cur2',
                      'CurWarning': cur_warning or 'none',
                  }, physical_id)
              except Exception as e:
                  logger.error("CUR manager failed: %s", e, exc_info=True)
                  # Always respond so CloudFormation is never left hanging.
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)}, physical_id)

  # CUR 1.0 report + shared bucket. Attaches only when EnableCurReport is true.
  XamOpsCurReport:
    Type: AWS::CloudFormation::CustomResource
    Condition: DeployCurReport
    Properties:
      ServiceToken: !GetAtt XamOpsCurManagerFunction.Arn
      AwsAccountId: !Ref AWS::AccountId
      EnableCurReport: 'true'
      EnableCurExport: 'false'
      Revision: 'v1-cur1'

  # CUR 2.0 export + shared bucket. Attaches only when EnableCurExport is true.
  XamOpsCurExport:
    Type: AWS::CloudFormation::CustomResource
    Condition: DeployCurExport
    Properties:
      ServiceToken: !GetAtt XamOpsCurManagerFunction.Arn
      AwsAccountId: !Ref AWS::AccountId
      EnableCurReport: 'false'
      EnableCurExport: 'true'
      Revision: 'v1-cur2'

  # ===================================================================================
  # Stack updates from the XamOps console
  #
  # Lets XamOps bring this stack onto the current template through its Update Stack button,
  # so new permissions reach a connected account without anyone opening the AWS console.
  # Granted here at creation because this is the only moment it can be granted without a
  # manual step: the permission to update a stack lives in the role that stack defines, so
  # for an account connected before this existed the first grant has to be deployed
  # separately (xamops-stack-updater.yml).
  #
  # Built as a service role rather than granted to XamOps directly. CloudFormation assumes
  # this role to do the work, so XamOps itself holds only change-set actions and iam:PassRole
  # on this one role, never iam:CreateRole. iam:PassRole to a privileged role is still a real
  # escalation path; scoped to one role and one service principal it is the standard AWS
  # pattern, and every change lands in this account's own stack event history.
  # ===================================================================================
  XamOpsConnectionUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      # No RoleName, on purpose. An account connected before this existed gets its first
      # grant from xamops-stack-updater.yml, which creates a role literally named
      # XamOpsStackUpdaterRole. A fixed name here would collide with it the first time that
      # account's stack is upgraded onto this template, failing the very update the grant
      # exists to enable. XamOps reads the generated name from the XamOpsStackUpdaterRoleArn
      # output instead.
      Description: Assumed by CloudFormation to apply XamOps connection stack updates.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: XamOpsConnectionStackResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Same scope as xamops-stack-updater.yml, which enumerates every resource type
              # this stack and its nested stacks create. Reads are included deliberately:
              # CloudFormation calls them during rollback, and a missing read breaks it.
              - Sid: NestedStacks
                Effect: Allow
                Action: 'cloudformation:*'
                Resource:
                  - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${AWS::StackName}*/*'
                  - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:changeSet/*/*'
              - Sid: ReadXamOpsTemplates
                Effect: Allow
                Action: 's3:GetObject'
                Resource: 'arn:aws:s3:::xamopscftemplate/*'
              - Sid: ConnectionRolesAndPolicies
                Effect: Allow
                Action: 'iam:*'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/XamOps*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/XamOps*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/xamops*'
                  # This role's own generated name starts with the stack name, which is not
                  # guaranteed to begin with XamOps for a stack someone renamed.
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}*'
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'
              - Sid: CostAndUsageReport
                Effect: Allow
                Action: 'cur:*'
                Resource: '*'
              - Sid: ReportBucket
                Effect: Allow
                Action: 's3:*'
                Resource:
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/*'
              - Sid: DataExports
                Effect: Allow
                Action: 'bcm-data-exports:*'
                Resource: '*'
              - Sid: InventoryEvents
                Effect: Allow
                Action:
                  - 'events:*'
                  - 'lambda:*'
                  - 'logs:*'
                Resource: '*'

  # What XamOps itself gains: proposing and applying a change set on this stack, and nothing
  # else. A separate policy rather than an edit to the connection role's own, and named
  # differently from xamops-stack-updater.yml's, so the two can coexist on an account that
  # has both without either stack deleting the other's grant.
  XamOpsConnectionUpdatePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: XamOpsConnectionUpdate
      Roles:
        - !Ref XamOpsReadWriteRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ChangeSetsOnThisStackOnly
            Effect: Allow
            Action:
              - 'cloudformation:CreateChangeSet'
              - 'cloudformation:DescribeChangeSet'
              - 'cloudformation:ExecuteChangeSet'
              - 'cloudformation:DeleteChangeSet'
              - 'cloudformation:DescribeStacks'
              - 'cloudformation:DescribeStackEvents'
              - 'cloudformation:DescribeStackResource'
              - 'cloudformation:DescribeStackResources'
              - 'cloudformation:GetTemplate'
              - 'cloudformation:GetTemplateSummary'
            Resource:
              - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${AWS::StackName}*/*'
              - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:changeSet/*/*'
          # Deliberately absent: UpdateStack, CreateStack, DeleteStack. Every change goes
          # through a change set, so none can skip being written down before it runs.
          - Sid: HandTheWorkToCloudFormation
            Effect: Allow
            Action: 'iam:PassRole'
            Resource: !GetAtt XamOpsConnectionUpdaterRole.Arn
            Condition:
              StringEquals:
                'iam:PassedToService': 'cloudformation.amazonaws.com'

Outputs:
  XamOpsStackUpdaterRoleArn:
    Description: >
      Role XamOps passes to CloudFormation when updating this stack. Read by XamOps in place of
      a fixed role name, because this role's name is generated.
    Value: !GetAtt XamOpsConnectionUpdaterRole.Arn

  XamOpsRoleArn:
    Description: ARN of the IAM role created for the XamOps platform (Read-Write access).
    Value: !GetAtt XamOpsReadWriteRole.Arn

  XamOpsRoleName:
    Description: Name of the IAM role created for the XamOps platform.
    Value: !Ref XamOpsReadWriteRole

  # Managed policy ARNs — useful for auditing or attaching to other roles
  PolicyReadExtraArn:
    Description: ARN of the XamOps extra read permissions policy.
    Value: !Ref XamOpsPolicyReadExtra

  PolicyEC2ManageArn:
    Description: ARN of the XamOps EC2 management policy.
    Value: !Ref XamOpsPolicyEC2Manage

  PolicySpotsArn:
    Description: ARN of the XamOps AutoSpotting policy.
    Value: !Ref XamOpsPolicySpots

  PolicyTaggingArn:
    Description: ARN of the XamOps cross-service tagging policy.
    Value: !Ref XamOpsPolicyTagging

  PolicyWasteArn:
    Description: ARN of the XamOps waste remediation policy.
    Value: !Ref XamOpsPolicyWaste

  PolicyIAMManageArn:
    Description: ARN of the XamOps IAM management policy.
    Value: !Ref XamOpsPolicyIAMManage

  PolicyComputeManageArn:
    Description: ARN of the XamOps compute/database management policy.
    Value: !Ref XamOpsPolicyComputeManage

  PolicyStorageManageArn:
    Description: ARN of the XamOps storage management policy.
    Value: !Ref XamOpsPolicyStorageManage

  PolicyCostManageArn:
    Description: ARN of the XamOps cost management policy.
    Value: !Ref XamOpsPolicyCostManage

  CurExportEnabled:
    Description: Whether a CUR 2.0 Data Export was configured for BillOps.
    Value: !Ref EnableCurExport

  CurBucketName:
    Description: >
      S3 bucket receiving CUR 2.0 exports. Feed this into CloudAccount.curS3Bucket
      during account verification so BillOps can locate the export.
    Value: !If
      - CreatesOwnCurBucket
      - !Sub 'xamops-cur-${AWS::AccountId}'
      - 'disabled — no CUR configured; XamOps/BillOps will use Cost Explorer instead'

  CurReportPrefix:
    Description: >
      S3 key prefix under which CUR 2.0 files are delivered. Feed this into
      CloudAccount.curReportPath during account verification.
    Value: !If
      - DeployCurExport
      - 'cur2'
      - 'disabled'

  AutoSpottingForwarderFunctionArn:
    Description: ARN of the AutoSpotting event forwarder Lambda function.
    Value: !GetAtt AutoSpottingEventForwarderFunction.Arn

  AutoSpottingStatus:
    Description: AutoSpotting event forwarding status in this account.
    Value: !If [IsAutoSpottingEnabled, 'ENABLED', 'DISABLED']

  InventoryEventsEnabled:
    Description: Whether near-real-time inventory events were configured.
    Value: !Ref EnableInventoryEvents

  InventoryEventRegions:
    Description: >
      Regions where inventory event rules were created. Discovered automatically
      from this account's enabled regions.
    Value: !If
      - DeployInventoryEvents
      - !GetAtt XamOpsInventoryEvents.Outputs.RegionsConfigured
      - 'disabled — XamOps will poll every 60s instead'

  InventoryEventRegionCount:
    Description: Number of regions forwarding inventory events.
    Value: !If
      - DeployInventoryEvents
      - !GetAtt XamOpsInventoryEvents.Outputs.RegionCount
      - '0'
