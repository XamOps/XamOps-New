AWSTemplateFormatVersion: '2010-09-09'
Description: >
  XamOps Read-Only Access Stack (LOCAL DEV): Creates a secure, read-only IAM Role for the XamOps platform
  to monitor this AWS account. After stack creation, paste the Role ARN into the XamOps UI to complete setup.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "XamOps Platform Configuration"
        Parameters:
          - XamOpsAccountId
          - ExternalId
      - Label:
          default: "Amazon EKS Configuration"
        Parameters:
          - EKSClusterNames
      - Label:
          default: "Cost and Usage Report (Optional)"
        Parameters:
          - CurS3Bucket
    ParameterLabels:
      XamOpsAccountId:
        default: "XamOps AWS Account ID"
      ExternalId:
        default: "Unique External ID"
      EKSClusterNames:
        default: "EKS Cluster Names (Optional)"
      CurS3Bucket:
        default: "CUR S3 Bucket Name (leave blank if under a XamOps payer account)"

Parameters:
  XamOpsAccountId:
    Type: String
    Description: The 12-digit AWS Account ID for the XamOps platform. Provided by XamOps.
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS Account ID.

  ExternalId:
    Type: String
    Description: A unique secret value provided by XamOps to secure the connection.
    MinLength: 10

  EKSClusterNames:
    Type: CommaDelimitedList
    Description: (Optional) Comma-separated list of EKS cluster names.
    Default: ""

  # -------------------------------------------------------------------
  # Inventory events (near-real-time resource discovery)
  #
  # On by default. Without it XamOps still discovers resources, but by
  # polling every 60s instead of being told within seconds. Defaulting to
  # 'true' rather than making it opt-in matters: the feature costs this
  # account a few cents a month, and an opt-in flag buried in a stack
  # parameter is one almost nobody would ever turn on.
  # -------------------------------------------------------------------
  EnableInventoryEvents:
    Type: String
    # 'true', the same as every other template. This one defaulted to 'false' until the
    # local environment started being used to connect real accounts.
    #
    # The reason it was off: the nested stack creates account-wide singletons — the
    # xamops-inventory-hub event bus, XamOpsInventoryForwardRole-<account>, and two
    # fixed-name Lambdas — and only one stack per account can own them. Re-onboarding the
    # same account, which a development loop does constantly, failed on a name conflict
    # every time after the first, as an opaque nested-stack validation error that named
    # nothing useful.
    #
    # That trade stopped being worth it once real accounts came through here. It cost them
    # near-real-time discovery silently: resources appeared by 60s polling instead of
    # within seconds, and nobody looking at the account could see that its template had
    # differed from everyone else's.
    #
    # The conflict has not gone away, it has moved to the launch. Re-onboarding an account
    # that already owns those singletons still fails the same way — pass
    # EnableInventoryEvents=false for that one launch rather than changing this back.
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Forward resource change events to XamOps so new resources appear within
      seconds instead of up to a minute. Creates an EventBridge bus, rules in
      each of your enabled regions, and one small Lambda. Cost is typically
      under $0.10/month.
      Defaults to false on local because these resources are account-wide singletons
      and would collide with an existing XamOps deployment in the same account.

  IncludeSecurityFindings:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Also forward Security Hub, GuardDuty and AWS Config findings. These events
      are free on the default event bus.

  XamOpsInventoryQueueUrl:
    Type: String
    Description: URL of the XamOps inventory event queue.
    Default: 'https://sqs.ap-south-1.amazonaws.com/605134457560/xamops-inventory-events.fifo'

  XamOpsInventoryRegion:
    Type: String
    Description: Region hosting the XamOps inventory event queue.
    Default: 'ap-south-1'

  XamOpsInventoryTemplateUrl:
    Type: String
    Description: S3 URL of the nested inventory-events template.
    Default: 'https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-inventory-events-nested.yaml'

  # -------------------------------------------------------------------
  # Cost and Usage Report (CUR)
  #
  # Only needed when this account keeps its OWN CUR — a standalone account, or
  # a member account whose payer XamOps does not manage. Accounts that sit under
  # a XamOps management/payer account are covered by that MPA's own CUR, which
  # XamOps reads from its own bucket with its own credentials, so they leave
  # this blank and no CUR permission is added to this role at all.
  #
  # Blank also covers the case where no CUR is obtainable: a member account whose
  # payer never enabled linked-account access to billing data cannot create one,
  # and XamOps serves that account from the Cost Explorer API instead.
  # -------------------------------------------------------------------
  CurS3Bucket:
    Type: String
    Default: ''
    Description: >
      (Optional) Name of the S3 bucket holding this account's Cost and Usage Report.
      Leave blank if this account is under a XamOps payer account, or if you have no CUR.
      Use AUTO if you are also deploying the XamOps cost reporting stack, which creates
      xamops-cur-<this account id>.

Conditions:
  # Guards the nested stack. With inventory events off, nothing below is created
  # and the account simply relies on 60s polling.
  DeployInventoryEvents: !Equals [!Ref EnableInventoryEvents, 'true']

  # Whether the role is granted CUR read permissions at all. True whenever the
  # customer named a bucket (or passed AUTO). The CUR itself is created by the
  # separate us-east-1 CUR stack (xamops-cur-report.yml), not by this template.
  HasCurBucket: !Not [!Equals [!Ref CurS3Bucket, '']]

  # Whether the bucket is the one the CUR stack creates (xamops-cur-<account id>),
  # rather than one the customer named. 'AUTO' says so explicitly; an empty value
  # means the same implicitly.
  AutoCurBucket: !Or
    - !Equals [!Ref CurS3Bucket, 'AUTO']
    - !Equals [!Ref CurS3Bucket, '']

Resources:
  # =================================================================
  # 1. IAM Role for XamOps Platform to Assume
  # =================================================================
  XamOpsReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'XamOpsReadOnlyRole-local'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${XamOpsAccountId}:role/XamOps-App-EC2-Role'
                - !Sub 'arn:aws:iam::${XamOpsAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: XamOpsComprehensiveReadOnlyPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: 'XamOpsApplicationPermissions'
                Effect: Allow
                Action:
                  - 'acm:ListCertificates'
                  - 'access-analyzer:ListAnalyzers'
                  - 'access-analyzer:ListFindings'
                  - 'autoscaling:DescribeAutoScalingGroups'
                  - 'budgets:ViewBudget'
                  - 'budgets:ModifyBudget'
                  - 'ce:GetAnomalies'
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetDimensionValues'
                  - 'ce:GetReservationCoverage'
                  - 'ce:GetReservationPurchaseRecommendation'
                  - 'ce:GetReservationUtilization'
                  - 'cloudtrail:DescribeTrails'
                  - 'cloudtrail:GetTrailStatus'
                  - 'cloudtrail:LookupEvents'
                  - 'cloudwatch:DescribeAlarms'
                  - 'cloudwatch:GetMetricData'
                  - 'cloudwatch:GetMetricStatistics'
                  - 'compute-optimizer:GetEBSVolumeRecommendations'
                  - 'compute-optimizer:GetEc2InstanceRecommendations'
                  - 'compute-optimizer:GetLambdaFunctionRecommendations'
                  - 'dynamodb:DescribeTable'
                  - 'dynamodb:ListTables'
                  - 'ec2:Describe*'
                  - 'ecr:DescribeRepositories'
                  - 'ecs:DescribeClusters'
                  - 'ecs:ListClusters'
                  - 'eks:DescribeCluster'
                  - 'eks:ListClusters'
                  - 'elasticache:DescribeCacheClusters'
                  - 'elasticloadbalancing:DescribeLoadBalancers'
                  - 'elasticloadbalancing:DescribeTargetGroups'
                  - 'elasticloadbalancing:DescribeTargetHealth'
                  - 'iam:GetAccountPasswordPolicy'
                  - 'iam:GetGroupPolicy'
                  - 'iam:GetLoginProfile'
                  - 'iam:GetPolicy'
                  - 'iam:GetPolicyVersion'
                  - 'iam:GetRole'
                  - 'iam:GetRolePolicy'
                  - 'iam:GetUserPolicy'
                  - 'iam:ListAccessKeys'
                  - 'iam:ListAccountAliases'
                  - 'iam:ListAttachedGroupPolicies'
                  - 'iam:ListAttachedRolePolicies'
                  - 'iam:ListAttachedUserPolicies'
                  - 'iam:ListGroupPolicies'
                  - 'iam:ListGroups'
                  - 'iam:ListGroupsForUser'
                  - 'iam:ListMFADevices'
                  - 'iam:ListPolicies'
                  - 'iam:ListRolePolicies'
                  - 'iam:ListRoles'
                  - 'iam:ListUserPolicies'
                  - 'iam:ListUsers'
                  - 'kms:DescribeKey'
                  - 'kms:GetKeyRotationStatus'
                  - 'kms:ListKeys'
                  - 'lambda:ListFunctions'
                  - 'lambda:ListProvisionedConcurrencyConfigs'
                  - 'lambda:ListVersionsByFunction'
                  - 'logs:DescribeLogGroups'
                  - 'logs:DescribeLogStreams'
                  - 'logs:GetQueryResults'
                  - 'logs:StartQuery'
                  - 'organizations:DescribeAccount'
                  - 'organizations:ListAccounts'
                  - 'pricing:DescribeServices'
                  - 'pricing:GetProducts'
                  - 'pricing:ListPriceLists'
                  - 'rds:DescribeDBInstances'
                  - 'rds:DescribeDBSnapshots'
                  - 'rds:ListTagsForResource'
                  # Resource Explorer — inventory source. One cross-region Search
                  # replaces ~1000 per-service describes, at no charge. Read-only:
                  # these actions never create an index.
                  - 'resource-explorer-2:Search'
                  - 'resource-explorer-2:ListResources'
                  - 'resource-explorer-2:ListIndexes'
                  - 'resource-explorer-2:ListViews'
                  - 'resource-explorer-2:GetIndex'
                  - 'resource-explorer-2:GetView'
                  - 'resource-explorer-2:GetDefaultView'
                  # ------------------------------------------------------------------
                  # Index creation - the only non-read Resource Explorer action here.
                  #
                  # AWS does not auto-index opt-in regions (Hyderabad, Jakarta, Melbourne,
                  # UAE, Zurich, Spain, Milan, Cape Town, Bahrain, Osaka). Measured on a
                  # live account: 18 enabled regions, 17 indexed, and the 7 EC2 instances
                  # in the unindexed region were invisible to XamOps. Without this
                  # permission every customer using an opt-in region needs a manual fix
                  # before their inventory is complete, so the gap persists silently.
                  #
                  # A Resource Explorer index holds no customer data of its own and is free
                  # of charge - it only lets AWS answer "what exists in this region".
                  # Creation is one-time per region and idempotent.
                  # ------------------------------------------------------------------
                  - 'resource-explorer-2:CreateIndex'
                  # Promote the first index to AGGREGATOR when the account has none.
                  #
                  # CreateIndex alone is not enough. An account with a LOCAL index in every
                  # region and no aggregator is still enumerated one region at a time, so a
                  # resource created anywhere else is not slow to appear - it is invisible.
                  # That is the state every newly onboarded account starts in, and nothing
                  # else creates the first aggregator, so without this the fix stays a manual
                  # per-account chore.
                  #
                  # Only ever used when no aggregator exists; AWS allows one per account and
                  # a customer's own choice is never overridden.
                  - 'resource-explorer-2:UpdateIndexType'
                  # Fallback when Resource Explorer is blocked: one call per region.
                  - 'tag:GetResources'
                  - 'tag:GetTagKeys'
                  - 'route53:ListHostedZones'
                  - 's3:GetBucketAcl'
                  - 's3:GetBucketLocation'
                  - 's3:GetBucketPublicAccessBlock'
                  - 's3:GetLifecycleConfiguration'
                  - 's3:ListAccessGrantsInstances'
                  - 's3:ListAccessGrantsLocations'
                  - 's3:ListAllMyBuckets'
                  - 's3:ListBucket'
                  - 's3:ListBucketVersions'
                  - 's3:ListMultiRegionAccessPoints'
                  - 'servicequotas:ListServiceQuotas'
                  - 'sns:ListTopics'
                  - 'sqs:GetQueueAttributes'
                  - 'sqs:ListQueues'
                  - 'sts:GetCallerIdentity'
                  - 'aws-marketplace:SearchAgreements'
                  - 'aws-marketplace:DescribeAgreement'
                  - 'aws-marketplace:DescribeEntity'
                  - 'aws-marketplace:GetAgreementApprovalRequest'
                  - 'aws-marketplace:ListEntities'
                Resource: '*'

              # ------------------------------------------------------------------
              # MediaOps output storage
              #
              # MediaOps transcodes media and writes the output into a bucket of this
              # account by assuming this role, so it needs object writes even on the
              # read-only stack — without them every job fails at submission with
              # "not authorized to perform: s3:PutObject".
              #
              # Deliberately scoped to the xamops-mediaops/ key prefix (OUTPUT_ROOT in
              # AccountS3Service) rather than the whole bucket: the role can create and
              # remove only the objects XamOps itself wrote, and stays read-only for
              # every other object in every bucket. Keep this prefix in sync with
              # AccountS3Service.OUTPUT_ROOT.
              # ------------------------------------------------------------------
              # The single write action on this read-only role, isolated and
              # condition-scoped to one AWS service. Grants Resource Explorer a
              # complete, self-updating index; without it Search returns only
              # partial results. IAM evaluates iam:AWSServiceName, so no other
              # service-linked role can be created with this.
              - Sid: 'XamOpsResourceExplorerServiceLinkedRole'
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'
                Condition:
                  StringEquals:
                    'iam:AWSServiceName': 'resource-explorer-2.amazonaws.com'

              - Sid: 'XamOpsMediaOpsOutputWrite'
                Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                Resource: 'arn:aws:s3:::*/xamops-mediaops/*'

              # ------------------------------------------------------------------
              # Cost and Usage Report access
              #
              # Attached only when CurS3Bucket is set, i.e. when the CUR lives in
              # THIS account. Accounts under a XamOps payer account get nothing here.
              #
              # Most of what a CUR read needs is already granted by the
              # ReadOnlyAccess managed policy above (s3:GetObject, glue:Get*,
              # athena:GetQueryExecution/GetQueryResults). The two grants that are
              # genuinely new are athena:StartQueryExecution — a write action, so
              # absent from ReadOnlyAccess — and the s3:PutObject below.
              #
              # Athena has no mode that avoids writing query results, so reading a
              # CUR requires one object write. It is scoped to a dedicated prefix
              # rather than the bucket, following the same pattern as the MediaOps
              # carve-out above: the role can create only the objects XamOps itself
              # wrote, and stays read-only for every other object in the bucket.
              # Keep this prefix in sync with CurSource.athenaResultsLocation.
              # ------------------------------------------------------------------
              - !If
                - HasCurBucket
                - Sid: 'XamOpsCurBucketRead'
                  Effect: Allow
                  Action:
                    - 's3:GetObject'
                    - 's3:ListBucket'
                    - 's3:GetBucketLocation'
                  Resource:
                    - !If [AutoCurBucket, !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}', !Sub 'arn:aws:s3:::${CurS3Bucket}']
                    - !If [AutoCurBucket, !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/*', !Sub 'arn:aws:s3:::${CurS3Bucket}/*']
                - !Ref 'AWS::NoValue'

              - !If
                - HasCurBucket
                - Sid: 'XamOpsCurAthenaQuery'
                  Effect: Allow
                  Action:
                    - 'athena:StartQueryExecution'
                    - 'athena:StopQueryExecution'
                    - 'athena:GetQueryExecution'
                    - 'athena:GetQueryResults'
                    - 'athena:GetWorkGroup'
                  Resource: '*'
                - !Ref 'AWS::NoValue'

              - !If
                - HasCurBucket
                - Sid: 'XamOpsCurGlueCatalog'
                  Effect: Allow
                  Action:
                    - 'glue:GetDatabase'
                    - 'glue:GetDatabases'
                    - 'glue:GetTable'
                    - 'glue:GetTables'
                    - 'glue:GetPartition'
                    - 'glue:GetPartitions'
                    # Athena describes a CUR through a Glue table, and XamOps builds that
                    # table from the report's own manifest rather than running a crawler.
                    # The table is pure metadata over objects already in this account —
                    # dropping an EXTERNAL table deletes no data — but creating it needs
                    # these writes. It is recreated on each validation because a CUR gains
                    # columns over time as AWS adds product attributes and cost allocation
                    # tags are activated.
                    - 'glue:CreateDatabase'
                    - 'glue:CreateTable'
                    - 'glue:DeleteTable'
                    - 'glue:BatchCreatePartition'
                  Resource: '*'
                - !Ref 'AWS::NoValue'

              - !If
                - HasCurBucket
                - Sid: 'XamOpsCurAthenaResultsWrite'
                  Effect: Allow
                  Action:
                    - 's3:PutObject'
                    - 's3:AbortMultipartUpload'
                  Resource: !If
                    - AutoCurBucket
                    - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/xamops-athena-results/*'
                    - !Sub 'arn:aws:s3:::${CurS3Bucket}/xamops-athena-results/*'
                - !Ref 'AWS::NoValue'
        # -----------------------------------------------------------------
        # CloudK8s fleet read - roadmap Appendix 8.1 Catalog-A read delta.
        # Kept as its own inline policy: 2,722 compacted chars does not fit in
        # the headroom of any existing policy on this role, and the read-write
        # role is already at the 10 managed-policies-per-role quota. The four
        # ecr:* actions are deferred to Phase 3 by Appendix 8.1 itself.
        # -----------------------------------------------------------------
        - PolicyName: XamOpsPolicyEksFleetRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EksFleetInventory
                Effect: Allow
                Action:
                  - 'eks:ListNodegroups'
                  - 'eks:DescribeNodegroup'
                  - 'eks:ListAddons'
                  - 'eks:DescribeAddon'
                  - 'eks:DescribeAddonVersions'
                  - 'eks:DescribeAddonConfiguration'
                  - 'eks:ListFargateProfiles'
                  - 'eks:DescribeFargateProfile'
                  - 'eks:ListUpdates'
                  - 'eks:DescribeUpdate'
                  - 'eks:ListInsights'
                  - 'eks:DescribeInsight'
                  - 'eks:DescribeClusterVersions'
                  - 'eks:ListAccessEntries'
                  - 'eks:DescribeAccessEntry'
                  - 'eks:ListAssociatedAccessPolicies'
                  - 'eks:ListAccessPolicies'
                  - 'eks:ListPodIdentityAssociations'
                  - 'eks:DescribePodIdentityAssociation'
                  - 'eks:ListTagsForResource'
                Resource: '*'
              - Sid: SpotCapacityScoring
                Effect: Allow
                Action:
                  - 'ec2:GetSpotPlacementScores'
                Resource: '*'
              - Sid: CloudWatchMetricDiscovery
                Effect: Allow
                Action:
                  - 'cloudwatch:ListMetrics'
                Resource: '*'
              - Sid: CommitmentCoverageForEksSpend
                Effect: Allow
                Action:
                  - 'ce:GetSavingsPlansPurchaseRecommendation'
                  - 'ce:GetSavingsPlansCoverage'
                  - 'ce:GetSavingsPlansUtilization'
                  - 'ce:GetSavingsPlansUtilizationDetails'
                  - 'ce:GetCostAndUsageWithResources'
                  - 'ce:GetCostForecast'
                  - 'ce:GetUsageForecast'
                  - 'ce:GetRightsizingRecommendation'
                  - 'ce:GetTags'
                  - 'savingsplans:DescribeSavingsPlans'
                  - 'savingsplans:DescribeSavingsPlanRates'
                  - 'savingsplans:DescribeSavingsPlansOfferings'
                  - 'savingsplans:ListTagsForResource'
                Resource: '*'
              - Sid: OptimizerRecommendations
                Effect: Allow
                Action:
                  - 'compute-optimizer:GetAutoScalingGroupRecommendations'
                  - 'compute-optimizer:GetRecommendationSummaries'
                  - 'compute-optimizer:GetEffectiveRecommendationPreferences'
                  - 'compute-optimizer:GetRecommendationPreferences'
                  - 'cost-optimization-hub:ListRecommendations'
                  - 'cost-optimization-hub:GetRecommendation'
                  - 'cost-optimization-hub:ListRecommendationSummaries'
                  - 'cost-optimization-hub:GetPreferences'
                Resource: '*'
              - Sid: EksOptimizedAmiLookup
                Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                  - 'ssm:GetParameters'
                  - 'ssm:GetParametersByPath'
                Resource: 'arn:aws:ssm:*::parameter/aws/service/eks/*'
              - Sid: SplitCostAllocationExportRead
                Effect: Allow
                Action:
                  - 'bcm-data-exports:GetExport'
                  - 'bcm-data-exports:ListExports'
                  - 'bcm-data-exports:GetTable'
                  - 'bcm-data-exports:ListTables'
                  - 'bcm-data-exports:ListTagsForResource'
                Resource: '*'
              - Sid: StackDriftDetectionReadOnly
                Effect: Allow
                Action:
                  - 'cloudformation:DetectStackDrift'
                  - 'cloudformation:DetectStackResourceDrift'
                  - 'cloudformation:DescribeStackDriftDetectionStatus'
                  - 'cloudformation:DescribeStackResourceDrifts'
                  - 'cloudformation:ListStacks'
                  - 'cloudformation:DescribeStackSet'
                  - 'cloudformation:ListStackSets'
                  - 'cloudformation:ListStackInstances'
                  - 'cloudformation:DescribeStackInstance'
                  - 'cloudformation:DetectStackSetDrift'
                  - 'cloudformation:DescribeStackSetOperation'
                Resource: '*'


  # =================================================================
  # 2. IAM Role for the EKS Automation Lambda
  # =================================================================
  ConfigMapLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EKSDescribeAndModifyAuthConfigMapPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'eks:DescribeCluster'
                Resource: !Sub 'arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/*'
              - Effect: Allow
                Action: 'sts:GetCallerIdentity'
                Resource: '*'

  # =================================================================
  # 3. Lambda to Update EKS aws-auth ConfigMap
  # =================================================================
  EKSAuthMapUpdaterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt ConfigMapLambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import logging
          import cfnresponse
          import boto3
          import base64
          import urllib3
          import os
          import time
          from botocore.signers import RequestSigner

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def get_bearer_token(cluster_name, region):
              sts_client = boto3.client('sts', region_name=region)
              service_id = sts_client.meta.service_model.service_id
              signer = RequestSigner(
                  service_id, region, 'sts', 'v4',
                  boto3.Session().get_credentials(),
                  boto3.Session().events
              )
              params = {
                  'method': 'GET',
                  'url': f'https://sts.{region}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15',
                  'body': {},
                  'headers': { 'x-k8s-aws-id': cluster_name },
                  'context': {}
              }
              signed_url = signer.generate_presigned_url(
                  params, region_name=region, expires_in=60, operation_name=''
              )
              base64_url = base64.urlsafe_b64encode(signed_url.encode('utf-8')).rstrip(b'=').decode('utf-8')
              return 'k8s-aws-v1.' + base64_url

          def handler(event, context):
              request_type = event['RequestType']
              props = event['ResourceProperties']
              role_arn = props['RoleArn']
              cluster_names = props['ClusterNames']
              physical_resource_id = f"eks-auth-updater-{props.get('StackId', 'default')}"

              try:
                  if request_type == 'Delete':
                      logger.info("Stack deletion triggered. No action taken on aws-auth ConfigMap.")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)
                      return

                  if not cluster_names or not cluster_names[0]:
                      logger.info("No EKS cluster names provided. Skipping ConfigMap update.")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)
                      return

                  eks_client = boto3.client('eks')
                  for cluster_name in cluster_names:
                      cluster_name = cluster_name.strip()
                      if not cluster_name: continue

                      logger.info(f"Processing cluster: {cluster_name}")
                      cluster_info = eks_client.describe_cluster(name=cluster_name)['cluster']
                      endpoint = cluster_info['endpoint']
                      ca_data_b64 = cluster_info['certificateAuthority']['data']
                      region = cluster_info['arn'].split(':')[3]

                      ca_cert_file = '/tmp/ca.crt'
                      with open(ca_cert_file, 'wb') as f:
                          f.write(base64.b64decode(ca_data_b64))

                      token = get_bearer_token(cluster_name, region)
                      http = urllib3.PoolManager(ca_certs=ca_cert_file)

                      headers = {'Authorization': f'Bearer {token}'}
                      get_url = f"{endpoint}/api/v1/namespaces/kube-system/configmaps/aws-auth"

                      resp = http.request('GET', get_url, headers=headers)
                      if resp.status != 200:
                          raise Exception(f"Failed to get aws-auth ConfigMap for {cluster_name}: Status {resp.status} - {resp.data.decode('utf-8')}")

                      cm = json.loads(resp.data.decode('utf-8'))
                      map_roles_str = cm['data'].get('mapRoles', '[]')
                      map_roles = json.loads(map_roles_str) if map_roles_str else []

                      role_exists = any(entry.get('rolearn') == role_arn for entry in map_roles)

                      if not role_exists:
                          logger.info(f"Role ARN not found. Adding '{role_arn}' to ConfigMap for cluster '{cluster_name}'.")
                          map_roles.append({
                              'rolearn': role_arn,
                              'username': 'xamops-monitoring-role:{{SessionName}}',
                              'groups': ['system:viewers']
                          })
                          cm['data']['mapRoles'] = json.dumps(map_roles, indent=2)

                          patch_headers = headers.copy()
                          patch_headers['Content-Type'] = 'application/strategic-merge-patch+json'

                          patch_payload = json.dumps({'data': cm['data']})
                          patch_resp = http.request('PATCH', get_url, headers=patch_headers, body=patch_payload.encode('utf-8'))

                          if patch_resp.status != 200:
                              raise Exception(f"Failed to update aws-auth ConfigMap for {cluster_name}: Status {patch_resp.status} - {patch_resp.data.decode('utf-8')}")

                          logger.info(f"Successfully added role to aws-auth ConfigMap for cluster {cluster_name}")
                      else:
                          logger.info(f"Role {role_arn} already exists in aws-auth ConfigMap for cluster {cluster_name}. No changes made.")

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)

              except Exception as e:
                  logger.error(f"Error processing EKS auth config: {e}", exc_info=True)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)}, physical_resource_id)

  # =================================================================
  # 4. Custom Resource to Trigger EKS Lambda
  # =================================================================
  EKSAuthConfig:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt EKSAuthMapUpdaterFunction.Arn
      RoleArn: !GetAtt XamOpsReadOnlyRole.Arn
      ClusterNames: !Ref EKSClusterNames
      StackId: !Ref AWS::StackId

  # =================================================================
  # 5. Inventory Events (nested)
  #
  # Nested rather than inlined so the same logic serves the read-only and
  # read-write templates across every environment without six copies to keep
  # in step. The nested stack discovers the account's enabled regions itself,
  # so single- and multi-region customers deploy exactly the same thing and
  # nobody has to declare a region list up front.
  # =================================================================
  XamOpsInventoryEvents:
    Type: AWS::CloudFormation::Stack
    Condition: DeployInventoryEvents
    Properties:
      TemplateURL: !Ref XamOpsInventoryTemplateUrl
      # Comfortably longer than the fan-out needs; a region that hangs must not
      # leave the parent stack waiting indefinitely.
      TimeoutInMinutes: 20
      Parameters:
        XamOpsAccountId: !Ref XamOpsAccountId
        XamOpsSQSQueueUrl: !Ref XamOpsInventoryQueueUrl
        XamOpsRegion: !Ref XamOpsInventoryRegion
        IncludeSecurityFindings: !Ref IncludeSecurityFindings

  # ===================================================================================
  # Stack updates from the XamOps console
  #
  # Lets XamOps bring this stack onto the current template through its Update Stack button,
  # so new permissions reach a connected account without anyone opening the AWS console.
  # Granted here at creation because this is the only moment it can be granted without a
  # manual step: the permission to update a stack lives in the role that stack defines, so
  # for an account connected before this existed the first grant has to be deployed
  # separately (xamops-stack-updater.yml).
  #
  # Built as a service role rather than granted to XamOps directly. CloudFormation assumes
  # this role to do the work, so XamOps itself holds only change-set actions and iam:PassRole
  # on this one role, never iam:CreateRole. iam:PassRole to a privileged role is still a real
  # escalation path; scoped to one role and one service principal it is the standard AWS
  # pattern, and every change lands in this account's own stack event history.
  # ===================================================================================
  XamOpsConnectionUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      # No RoleName, on purpose. An account connected before this existed gets its first
      # grant from xamops-stack-updater.yml, which creates a role literally named
      # XamOpsStackUpdaterRole. A fixed name here would collide with it the first time that
      # account's stack is upgraded onto this template, failing the very update the grant
      # exists to enable. XamOps reads the generated name from the XamOpsStackUpdaterRoleArn
      # output instead.
      Description: Assumed by CloudFormation to apply XamOps connection stack updates.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: XamOpsConnectionStackResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Same scope as xamops-stack-updater.yml, which enumerates every resource type
              # this stack and its nested stacks create. Reads are included deliberately:
              # CloudFormation calls them during rollback, and a missing read breaks it.
              - Sid: NestedStacks
                Effect: Allow
                Action: 'cloudformation:*'
                Resource:
                  - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${AWS::StackName}*/*'
                  - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:changeSet/*/*'
              - Sid: ReadXamOpsTemplates
                Effect: Allow
                Action: 's3:GetObject'
                Resource: 'arn:aws:s3:::xamopscftemplate/*'
              - Sid: ConnectionRolesAndPolicies
                Effect: Allow
                Action: 'iam:*'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/XamOps*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/XamOps*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/xamops*'
                  # This role's own generated name starts with the stack name, which is not
                  # guaranteed to begin with XamOps for a stack someone renamed.
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}*'
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'
              - Sid: CostAndUsageReport
                Effect: Allow
                Action: 'cur:*'
                Resource: '*'
              - Sid: ReportBucket
                Effect: Allow
                Action: 's3:*'
                Resource:
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/*'
              - Sid: DataExports
                Effect: Allow
                Action: 'bcm-data-exports:*'
                Resource: '*'
              - Sid: InventoryEvents
                Effect: Allow
                Action:
                  - 'events:*'
                  - 'lambda:*'
                  - 'logs:*'
                Resource: '*'

  # What XamOps itself gains: proposing and applying a change set on this stack, and nothing
  # else. A separate policy rather than an edit to the connection role's own, and named
  # differently from xamops-stack-updater.yml's, so the two can coexist on an account that
  # has both without either stack deleting the other's grant.
  XamOpsConnectionUpdatePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: XamOpsConnectionUpdate
      Roles:
        - !Ref XamOpsReadOnlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ChangeSetsOnThisStackOnly
            Effect: Allow
            Action:
              - 'cloudformation:CreateChangeSet'
              - 'cloudformation:DescribeChangeSet'
              - 'cloudformation:ExecuteChangeSet'
              - 'cloudformation:DeleteChangeSet'
              - 'cloudformation:DescribeStacks'
              - 'cloudformation:DescribeStackEvents'
              - 'cloudformation:DescribeStackResource'
              - 'cloudformation:DescribeStackResources'
              - 'cloudformation:GetTemplate'
              - 'cloudformation:GetTemplateSummary'
            Resource:
              - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${AWS::StackName}*/*'
              - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:changeSet/*/*'
          # Deliberately absent: UpdateStack, CreateStack, DeleteStack. Every change goes
          # through a change set, so none can skip being written down before it runs.
          - Sid: HandTheWorkToCloudFormation
            Effect: Allow
            Action: 'iam:PassRole'
            Resource: !GetAtt XamOpsConnectionUpdaterRole.Arn
            Condition:
              StringEquals:
                'iam:PassedToService': 'cloudformation.amazonaws.com'

Outputs:
  XamOpsStackUpdaterRoleArn:
    Description: >
      Role XamOps passes to CloudFormation when updating this stack. Read by XamOps in place of
      a fixed role name, because this role's name is generated.
    Value: !GetAtt XamOpsConnectionUpdaterRole.Arn

  XamOpsRoleArn:
    Description: The ARN of the IAM role created for the XamOps platform.
    Value: !GetAtt XamOpsReadOnlyRole.Arn

  InventoryEventsEnabled:
    Description: Whether near-real-time inventory events were configured.
    Value: !Ref EnableInventoryEvents

  InventoryEventRegions:
    Description: >
      Regions where inventory event rules were created. Discovered automatically
      from this account's enabled regions.
    Value: !If
      - DeployInventoryEvents
      - !GetAtt XamOpsInventoryEvents.Outputs.RegionsConfigured
      - 'disabled — XamOps will poll every 60s instead'

  InventoryEventRegionCount:
    Description: Number of regions forwarding inventory events.
    Value: !If
      - DeployInventoryEvents
      - !GetAtt XamOpsInventoryEvents.Outputs.RegionCount
      - '0'
