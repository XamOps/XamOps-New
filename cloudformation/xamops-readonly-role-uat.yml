AWSTemplateFormatVersion: '2010-09-09'
Description: >
  XamOps Read-Only Access Stack: Creates a secure, read-only IAM Role for the XamOps platform
  to monitor this AWS account. Automatically notifies XamOps via EventBridge when setup is complete.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "XamOps Platform Configuration"
        Parameters:
          - XamOpsAccountId
          - ExternalId
          - XamOpsEventBusArn
      - Label:
          default: "Amazon EKS Configuration"
        Parameters:
          - EKSClusterNames
      - Label:
          default: "Cost and Usage Report (Optional)"
        Parameters:
          - CurS3Bucket
    ParameterLabels:
      XamOpsAccountId:
        default: "XamOps AWS Account ID"
      ExternalId:
        default: "Unique External ID"
      XamOpsEventBusArn:
        default: "XamOps EventBridge Bus ARN"
      EKSClusterNames:
        default: "EKS Cluster Names (Optional)"
      CurS3Bucket:
        default: "CUR S3 Bucket Name (leave blank if under a XamOps payer account)"

Parameters:
  XamOpsAccountId:
    Type: String
    Description: The 12-digit AWS Account ID for the XamOps platform. Provided by XamOps.
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS Account ID.

  ExternalId:
    Type: String
    Description: A unique secret value provided by XamOps to secure the connection.
    MinLength: 10

  XamOpsEventBusArn:
    Type: String
    Description: ARN of the XamOps EventBridge custom bus that receives the connection confirmation.
    Default: 'arn:aws:events:ap-south-1:605134457560:event-bus/xamops-onboarding-events'

  EKSClusterNames:
    Type: CommaDelimitedList
    Description: (Optional) Comma-separated list of EKS cluster names.
    Default: ""

  XamOpsCallbackUrl:
    Type: String
    Description: XamOps backend endpoint that receives the direct auto-connect callback.
    Default: 'https://uat.xamops.com/api/xamops/account-manager/eventbridge-callback'

  # -------------------------------------------------------------------
  # Inventory events (near-real-time resource discovery)
  #
  # On by default. Without it XamOps still discovers resources, but by
  # polling every 60s instead of being told within seconds. Defaulting to
  # 'true' rather than making it opt-in matters: the feature costs this
  # account a few cents a month, and an opt-in flag buried in a stack
  # parameter is one almost nobody would ever turn on.
  # -------------------------------------------------------------------
  EnableInventoryEvents:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Forward resource change events to XamOps so new resources appear within
      seconds instead of up to a minute. Creates an EventBridge bus, rules in
      each of your enabled regions, and one small Lambda. Cost is typically
      under $0.10/month.

  IncludeSecurityFindings:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Also forward Security Hub, GuardDuty and AWS Config findings. These events
      are free on the default event bus.

  XamOpsInventoryQueueUrl:
    Type: String
    Description: URL of the XamOps inventory event queue.
    Default: 'https://sqs.ap-south-1.amazonaws.com/605134457560/xamops-inventory-events.fifo'

  XamOpsInventoryRegion:
    Type: String
    Description: Region hosting the XamOps inventory event queue.
    Default: 'ap-south-1'

  XamOpsPrincipalRoleName:
    Type: String
    Default: 'XamOps-App-EC2-Role-new'
    Description: >
      Name of the IAM role the XamOps backend runs as. This is the ONLY principal
      allowed to assume the role created here.

      It must name the instance profile of the environment doing the connecting, and
      UAT differs from production: the UAT app server runs as
      XamOps-App-EC2-Role-new, production as XamOps-App-EC2-Role.

      This was hardcoded to XamOps-App-EC2-Role in every template, so a UAT
      connection produced a role whose trust policy excluded the very server trying
      to use it. The stack reached CREATE_COMPLETE and verification then failed with
      "Role assumption failed", which reads like a customer misconfiguration rather
      than ours.
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'

  XamOpsInventoryResourceSuffix:
    Type: String
    Default: '-uat'
    Description: >
      Suffix for the physically-named resources the inventory nested stack creates,
      so the SAME AWS account can be connected to more than one XamOps environment.

      Without it that stack fails AWS::EarlyValidation::ResourceExistenceCheck on
      four resources at once - the hub bus, the forward role and both Lambdas all
      exist already from the other environment's connection - and the parent rolls
      back reporting only "Validation failure detected".
    AllowedPattern: '^$|^-[a-z0-9-]{1,20}$'

  XamOpsInventoryTemplateUrl:
    Type: String
    Description: S3 URL of the nested inventory-events template.
    Default: 'https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-inventory-events-nested.yaml'

  # -------------------------------------------------------------------
  # Cost and Usage Report (CUR)
  #
  # Only needed when this account keeps its OWN CUR — a standalone account, or
  # a member account whose payer XamOps does not manage. Accounts that sit under
  # a XamOps management/payer account are covered by that MPA's own CUR, which
  # XamOps reads from its own bucket with its own credentials, so they leave
  # this blank and no CUR permission is added to this role at all.
  #
  # Blank also covers the case where no CUR is obtainable: a member account whose
  # payer never enabled linked-account access to billing data cannot create one,
  # and XamOps serves that account from the Cost Explorer API instead.
  # -------------------------------------------------------------------
  CurS3Bucket:
    Type: String
    Default: ''
    Description: >
      (Optional) Name of the S3 bucket holding this account's Cost and Usage Report.
      Leave blank if this account is under a XamOps payer account, or if you have no CUR.
      Use AUTO if you are also deploying the XamOps cost reporting stack, which creates
      xamops-cur-<this account id>.
  # CUR 2.0 Data Export (billing reconciliation for BillOps invoicing)
  #
  # On by default, same reasoning as EnableInventoryEvents. Cost to this
  # account is a few cents a month (S3 storage + requests only — Data
  # Exports itself has no AWS charge) and is purged automatically after
  # 90 days.
  # -------------------------------------------------------------------
  EnableCurExport:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Set up an AWS Cost and Usage Report (CUR 2.0) export to a dedicated S3
      bucket in this account, so BillOps can reconcile invoices from AWS's
      billing source of truth instead of Cost Explorer's aggregated totals.
      Creates one S3 bucket and one Data Export. Cost is typically a few
      cents a month.

  XamOpsCurExportTemplateUrl:
    Type: String
    Description: (Deprecated, unused) Former S3 URL of the nested CUR export template.
    Default: 'https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-cur-export-nested.yaml'

  # ---------------------------------------------------------------------------------
  # CUR 1.0 — the report XamOps itself reads.
  #
  # On by default, and nested here rather than left to a second launch link, because an
  # optional step is one most accounts never take: XamOps then shows Cost Explorer
  # figures everywhere and nobody can say why the per-resource and invoice views are
  # empty. CUR 2.0 above stays available but is off by default; the two write the same
  # bucket name and only one can own it.
  # ---------------------------------------------------------------------------------
  EnableCurReport:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Create an AWS Cost and Usage Report (CUR 1.0) in this account, so XamOps can show
      per-resource cost, invoice-level charges and data transfer breakdowns that the Cost
      Explorer API cannot express. Set to false for an account under a XamOps payer
      account, which is already covered by that payer's report.

  XamOpsCurReportTemplateUrl:
    Type: String
    Description: (Deprecated, unused) Former S3 URL of the nested CUR 1.0 report template.
    Default: 'https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-cur-report.yml'

Conditions:
  # Guards the nested stack. With inventory events off, nothing below is created
  # and the account simply relies on 60s polling.
  DeployInventoryEvents: !Equals [!Ref EnableInventoryEvents, 'true']

  # Guards the CUR export nested stack. With this off, BillOps simply keeps
  # reconciling this account's invoices from Cost Explorer.
  DeployCurExport: !Equals [!Ref EnableCurExport, 'true']

  # CUR is created by the XamOpsCurManagerFunction custom resource, which pins all
  # CUR / Data Exports / S3 calls to us-east-1 regardless of this stack's region.
  # No longer region-gated — only the EnableCurReport toggle decides it; a us-east-1
  # parent is handled by the same idempotent Lambda (create-if-absent).
  DeployCurReport: !Equals [!Ref EnableCurReport, 'true']

  # Whether the role is granted CUR read permissions at all.
  #
  # Deploying the export is itself a bucket: the nested stack creates
  # xamops-cur-<this account id> whether or not anyone named it here. Testing only
  # CurS3Bucket left the two defaults contradicting each other — EnableCurExport
  # defaults to 'true' and CurS3Bucket to '' — so a stack launched with defaults
  # created a CUR bucket and then withheld permission to read it. The data arrived
  # and every query against it failed with AccessDenied.
  #
  # Keeping the grant off entirely — rather than scoped to a wildcard — is what lets an
  # account under a XamOps MPA deploy this stack with the same permission surface it had
  # before CUR support existed. That account sets EnableCurExport to 'false'.
  # Either report writes the same bucket, xamops-cur-<this account id>, so the read
  # grant follows whichever one is on rather than being tied to the CUR 2.0 export.
  CreatesOwnCurBucket: !Or
    - !Condition DeployCurExport
    - !Condition DeployCurReport

  HasCurBucket: !Or
    - !Not [!Equals [!Ref CurS3Bucket, '']]
    - !Condition CreatesOwnCurBucket

  # Whether the bucket is the one the export nested stack creates, rather than one the
  # customer named. 'AUTO' says so explicitly; an empty value alongside the export says
  # so implicitly, and both have to resolve to the same ARN or the policy names a bucket
  # that does not exist.
  #
  # Derived here rather than passed in, because the onboarding UI does not know the account
  # id when it builds this launch URL. An IAM policy may name a bucket that does not exist
  # yet — it grants nothing until it does — so the two stacks can be launched in any order.
  AutoCurBucket: !Or
    - !Equals [!Ref CurS3Bucket, 'AUTO']
    - !And
      - !Equals [!Ref CurS3Bucket, '']
      - !Condition CreatesOwnCurBucket

Resources:
  # =================================================================
  # 1. IAM Role for XamOps Platform to Assume
  # =================================================================
  XamOpsReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'XamOpsReadOnlyRole-uat'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${XamOpsAccountId}:role/${XamOpsPrincipalRoleName}'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: XamOpsComprehensiveReadOnlyPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: 'XamOpsApplicationPermissions'
                Effect: Allow
                Action:
                  - 'acm:ListCertificates'
                  - 'access-analyzer:ListAnalyzers'
                  - 'access-analyzer:ListFindings'
                  - 'autoscaling:DescribeAutoScalingGroups'
                  - 'budgets:ViewBudget'
                  - 'budgets:ModifyBudget'
                  - 'ce:GetAnomalies'
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetDimensionValues'
                  - 'ce:GetReservationCoverage'
                  - 'ce:GetReservationPurchaseRecommendation'
                  - 'ce:GetReservationUtilization'
                  - 'cloudtrail:DescribeTrails'
                  - 'cloudtrail:GetTrailStatus'
                  - 'cloudtrail:LookupEvents'
                  - 'cloudwatch:DescribeAlarms'
                  - 'cloudwatch:GetMetricData'
                  - 'cloudwatch:GetMetricStatistics'
                  - 'compute-optimizer:GetEBSVolumeRecommendations'
                  - 'compute-optimizer:GetEc2InstanceRecommendations'
                  - 'compute-optimizer:GetLambdaFunctionRecommendations'
                  - 'dynamodb:DescribeTable'
                  - 'dynamodb:ListTables'
                  - 'ec2:Describe*'
                  - 'ecr:DescribeRepositories'
                  - 'ecs:DescribeClusters'
                  - 'ecs:ListClusters'
                  - 'eks:DescribeCluster'
                  - 'eks:ListClusters'
                  - 'elasticache:DescribeCacheClusters'
                  - 'elasticloadbalancing:DescribeLoadBalancers'
                  - 'elasticloadbalancing:DescribeTargetGroups'
                  - 'elasticloadbalancing:DescribeTargetHealth'
                  - 'iam:GetAccountPasswordPolicy'
                  - 'iam:GetGroupPolicy'
                  - 'iam:GetLoginProfile'
                  - 'iam:GetPolicy'
                  - 'iam:GetPolicyVersion'
                  - 'iam:GetRole'
                  - 'iam:GetRolePolicy'
                  - 'iam:GetUserPolicy'
                  - 'iam:ListAccessKeys'
                  - 'iam:ListAccountAliases'
                  - 'iam:ListAttachedGroupPolicies'
                  - 'iam:ListAttachedRolePolicies'
                  - 'iam:ListAttachedUserPolicies'
                  - 'iam:ListGroupPolicies'
                  - 'iam:ListGroups'
                  - 'iam:ListGroupsForUser'
                  - 'iam:ListMFADevices'
                  - 'iam:ListPolicies'
                  - 'iam:ListRolePolicies'
                  - 'iam:ListRoles'
                  - 'iam:ListUserPolicies'
                  - 'iam:ListUsers'
                  - 'kms:DescribeKey'
                  - 'kms:GetKeyRotationStatus'
                  - 'kms:ListKeys'
                  - 'lambda:ListFunctions'
                  - 'lambda:ListProvisionedConcurrencyConfigs'
                  - 'lambda:ListVersionsByFunction'
                  - 'logs:DescribeLogGroups'
                  - 'logs:DescribeLogStreams'
                  - 'logs:GetQueryResults'
                  - 'logs:StartQuery'
                  - 'organizations:DescribeAccount'
                  - 'organizations:ListAccounts'
                  - 'pricing:DescribeServices'
                  - 'pricing:GetProducts'
                  - 'pricing:ListPriceLists'
                  - 'rds:DescribeDBInstances'
                  - 'rds:DescribeDBSnapshots'
                  - 'rds:ListTagsForResource'
                  # Resource Explorer — inventory source. One cross-region Search
                  # replaces ~1000 per-service describes, at no charge. Read-only:
                  # these actions never create an index.
                  - 'resource-explorer-2:Search'
                  - 'resource-explorer-2:ListResources'
                  - 'resource-explorer-2:ListIndexes'
                  - 'resource-explorer-2:ListViews'
                  - 'resource-explorer-2:GetIndex'
                  - 'resource-explorer-2:GetView'
                  - 'resource-explorer-2:GetDefaultView'
                  # ------------------------------------------------------------------
                  # Index creation - the only non-read Resource Explorer action here.
                  #
                  # AWS does not auto-index opt-in regions (Hyderabad, Jakarta, Melbourne,
                  # UAE, Zurich, Spain, Milan, Cape Town, Bahrain, Osaka). Measured on a
                  # live account: 18 enabled regions, 17 indexed, and the 7 EC2 instances
                  # in the unindexed region were invisible to XamOps. Without this
                  # permission every customer using an opt-in region needs a manual fix
                  # before their inventory is complete, so the gap persists silently.
                  #
                  # A Resource Explorer index holds no customer data of its own and is free
                  # of charge - it only lets AWS answer "what exists in this region".
                  # Creation is one-time per region and idempotent.
                  # ------------------------------------------------------------------
                  - 'resource-explorer-2:CreateIndex'
                  # Promote the first index to AGGREGATOR when the account has none.
                  #
                  # CreateIndex alone is not enough. An account with a LOCAL index in every
                  # region and no aggregator is still enumerated one region at a time, so a
                  # resource created anywhere else is not slow to appear - it is invisible.
                  # That is the state every newly onboarded account starts in, and nothing
                  # else creates the first aggregator, so without this the fix stays a manual
                  # per-account chore.
                  #
                  # Only ever used when no aggregator exists; AWS allows one per account and
                  # a customer's own choice is never overridden.
                  - 'resource-explorer-2:UpdateIndexType'
                  # Fallback when Resource Explorer is blocked: one call per region.
                  - 'tag:GetResources'
                  - 'tag:GetTagKeys'
                  - 'route53:ListHostedZones'
                  - 's3:GetBucketAcl'
                  - 's3:GetBucketLocation'
                  - 's3:GetBucketPublicAccessBlock'
                  - 's3:GetLifecycleConfiguration'
                  - 's3:ListAccessGrantsInstances'
                  - 's3:ListAccessGrantsLocations'
                  - 's3:ListAllMyBuckets'
                  - 's3:ListBucket'
                  - 's3:ListBucketVersions'
                  - 's3:ListMultiRegionAccessPoints'
                  - 'servicequotas:ListServiceQuotas'
                  - 'sns:ListTopics'
                  - 'sqs:GetQueueAttributes'
                  - 'sqs:ListQueues'
                  - 'sts:GetCallerIdentity'
                  - 'aws-marketplace:SearchAgreements'
                  - 'aws-marketplace:DescribeAgreement'
                  - 'aws-marketplace:GetAgreementTerms'
                  - 'aws-marketplace:DescribeEntity'
                  - 'aws-marketplace:SendAgreementPaymentRequest'
                  - 'aws-marketplace:CancelAgreementPaymentRequest'
                  - 'aws-marketplace:GetAgreementPaymentRequest'
                  - 'aws-marketplace:ListEntities'
                  - 'aws-marketplace:SearchListings'
                  - 'aws-marketplace:GetListing'
                  - 'aws-marketplace:GetProduct'
                  - 'aws-marketplace:GetOffer'
                  - 'aws-marketplace:GetOfferTerms'
                  - 'aws-marketplace:ListPurchaseOptions'
                  - 'aws-marketplace:ListFulfillmentOptions'
                  - 'aws-marketplace:ListAgreementInvoiceLineItems'
                  - 'aws-marketplace:ListAgreementPaymentRequests'
                  - 'aws-marketplace:GetBillingAdjustmentRequest'
                  - 'aws-marketplace:BatchCreateBillingAdjustmentRequest'
                  - 'aws-marketplace:ListAgreementCancellationRequests'
                  - 'aws-marketplace:SendAgreementCancellationRequest'
                  - 'aws-marketplace:GetAgreementCancellationRequest'
                  - 'aws-marketplace:CancelAgreementCancellationRequest'
                Resource: '*'

              # ------------------------------------------------------------------
              # MediaOps output storage
              #
              # MediaOps transcodes media and writes the output into a bucket of this
              # account by assuming this role, so it needs object writes even on the
              # read-only stack — without them every job fails at submission with
              # "not authorized to perform: s3:PutObject".
              #
              # Deliberately scoped to the xamops-mediaops/ key prefix (OUTPUT_ROOT in
              # AccountS3Service) rather than the whole bucket: the role can create and
              # remove only the objects XamOps itself wrote, and stays read-only for
              # every other object in every bucket. Keep this prefix in sync with
              # AccountS3Service.OUTPUT_ROOT.
              # ------------------------------------------------------------------
              # The single write action on this read-only role, isolated and
              # condition-scoped to one AWS service. Grants Resource Explorer a
              # complete, self-updating index; without it Search returns only
              # partial results. IAM evaluates iam:AWSServiceName, so no other
              # service-linked role can be created with this.
              - Sid: 'XamOpsResourceExplorerServiceLinkedRole'
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'
                Condition:
                  StringEquals:
                    'iam:AWSServiceName': 'resource-explorer-2.amazonaws.com'

              - Sid: 'XamOpsMediaOpsOutputWrite'
                Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                Resource: 'arn:aws:s3:::*/xamops-mediaops/*'

              # ------------------------------------------------------------------
              # Cost and Usage Report access
              #
              # Attached only when CurS3Bucket is set, i.e. when the CUR lives in
              # THIS account. Accounts under a XamOps payer account get nothing here.
              #
              # Most of what a CUR read needs is already granted by the
              # ReadOnlyAccess managed policy above (s3:GetObject, glue:Get*,
              # athena:GetQueryExecution/GetQueryResults). The two grants that are
              # genuinely new are athena:StartQueryExecution — a write action, so
              # absent from ReadOnlyAccess — and the s3:PutObject below.
              #
              # Athena has no mode that avoids writing query results, so reading a
              # CUR requires one object write. It is scoped to a dedicated prefix
              # rather than the bucket, following the same pattern as the MediaOps
              # carve-out above: the role can create only the objects XamOps itself
              # wrote, and stays read-only for every other object in the bucket.
              # Keep this prefix in sync with CurSource.athenaResultsLocation.
              # ------------------------------------------------------------------
              - !If
                - HasCurBucket
                - Sid: 'XamOpsCurBucketRead'
                  Effect: Allow
                  Action:
                    - 's3:GetObject'
                    - 's3:ListBucket'
                    - 's3:GetBucketLocation'
                  Resource:
                    - !If [AutoCurBucket, !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}', !Sub 'arn:aws:s3:::${CurS3Bucket}']
                    - !If [AutoCurBucket, !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/*', !Sub 'arn:aws:s3:::${CurS3Bucket}/*']
                - !Ref 'AWS::NoValue'

              - !If
                - HasCurBucket
                - Sid: 'XamOpsCurAthenaQuery'
                  Effect: Allow
                  Action:
                    - 'athena:StartQueryExecution'
                    - 'athena:StopQueryExecution'
                    - 'athena:GetQueryExecution'
                    - 'athena:GetQueryResults'
                    - 'athena:GetWorkGroup'
                  Resource: '*'
                - !Ref 'AWS::NoValue'

              - !If
                - HasCurBucket
                - Sid: 'XamOpsCurGlueCatalog'
                  Effect: Allow
                  Action:
                    - 'glue:GetDatabase'
                    - 'glue:GetDatabases'
                    - 'glue:GetTable'
                    - 'glue:GetTables'
                    - 'glue:GetPartition'
                    - 'glue:GetPartitions'
                    # Athena describes a CUR through a Glue table, and XamOps builds that
                    # table from the report's own manifest rather than running a crawler.
                    # The table is pure metadata over objects already in this account —
                    # dropping an EXTERNAL table deletes no data — but creating it needs
                    # these writes. It is recreated on each validation because a CUR gains
                    # columns over time as AWS adds product attributes and cost allocation
                    # tags are activated.
                    - 'glue:CreateDatabase'
                    - 'glue:CreateTable'
                    - 'glue:DeleteTable'
                    - 'glue:BatchCreatePartition'
                  Resource: '*'
                - !Ref 'AWS::NoValue'

              - !If
                - HasCurBucket
                - Sid: 'XamOpsCurAthenaResultsWrite'
                  Effect: Allow
                  Action:
                    - 's3:PutObject'
                    - 's3:AbortMultipartUpload'
                  Resource: !If
                    - AutoCurBucket
                    - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/xamops-athena-results/*'
                    - !Sub 'arn:aws:s3:::${CurS3Bucket}/xamops-athena-results/*'
                - !Ref 'AWS::NoValue'

              # BillOps CUR read access — scoped to the dedicated
              # xamops-cur-{accountId} bucket created by the nested
              # XamOpsCurExport stack, not a wildcard.
              - Sid: 'XamOpsCurReadAccess'
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource:
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/*'
        # -----------------------------------------------------------------
        # CloudK8s fleet read - roadmap Appendix 8.1 Catalog-A read delta.
        # Kept as its own inline policy: 2,722 compacted chars does not fit in
        # the headroom of any existing policy on this role, and the read-write
        # role is already at the 10 managed-policies-per-role quota. The four
        # ecr:* actions are deferred to Phase 3 by Appendix 8.1 itself.
        # -----------------------------------------------------------------
        - PolicyName: XamOpsPolicyEksFleetRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EksFleetInventory
                Effect: Allow
                Action:
                  - 'eks:ListNodegroups'
                  - 'eks:DescribeNodegroup'
                  - 'eks:ListAddons'
                  - 'eks:DescribeAddon'
                  - 'eks:DescribeAddonVersions'
                  - 'eks:DescribeAddonConfiguration'
                  - 'eks:ListFargateProfiles'
                  - 'eks:DescribeFargateProfile'
                  - 'eks:ListUpdates'
                  - 'eks:DescribeUpdate'
                  - 'eks:ListInsights'
                  - 'eks:DescribeInsight'
                  - 'eks:DescribeClusterVersions'
                  - 'eks:ListAccessEntries'
                  - 'eks:DescribeAccessEntry'
                  - 'eks:ListAssociatedAccessPolicies'
                  - 'eks:ListAccessPolicies'
                  - 'eks:ListPodIdentityAssociations'
                  - 'eks:DescribePodIdentityAssociation'
                  - 'eks:ListTagsForResource'
                Resource: '*'
              - Sid: SpotCapacityScoring
                Effect: Allow
                Action:
                  - 'ec2:GetSpotPlacementScores'
                Resource: '*'
              - Sid: CloudWatchMetricDiscovery
                Effect: Allow
                Action:
                  - 'cloudwatch:ListMetrics'
                Resource: '*'
              - Sid: CommitmentCoverageForEksSpend
                Effect: Allow
                Action:
                  - 'ce:GetSavingsPlansPurchaseRecommendation'
                  - 'ce:GetSavingsPlansCoverage'
                  - 'ce:GetSavingsPlansUtilization'
                  - 'ce:GetSavingsPlansUtilizationDetails'
                  - 'ce:GetCostAndUsageWithResources'
                  - 'ce:GetCostForecast'
                  - 'ce:GetUsageForecast'
                  - 'ce:GetRightsizingRecommendation'
                  - 'ce:GetTags'
                  - 'savingsplans:DescribeSavingsPlans'
                  - 'savingsplans:DescribeSavingsPlanRates'
                  - 'savingsplans:DescribeSavingsPlansOfferings'
                  - 'savingsplans:ListTagsForResource'
                Resource: '*'
              - Sid: OptimizerRecommendations
                Effect: Allow
                Action:
                  - 'compute-optimizer:GetAutoScalingGroupRecommendations'
                  - 'compute-optimizer:GetRecommendationSummaries'
                  - 'compute-optimizer:GetEffectiveRecommendationPreferences'
                  - 'compute-optimizer:GetRecommendationPreferences'
                  - 'cost-optimization-hub:ListRecommendations'
                  - 'cost-optimization-hub:GetRecommendation'
                  - 'cost-optimization-hub:ListRecommendationSummaries'
                  - 'cost-optimization-hub:GetPreferences'
                Resource: '*'
              - Sid: EksOptimizedAmiLookup
                Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                  - 'ssm:GetParameters'
                  - 'ssm:GetParametersByPath'
                Resource: 'arn:aws:ssm:*::parameter/aws/service/eks/*'
              - Sid: SplitCostAllocationExportRead
                Effect: Allow
                Action:
                  - 'bcm-data-exports:GetExport'
                  - 'bcm-data-exports:ListExports'
                  - 'bcm-data-exports:GetTable'
                  - 'bcm-data-exports:ListTables'
                  - 'bcm-data-exports:ListTagsForResource'
                Resource: '*'
              - Sid: StackDriftDetectionReadOnly
                Effect: Allow
                Action:
                  - 'cloudformation:DetectStackDrift'
                  - 'cloudformation:DetectStackResourceDrift'
                  - 'cloudformation:DescribeStackDriftDetectionStatus'
                  - 'cloudformation:DescribeStackResourceDrifts'
                  - 'cloudformation:ListStacks'
                  - 'cloudformation:DescribeStackSet'
                  - 'cloudformation:ListStackSets'
                  - 'cloudformation:ListStackInstances'
                  - 'cloudformation:DescribeStackInstance'
                  - 'cloudformation:DetectStackSetDrift'
                  - 'cloudformation:DescribeStackSetOperation'
                Resource: '*'

  # =================================================================
  # 2. IAM Role for the EKS Automation Lambda
  # =================================================================
  ConfigMapLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EKSDescribeAndModifyAuthConfigMapPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'eks:DescribeCluster'
                Resource: !Sub 'arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/*'
              - Effect: Allow
                Action: 'sts:GetCallerIdentity'
                Resource: '*'

  # =================================================================
  # 3. Lambda to Update EKS aws-auth ConfigMap
  # =================================================================
  EKSAuthMapUpdaterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt ConfigMapLambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import logging
          import cfnresponse
          import boto3
          import base64
          import urllib3
          import os
          import time
          from botocore.signers import RequestSigner

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def get_bearer_token(cluster_name, region):
              sts_client = boto3.client('sts', region_name=region)
              service_id = sts_client.meta.service_model.service_id
              signer = RequestSigner(
                  service_id, region, 'sts', 'v4',
                  boto3.Session().get_credentials(),
                  boto3.Session().events
              )
              params = {
                  'method': 'GET',
                  'url': f'https://sts.{region}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15',
                  'body': {},
                  'headers': { 'x-k8s-aws-id': cluster_name },
                  'context': {}
              }
              signed_url = signer.generate_presigned_url(
                  params, region_name=region, expires_in=60, operation_name=''
              )
              base64_url = base64.urlsafe_b64encode(signed_url.encode('utf-8')).rstrip(b'=').decode('utf-8')
              return 'k8s-aws-v1.' + base64_url

          def handler(event, context):
              request_type = event['RequestType']
              props = event['ResourceProperties']
              role_arn = props['RoleArn']
              cluster_names = props['ClusterNames']
              physical_resource_id = f"eks-auth-updater-{props.get('StackId', 'default')}"

              try:
                  if request_type == 'Delete':
                      logger.info("Stack deletion triggered. No action taken on aws-auth ConfigMap.")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)
                      return

                  if not cluster_names or not cluster_names[0]:
                      logger.info("No EKS cluster names provided. Skipping ConfigMap update.")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)
                      return

                  eks_client = boto3.client('eks')
                  for cluster_name in cluster_names:
                      cluster_name = cluster_name.strip()
                      if not cluster_name: continue

                      logger.info(f"Processing cluster: {cluster_name}")
                      cluster_info = eks_client.describe_cluster(name=cluster_name)['cluster']
                      endpoint = cluster_info['endpoint']
                      ca_data_b64 = cluster_info['certificateAuthority']['data']
                      region = cluster_info['arn'].split(':')[3]

                      ca_cert_file = '/tmp/ca.crt'
                      with open(ca_cert_file, 'wb') as f:
                          f.write(base64.b64decode(ca_data_b64))

                      token = get_bearer_token(cluster_name, region)
                      http = urllib3.PoolManager(ca_certs=ca_cert_file)

                      headers = {'Authorization': f'Bearer {token}'}
                      get_url = f"{endpoint}/api/v1/namespaces/kube-system/configmaps/aws-auth"

                      resp = http.request('GET', get_url, headers=headers)
                      if resp.status != 200:
                          raise Exception(f"Failed to get aws-auth ConfigMap for {cluster_name}: Status {resp.status} - {resp.data.decode('utf-8')}")

                      cm = json.loads(resp.data.decode('utf-8'))
                      map_roles_str = cm['data'].get('mapRoles', '[]')
                      map_roles = json.loads(map_roles_str) if map_roles_str else []

                      role_exists = any(entry.get('rolearn') == role_arn for entry in map_roles)

                      if not role_exists:
                          logger.info(f"Role ARN not found. Adding '{role_arn}' to ConfigMap for cluster '{cluster_name}'.")
                          map_roles.append({
                              'rolearn': role_arn,
                              'username': 'xamops-monitoring-role:{{SessionName}}',
                              'groups': ['system:viewers']
                          })
                          cm['data']['mapRoles'] = json.dumps(map_roles, indent=2)

                          patch_headers = headers.copy()
                          patch_headers['Content-Type'] = 'application/strategic-merge-patch+json'

                          patch_payload = json.dumps({'data': cm['data']})
                          patch_resp = http.request('PATCH', get_url, headers=patch_headers, body=patch_payload.encode('utf-8'))

                          if patch_resp.status != 200:
                              raise Exception(f"Failed to update aws-auth ConfigMap for {cluster_name}: Status {patch_resp.status} - {patch_resp.data.decode('utf-8')}")

                          logger.info(f"Successfully added role to aws-auth ConfigMap for cluster {cluster_name}")
                      else:
                          logger.info(f"Role {role_arn} already exists in aws-auth ConfigMap for cluster {cluster_name}. No changes made.")

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)

              except Exception as e:
                  logger.error(f"Error processing EKS auth config: {e}", exc_info=True)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)}, physical_resource_id)

  # =================================================================
  # 4. Custom Resource to Trigger EKS Lambda
  # =================================================================
  EKSAuthConfig:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt EKSAuthMapUpdaterFunction.Arn
      RoleArn: !GetAtt XamOpsReadOnlyRole.Arn
      ClusterNames: !Ref EKSClusterNames
      StackId: !Ref AWS::StackId

  # =================================================================
  # 5. IAM Role for Auto-Callback Lambda (EventBridge PutEvents)
  # =================================================================
  AutoCallbackLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: XamOpsEventBridgePutEventsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'events:PutEvents'
                Resource: !Ref XamOpsEventBusArn

  # =================================================================
  # 6. Auto-Callback Lambda — sends EventBridge event when stack is ready
  # =================================================================
  AutoCallbackFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt AutoCallbackLambdaRole.Arn
      Runtime: python3.12
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import logging
          import cfnresponse
          import boto3
          import urllib3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              request_type = event['RequestType']
              props = event['ResourceProperties']
              physical_resource_id = 'xamops-auto-callback'

              if request_type == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)
                  return

              event_bus_arn = props['EventBusArn']
              external_id = props['ExternalId']
              aws_account_id = props['AwsAccountId']
              role_arn = props['RoleArn']
              callback_url = props.get('CallbackUrl', '')

              # StackId lets XamOps record which stack owns this connection. Without it the
              # platform has to ask CloudFormation which stack created the role — which works,
              # but cannot tell a stack that was deleted and recreated from the original.
              stack_id = props.get('StackId', '')

              detail = json.dumps({
                  'externalId': external_id,
                  'awsAccountId': aws_account_id,
                  'roleArn': role_arn,
                  'stackId': stack_id
              })

              # 1. Send EventBridge event (for audit/logging)
              try:
                  bus_region = event_bus_arn.split(':')[3]
                  eb = boto3.client('events', region_name=bus_region)
                  response = eb.put_events(Entries=[{
                      'Source': 'com.xamops.onboarding',
                      'DetailType': 'AccountOnboardingComplete',
                      'Detail': detail,
                      'EventBusName': event_bus_arn
                  }])
                  failed = response.get('FailedEntryCount', 0)
                  if failed > 0:
                      logger.error(f"EventBridge PutEvents had {failed} failed entries: {response['Entries']}")
                  else:
                      logger.info(f"EventBridge event sent for externalId={external_id}")
              except Exception as e:
                  logger.warning(f"EventBridge PutEvents failed (non-fatal): {str(e)}")

              # 2. Call XamOps backend directly so account status updates immediately
              if callback_url:
                  try:
                      http = urllib3.PoolManager()
                      payload_bytes = detail.encode('utf-8')
                      cb_resp = http.request(
                          'POST', callback_url,
                          body=payload_bytes,
                          headers={'Content-Type': 'application/json'},
                          timeout=urllib3.Timeout(connect=5.0, read=15.0)
                      )
                      logger.info(f"Direct callback to {callback_url} returned HTTP {cb_resp.status}")
                  except Exception as cb_err:
                      logger.warning(f"Direct callback failed (non-fatal): {str(cb_err)}")

              cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_resource_id)

  # =================================================================
  # 7. Custom Resource to Trigger Auto-Callback
  #    Runs AFTER EKSAuthConfig so role is fully ready
  # =================================================================
  XamOpsAutoCallback:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: EKSAuthConfig
    Properties:
      ServiceToken: !GetAtt AutoCallbackFunction.Arn
      EventBusArn: !Ref XamOpsEventBusArn
      CallbackUrl: !Ref XamOpsCallbackUrl
      ExternalId: !Ref ExternalId
      AwsAccountId: !Ref AWS::AccountId
      RoleArn: !GetAtt XamOpsReadOnlyRole.Arn
      StackId: !Ref AWS::StackId

  # =================================================================
  # 8. Inventory Events (nested)
  #
  # Nested rather than inlined so the same logic serves the read-only and
  # read-write templates across every environment without six copies to keep
  # in step. The nested stack discovers the account's enabled regions itself,
  # so single- and multi-region customers deploy exactly the same thing and
  # nobody has to declare a region list up front.
  # =================================================================
  XamOpsInventoryEvents:
    Type: AWS::CloudFormation::Stack
    Condition: DeployInventoryEvents
    Properties:
      TemplateURL: !Ref XamOpsInventoryTemplateUrl
      # Comfortably longer than the fan-out needs; a region that hangs must not
      # leave the parent stack waiting indefinitely.
      TimeoutInMinutes: 20
      Parameters:
        XamOpsAccountId: !Ref XamOpsAccountId
        XamOpsSQSQueueUrl: !Ref XamOpsInventoryQueueUrl
        XamOpsRegion: !Ref XamOpsInventoryRegion
        IncludeSecurityFindings: !Ref IncludeSecurityFindings
        ResourceSuffix: !Ref XamOpsInventoryResourceSuffix

  # =================================================================
  # CUR in us-east-1 from a parent stack in ANY region
  #
  # Replaces the region-locked CUR nested stacks. AWS::CUR::ReportDefinition and
  # AWS::BCMDataExports::Export only exist in us-east-1, and a native nested stack is
  # always created in its parent's region. This custom-resource Lambda runs in the
  # parent's region but pins every CUR / Data Exports / S3 call to us-east-1, so the
  # shared bucket (xamops-cur-<id>), the CUR 1.0 report and the CUR 2.0 export all land
  # in us-east-1 regardless of where this stack lives. Rides along on a normal
  # "Update stack", so connected accounts get CUR without re-onboarding or moving region.
  # Bucket/report/prefix names below are byte-for-byte what the backend already expects.
  # =================================================================
  XamOpsCurManagerRole:
    Type: AWS::IAM::Role
    Condition: CreatesOwnCurBucket
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: XamOpsCurManagerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CurBucket
                Effect: Allow
                Action:
                  - 's3:CreateBucket'
                  - 's3:PutBucketPolicy'
                  - 's3:GetBucketPolicy'
                  - 's3:PutBucketPublicAccessBlock'
                  - 's3:PutEncryptionConfiguration'
                  - 's3:PutBucketLifecycleConfiguration'
                  - 's3:PutBucketOwnershipControls'
                  - 's3:PutBucketTagging'
                  - 's3:GetBucketLocation'
                  - 's3:ListBucket'
                Resource:
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/*'
              - Sid: CurReportDefinition
                Effect: Allow
                Action:
                  - 'cur:PutReportDefinition'
                  - 'cur:DescribeReportDefinitions'
                  - 'cur:DeleteReportDefinition'
                Resource: '*'
              - Sid: CurDataExport
                Effect: Allow
                Action:
                  - 'bcm-data-exports:CreateExport'
                  - 'bcm-data-exports:GetExport'
                  - 'bcm-data-exports:ListExports'
                  - 'bcm-data-exports:UpdateExport'
                  - 'bcm-data-exports:DeleteExport'
                Resource: '*'

  XamOpsCurManagerFunction:
    Type: AWS::Lambda::Function
    Condition: CreatesOwnCurBucket
    Properties:
      Handler: index.handler
      Role: !GetAtt XamOpsCurManagerRole.Arn
      Runtime: python3.12
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import logging
          import boto3
          import cfnresponse
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          CUR_REGION = 'us-east-1'

          CUR2_QUERY = (
              "SELECT bill_bill_type, bill_payer_account_id, bill_billing_entity, "
              "line_item_usage_account_id, line_item_line_item_type, "
              "line_item_usage_start_date, line_item_usage_end_date, "
              "line_item_product_code, product_servicecode, product_region_code, "
              "line_item_usage_type, line_item_operation, line_item_resource_id, "
              "line_item_usage_amount, line_item_unblended_rate, "
              "line_item_unblended_cost, line_item_blended_cost, pricing_unit, "
              "pricing_public_on_demand_cost, "
              "reservation_amortized_upfront_cost_for_usage, "
              "savings_plan_savings_plan_effective_cost "
              "FROM COST_AND_USAGE_REPORT"
          )

          def _bucket_exists(s3, bucket):
              try:
                  s3.head_bucket(Bucket=bucket)
                  return True
              except ClientError as e:
                  code = e.response.get('Error', {}).get('Code', '')
                  if code in ('404', 'NoSuchBucket'):
                      return False
                  if code == '403':
                      return True
                  raise

          def ensure_bucket(account_id):
              bucket = 'xamops-cur-' + account_id
              s3 = boto3.client('s3', region_name=CUR_REGION)
              if not _bucket_exists(s3, bucket):
                  try:
                      s3.create_bucket(Bucket=bucket)
                      logger.info("Created bucket %s", bucket)
                  except ClientError as e:
                      code = e.response.get('Error', {}).get('Code', '')
                      if code not in ('BucketAlreadyOwnedByYou', 'BucketAlreadyExists'):
                          raise
                      logger.info("Bucket %s already present (%s)", bucket, code)

              s3.put_public_access_block(
                  Bucket=bucket,
                  PublicAccessBlockConfiguration={
                      'BlockPublicAcls': True, 'BlockPublicPolicy': True,
                      'IgnorePublicAcls': True, 'RestrictPublicBuckets': True,
                  },
              )
              s3.put_bucket_encryption(
                  Bucket=bucket,
                  ServerSideEncryptionConfiguration={
                      'Rules': [{'ApplyServerSideEncryptionByDefault': {'SSEAlgorithm': 'AES256'}}]
                  },
              )
              try:
                  s3.put_bucket_ownership_controls(
                      Bucket=bucket,
                      OwnershipControls={'Rules': [{'ObjectOwnership': 'BucketOwnerEnforced'}]},
                  )
              except ClientError as e:
                  logger.warning("put_bucket_ownership_controls failed (non-fatal): %s", e)
              s3.put_bucket_lifecycle_configuration(
                  Bucket=bucket,
                  LifecycleConfiguration={'Rules': [
                      {
                          'ID': 'ExpireAthenaResults', 'Status': 'Enabled',
                          'Filter': {'Prefix': 'xamops-athena-results/'},
                          'Expiration': {'Days': 7},
                          'AbortIncompleteMultipartUpload': {'DaysAfterInitiation': 1},
                      },
                      {
                          'ID': 'ExpireOldExports', 'Status': 'Enabled',
                          'Filter': {'Prefix': 'cur2/'},
                          'Expiration': {'Days': 90},
                      },
                  ]},
              )
              arn = 'arn:aws:s3:::' + bucket
              policy = {
                  'Version': '2012-10-17',
                  'Statement': [
                      {
                          'Sid': 'AllowBillingReportsGetBucketAcl',
                          'Effect': 'Allow',
                          'Principal': {'Service': 'billingreports.amazonaws.com'},
                          'Action': ['s3:GetBucketAcl', 's3:GetBucketPolicy'],
                          'Resource': arn,
                          'Condition': {'StringEquals': {
                              'aws:SourceAccount': account_id,
                              'aws:SourceArn': 'arn:aws:cur:us-east-1:' + account_id + ':definition/*',
                          }},
                      },
                      {
                          'Sid': 'AllowBillingReportsPutObject',
                          'Effect': 'Allow',
                          'Principal': {'Service': 'billingreports.amazonaws.com'},
                          'Action': 's3:PutObject',
                          'Resource': arn + '/*',
                          'Condition': {'StringEquals': {
                              'aws:SourceAccount': account_id,
                              'aws:SourceArn': 'arn:aws:cur:us-east-1:' + account_id + ':definition/*',
                          }},
                      },
                      {
                          'Sid': 'EnableAWSDataExportsToWriteToS3',
                          'Effect': 'Allow',
                          'Principal': {'Service': 'bcm-data-exports.amazonaws.com'},
                          'Action': 's3:PutObject',
                          'Resource': arn + '/*',
                          'Condition': {
                              'ArnLike': {'aws:SourceArn': 'arn:aws:bcm-data-exports:us-east-1:' + account_id + ':export/*'},
                              'StringEquals': {'aws:SourceAccount': account_id},
                          },
                      },
                  ],
              }
              s3.put_bucket_policy(Bucket=bucket, Policy=json.dumps(policy))
              logger.info("Bucket %s configured", bucket)
              return bucket

          def ensure_cur1_report(bucket):
              cur = boto3.client('cur', region_name=CUR_REGION)
              definition = {
                  'ReportName': 'xamops-cur',
                  'TimeUnit': 'HOURLY',
                  'Format': 'Parquet',
                  'Compression': 'Parquet',
                  'AdditionalSchemaElements': ['RESOURCES'],
                  'S3Bucket': bucket,
                  'S3Prefix': 'cur',
                  'S3Region': CUR_REGION,
                  'AdditionalArtifacts': [],
                  'RefreshClosedReports': True,
                  'ReportVersioning': 'OVERWRITE_REPORT',
              }
              try:
                  cur.put_report_definition(ReportDefinition=definition)
                  logger.info("Created CUR 1.0 report xamops-cur")
              except ClientError as e:
                  code = e.response.get('Error', {}).get('Code', '')
                  if code in ('DuplicateReportNameException', 'ValidationException'):
                      logger.info("CUR 1.0 report already present (%s)", code)
                  else:
                      raise

          def ensure_cur2_export(account_id, bucket):
              de = boto3.client('bcm-data-exports', region_name=CUR_REGION)
              for page in de.get_paginator('list_exports').paginate():
                  for ref in page.get('Exports', []):
                      if ref.get('ExportName') == 'xamops-cur2':
                          logger.info("CUR 2.0 export already present")
                          return
              export = {
                  'Name': 'xamops-cur2',
                  'Description': 'XamOps BillOps invoice reconciliation export',
                  'DataQuery': {
                      'QueryStatement': CUR2_QUERY,
                      'TableConfigurations': {
                          'COST_AND_USAGE_REPORT': {
                              'TIME_GRANULARITY': 'DAILY',
                              'INCLUDE_RESOURCES': 'TRUE',
                          }
                      },
                  },
                  'DestinationConfigurations': {
                      'S3Destination': {
                          'S3Bucket': bucket,
                          'S3Prefix': 'cur2',
                          'S3Region': CUR_REGION,
                          'S3OutputConfigurations': {
                              'OutputType': 'CUSTOM',
                              'Format': 'TEXT_OR_CSV',
                              'Compression': 'GZIP',
                              'Overwrite': 'OVERWRITE_REPORT',
                          },
                      }
                  },
                  'RefreshCadence': {'Frequency': 'SYNCHRONOUS'},
              }
              de.create_export(Export=export)
              logger.info("Created CUR 2.0 export xamops-cur2")

          def handler(event, context):
              request_type = event['RequestType']
              props = event.get('ResourceProperties', {})
              account_id = props['AwsAccountId']
              enable_report = str(props.get('EnableCurReport', 'false')).lower() == 'true'
              enable_export = str(props.get('EnableCurExport', 'false')).lower() == 'true'
              physical_id = 'xamops-cur-manager-' + account_id

              try:
                  if request_type == 'Delete':
                      logger.info("Delete: leaving CUR bucket/report/export intact")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
                      return

                  bucket = ensure_bucket(account_id)
                  if enable_report:
                      ensure_cur1_report(bucket)
                  if enable_export:
                      ensure_cur2_export(account_id, bucket)

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'BucketName': bucket,
                      'Cur1Prefix': 'cur',
                      'Cur2Prefix': 'cur2',
                  }, physical_id)
              except Exception as e:
                  logger.error("CUR manager failed: %s", e, exc_info=True)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)}, physical_id)

  # CUR 1.0 report + shared bucket. Attaches only when EnableCurReport is true.
  XamOpsCurReport:
    Type: AWS::CloudFormation::CustomResource
    Condition: DeployCurReport
    Properties:
      ServiceToken: !GetAtt XamOpsCurManagerFunction.Arn
      AwsAccountId: !Ref AWS::AccountId
      EnableCurReport: 'true'
      EnableCurExport: 'false'
      Revision: 'v1-cur1'

  # CUR 2.0 export + shared bucket. Attaches only when EnableCurExport is true.
  XamOpsCurExport:
    Type: AWS::CloudFormation::CustomResource
    Condition: DeployCurExport
    Properties:
      ServiceToken: !GetAtt XamOpsCurManagerFunction.Arn
      AwsAccountId: !Ref AWS::AccountId
      EnableCurReport: 'false'
      EnableCurExport: 'true'
      Revision: 'v1-cur2'

  # ===================================================================================
  # Stack updates from the XamOps console
  #
  # Lets XamOps bring this stack onto the current template through its Update Stack button,
  # so new permissions reach a connected account without anyone opening the AWS console.
  # Granted here at creation because this is the only moment it can be granted without a
  # manual step: the permission to update a stack lives in the role that stack defines, so
  # for an account connected before this existed the first grant has to be deployed
  # separately (xamops-stack-updater.yml).
  #
  # Built as a service role rather than granted to XamOps directly. CloudFormation assumes
  # this role to do the work, so XamOps itself holds only change-set actions and iam:PassRole
  # on this one role, never iam:CreateRole. iam:PassRole to a privileged role is still a real
  # escalation path; scoped to one role and one service principal it is the standard AWS
  # pattern, and every change lands in this account's own stack event history.
  # ===================================================================================
  XamOpsConnectionUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      # No RoleName, on purpose. An account connected before this existed gets its first
      # grant from xamops-stack-updater.yml, which creates a role literally named
      # XamOpsStackUpdaterRole. A fixed name here would collide with it the first time that
      # account's stack is upgraded onto this template, failing the very update the grant
      # exists to enable. XamOps reads the generated name from the XamOpsStackUpdaterRoleArn
      # output instead.
      Description: Assumed by CloudFormation to apply XamOps connection stack updates.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: XamOpsConnectionStackResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Same scope as xamops-stack-updater.yml, which enumerates every resource type
              # this stack and its nested stacks create. Reads are included deliberately:
              # CloudFormation calls them during rollback, and a missing read breaks it.
              - Sid: NestedStacks
                Effect: Allow
                Action: 'cloudformation:*'
                Resource:
                  - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${AWS::StackName}*/*'
                  - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:changeSet/*/*'
              - Sid: ReadXamOpsTemplates
                Effect: Allow
                Action: 's3:GetObject'
                Resource: 'arn:aws:s3:::xamopscftemplate/*'
              - Sid: ConnectionRolesAndPolicies
                Effect: Allow
                Action: 'iam:*'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/XamOps*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/XamOps*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/xamops*'
                  # This role's own generated name starts with the stack name, which is not
                  # guaranteed to begin with XamOps for a stack someone renamed.
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}*'
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'
              - Sid: CostAndUsageReport
                Effect: Allow
                Action: 'cur:*'
                Resource: '*'
              - Sid: ReportBucket
                Effect: Allow
                Action: 's3:*'
                Resource:
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::xamops-cur-${AWS::AccountId}/*'
              - Sid: DataExports
                Effect: Allow
                Action: 'bcm-data-exports:*'
                Resource: '*'
              - Sid: InventoryEvents
                Effect: Allow
                Action:
                  - 'events:*'
                  - 'lambda:*'
                  - 'logs:*'
                Resource: '*'

  # What XamOps itself gains: proposing and applying a change set on this stack, and nothing
  # else. A separate policy rather than an edit to the connection role's own, and named
  # differently from xamops-stack-updater.yml's, so the two can coexist on an account that
  # has both without either stack deleting the other's grant.
  XamOpsConnectionUpdatePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: XamOpsConnectionUpdate
      Roles:
        - !Ref XamOpsReadOnlyRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ChangeSetsOnThisStackOnly
            Effect: Allow
            Action:
              - 'cloudformation:CreateChangeSet'
              - 'cloudformation:DescribeChangeSet'
              - 'cloudformation:ExecuteChangeSet'
              - 'cloudformation:DeleteChangeSet'
              - 'cloudformation:DescribeStacks'
              - 'cloudformation:DescribeStackEvents'
              - 'cloudformation:DescribeStackResource'
              - 'cloudformation:DescribeStackResources'
              - 'cloudformation:GetTemplate'
              - 'cloudformation:GetTemplateSummary'
            Resource:
              - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${AWS::StackName}*/*'
              - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:changeSet/*/*'
          # Deliberately absent: UpdateStack, CreateStack, DeleteStack. Every change goes
          # through a change set, so none can skip being written down before it runs.
          - Sid: HandTheWorkToCloudFormation
            Effect: Allow
            Action: 'iam:PassRole'
            Resource: !GetAtt XamOpsConnectionUpdaterRole.Arn
            Condition:
              StringEquals:
                'iam:PassedToService': 'cloudformation.amazonaws.com'

Outputs:
  XamOpsStackUpdaterRoleArn:
    Description: >
      Role XamOps passes to CloudFormation when updating this stack. Read by XamOps in place of
      a fixed role name, because this role's name is generated.
    Value: !GetAtt XamOpsConnectionUpdaterRole.Arn

  XamOpsRoleArn:
    Description: The ARN of the IAM role created for the XamOps platform.
    Value: !GetAtt XamOpsReadOnlyRole.Arn

  InventoryEventsEnabled:
    Description: Whether near-real-time inventory events were configured.
    Value: !Ref EnableInventoryEvents

  InventoryEventRegions:
    Description: >
      Regions where inventory event rules were created. Discovered automatically
      from this account's enabled regions.
    Value: !If
      - DeployInventoryEvents
      - !GetAtt XamOpsInventoryEvents.Outputs.RegionsConfigured
      - 'disabled — XamOps will poll every 60s instead'

  InventoryEventRegionCount:
    Description: Number of regions forwarding inventory events.
    Value: !If
      - DeployInventoryEvents
      - !GetAtt XamOpsInventoryEvents.Outputs.RegionCount
      - '0'

  CurBucketName:
    Description: >
      S3 bucket receiving CUR 2.0 exports. Feed this into CloudAccount.curS3Bucket
      during account verification so BillOps can locate the export.
    Value: !If
      - CreatesOwnCurBucket
      - !Sub 'xamops-cur-${AWS::AccountId}'
      - 'disabled — no CUR configured; XamOps/BillOps will use Cost Explorer instead'

  CurExportEnabled:
    Description: Whether a CUR 2.0 Data Export was configured for BillOps.
    Value: !Ref EnableCurExport

  CurReportPrefix:
    Description: >
      S3 key prefix under which CUR 2.0 files are delivered. Feed this into
      CloudAccount.curReportPath during account verification.
    Value: !If
      - DeployCurExport
      - 'cur2'
      - 'disabled'

  XamOpsRoleName:
    Description: Name of the IAM role created for the XamOps platform.
    Value: !Ref XamOpsReadOnlyRole
