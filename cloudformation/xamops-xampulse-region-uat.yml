          Values:
            - '*'

Outputs:
  AssociationIds:
    Value: !Join
      - ','
      - - !If [AssocIds1, !Ref AssociationIds1, '']
        - !If [AssocIds2, !Ref AssociationIds2, '']
        - !If [AssocIds3, !Ref AssociationIds3, '']
        - !If [AssocIds4, !Ref AssociationIds4, '']
        - !If [AssocIds5, !Ref AssociationIds5, '']
        - !If [AssocIds6, !Ref AssociationIds6, '']
        - !If [AssocIds7, !Ref AssociationIds7, '']
        - !If [AssocIds8, !Ref AssociationIds8, '']
        - !If [AssocIds9, !Ref AssociationIds9, '']
