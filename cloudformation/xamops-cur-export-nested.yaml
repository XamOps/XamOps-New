AWSTemplateFormatVersion: '2010-09-09'
Description: >
  XamOps CUR 2.0 Data Export (nested stack). Creates a dedicated S3 bucket and
  a Cost and Usage Report 2.0 export in the account it is deployed into, so
  BillOps can reconcile invoices from AWS's own billing source instead of
  Cost Explorer's aggregated (and sometimes divergent) totals.

  Only meaningful in a management/payer account: Data Exports created from a
  linked/member account contain only that member account's own data, never
  the consolidated org-wide total. Included as an on-by-default nested stack
  (like xamops-inventory-events-nested.yaml) so the customer doesn't have to
  separately discover and enable Data Exports themselves.

Parameters:
  XamOpsAccountId:
    Type: String
    Description: The 12-digit AWS Account ID for the XamOps platform.
    AllowedPattern: '^\d{12}$'

Resources:
  # ===========================================================================
  # Destination bucket
  #
  # Dedicated rather than reusing an existing customer bucket: Data Exports
  # validates and locks bucket ownership at export-creation time, and editing
  # the bucket policy afterward risks silently breaking delivery (per AWS's
  # own docs). A bucket XamOps's stack owns end-to-end avoids that risk and
  # keeps the CUR read scope in XamOpsReadOnlyRole tight and auditable.
  # ===========================================================================
  CurExportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'xamops-cur-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          # CUR re-delivers and overwrites the current period continuously; once a
          # month closes there is no reason to keep more than a modest tail of raw
          # export files around in the customer's own account — XamOps aggregates
          # and persists the data it needs on ingest. Keeps the customer's S3 bill
          # from growing unbounded from a stack they may forget exists.
          - Id: ExpireOldExports
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Service
          Value: XamOpsBillOps

  # This exact policy (principal, action, resource, and both condition keys) is
  # mandatory — AWS Data Exports validates it at export-creation time and will
  # refuse to deliver to a bucket that doesn't have it.
  CurExportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CurExportBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAWSDataExportsToWriteToS3
            Effect: Allow
            Principal:
              Service: bcm-data-exports.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${CurExportBucket.Arn}/*'
            Condition:
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:bcm-data-exports:us-east-1:${AWS::AccountId}:export/*'
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'

  # ===========================================================================
  # The export itself (CUR 2.0 via Data Exports)
  #
  # DAILY granularity (not MONTHLY): BillOps needs day-level rows so ingestion
  # can (a) reconstruct the daily trend charts xamops-service already produces
  # from Cost Explorer, and (b) safely re-ingest a SYNCHRONOUS mid-month
  # refresh by replacing only the days that changed, instead of reprocessing
  # one ever-growing month-total blob on every delivery.
  #
  # CSV/GZIP (not Parquet): matches the CSV parsing AwsInvoiceService already
  # does with OpenCSV — avoids adding a Parquet reader for v1.
  # ===========================================================================
  XamOpsCurExport:
    Type: AWS::BCMDataExports::Export
    DependsOn: CurExportBucketPolicy
    Properties:
      Export:
        Name: 'xamops-cur2'
        Description: 'XamOps BillOps invoice reconciliation export'
        DataQuery:
          QueryStatement: >-
            SELECT bill_bill_type, bill_payer_account_id, bill_billing_entity,
            line_item_usage_account_id, line_item_line_item_type,
            line_item_usage_start_date, line_item_usage_end_date,
            line_item_product_code, product_product_name, product_region_code,
            line_item_usage_type, line_item_operation, line_item_resource_id,
            line_item_usage_amount, line_item_unblended_rate,
            line_item_unblended_cost, line_item_blended_cost, pricing_unit,
            pricing_public_on_demand_cost,
            reservation_amortized_upfront_fee_for_usage,
            savings_plan_savings_plan_effective_cost
            FROM COST_AND_USAGE_REPORT
          TableConfigurations:
            COST_AND_USAGE_REPORT:
              TIME_GRANULARITY: 'DAILY'
              # ----------------------------------------------------------------
              # Resource-level rows are ON, so line_item_resource_id is populated.
              #
              # This costs real volume: CUR emits one row per resource per usage type
              # per day instead of one row per usage type per day, which on an account
              # with a few hundred resources is roughly an order of magnitude more
              # rows, S3 storage and parse time. Invoice totals are identical either
              # way — the aggregation sums the same dollars regardless of how finely
              # the source rows are split.
              #
              # It is on because the setting is not symmetrically reversible. Turning
              # it on later only affects periods AWS delivers AFTER the stack update;
              # months already exported without resource detail can never be
              # backfilled with it. Since XamOps FinOps wants per-resource cost
              # attribution, any month spent with this off would be permanently
              # missing that history — a worse outcome than the storage cost, which is
              # cents per month.
              # ----------------------------------------------------------------
              INCLUDE_RESOURCES: 'TRUE'
              INCLUDE_MANIFEST: 'TRUE'
        DestinationConfigurations:
          S3Destination:
            S3Bucket: !Ref CurExportBucket
            S3Prefix: 'cur2'
            S3Region: !Ref 'AWS::Region'
            S3OutputConfigurations:
              OutputType: CUSTOM
              Format: TEXT_OR_CSV
              Compression: GZIP
              Overwrite: OVERWRITE_REPORT
        RefreshCadence:
          Frequency: SYNCHRONOUS

Outputs:
  CurBucketName:
    Description: Name of the S3 bucket receiving CUR 2.0 exports
    Value: !Ref CurExportBucket

  CurBucketArn:
    Description: ARN of the S3 bucket receiving CUR 2.0 exports
    Value: !GetAtt CurExportBucket.Arn

  CurReportPrefix:
    Description: S3 key prefix under which CUR 2.0 files are delivered
    Value: 'cur2'

  CurExportArn:
    Description: ARN of the CUR 2.0 Data Export
    Value: !GetAtt XamOpsCurExport.ExportArn
