AWSTemplateFormatVersion: '2010-09-09'
Description: >
  XamOps Read-Write + AutoSpotting Stack (LOCAL DEV): Creates a secure IAM Role for the XamOps platform
  to monitor AND manage this AWS account, including auto-spotting event forwarding,
  user management, resource modification, and full operational control over supported services.
  Deploys EventBridge rules and a Lambda forwarder for real-time Spot instance event capture.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "XamOps Platform Configuration"
        Parameters:
          - XamOpsAccountId
          - ExternalId
      - Label:
          default: "Amazon EKS Configuration"
        Parameters:
          - EKSClusterNames
      - Label:
          default: "AutoSpotting Configuration"
        Parameters:
          - XammerSQSQueueUrl
          - XammerRegion
          - EnableAutoSpotting
    ParameterLabels:
      XamOpsAccountId:
        default: "XamOps AWS Account ID"
      ExternalId:
        default: "Unique External ID"
      EKSClusterNames:
        default: "EKS Cluster Names (Optional)"
      XammerSQSQueueUrl:
        default: "Xammer SQS Queue URL"
      XammerRegion:
        default: "Xammer AWS Region"
      EnableAutoSpotting:
        default: "Enable AutoSpotting"

Parameters:
  XamOpsAccountId:
    Type: String
    Description: The 12-digit AWS Account ID for the XamOps platform. Provided by XamOps.
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS Account ID.

  ExternalId:
    Type: String
    Description: A unique secret value provided by XamOps to secure the connection (cross-account IAM role assumption).
    MinLength: 10
    ConstraintDescription: Must be the unique external ID from the XamOps platform.

  EKSClusterNames:
    Type: CommaDelimitedList
    Description: (Optional) A comma-separated list of your EKS cluster names. XamOps will be granted admin access to these clusters.
    Default: ""

  XammerSQSQueueUrl:
    Type: String
    Description: URL of the Xammer SQS queue for AutoSpotting events. Provided by XamOps.
    Default: 'https://sqs.ap-south-1.amazonaws.com/605134457560/autospotting-events.fifo'

  XammerRegion:
    Type: String
    Description: AWS Region where Xammer infrastructure is deployed.
    Default: 'ap-south-1'

  EnableAutoSpotting:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable or disable AutoSpotting event forwarding to XamOps.

  # -------------------------------------------------------------------
  # Inventory events (near-real-time resource discovery)
  #
  # On by default. Without it XamOps still discovers resources, but by
  # polling every 60s instead of being told within seconds. Defaulting to
  # 'true' rather than making it opt-in matters: the feature costs this
  # account a few cents a month, and an opt-in flag buried in a stack
  # parameter is one almost nobody would ever turn on.
  # -------------------------------------------------------------------
  EnableInventoryEvents:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Forward resource change events to XamOps so new resources appear within
      seconds instead of up to a minute. Creates an EventBridge bus, rules in
      each of your enabled regions, and one small Lambda. Cost is typically
      under $0.10/month.

  IncludeSecurityFindings:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Also forward Security Hub, GuardDuty and AWS Config findings. These events
      are free on the default event bus.

  XamOpsInventoryQueueUrl:
    Type: String
    Description: URL of the XamOps inventory event queue.
    Default: 'https://sqs.ap-south-1.amazonaws.com/605134457560/xamops-inventory-events.fifo'

  XamOpsInventoryRegion:
    Type: String
    Description: Region hosting the XamOps inventory event queue.
    Default: 'ap-south-1'

  XamOpsInventoryTemplateUrl:
    Type: String
    Description: S3 URL of the nested inventory-events template.
    Default: 'https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-inventory-events-nested.yaml'

  # -------------------------------------------------------------------
  # Cost and Usage Report (CUR)
  #
  # Only needed when this account keeps its OWN CUR — a standalone account, or
  # a member account whose payer XamOps does not manage. Accounts that sit under
  # a XamOps management/payer account are covered by that MPA's own CUR, which
  # XamOps reads from its own bucket, so they leave this blank and no CUR
  # permission is added to this role at all.
  # -------------------------------------------------------------------
  CurS3Bucket:
    Type: String
    Default: ''
    Description: >
      (Optional) Name of the S3 bucket holding this account's Cost and Usage Report.
      Leave blank if this account is under a XamOps payer account, or if you have no CUR.
      Use AUTO if you are also deploying the XamOps cost reporting stack, which creates
      xamops-cur-<this account id>.
  # CUR 2.0 Data Export (billing reconciliation for BillOps invoicing). On by
  # default, same reasoning as EnableInventoryEvents — see xamops-readwrite-role.yml.
  EnableCurExport:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Set up an AWS Cost and Usage Report (CUR 2.0) export to a dedicated S3
      bucket in this account, so BillOps can reconcile invoices from AWS's
      billing source of truth instead of Cost Explorer's aggregated totals.

  XamOpsCurExportTemplateUrl:
    Type: String
    Description: S3 URL of the nested CUR export template.
    Default: 'https://xamopscftemplate.s3.ap-south-1.amazonaws.com/xamops-cur-export-nested.yaml'

Conditions:
  IsAutoSpottingEnabled: !Equals [!Ref EnableAutoSpotting, 'true']

  # Guards the nested stack. With inventory events off, nothing below is created
  # and the account simply relies on 60s polling.
  # No CUR bucket named means no CUR permissions are attached, so an account under
  # a XamOps payer account keeps exactly the permission surface it had before.
  HasCurBucket: !Not [!Equals [!Ref CurS3Bucket, '']]

  # 'AUTO' means the CUR stack has not run yet and will create xamops-cur-<this account>.
  # Derived here rather than passed in, because the onboarding UI does not know the account
  # id when it builds this launch URL. An IAM policy may name a bucket that does not exist
  # yet — it grants nothing until it does — so the two stacks can be launched in any order.
  AutoCurBucket: !Equals [!Ref CurS3Bucket, 'AUTO']

  DeployInventoryEvents: !Equals [!Ref EnableInventoryEvents, 'true']

  # Guards the CUR export nested stack.
  DeployCurExport: !Equals [!Ref EnableCurExport, 'true']

Resources:

  # =================================================================
  # MANAGED POLICIES — 9 domain-specific policies (LOCAL DEV)
  # All names carry a -local suffix to avoid conflicts with UAT/prod.
  # =================================================================

  XamOpsPolicyReadExtra:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: XamOpsPolicyReadExtra-local
      Description: "[LOCAL] Extra read permissions for XamOps platform monitoring"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'acm:ListCertificates'
              - 'access-analyzer:ListAnalyzers'
              - 'access-analyzer:ListFindings'
              - 'autoscaling:DescribeAutoScalingGroups'
              - 'autoscaling:DescribeInstanceRefreshes'
              - 'autoscaling:DescribeLaunchConfigurations'
              - 'autoscaling:DescribePolicies'
              - 'autoscaling:DescribeScheduledActions'
              - 'budgets:ViewBudget'
              - 'ce:GetAnomalies'
              - 'ce:GetCostAndUsage'
              - 'ce:GetDimensionValues'
              - 'ce:GetReservationCoverage'
              - 'ce:GetReservationPurchaseRecommendation'
              - 'ce:GetReservationUtilization'
              - 'cloudtrail:DescribeTrails'
              - 'cloudtrail:GetTrailStatus'
              - 'cloudtrail:LookupEvents'
              - 'cloudwatch:DescribeAlarms'
              - 'cloudwatch:GetMetricData'
              - 'cloudwatch:GetMetricStatistics'
              - 'compute-optimizer:GetEBSVolumeRecommendations'
              - 'compute-optimizer:GetEc2InstanceRecommendations'
              - 'compute-optimizer:GetLambdaFunctionRecommendations'
              - 'dynamodb:DescribeTable'
              - 'dynamodb:ListTables'
              - 'ec2:Describe*'
              - 'ecr:DescribeRepositories'
              - 'ecs:DescribeClusters'
              - 'ecs:ListClusters'
              - 'eks:DescribeCluster'
              - 'eks:ListClusters'
              - 'elasticache:DescribeCacheClusters'
              - 'elasticloadbalancing:DescribeLoadBalancers'
              - 'elasticloadbalancing:DescribeTargetGroups'
              - 'elasticloadbalancing:DescribeTargetHealth'
              - 'iam:GetAccountPasswordPolicy'
              - 'iam:GetLoginProfile'
              - 'iam:GetPolicyVersion'
              - 'iam:GetRole'
              - 'iam:ListAccessKeys'
              - 'iam:ListAccountAliases'
              - 'iam:ListAttachedUserPolicies'
              - 'iam:ListGroups'
              - 'iam:ListGroupsForUser'
              - 'iam:ListMFADevices'
              - 'iam:ListPolicies'
              - 'iam:ListRoles'
              - 'iam:ListUserPolicies'
              - 'iam:ListUsers'
              - 'kms:DescribeKey'
              - 'kms:GetKeyRotationStatus'
              - 'kms:ListKeys'
              - 'lambda:GetFunction'
              - 'lambda:ListFunctions'
              - 'lambda:ListProvisionedConcurrencyConfigs'
              - 'lambda:ListVersionsByFunction'
              - 'logs:DescribeLogGroups'
              - 'logs:DescribeLogStreams'
              - 'logs:GetQueryResults'
              - 'logs:StartQuery'
              - 'organizations:DescribeAccount'
              - 'organizations:ListAccounts'
              - 'pricing:DescribeServices'
              - 'pricing:GetProducts'
              - 'pricing:ListPriceLists'
              - 'rds:DescribeDBInstances'
              - 'rds:DescribeDBSnapshots'
              - 'rds:ListTagsForResource'
              # Resource Explorer — inventory source. One cross-region Search
              # replaces ~1000 per-service describes, at no charge. Read-only:
              # these actions never create an index.
              - 'resource-explorer-2:Search'
              - 'resource-explorer-2:ListResources'
              - 'resource-explorer-2:ListIndexes'
              - 'resource-explorer-2:ListViews'
              - 'resource-explorer-2:GetIndex'
              - 'resource-explorer-2:GetView'
              - 'resource-explorer-2:GetDefaultView'
              # ------------------------------------------------------------------
              # Index creation - the only non-read Resource Explorer action here.
              #
              # AWS does not auto-index opt-in regions (Hyderabad, Jakarta, Melbourne,
              # UAE, Zurich, Spain, Milan, Cape Town, Bahrain, Osaka). Measured on a
              # live account: 18 enabled regions, 17 indexed, and the 7 EC2 instances
              # in the unindexed region were invisible to XamOps. Without this
              # permission every customer using an opt-in region needs a manual fix
              # before their inventory is complete, so the gap persists silently.
              #
              # A Resource Explorer index holds no customer data of its own and is free
              # of charge - it only lets AWS answer "what exists in this region".
              # Creation is one-time per region and idempotent.
              # ------------------------------------------------------------------
              - 'resource-explorer-2:CreateIndex'
              # Fallback when Resource Explorer is blocked: one call per region.
              - 'tag:GetResources'
              - 'tag:GetTagKeys'
              - 'route53:ListHostedZones'
              - 's3:GetBucketAcl'
              - 's3:GetBucketLocation'
              - 's3:GetBucketPublicAccessBlock'
              - 's3:GetLifecycleConfiguration'
              - 's3:ListAccessGrantsInstances'
              - 's3:ListAccessGrantsLocations'
              - 's3:ListAllMyBuckets'
              - 's3:ListBucket'
              - 's3:ListBucketVersions'
              - 's3:ListMultiRegionAccessPoints'
