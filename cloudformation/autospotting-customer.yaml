AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AutoSpotting Customer Stack - EventBridge cross-account forwarding.
  Replaces Lambda+SQS with direct EventBridge bus forwarding (no Lambda required).
  Deploy in every region of a customer account. Run with CreateIAMRole=true for the
  first region only; all additional regions use CreateIAMRole=false.

Parameters:
  XammerAccountId:
    Type: String
    Description: XamOps host AWS Account ID (where the central EventBridge bus lives)
    Default: '605134457560'

  XammerRegion:
    Type: String
    Description: AWS Region where XamOps central EventBridge bus is deployed
    Default: 'ap-south-1'

  EnableAutoSpotting:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable or disable AutoSpotting event forwarding in this region

  CreateIAMRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >
      Set to 'true' for the FIRST regional deployment (creates global IAM roles).
      Set to 'false' for ADDITIONAL regions (roles already exist, skip creation).

Conditions:
  IsEnabled: !Equals [!Ref EnableAutoSpotting, 'true']
  ShouldCreateIAMRole: !Equals [!Ref CreateIAMRole, 'true']

Resources:

  # ============================================================================
  # EventBridge Cross-Account Forwarding Role
  # Allows EventBridge in this account to put events into the XamOps host bus.
  # IAM roles are global - created once in the first region, reused by all others.
  # ============================================================================
  EventBridgeCrossAccountRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateIAMRole
    Properties:
      RoleName: AutoSpotting-EventBridge-Role
      Description: Allows EventBridge to forward AutoSpotting events to XamOps host
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEventsToXamOpsHostBus
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub 'arn:aws:events:${XammerRegion}:${XammerAccountId}:event-bus/autospotting-events'
      Tags:
        - Key: Service
          Value: AutoSpotting
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================================
  # Cross-Account Execution Role
  # Assumed by the XamOps backend to manage Spot instances in this account.
  # Uses the customer account ID as ExternalId for additional security.
  # ============================================================================
  AutoSpottingExecutionRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateIAMRole
    Properties:
      RoleName: AutoSpotting-Execution-Role
      Description: Role assumed by XamOps backend to manage Spot instances
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${XammerAccountId}:root'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AutoSpottingExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # EC2 permissions - Resource: "*" is required for RunInstances because
              # AutoScaling validates it against AMIs, subnets, security groups, etc.
              - Sid: EC2Permissions
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeRegions
                  - ec2:DescribeSpotPriceHistory
                  - ec2:DescribeImages
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:CreateTags
                Resource: '*'

              # AutoScaling permissions
              - Sid: AutoScalingPermissions
                Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeAutoScalingInstances
                  - autoscaling:DescribeLaunchConfigurations
                  - autoscaling:UpdateAutoScalingGroup
                  - autoscaling:CreateOrUpdateTags
                  - autoscaling:DeleteTags
                Resource: '*'

              # Pricing API (global endpoint)
              - Sid: PricingPermissions
                Effect: Allow
                Action:
                  - pricing:GetProducts
                Resource: '*'

              # CloudFormation - scoped to autospotting stacks only
              - Sid: CloudFormationPermissions
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                Resource: !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/autospotting-*'

              # IAM PassRole - needed when AutoScaling uses its service-linked role
              - Sid: IAMPassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/autoscaling.amazonaws.com/AWSServiceRoleForAutoScaling'
      Tags:
        - Key: Service
          Value: AutoSpotting
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================================
  # EventBridge Rules - Forward events directly to XamOps host bus (no Lambda!)
  #
  # All rules target the XamOps EventBridge custom bus in ap-south-1.
  # Cross-account + cross-region EventBridge forwarding is natively supported.
  #
  # NOTE: The old `instance-lifecycle: spot` filter has been removed.
  # That field does NOT appear in EC2 State-change Notification events, so the
  # old rules never matched anything. The backend filters spot vs on-demand
  # instances via DescribeInstances after receiving the event.
  # ============================================================================

  # Instance launch events
  SpotInstanceLaunchRule:
    Type: AWS::Events::Rule
    Properties:
      Name: autospotting-instance-launch
      Description: Forward EC2 instance launch events to XamOps host EventBridge bus
      State: !If [IsEnabled, ENABLED, DISABLED]
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Instance State-change Notification
        detail:
          state:
            - running
      Targets:
        - Arn: !Sub 'arn:aws:events:${XammerRegion}:${XammerAccountId}:event-bus/autospotting-events'
          Id: XamOpsHostBusLaunch
          RoleArn: !If
            - ShouldCreateIAMRole
            - !GetAtt EventBridgeCrossAccountRole.Arn
            - !Sub 'arn:aws:iam::${AWS::AccountId}:role/AutoSpotting-EventBridge-Role'

  # Instance termination / stopped events
  SpotInstanceTerminationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: autospotting-instance-termination
      Description: Forward EC2 instance termination events to XamOps host EventBridge bus
      State: !If [IsEnabled, ENABLED, DISABLED]
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Instance State-change Notification
        detail:
          state:
            - terminated
            - stopped
      Targets:
        - Arn: !Sub 'arn:aws:events:${XammerRegion}:${XammerAccountId}:event-bus/autospotting-events'
          Id: XamOpsHostBusTermination
          RoleArn: !If
            - ShouldCreateIAMRole
            - !GetAtt EventBridgeCrossAccountRole.Arn
            - !Sub 'arn:aws:iam::${AWS::AccountId}:role/AutoSpotting-EventBridge-Role'

  # Spot Interruption Warning (2-minute advance notice)
  SpotInterruptionWarningRule:
    Type: AWS::Events::Rule
    Properties:
      Name: autospotting-spot-interruption-warning
      Description: Forward EC2 Spot Interruption Warning events to XamOps host
      State: !If [IsEnabled, ENABLED, DISABLED]
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Spot Instance Interruption Warning
      Targets:
        - Arn: !Sub 'arn:aws:events:${XammerRegion}:${XammerAccountId}:event-bus/autospotting-events'
          Id: XamOpsHostBusInterruption
          RoleArn: !If
            - ShouldCreateIAMRole
            - !GetAtt EventBridgeCrossAccountRole.Arn
            - !Sub 'arn:aws:iam::${AWS::AccountId}:role/AutoSpotting-EventBridge-Role'

  # EC2 Instance Rebalance Recommendation (early warning before interruption)
  RebalanceRecommendationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: autospotting-rebalance-recommendation
      Description: Forward EC2 Rebalance Recommendation events to XamOps host
      State: !If [IsEnabled, ENABLED, DISABLED]
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Instance Rebalance Recommendation
      Targets:
        - Arn: !Sub 'arn:aws:events:${XammerRegion}:${XammerAccountId}:event-bus/autospotting-events'
          Id: XamOpsHostBusRebalance
          RoleArn: !If
            - ShouldCreateIAMRole
            - !GetAtt EventBridgeCrossAccountRole.Arn
            - !Sub 'arn:aws:iam::${AWS::AccountId}:role/AutoSpotting-EventBridge-Role'

Outputs:
  EventBridgeCrossAccountRoleArn:
    Condition: ShouldCreateIAMRole
    Description: ARN of the EventBridge cross-account forwarding role
    Value: !GetAtt EventBridgeCrossAccountRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EventBridgeRoleArn'

  AutoSpottingExecutionRoleArn:
    Condition: ShouldCreateIAMRole
    Description: ARN of the cross-account execution role for XamOps backend
    Value: !GetAtt AutoSpottingExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ExecutionRoleArn'

  Status:
    Description: AutoSpotting forwarding status in this account/region
    Value: !If [IsEnabled, 'ENABLED', 'DISABLED']

  TargetEventBus:
    Description: XamOps host EventBridge bus receiving events from this account
    Value: !Sub 'arn:aws:events:${XammerRegion}:${XammerAccountId}:event-bus/autospotting-events'

  ConfigurationInstructions:
    Description: Next steps after deploying this stack
    Value: !Sub >
      AutoSpotting is ${EnableAutoSpotting} in ${AWS::AccountId} / ${AWS::Region}.
      Events forward to arn:aws:events:${XammerRegion}:${XammerAccountId}:event-bus/autospotting-events.
      No Lambda functions required - zero maintenance overhead.
      To disable: update stack with EnableAutoSpotting=false.
